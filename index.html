<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#1a6b5c;--p2:#155a4c;--p3:#0f4238;
  --g:#d4a017;--surface:#fff;--surface2:#f8faf9;
  --border:#e2ebe8;--text1:#1a2e2a;--text2:#4a6b63;--text3:#8aada6;
  --red:#dc2626;--red-l:#fef2f2;--green:#16a34a;
  --radius:12px;
}
body{font-family:'Segoe UI',sans-serif;background:var(--surface2);color:var(--text1);min-height:100vh}
.btn{padding:10px 20px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--p);color:#fff}
.btn-primary:hover{background:var(--p2)}
.btn-gold{background:var(--g);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--p);color:var(--p)}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:20px}
.badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge-baik{background:#d1fae5;color:#065f46}
.badge-cukup{background:#fef3c7;color:#92400e}
.badge-kurang{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:.87rem;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
label{display:block;font-size:.76rem;font-weight:700;color:var(--text2);margin-bottom:4px}
.form-group{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:768px){
  .hero-grid{grid-template-columns:1fr !important;padding:16px !important}
  .hero-title{font-size:2rem !important}
  .hero-kanan{display:none}
  .hero-nav-links{display:none}
}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;font-weight:600;font-size:.82rem;z-index:9999;animation:slideIn .3s ease}
.toast-success{background:#f0fdf4;color:#166534;border:1.5px solid #86efac}
.toast-warning{background:#fffbeb;color:#92400e;border:1.5px solid #fcd34d}
.toast-error{background:#fef2f2;color:#991b1b;border:1.5px solid #fca5a5}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>

ifik atau tidak disertai rencana tindak lanjut yang jelas bagi murid.",rekomendasi:"Berikan umpan balik segera dan spesifik. Susun rencana tindak lanjut: remedial bagi yang belum dan pengayaan bagi yang sudah.",target:"Umpan balik bermakna dan RTL tersusun",waktu:"2 minggu"},{aspek:"Mengintegrasikan Topik Panca Cinta dalam materi/kegiatan pembelajaran",masalah:"Integrasi Topik Panca Cinta dalam pelaksanaan pembelajaran masih bersifat artifisial atau tidak ada.",rekomendasi:"Hubungkan nilai Panca Cinta dengan konteks materi secara alami. Ajak murid merefleksikan nilai yang mereka pelajari dari aktivitas.",target:"Panca Cinta terintegrasi natural dalam KBM",waktu:"1 bulan"},{aspek:"Mengimplementasikan Prinsip Pembelajaran (Berdasarkan, Bermakna, Menggembirakan)",masalah:"Prinsip BBM belum diimplementasikan secara konsisten dalam tahap merefleksi.",rekomendasi:"Pastikan refleksi didasarkan pada pengalaman nyata murid, bermakna untuk pertumbuhan diri, dan dilakukan dengan suasana positif.",target:"Prinsip BBM terwujud dalam tahap Merefleksi",waktu:"1 bulan"}],a:[{aspek:"Instrumen penilaian sesuai tujuan pembelajaran",masalah:"Instrumen penilaian yang digunakan tidak selaras dengan tujuan pembelajaran yang ditetapkan.",rekomendasi:"Review setiap instrumen dan pastikan mengukur kompetensi yang tertuang dalam tujuan pembelajaran. Buat tabel alignment tujuan-instrumen.",target:"Instrumen selaras dengan tujuan pembelajaran",waktu:"1 bulan"},{aspek:"Penilaian mencakup proses dan hasil belajar",masalah:"Penilaian hanya fokus pada hasil akhir, tanpa menilai proses belajar murid.",rekomendasi:"Kembangkan rubrik penilaian proses (observasi keaktifan, kolaborasi, diskusi) dan rubrik hasil belajar secara seimbang.",target:"Penilaian proses dan hasil seimbang",waktu:"2 bulan"},{aspek:"Penilaian berorientasi pada dimensi profil lulusan dan Topik Panca Cinta",masalah:"Instrumen penilaian belum mencerminkan dimensi profil lulusan atau nilai Panca Cinta.",rekomendasi:"Integrasikan indik
