const FITUR_DEFS = [
  { key:'supervisi',          label:'📋 Modul Supervisi',          desc:'Form isian supervisi pembelajaran + rekap hasil'},
  { key:'jadwal',             label:'📅 Jadwal Supervisi',          desc:'Penjadwalan supervisi per guru'},
  { key:'rtl',                label:'📌 RTL (Rencana Tindak Lanjut)',desc:'Pembuatan & pemantauan tindak lanjut hasil supervisi'},
  { key:'portofolio',         label:'🗂️ e-Portofolio PKB',         desc:'Upload bukti PKB & portofolio pengembangan guru'},
  { key:'analisis_instrumen', label:'🔬 Analisis Instrumen',        desc:'Analisis kualitas soal sebelum digunakan'},
  { key:'analisis_asesmen',   label:'📈 Analisis Hasil Asesmen',    desc:'Analisis nilai siswa: mean, STDV, tuntas/remedial'},
  { key:'grafik',             label:'📊 Grafik & Statistik',        desc:'Tampilan grafik progress supervisi per periode'},
  { key:'dashboard_guru',     label:'🎓 Dashboard Guru',            desc:'Halaman khusus guru: lihat hasil supervisi & RTL'},
];

const FITUR_DEFAULT = Object.fromEntries(FITUR_DEFS.map(f=>[f.key, true]));

function TabKelolaFitur({madrasahList, showToast, onReload}) {
  const sb = window.supabase;
  const [saving, setSaving]         = React.useState({});
  const [localFitur, setLocalFitur] = React.useState({});
  const [filterKab, setFilterKab]   = React.useState('');
  const [filterTkt, setFilterTkt]   = React.useState('');
  const [modeView, setModeView]     = React.useState('per-madrasah'); // 'per-madrasah' | 'per-fitur'
  const [bulk, setBulk]             = React.useState(null); // {fiturKey, value} untuk set semua sekaligus

  // Inisialisasi state lokal dari data madrasah
  React.useEffect(()=>{
    const init = {};
    madrasahList.forEach(m=>{
      init[m.id] = { ...(FITUR_DEFAULT), ...(m.fitur_aktif||{}) };
    });
    setLocalFitur(init);
  }, [madrasahList]);

  function toggle(madId, fiturKey) {
    setLocalFitur(prev=>({
      ...prev,
      [madId]: { ...prev[madId], [fiturKey]: !prev[madId]?.[fiturKey] }
    }));
  }

  async function simpanMadrasah(m) {
    setSaving(s=>({...s,[m.id]:true}));
    const fitur = localFitur[m.id] || FITUR_DEFAULT;
    const {error} = await sb.from('supermad_madrasah')
      .update({fitur_aktif: fitur}).eq('id', m.id);
    setSaving(s=>({...s,[m.id]:false}));
    if (error) { showToast('Gagal simpan '+m.nama+': '+error.message,'error'); return; }
    showToast('✅ Pengaturan fitur '+m.nama+' disimpan','success');
    onReload();
  }

  async function simpanSemua() {
    const filtered = filteredList;
    let ok=0, fail=0;
    for (const m of filtered) {
      const fitur = localFitur[m.id] || FITUR_DEFAULT;
      const {error} = await sb.from('supermad_madrasah').update({fitur_aktif:fitur}).eq('id',m.id);
      if (error) fail++; else ok++;
    }
    showToast(ok+' madrasah disimpan'+(fail?' · '+fail+' gagal':''),'success');
    onReload();
  }

  async function aturSemua(fiturKey, nilai) {
    setLocalFitur(prev=>{
      const upd = {...prev};
      filteredList.forEach(m=>{
        upd[m.id] = {...(upd[m.id]||FITUR_DEFAULT), [fiturKey]: nilai};
      });
      return upd;
    });
    setBulk(null);
  }

  const kabList     = [...new Set(madrasahList.map(m=>m.kota_kab).filter(Boolean))].sort();
  const filteredList = madrasahList.filter(m=>{
    if (filterKab && m.kota_kab!==filterKab) return false;
    if (filterTkt && m.tingkat!==filterTkt) return false;
    return true;
  });

  // Hitung ringkasan per fitur
  function ringkasanFitur(fiturKey) {
    const aktif = madrasahList.filter(m=>(localFitur[m.id]?.[fiturKey]??true)).length;
    return { aktif, mati: madrasahList.length - aktif };
  }

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontWeight:800,color:'var(--p3)',fontSize:'1rem'}}>⚙️ Kelola Fitur per Madrasah</div>
          <div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:3}}>
            Aktifkan atau nonaktifkan fitur untuk setiap madrasah. Fitur yang dinonaktifkan tidak akan muncul di tampilan supervisor dan guru madrasah tersebut.
          </div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={simpanSemua}>
          💾 Simpan Semua Perubahan
        </button>
      </div>

      {/* Ringkasan per fitur */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(145px,1fr))',gap:8,marginBottom:16}}>
        {FITUR_DEFS.map(f=>{
          const r = ringkasanFitur(f.key);
          const pct = madrasahList.length ? Math.round(r.aktif/madrasahList.length*100) : 0;
          return (
            <div key={f.key} className="card" style={{padding:'10px 12px',border:r.mati>0?'1.5px solid #fbbf24':'1.5px solid #86efac'}}>
              <div style={{fontSize:'.8rem',fontWeight:700,marginBottom:4}}>{f.label}</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'.85rem',fontWeight:800,color:pct===100?'#16a34a':pct>=50?'#d97706':'#dc2626'}}>
                  {r.aktif}/{madrasahList.length}
                </span>
                <span style={{fontSize:'.72rem',color:'var(--text2)'}}>madrasah aktif</span>
              </div>
              <div style={{marginTop:5,height:4,background:'var(--surface2)',borderRadius:3,overflow:'hidden'}}>
                <div style={{width:pct+'%',height:'100%',background:pct===100?'#22c55e':pct>=50?'#f59e0b':'#ef4444',borderRadius:3}}/>
              </div>
              {/* Tombol atur massal */}
              <div style={{display:'flex',gap:5,marginTop:7}}>
                <button onClick={()=>aturSemua(f.key, true)}
                  style={{flex:1,padding:'3px 0',borderRadius:6,border:'1px solid #86efac',
                    background:'#f0fdf4',color:'#15803d',cursor:'pointer',fontSize:'.68rem',fontWeight:700}}>
                  ✓ Semua On
                </button>
                <button onClick={()=>aturSemua(f.key, false)}
                  style={{flex:1,padding:'3px 0',borderRadius:6,border:'1px solid #fca5a5',
                    background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.68rem',fontWeight:700}}>
                  ✕ Semua Off
                </button>
              </div>
            </div>
          );
        })}
      </div>

      {/* Filter */}
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)'}}>Filter:</span>
        <select value={filterKab} onChange={e=>setFilterKab(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',fontSize:'.8rem',fontFamily:'inherit'}}>
          <option value="">Semua Kab/Kota</option>
          {kabList.map(k=><option key={k}>{k}</option>)}
        </select>
        <select value={filterTkt} onChange={e=>setFilterTkt(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',fontSize:'.8rem',fontFamily:'inherit'}}>
          <option value="">Semua Tingkat</option>
          {['MI','MTs','MA'].map(t=><option key={t}>{t}</option>)}
        </select>
        <span style={{fontSize:'.75rem',color:'var(--text2)',marginLeft:'auto'}}>
          {filteredList.length} madrasah
        </span>
      </div>

      {/* Tabel per madrasah */}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {filteredList.map(m=>{
          const fitur = localFitur[m.id] || FITUR_DEFAULT;
          const aktifCount = FITUR_DEFS.filter(f=>fitur[f.key]!==false).length;
          const adaPerubahan = JSON.stringify(fitur) !== JSON.stringify({...(FITUR_DEFAULT),...(m.fitur_aktif||{})});
          return (
            <div key={m.id} className="card" style={{padding:'14px 16px',
              border: adaPerubahan ? '2px solid var(--p)' : '1px solid var(--border)'}}>
              {/* Header madrasah */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10,gap:10}}>
                <div>
                  <div style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap'}}>
                    <span style={{fontWeight:700,fontSize:'.92rem'}}>{m.nama}</span>
                    <span style={{padding:'2px 7px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                      background:m.tingkat==='MA'?'#dbeafe':m.tingkat==='MTs'?'#fef3c7':'#d1fae5',
                      color:m.tingkat==='MA'?'#1d4ed8':m.tingkat==='MTs'?'#92400e':'#065f46'}}>
                      {m.tingkat}
                    </span>
                    {adaPerubahan && (
                      <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',fontWeight:700,
                        background:'#ede9fe',color:'#7c3aed'}}>✎ Ada perubahan</span>
                    )}
                  </div>
                  <div style={{fontSize:'.73rem',color:'var(--text2)',marginTop:2}}>
                    {m.kota_kab||'—'} · {aktifCount}/{FITUR_DEFS.length} fitur aktif
                  </div>
                </div>
                <button className="btn btn-primary btn-sm" disabled={saving[m.id]}
                  onClick={()=>simpanMadrasah(m)}>
                  {saving[m.id]?'⏳':'💾'} Simpan
                </button>
              </div>

              {/* Toggle grid */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:6}}>
                {FITUR_DEFS.map(f=>{
                  const on = fitur[f.key] !== false;
                  return (
                    <div key={f.key} onClick={()=>toggle(m.id, f.key)}
                      style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',
                        borderRadius:9,cursor:'pointer',userSelect:'none',
                        background: on ? '#f0fdf4' : '#fef2f2',
                        border:'1.5px solid '+(on?'#86efac':'#fca5a5'),
                        transition:'all .15s'}}>
                      {/* Toggle switch visual */}
                      <div style={{width:36,height:20,borderRadius:10,position:'relative',flexShrink:0,
                        background: on ? '#22c55e' : '#d1d5db',transition:'background .2s'}}>
                        <div style={{position:'absolute',top:3,left:on?17:3,width:14,height:14,
                          borderRadius:7,background:'#fff',transition:'left .2s',
                          boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:'.78rem',color:on?'#15803d':'#dc2626'}}>
                          {f.label}
                        </div>
                        <div style={{fontSize:'.68rem',color:'var(--text2)',
                          whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                          {f.desc}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {filteredList.length===0 && (
        <div style={{textAlign:'center',padding:40,color:'var(--text2)'}}>
          Tidak ada madrasah yang cocok dengan filter.
        </div>
      )}
    </div>
  );
}

// ── JADWAL SUPERVISI ─────────────────────────────────────────
function HalamanJadwal({sesi, showToast, guruList, filterSmt, filterTA, onMulaiSupervisi}) {
  const [jadwalList, setJadwalList] = useState([]);
  const [loading, setLoading]       = useState(true);
  const [showForm, setShowForm]     = useState(false);
  const [editJadwal, setEditJadwal] = useState(null);
  const [saving, setSaving]         = useState(false);
  const today = new Date().toISOString().split('T')[0];
  const blankForm = {guru_id:'',tanggal:today,jam_mulai:'07:30',jam_selesai:'08:30',kelas:'',mapel:'',catatan:''};
  const [form, setForm] = useState(blankForm);

  useEffect(()=>{ loadJadwal(); }, [filterSmt, filterTA]);

  async function loadJadwal() {
    setLoading(true);
    const {data} = await sb.from('supermad_jadwal')
      .select('*').eq('madrasah_id', sesi.mad.id)
      .eq('semester', filterSmt).eq('tahun_ajaran', filterTA)
      .order('tanggal').order('jam_mulai');
    setJadwalList(data||[]);
    setLoading(false);
  }

  async function simpan(e) {
    e.preventDefault();
    if (!form.guru_id) { showToast('Pilih guru!','error'); return; }
    setSaving(true);
    const guru = guruList.find(g=>g.id===form.guru_id);
    const payload = {
      madrasah_id:sesi.mad.id, guru_id:form.guru_id,
      tanggal:form.tanggal, jam_mulai:form.jam_mulai||null,
      jam_selesai:form.jam_selesai||null, kelas:form.kelas,
      mapel:form.mapel||(guru?guru.mapel:''), semester:filterSmt,
      tahun_ajaran:filterTA, catatan:form.catatan,
      status:'terjadwal', dibuat_oleh:sesi.pengguna.id,
      updated_at:new Date().toISOString(),
    };
    let err;
    if (editJadwal) { ({error:err}=await sb.from('supermad_jadwal').update(payload).eq('id',editJadwal.id)); }
    else { ({error:err}=await sb.from('supermad_jadwal').insert(payload)); }
    setSaving(false);
    if (err) { showToast('Gagal: '+err.message,'error'); return; }
    showToast(editJadwal?'✅ Jadwal diupdate!':'✅ Jadwal ditambahkan!');
    setShowForm(false); setEditJadwal(null); setForm(blankForm);
    loadJadwal();
  }

  async function hapus(j) {
    if (!window.confirm('Hapus jadwal ini?')) return;
    await sb.from('supermad_jadwal').delete().eq('id',j.id);
    showToast('🗑️ Jadwal dihapus.'); loadJadwal();
  }

  async function batal(j) {
    await sb.from('supermad_jadwal').update({status:'dibatalkan',updated_at:new Date().toISOString()}).eq('id',j.id);
    showToast('Jadwal dibatalkan.'); loadJadwal();
  }

  const total   = jadwalList.length;
  const selesai = jadwalList.filter(j=>j.status==='selesai').length;
  const hariIni = jadwalList.filter(j=>j.tanggal===today&&j.status==='terjadwal').length;
  const pct     = total>0?Math.round(selesai/total*100):0;

  const sColor = {terjadwal:'#2563eb',selesai:'#16a34a',dibatalkan:'#9ca3af'};
  const sBg    = {terjadwal:'#dbeafe',selesai:'#d1fae5',dibatalkan:'#f3f4f6'};
  const sLabel = {terjadwal:'🗓️ Terjadwal',selesai:'✅ Selesai',dibatalkan:'❌ Dibatalkan'};

  const grouped = {};
  jadwalList.forEach(j=>{ if(!grouped[j.tanggal])grouped[j.tanggal]=[]; grouped[j.tanggal].push(j); });

  return (
    <div>
      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:14}}>
        {[[total,'🗓️','Total Jadwal'],[selesai+'/'+total,'✅','Terlaksana ('+pct+'%)'],[hariIni,'📍','Hari Ini']].map((s,i)=>(
          <div key={i} className="card" style={{textAlign:'center',padding:10}}>
            <div style={{fontSize:'1.4rem'}}>{s[1]}</div>
            <div style={{fontWeight:900,fontSize:'1.2rem',color:'var(--p3)'}}>{s[0]}</div>
            <div style={{fontSize:'.7rem',color:'var(--text2)'}}>{s[2]}</div>
          </div>
        ))}
      </div>

      {/* Header + Tombol */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div style={{fontWeight:800,color:'var(--p3)'}}>🗓️ Jadwal Supervisi — {filterSmt} {filterTA}</div>
        <button onClick={()=>{setShowForm(!showForm);setEditJadwal(null);setForm({...blankForm,tanggal:today});}}
          className="btn btn-primary btn-sm">
          {showForm?'✕ Batal':'+ Jadwal Baru'}
        </button>
      </div>

      {/* Form */}
      {showForm && (
        <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
            {editJadwal?'✏️ Edit Jadwal':'+ Jadwal Baru'}
          </div>
          <form onSubmit={simpan}>
            <div className="grid2">
              <div className="form-group">
                <label>Guru *</label>
                <select value={form.guru_id} required
                  onChange={e=>{const g=guruList.find(x=>x.id===e.target.value);setForm({...form,guru_id:e.target.value,mapel:g?g.mapel:''});}}>
                  <option value="">-- Pilih Guru --</option>
                  {guruList.map(g=><option key={g.id} value={g.id}>{g.nama} — {g.mapel}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Tanggal *</label>
                <input type="date" value={form.tanggal} required onChange={e=>setForm({...form,tanggal:e.target.value})}/>
              </div>
              <div className="form-group">
                <label>Jam Mulai</label>
                <input type="time" value={form.jam_mulai} onChange={e=>setForm({...form,jam_mulai:e.target.value})}/>
              </div>
              <div className="form-group">
                <label>Jam Selesai</label>
                <input type="time" value={form.jam_selesai} onChange={e=>setForm({...form,jam_selesai:e.target.value})}/>
              </div>
              <div className="form-group">
                <label>Kelas</label>
                <input value={form.kelas} placeholder="cth: VII A" onChange={e=>setForm({...form,kelas:e.target.value})}/>
              </div>
              <div className="form-group">
                <label>Mata Pelajaran</label>
                <input value={form.mapel} placeholder="otomatis dari guru" onChange={e=>setForm({...form,mapel:e.target.value})}/>
              </div>
              <div className="form-group" style={{gridColumn:'1/-1'}}>
                <label>Catatan</label>
                <input value={form.catatan} placeholder="opsional..." onChange={e=>setForm({...form,catatan:e.target.value})}/>
              </div>
            </div>
            <button className="btn btn-primary" type="submit" disabled={saving}>
              {saving?'⏳ Menyimpan...':'💾 Simpan Jadwal'}
            </button>
          </form>
        </div>
      )}

      {/* Daftar */}
      {loading ? <div style={{textAlign:'center',padding:24,color:'var(--text3)'}}>⏳ Memuat...</div>
      : Object.keys(grouped).length===0
        ? <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
            Belum ada jadwal. Klik <b>+ Jadwal Baru</b> untuk mulai!
          </div>
        : Object.keys(grouped).sort().map(tgl=>{
            const tglStr = new Date(tgl+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
            const isToday = tgl===today;
            const isPast  = tgl<today;
            return (
              <div key={tgl} style={{marginBottom:12}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                  <span style={{padding:'3px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:800,
                    background:isToday?'#fef3c7':isPast?'var(--surface2)':'#dbeafe',
                    color:isToday?'#92400e':isPast?'var(--text3)':'#1d4ed8'}}>
                    {isToday?'📍 HARI INI':isPast?'📅 Lalu':'📅 Mendatang'}
                  </span>
                  <span style={{fontWeight:700,fontSize:'.82rem'}}>{tglStr}</span>
                </div>
                {grouped[tgl].map(j=>{
                  const guru = guruList.find(g=>g.id===j.guru_id);
                  return (
                    <div key={j.id} style={{marginBottom:8,padding:'12px 14px',background:'#fff',
                      borderRadius:10,borderLeft:'4px solid '+(sColor[j.status]||'var(--border)'),
                      border:'1px solid '+(isToday&&j.status==='terjadwal'?'#f59e0b':'var(--border)')}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,flexWrap:'wrap'}}>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:700}}>{guru?guru.nama:'—'}</div>
                          <div style={{fontSize:'.75rem',color:'var(--text2)',marginTop:2}}>
                            {j.mapel||'—'} · Kelas {j.kelas||'—'}
                            {j.jam_mulai?' · '+j.jam_mulai.slice(0,5)+(j.jam_selesai?' – '+j.jam_selesai.slice(0,5):''):''}
                          </div>
                          {j.catatan&&<div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:2}}>📝 {j.catatan}</div>}
                        </div>
                        <div style={{display:'flex',gap:5,alignItems:'center',flexWrap:'wrap'}}>
                          <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                            background:sBg[j.status],color:sColor[j.status]}}>
                            {sLabel[j.status]}
                          </span>
                          {j.status==='terjadwal' && <>
                            <button onClick={()=>onMulaiSupervisi(guru,j)}
                              style={{padding:'4px 10px',borderRadius:6,border:'none',
                                background:'var(--p)',color:'#fff',cursor:'pointer',fontSize:'.72rem',fontWeight:700}}>
                              📋 Mulai
                            </button>
                            <button onClick={()=>{setEditJadwal(j);setForm({...j});setShowForm(true);}}
                              style={{padding:'4px 8px',borderRadius:6,border:'1px solid #d97706',
                                background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:'.72rem'}}>✏️</button>
                            <button onClick={()=>batal(j)}
                              style={{padding:'4px 8px',borderRadius:6,border:'1px solid #fca5a5',
                                background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.72rem'}}>✕</button>
                          </>}
                          <button onClick={()=>hapus(j)}
                            style={{padding:'4px 8px',borderRadius:6,border:'1px solid #e5e7eb',
                              background:'#f9fafb',color:'#6b7280',cursor:'pointer',fontSize:'.72rem'}}>🗑️</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })
      }
    </div>
  );
}

function DashboardSupervisor({sesi, showToast}) {
  // Fitur aktif dari setting kanwil (default semua aktif jika belum diset)
  const FITUR_DEFAULT_SUP = {supervisi:true,jadwal:true,rtl:true,portofolio:true,
    analisis_instrumen:true,analisis_asesmen:true,grafik:true,dashboard_guru:true};
  const fiturAktif = {...FITUR_DEFAULT_SUP, ...(sesi.mad.fitur_aktif||{})};

  const [tab, setTab]             = useState('sudah'); // default ke sudah agar langsung terlihat
  const [guruList, setGuruList]   = useState([]);
  const [supList, setSupList]     = useState([]);       // SEMUA supervisi (stats & riwayat)
  const [supListFilter, setSupListFilter] = useState([]); // difilter semester+TA (grafik & daftar)
  const [loading, setLoading]     = useState(true);
  const [guruAktif, setGuruAktif]       = useState(null);
  const [jadwalAktif, setJadwalAktif]   = useState(null); // jadwal yang dipilih
  const [supAktifRTL, setSupAktifRTL] = useState(null);
  // Hitung tahun ajaran berjalan otomatis
  const now = new Date();
  const bln = now.getMonth() + 1; // 1-12
  const thn = now.getFullYear();
  const taAwal = bln >= 7 ? thn : thn - 1;
  const taDefault = taAwal + '/' + (taAwal + 1);
  const smtDefault = bln >= 7 ? 'Ganjil' : 'Genap';

  const [filterSmt, setFilterSmt] = useState(sesi.mad.semester_aktif || smtDefault);
  const [filterTA, setFilterTA]   = useState(sesi.mad.tahun_ajaran   || taDefault);

  useEffect(() => { loadData(filterSmt, filterTA); }, [filterSmt, filterTA]);

  async function loadData(smt, ta) {
    setLoading(true);
    const useSmt = smt || filterSmt;
    const useTA  = ta  || filterTA;
    const [g, sAll, sFilter] = await Promise.all([
      sb.from('supermad_guru').select('*').eq('madrasah_id', sesi.mad.id).eq('aktif',true).order('nama'),
      // Semua supervisi madrasah ini (untuk stats Total/Sudah/Belum & Riwayat)
      sb.from('supermad_supervisi').select('*')
        .eq('madrasah_id', sesi.mad.id)
        .order('created_at', {ascending:false}),
      // Supervisi difilter per semester+TA (untuk Grafik & daftar periode ini)
      sb.from('supermad_supervisi').select('*')
        .eq('madrasah_id', sesi.mad.id)
        .eq('semester', useSmt)
        .eq('tahun_ajaran', useTA)
        .order('created_at', {ascending:false}),
    ]);
    if (g.error) console.error('Guru error:', g.error);
    setGuruList(g.data||[]);
    setSupList(sAll.data||[]);          // semua — untuk stats & riwayat
    setSupListFilter(sFilter.data||[]); // difilter — untuk grafik & daftar
    setLoading(false);
  }

  if (loading) return <Loading text="Memuat data supervisi..." />;
  function mulaiDariJadwal(guru, jadwal) {
    setGuruAktif(guru);
    setJadwalAktif(jadwal);
    setTab('daftar');
  }

  if (supAktifRTL) return (
    <HalamanRTL
      sup={supAktifRTL.sup} guru={supAktifRTL.guru}
      sesi={sesi} showToast={showToast}
      onBack={()=>{ setSupAktifRTL(null); setTab('riwayat'); loadData(); }}
    />
  );
  if (guruAktif) return (
    <FormSupervisi
      guru={guruAktif} sesi={sesi} showToast={showToast}
      filterSmt={filterSmt} filterTA={filterTA}
      jadwal={jadwalAktif}
      onBatal={()=>{ setGuruAktif(null); setJadwalAktif(null); }}
      onSelesai={async()=>{ setGuruAktif(null); setJadwalAktif(null); await loadData(filterSmt, filterTA); setTab('sudah'); }}
    />
  );

  // Hitung sudah/belum dari semua supervisi (draft maupun selesai)
  const guruSudah = new Set(supList.map(s=>s.guru_id));
  const guruBelum = guruList.filter(g => !guruSudah.has(g.id));
  const guruSelesai = guruList.filter(g => guruSudah.has(g.id));

  return (
    <div>
      <h2 style={{fontWeight:900,color:'var(--p3)',marginBottom:16,fontSize:'1.1rem'}}>
        👨‍💼 Supervisor — {sesi.mad.nama}
      </h2>

      {/* Stats */}
      <div className="grid3" style={{marginBottom:16}}>
        {[
          {label:'Total Guru', value:guruList.length, icon:'👨‍🏫'},
          {label:'Sudah Supervisi', value:guruSelesai.length, icon:'✅'},
          {label:'Belum Supervisi', value:guruBelum.length, icon:'⏳'},
        ].map((k,i)=>(
          <div key={i} className="card" style={{textAlign:'center',padding:14}}>
            <div style={{fontSize:'1.4rem'}}>{k.icon}</div>
            <div style={{fontSize:'1.4rem',fontWeight:900,color:'var(--p)',marginTop:4}}>{k.value}</div>
            <div style={{fontSize:'.7rem',color:'var(--text2)'}}>{k.label}</div>
          </div>
        ))}
      </div>



      {/* Banner fitur yang dinonaktifkan kanwil */}
      {(()=>{
        const mati = Object.entries(fiturAktif).filter(([,v])=>v===false).map(([k])=>k);
        if (mati.length===0) return null;
        const labelMap = {supervisi:'Modul Supervisi',jadwal:'Jadwal',rtl:'RTL',
          portofolio:'e-Portofolio',analisis_instrumen:'Analisis Instrumen',
          analisis_asesmen:'Analisis Asesmen',grafik:'Grafik',dashboard_guru:'Dashboard Guru'};
        return (
          <div style={{marginBottom:12,padding:'9px 14px',borderRadius:9,
            background:'#fffbeb',border:'1.5px solid #fcd34d',fontSize:'.78rem',color:'#92400e'}}>
            <b>⚙️ Fitur dinonaktifkan Kanwil:</b>{' '}
            {mati.map(k=>labelMap[k]||k).join(', ')}
          </div>
        );
      })()}

      {/* Banner Jadwal Hari Ini */}
      {(()=>{
        const today = new Date().toISOString().split('T')[0];
        return null; // akan diload dari HalamanJadwal
      })()}

      {/* Filter Semester & TA */}
      <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center',
        padding:'10px 14px',background:'var(--surface2)',borderRadius:10,flexWrap:'wrap'}}>
        <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)'}}>📅 Filter:</span>
        <select value={filterSmt} onChange={e=>setFilterSmt(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer'}}>
          <option value="Ganjil">Semester Ganjil</option>
          <option value="Genap">Semester Genap</option>
        </select>
        <select value={filterTA} onChange={e=>setFilterTA(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer'}}>
          {(()=>{
            const yr = new Date().getFullYear();
            const tas = [];
            for(let y=yr-1; y<=yr+2; y++) tas.push(y+'/'+(y+1));
            return tas.map(ta=><option key={ta} value={ta}>{ta}</option>);
          })()}
        </select>
        <span style={{fontSize:'.75rem',color:'var(--text3)',marginLeft:'auto'}}>
          {supListFilter.length} supervisi periode ini
          {supListFilter.filter(s=>s.status==='selesai').length > 0 &&
            ` (${supListFilter.filter(s=>s.status==='selesai').length} selesai)`}
        </span>
      </div>

      {/* Tab */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        {[
          ['jadwal',     '🗓️ Jadwal',            fiturAktif.jadwal !== false],
          ['daftar',     '📋 Belum Supervisi',    fiturAktif.supervisi !== false],
          ['sudah',      '✅ Sudah Supervisi',     fiturAktif.supervisi !== false],
          ['grafik',     '📊 Grafik',              fiturAktif.grafik !== false],
          ['riwayat',    '📜 Riwayat',             fiturAktif.supervisi !== false],
          ['portofolio', '🗂️ Portofolio Guru',    fiturAktif.portofolio !== false],
        ].filter(([,,tampil])=>tampil).map(([key,label])=>(
          <button key={key} onClick={()=>setTab(key)}
            style={{padding:'6px 14px',borderRadius:8,border:'none',cursor:'pointer',fontWeight:700,fontSize:'.8rem',
              background:tab===key?'var(--p)':'var(--surface2)',color:tab===key?'#fff':'var(--text2)'}}>
            {label}
          </button>
        ))}
      </div>

      {tab === 'jadwal' && (
        <HalamanJadwal
          sesi={sesi} showToast={showToast}
          guruList={guruList}
          filterSmt={filterSmt} filterTA={filterTA}
          onMulaiSupervisi={mulaiDariJadwal}
        />
      )}

      {tab === 'daftar' && (
        <div className="card">
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {guruBelum.map(g => (
              <div key={g.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                padding:'12px 14px',background:'var(--surface2)',borderRadius:10,border:'1px solid var(--border)'}}>
                <div>
                  <div style={{fontWeight:700}}>{g.nama}</div>
                  <div style={{fontSize:'.73rem',color:'var(--text2)',marginTop:2}}>{g.mapel} · {g.status_kepeg}</div>
                </div>
                <button className="btn btn-primary btn-sm" onClick={()=>setGuruAktif(g)}>
                  ▶ Supervisi
                </button>
              </div>
            ))}
            {!guruBelum.length && (
              <div style={{textAlign:'center',color:'var(--text3)',padding:20,fontSize:'.85rem'}}>
                🎉 Semua guru sudah disupervisi!
              </div>
            )}
          </div>
        </div>
      )}

      {tab === 'sudah' && (
        <div className="card">
          <div style={{fontWeight:700,color:'var(--text2)',fontSize:'.83rem',marginBottom:12,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <span>{supListFilter.length} supervisi · {filterSmt} {filterTA}</span>
            {supListFilter.filter(s=>s.status==='draft').length > 0 && (
              <span style={{fontSize:'.72rem',color:'#92400e',background:'#fef3c7',
                padding:'2px 10px',borderRadius:20,border:'1px solid #fbbf24'}}>
                {supListFilter.filter(s=>s.status==='draft').length} draft belum diselesaikan
              </span>
            )}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {(() => {
              // Hitung berapa sesi per guru untuk label "Sesi ke-X"
              const sesiCountMap = {};
              supListFilter.forEach(s => {
                sesiCountMap[s.guru_id] = (sesiCountMap[s.guru_id]||0)+1;
              });
              const sesiIndexMap = {};
              return supListFilter.map(s => {
                sesiIndexMap[s.guru_id] = (sesiIndexMap[s.guru_id]||0)+1;
                const sesiIndex = sesiIndexMap[s.guru_id];
                const totalSesi = sesiCountMap[s.guru_id]||1;
              const capaian = parseFloat(s.capaian_rata)||0;
              const warna   = capaian>=87.5?'#16a34a':capaian>=75?'#2563eb':capaian>=62.5?'#d97706':'#dc2626';
              const pred    = capaian>=87.5?'Sangat Baik':capaian>=75?'Baik':capaian>=62.5?'Cukup':'Kurang';
              const guru    = guruList.find(g=>g.id===s.guru_id);
              const isDraft = s.status==='draft';

              async function tandaiSelesai() {
                const {error} = await sb.from('supermad_supervisi')
                  .update({status:'selesai'})
                  .eq('id', s.id);
                if (error) { showToast('Gagal: '+error.message,'error'); return; }
                showToast('✅ Supervisi '+guru?.nama+' ditandai Selesai','success');
                loadData(filterSmt, filterTA);
              }

              async function hapusSupervisi() {
                const namaGuru = guru?.nama||'guru ini';
                const tgl = s.tanggal_supervisi
                  ? new Date(s.tanggal_supervisi).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})
                  : 'tanggal tidak diketahui';
                if (!window.confirm(`Hapus data supervisi ${namaGuru} (${tgl})?\n\nData yang dihapus tidak bisa dikembalikan.`)) return;
                const {error} = await sb.from('supermad_supervisi').delete().eq('id', s.id);
                if (error) { showToast('❌ Gagal hapus: '+error.message,'error'); return; }
                showToast('🗑️ Data supervisi '+namaGuru+' berhasil dihapus','success');
                loadData(filterSmt, filterTA);
              }

              return (
                <div key={s.id} style={{padding:'12px 14px',background:'var(--surface2)',borderRadius:10,
                  border:`1.5px solid ${isDraft?'#fbbf24':'#86efac'}`}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                        {guru?.nama||'—'}
                        {totalSesi > 1 && (
                          <span style={{padding:'1px 8px',borderRadius:20,fontSize:'.65rem',fontWeight:700,
                            background:'#e0e7ff',color:'#3730a3',border:'1px solid #a5b4fc'}}>
                            Sesi {sesiIndex}/{totalSesi}
                          </span>
                        )}
                        {isDraft
                          ? <span style={{padding:'1px 8px',borderRadius:20,fontSize:'.65rem',fontWeight:700,
                              background:'#fef3c7',color:'#92400e',border:'1px solid #fbbf24'}}>Draft</span>
                          : <span style={{padding:'1px 8px',borderRadius:20,fontSize:'.65rem',fontWeight:700,
                              background:'#d1fae5',color:'#065f46',border:'1px solid #86efac'}}>✓ Selesai</span>
                        }
                      </div>
                      <div style={{fontSize:'.73rem',color:'var(--text2)',marginTop:3}}>
                        {guru?.mapel||'—'} · Kelas: {s.kelas_sem||'—'}
                      </div>
                      <div style={{fontSize:'.7rem',color:'var(--text3)',marginTop:2}}>
                        {s.tanggal_supervisi
                          ? new Date(s.tanggal_supervisi).toLocaleDateString('id-ID',
                              {day:'numeric',month:'long',year:'numeric'})
                          : '—'}
                      </div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontWeight:900,fontSize:'1.1rem',color:warna}}>
                        {capaian.toFixed(1)}%
                      </div>
                      <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                        background:capaian>=87.5?'#d1fae5':capaian>=75?'#dbeafe':capaian>=62.5?'#fef3c7':'#fee2e2',
                        color:capaian>=87.5?'#065f46':capaian>=75?'#1d4ed8':capaian>=62.5?'#92400e':'#991b1b'}}>
                        {s.predikat||pred}
                      </span>
                    </div>
                  </div>
                  {/* Tombol aksi */}
                  <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
                    {isDraft && (
                      <button onClick={tandaiSelesai}
                        style={{padding:'5px 14px',background:'#16a34a',color:'#fff',
                          border:'none',borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                        ✅ Tandai Selesai
                      </button>
                    )}
                    <button onClick={()=>setGuruAktif(guru)}
                      style={{padding:'5px 12px',background:'#fff',color:'var(--p)',
                        border:'1.5px solid var(--p)',borderRadius:7,cursor:'pointer',
                        fontSize:'.75rem',fontWeight:700}}>
                      ✏️ {isDraft ? 'Lanjut Edit' : 'Edit Ulang'}
                    </button>
                    <button onClick={()=>setSupAktifRTL({sup:s,guru})}
                      style={{padding:'5px 12px',background:'var(--g)',color:'#fff',
                        border:'none',borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                      📋 RTL
                    </button>
                    <button onClick={hapusSupervisi}
                      style={{padding:'5px 12px',background:'#fff',color:'#dc2626',
                        border:'1.5px solid #fca5a5',borderRadius:7,cursor:'pointer',
                        fontSize:'.75rem',fontWeight:700,marginLeft:'auto'}}>
                      🗑️ Hapus
                    </button>
                  </div>
                </div>
              );
            });
            })()}
            {!supListFilter.length && (
              <div style={{textAlign:'center',color:'var(--text3)',padding:24,fontSize:'.85rem'}}>
                Belum ada supervisi untuk periode {filterSmt} {filterTA}.
              </div>
            )}
          </div>
        </div>
      )}

      {/* TAB GRAFIK */}
      {tab === 'grafik' && (
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {/* Summary cards */}
          {(()=>{const sf=supListFilter; return (
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
            {[
              {label:'Perencanaan',
               val:sf.length ? (sf.reduce((a,s)=>a+(+s.capaian_perencanaan||0),0)/sf.length).toFixed(1)+'%' : '—',
               color:'#16a34a'},
              {label:'Pelaksanaan',
               val:sf.length ? (sf.reduce((a,s)=>a+(+s.capaian_pelaksanaan||0),0)/sf.length).toFixed(1)+'%' : '—',
               color:'#2563eb'},
              {label:'Asesmen',
               val:sf.length ? (sf.reduce((a,s)=>a+(+s.capaian_asesmen||0),0)/sf.length).toFixed(1)+'%' : '—',
               color:'#d97706'},
            ].map((k,i)=>(
              <div key={i} className="card" style={{textAlign:'center',padding:12,borderTop:'3px solid '+k.color}}>
                <div style={{fontSize:'1.2rem',fontWeight:900,color:k.color}}>{k.val}</div>
                <div style={{fontSize:'.72rem',color:'var(--text2)',marginTop:4}}>Rata-rata {k.label}</div>
              </div>
            ))}
          </div>
          );})()}

          {/* Bar chart per guru */}
          <div className="card">
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16}}>
              📊 Capaian Per Guru — {filterSmt} {filterTA}
            </div>

              ? <div style={{textAlign:'center',color:'var(--text3)',padding:24}}>
                  Belum ada data supervisi periode {filterSmt} {filterTA}.
                </div>
              : <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  {supListFilter.map(s=>{
                    const guru = guruList.find(g=>g.id===s.guru_id);
                    const cap  = parseFloat(s.capaian_rata)||0;
                    const capP = parseFloat(s.capaian_perencanaan)||0;
                    const capL = parseFloat(s.capaian_pelaksanaan)||0;
                    const capA = parseFloat(s.capaian_asesmen)||0;
                    const warna = cap>=87.5?'#16a34a':cap>=75?'#2563eb':cap>=62.5?'#d97706':'#dc2626';
                    return (
                      <div key={s.id} style={{padding:'12px 14px',background:'var(--surface2)',borderRadius:10}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,alignItems:'center'}}>
                          <div>
                            <span style={{fontWeight:700,fontSize:'.85rem'}}>{guru?.nama||'—'}</span>
                            <span style={{fontSize:'.72rem',color:'var(--text2)',marginLeft:8}}>{guru?.mapel||'—'}</span>
                          </div>
                          <span style={{fontWeight:900,color:warna,fontSize:'1rem'}}>{cap.toFixed(1)}%</span>
                        </div>
                        {/* Bar per komponen */}
                        {[
                          {label:'P',val:capP,color:'#16a34a'},
                          {label:'L',val:capL,color:'#2563eb'},
                          {label:'A',val:capA,color:'#d97706'},
                        ].map((b,bi)=>(
                          <div key={bi} style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                            <span style={{fontSize:'.68rem',fontWeight:700,color:'var(--text2)',width:16}}>{b.label}</span>
                            <div style={{flex:1,background:'#e5e7eb',borderRadius:4,height:12,overflow:'hidden'}}>
                              <div style={{width:b.val+'%',height:'100%',background:b.color,borderRadius:4,
                                transition:'width .5s ease'}}/>
                            </div>
                            <span style={{fontSize:'.68rem',fontWeight:700,color:b.color,width:40,textAlign:'right'}}>
                              {b.val.toFixed(1)}%
                            </span>
                          </div>
                        ))}
                        {/* Predikat */}
                        <div style={{marginTop:6,display:'flex',alignItems:'center',gap:8}}>
                          <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                            background:cap>=87.5?'#d1fae5':cap>=75?'#dbeafe':cap>=62.5?'#fef3c7':'#fee2e2',
                            color:cap>=87.5?'#065f46':cap>=75?'#1d4ed8':cap>=62.5?'#92400e':'#991b1b'}}>
                            {s.predikat||'—'}
                          </span>
                          <span style={{fontSize:'.68rem',color:'var(--text3)'}}>
                            Kelas {s.kelas_sem||'—'} · {new Date(s.tanggal_supervisi).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
            }
          </div>

          {/* Distribusi predikat */}
          {supListFilter.length > 0 && (
            <div className="card">
              <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>🏆 Distribusi Predikat</div>
              {(()=>{
                const selesai = supListFilter;
                const dist = [
                  {label:'Sangat Baik',count:selesai.filter(s=>(+s.capaian_rata||0)>=87.5).length,color:'#16a34a',bg:'#d1fae5'},
                  {label:'Baik',       count:selesai.filter(s=>(+s.capaian_rata||0)>=75&&(+s.capaian_rata||0)<87.5).length,color:'#2563eb',bg:'#dbeafe'},
                  {label:'Cukup',      count:selesai.filter(s=>(+s.capaian_rata||0)>=62.5&&(+s.capaian_rata||0)<75).length,color:'#d97706',bg:'#fef3c7'},
                  {label:'Kurang',     count:selesai.filter(s=>(+s.capaian_rata||0)<62.5).length,color:'#dc2626',bg:'#fee2e2'},
                ];
                return (
                  <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
                    {dist.map((d,i)=>(
                      <div key={i} style={{textAlign:'center',padding:'12px 8px',borderRadius:10,
                        background:d.count>0?d.bg:'var(--surface2)',
                        border:'2px solid '+(d.count>0?d.color:'var(--border)')}}>
                        <div style={{fontSize:'1.6rem',fontWeight:900,color:d.color}}>{d.count}</div>
                        <div style={{fontSize:'.7rem',fontWeight:700,color:d.color,marginTop:4}}>{d.label}</div>
                        <div style={{fontSize:'.65rem',color:'var(--text3)',marginTop:2}}>
                          {selesai.length?Math.round(d.count/selesai.length*100):0}%
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      )}

      {/* TAB PORTOFOLIO GURU */}
      {tab === 'portofolio' && (
        <TabPortofolioSupervisor sesi={sesi} guruList={guruList} showToast={showToast} fiturAktif={fiturAktif} />
      )}

      {/* TAB RIWAYAT */}
      {tab === 'riwayat' && (
        <div className="card">
          <div style={{fontWeight:700,color:'var(--text2)',fontSize:'.83rem',marginBottom:12}}>
            {supList.length} riwayat supervisi tersimpan
          </div>
          {supList.length === 0
            ? <div style={{textAlign:'center',color:'var(--text3)',padding:24}}>Belum ada riwayat supervisi.</div>
            : <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {supList.map((s,i) => {
                  const capaian = parseFloat(s.capaian_rata)||0;
                  const warna   = capaian>=87.5?'#16a34a':capaian>=75?'#2563eb':capaian>=62.5?'#d97706':'#dc2626';
                  const guruData= guruList.find(g=>g.id===s.guru_id);
                  const tgl     = s.tanggal_supervisi
                    ? new Date(s.tanggal_supervisi).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})
                    : '—';
                  return (
                    <div key={s.id} style={{padding:'14px',background:'var(--surface2)',
                      borderRadius:10,border:'1px solid var(--border)'}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:700,fontSize:'.9rem'}}>{guruData?.nama||'—'}</div>
                          <div style={{fontSize:'.73rem',color:'var(--text2)',marginTop:2}}>
                            {guruData?.mapel||'—'} · Kelas: {s.kelas_sem||'—'} · {s.semester||'—'}
                          </div>
                          <div style={{fontSize:'.7rem',color:'var(--text3)',marginTop:2}}>📅 {tgl}</div>
                        </div>
                        <div style={{textAlign:'right'}}>
                          <div style={{fontWeight:900,fontSize:'1.1rem',color:warna}}>{capaian.toFixed(1)}%</div>
                          <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                            background:capaian>=87.5?'#d1fae5':capaian>=75?'#dbeafe':capaian>=62.5?'#fef3c7':'#fee2e2',
                            color:capaian>=87.5?'#065f46':capaian>=75?'#1d4ed8':capaian>=62.5?'#92400e':'#991b1b'}}>
                            {s.predikat||'—'}
                          </span>
                        </div>
                      </div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginTop:10}}>
                        {[
                          {label:'Perencanaan',val:s.capaian_perencanaan},
                          {label:'Pelaksanaan',val:s.capaian_pelaksanaan},
                          {label:'Asesmen',    val:s.capaian_asesmen},
                        ].map((k,ki)=>{
                          const v = parseFloat(k.val)||0;
                          const w = v>=87.5?'#16a34a':v>=75?'#2563eb':v>=62.5?'#d97706':'#dc2626';
                          return (
                            <div key={ki} style={{background:'#fff',borderRadius:7,padding:'6px 8px',
                              border:'1px solid var(--border)',textAlign:'center'}}>
                              <div style={{fontSize:'.68rem',color:'var(--text2)'}}>{k.label}</div>
                              <div style={{fontWeight:800,color:w,fontSize:'.85rem'}}>{v.toFixed(1)}%</div>
                            </div>
                          );
                        })}
                      </div>
                      <div style={{marginTop:10}}>
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                          <button onClick={()=>cetakDariRiwayat(s, guruData)}
                            style={{padding:'5px 12px',background:'var(--p)',color:'#fff',
                              border:'none',borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                            🖨️ Cetak Laporan
                          </button>
                          <button onClick={()=>setSupAktifRTL({sup:s,guru:guruData})}
                            style={{padding:'5px 12px',background:'var(--g)',color:'#fff',
                              border:'none',borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                            📋 RTL
                          </button>
                          <button onClick={()=>setGuruAktif(guruData)}
                            style={{padding:'5px 12px',background:'#fff',color:'var(--p)',
                              border:'1.5px solid var(--p)',borderRadius:7,cursor:'pointer',
                              fontSize:'.75rem',fontWeight:700}}>
                            🔄 Supervisi Lagi
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
          }
        </div>
      )}
    </div>
  );
}

// ── PORTOFOLIO SUPERVISOR (lihat portofolio semua guru di madrasah) ───────────────
function TabPortofolioSupervisor({sesi, guruList, showToast, fiturAktif}) {
  const fa = fiturAktif || {};
  const KATEGORI = ['Sertifikat Pelatihan','Workshop/Seminar','PTK / Karya Ilmiah','Media/Perangkat Ajar','Penghargaan','Lainnya'];
  const [subTab, setSubTab]       = React.useState('pkb'); // 'pkb' | 'analisis'
  const [items, setItems]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [filterGuru, setFilterGuru] = React.useState('');
  const [filterKat, setFilterKat]   = React.useState('');
  // Analisis instrumen
  const [analisisList, setAnalisisList] = React.useState([]);
  const [loadingAnalisis, setLoadingAnalisis] = React.useState(false);
  const [filterGuruA, setFilterGuruA] = React.useState('');
  // Analisis asesmen
  const [asesmenList, setAsesmenList] = React.useState([]);
  const [loadingAsesmen, setLoadingAsesmen] = React.useState(false);
  const [filterGuruAsm, setFilterGuruAsm] = React.useState('');
  const [asesmenDetail, setAsesmenDetail] = React.useState(null);

  React.useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const {data, error} = await sb.from('supermad_portofolio')
      .select('*').eq('madrasah_id', sesi.mad.id)
      .order('tanggal', {ascending: false});
    if (error) showToast('Gagal memuat portofolio: '+error.message, 'error');
    setItems(data||[]);
    setLoading(false);
  }

  async function loadAnalisis() {
    setLoadingAnalisis(true);
    const {data, error} = await sb.from('supermad_analisis_instrumen')
      .select('*').eq('madrasah_id', sesi.mad.id)
      .order('created_at', {ascending: false});
    if (error) showToast('Gagal memuat analisis: '+error.message, 'error');
    setAnalisisList(data||[]);
    setLoadingAnalisis(false);
  }

  async function loadAsesmen() {
    setLoadingAsesmen(true);
    const {data, error} = await sb.from('supermad_analisis_asesmen')
      .select('*').eq('madrasah_id', sesi.mad.id)
      .order('created_at', {ascending: false});
    if (error) showToast('Gagal memuat analisis asesmen: '+error.message, 'error');
    setAsesmenList(data||[]);
    setLoadingAsesmen(false);
  }

  React.useEffect(()=>{ if(subTab==='analisis') loadAnalisis(); }, [subTab]);
  React.useEffect(()=>{ if(subTab==='asesmen') loadAsesmen(); }, [subTab]);

  const katColor = {
    'Sertifikat Pelatihan':'#2563eb','Workshop/Seminar':'#7c3aed',
    'PTK / Karya Ilmiah':'#16a34a','Media/Perangkat Ajar':'#d97706',
    'Penghargaan':'#dc2626','Lainnya':'#6b7280',
  };

  const filtered = items.filter(it => {
    if (filterGuru && it.guru_id !== filterGuru) return false;
    if (filterKat  && it.kategori !== filterKat) return false;
    return true;
  });

  // Hitung rekap per guru
  const rekapGuru = guruList.map(g => ({
    ...g,
    jumlah: items.filter(it => it.guru_id === g.id).length,
  }));

  if (loading) return <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat portofolio...</div>;

  const BLOOM_COLOR = {C1:'#6b7280',C2:'#2563eb',C3:'#16a34a',C4:'#d97706',C5:'#9333ea',C6:'#dc2626'};
  const BLOOM_LABEL = {C1:'Mengingat',C2:'Memahami',C3:'Menerapkan',C4:'Menganalisis',C5:'Mengevaluasi',C6:'Mencipta'};
  const JENIS_LABEL = {UH:'Ulangan Harian',PTS:'PTS',PAS:'PAS',PAT:'PAT',
    Proyek:'Proyek',Observasi:'Observasi',Portofolio:'Portofolio',Lainnya:'Lainnya'};

  return (
    <div>
      {/* Sub-tab navigator */}
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {[
          ['pkb',     '🗂️ e-Portofolio PKB',      fa.portofolio !== false],
          ['asesmen', '📈 Analisis Asesmen',         fa.analisis_asesmen !== false],
          ['analisis','🔬 Analisis Instrumen',       fa.analisis_instrumen !== false],
        ].filter(([,,t])=>t).map(([k,l])=>(
          <button key={k} onClick={()=>setSubTab(k)}
            style={{padding:'7px 16px',borderRadius:8,border:'none',cursor:'pointer',fontWeight:700,fontSize:'.82rem',
              background:subTab===k?'var(--p)':'var(--surface2)',color:subTab===k?'#fff':'var(--text2)'}}>
            {l}
          </button>
        ))}
      </div>

      {/* ── SUB-TAB ANALISIS ASESMEN ── */}
      {subTab==='asesmen' && (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <div style={{fontWeight:800,color:'var(--p3)',fontSize:'1rem'}}>📈 Analisis Hasil Asesmen Guru</div>
            <span style={{fontSize:'.75rem',color:'var(--text3)'}}>
              {asesmenList.length} analisis · {asesmenList.filter(a=>a.status==='final').length} final
            </span>
          </div>

          {/* Filter per guru */}
          {guruList.length > 0 && (
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
              <button onClick={()=>setFilterGuruAsm('')}
                style={{padding:'4px 12px',borderRadius:20,border:'1.5px solid',cursor:'pointer',
                  fontWeight:700,fontSize:'.73rem',
                  background:filterGuruAsm===''?'var(--p)':'transparent',
                  color:filterGuruAsm===''?'#fff':'var(--text2)',
                  borderColor:filterGuruAsm===''?'var(--p)':'var(--border)'}}>
                Semua Guru
              </button>
              {guruList.filter(g=>asesmenList.some(a=>a.guru_id===g.id)).map(g=>(
                <button key={g.id} onClick={()=>setFilterGuruAsm(filterGuruAsm===g.id?'':g.id)}
                  style={{padding:'4px 12px',borderRadius:20,border:'1.5px solid',cursor:'pointer',
                    fontWeight:700,fontSize:'.73rem',
                    background:filterGuruAsm===g.id?'var(--p)':'transparent',
                    color:filterGuruAsm===g.id?'#fff':'var(--text2)',
                    borderColor:filterGuruAsm===g.id?'var(--p)':'var(--border)'}}>
                  {g.nama.split(' ')[0]}
                  <span style={{marginLeft:4,background:filterGuruAsm===g.id?'rgba(255,255,255,.25)':'var(--surface2)',
                    borderRadius:10,padding:'1px 6px',fontWeight:900}}>
                    {asesmenList.filter(a=>a.guru_id===g.id).length}
                  </span>
                </button>
              ))}
            </div>
          )}

          {/* Rekap statistik */}
          {asesmenList.length > 0 && (()=>{
            const filtered = asesmenList.filter(a=>filterGuruAsm?a.guru_id===filterGuruAsm:true);
            const finals   = filtered.filter(a=>a.status==='final');
            const avgTuntas= finals.length>0 ? finals.reduce((s,a)=>s+(a.pct_tuntas||0),0)/finals.length : 0;
            const avgStdv  = finals.length>0 ? finals.reduce((s,a)=>s+(a.stdv||0),0)/finals.length : 0;
            return (
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:8,marginBottom:14}}>
                {[
                  ['Total Analisis', filtered.length, '#6366f1'],
                  ['Sudah Final',    finals.length, '#22c55e'],
                  ['Rata-rata Tuntas', avgTuntas.toFixed(0)+'%', avgTuntas>=70?'#22c55e':'#f59e0b'],
                  ['Rata-rata STDV',  avgStdv.toFixed(1), '#8b5cf6'],
                ].map(([l,v,c])=>(
                  <div key={l} className="card" style={{textAlign:'center',padding:'10px 6px',border:'1.5px solid '+c+'33'}}>
                    <div style={{fontWeight:800,color:c,fontSize:'1.15rem'}}>{v}</div>
                    <div style={{fontSize:'.7rem',color:'var(--text2)'}}>{l}</div>
                  </div>
                ))}
              </div>
            );
          })()}

          {loadingAsesmen
            ? <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat...</div>
            : asesmenList.filter(a=>filterGuruAsm?a.guru_id===filterGuruAsm:true).length===0
              ? <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
                  <div style={{fontSize:'2rem',marginBottom:8}}>📊</div>
                  <div>Belum ada guru yang membuat analisis asesmen.</div>
                </div>
              : (
                asesmenDetail ? (
                  /* ── Detail view ── */
                  <div>
                    <button className="btn btn-outline btn-sm" style={{marginBottom:12}}
                      onClick={()=>setAsesmenDetail(null)}>← Kembali ke Daftar</button>
                    <div className="card" style={{marginBottom:10}}>
                      <div style={{fontWeight:700,fontSize:'.95rem'}}>
                        {asesmenDetail.jenis_penilaian} — {asesmenDetail.mapel||'—'} · {asesmenDetail.kelas||'—'}
                      </div>
                      {asesmenDetail.topik && <div style={{color:'var(--text2)',fontSize:'.82rem',marginTop:3}}>{asesmenDetail.topik}</div>}
                      <div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:4}}>
                        {(()=>{const g=guruList.find(x=>x.id===asesmenDetail.guru_id);return g?'Guru: '+g.nama+' · ':''})()}
                        {asesmenDetail.semester} {asesmenDetail.tahun_ajaran} · KKM: {asesmenDetail.kkm}
                      </div>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:8,marginBottom:12}}>
                      {[
                        ['Siswa',        asesmenDetail.jumlah_siswa||0,   '#6366f1'],
                        ['Rata-rata',    Number(asesmenDetail.nilai_rata||0).toFixed(1), '#3b82f6'],
                        ['STDV',         Number(asesmenDetail.stdv||0).toFixed(1), '#8b5cf6'],
                        ['% Tuntas',     Number(asesmenDetail.pct_tuntas||0).toFixed(0)+'%',
                          (asesmenDetail.pct_tuntas||0)>=70?'#22c55e':'#ef4444'],
                        ['Tertinggi',    Number(asesmenDetail.nilai_tertinggi||0).toFixed(0), '#22c55e'],
                        ['Terendah',     Number(asesmenDetail.nilai_terendah||0).toFixed(0), '#ef4444'],
                      ].map(([l,v,c])=>(
                        <div key={l} className="card" style={{textAlign:'center',padding:'10px 6px',border:'1.5px solid '+c+'33'}}>
                          <div style={{fontWeight:800,color:c,fontSize:'1.1rem'}}>{v}</div>
                          <div style={{fontSize:'.7rem',color:'var(--text2)'}}>{l}</div>

                      ))}
                    </div>
                    {asesmenDetail.interpretasi_stdv && (
                      <div style={{marginBottom:10,padding:'9px 12px',borderRadius:9,background:'#f5f3ff',border:'1.5px solid #a78bfa',fontSize:'.82rem'}}>
                        <b>📐 Interpretasi STDV:</b> {asesmenDetail.interpretasi_stdv}

                    {asesmenDetail.rekomendasi && (

                        <b>💡 Rekomendasi:</b> {asesmenDetail.rekomendasi}

                    {/* Distribusi */}
                    {(()=>{

                      const maxD = Math.max(dist.r0_59||0,dist.r60_74||0,dist.r75_84||0,dist.r85_100||0,1);

                        <div className="card" style={{marginBottom:10}}>

                            const jml = dist[key]||0;

          })}
        </div>
      )}
      </div>} {/* tutup sub-tab PKB */}
    </div>
  );
}

// Generate RTL otomatis dari skor rendah
function generateRTL(skorP, skorL, skorA) {
  const rtl = {p:[], l:[], a:[]};
  [['p',skorP],['l',skorL],['a',skorA]].forEach(([key,skors])=>{
    skors.forEach((skor,i)=>{
      if ((+skor||0) <= 1 && RTL_DB[key][i]) {
        rtl[key].push({
          ...RTL_DB[key][i],
          skor: +skor||0,
          edited: false,
          id: key+'_'+i,
        });
      }
    });
  });
  return rtl;
}

  const [expanded, setExpanded] = useState(false);
  const [editing, setEditing]   = useState(false);

    onUpdate({...form, edited:true});

        background:item.skor===0?'#fef2f2':item.skor===1?'#fffbeb':'var(--surface2)',
        cursor:'pointer'}} onClick={()=>setExpanded(!expanded)}>
        <span style={{fontSize:'1rem'}}>{item.skor===0?'🔴':'🟡'}</span>

      </div>

      {/* Content */}
      {expanded && (
        <div style={{padding:'12px 14px',background:'#fff'}}>
          {editing ? (
            <div>

      )}

// ── HALAMAN RTL LENGKAP ────────────────────────────────────────
function HalamanRTL({sup, guru, sesi, showToast, onBack}) {
  const [loading, setLoading]   = useState(true);
  const [saving, setSaving]     = useState(false);
  const [rtlId, setRtlId]       = useState(null);
  const [tab, setTab]           = useState('guru');
  const [catUmum, setCatUmum]       = useState('');
  const [konfirmasi, setKonfirmasi] = useState('belum');
  const [catatanGuru, setCatatanGuru] = useState('');
  const [tglKonfirmasi, setTglKonfirmasi] = useState(null);

  // RTL per komponen
  const [rtlP, setRtlP] = useState([]);
  const [rtlL, setRtlL] = useState([]);
  const [rtlA, setRtlA] = useState([]);

  // RTL Madrasah
  const [rtlMad, setRtlMad] = useState([]);
  const [newMad, setNewMad] = useState({program:'',tujuan:'',sasaran:'Semua Guru',waktu:'1 semester',pj:'Kepala Madrasah'});
  const [showAddMad, setShowAddMad] = useState(false);

  useEffect(() => { loadRTL(); }, []);

  async function loadRTL() {
    setLoading(true);
    // Cek apakah RTL sudah ada
    const {data} = await sb.from('supermad_rtl')
      .select('*').eq('supervisi_id', sup.id).maybeSingle();

    if (data) {
      setRtlId(data.id);
      setRtlP(data.rtl_perencanaan||[]);
      setRtlL(data.rtl_pelaksanaan||[]);
      setRtlA(data.rtl_asesmen||[]);
      setRtlMad(data.rtl_madrasah||[]);
      setCatUmum(data.catatan_umum||'');
      setKonfirmasi(data.konfirmasi_guru||'belum');
      setCatatanGuru(data.catatan_guru||'');
      setTglKonfirmasi(data.tgl_konfirmasi||null);
    } else {
      // Auto-generate dari skor rendah
      const generated = generateRTL(
        sup.skor_perencanaan||[],
        sup.skor_pelaksanaan||[],
        sup.skor_asesmen||[]
      );
      setRtlP(generated.p);
      setRtlL(generated.l);
      setRtlA(generated.a);
      // Auto-generate RTL madrasah dari item yang bermasalah
      const allIssues = [...generated.p,...generated.l,...generated.a];
      if (allIssues.length > 0) {
        setRtlMad([{
          program: 'Program Pembinaan Guru — ' + (guru?.nama||''),
          tujuan: 'Meningkatkan kompetensi pembelajaran PM-KBC',
          sasaran: guru?.nama||'Guru yang bersangkutan',
          waktu: '1 semester',
          pj: sup.nama_supervisor||sesi.pengguna.nama,
        }]);
      }
      // Auto-simpan draft ke DB
      try {
        const {data:newRtl} = await sb.from('supermad_rtl').insert({
          supervisi_id:    sup.id,
          madrasah_id:     sesi.mad.id,
          guru_id:         guru.id,
          tahun_ajaran:    sesi.mad.tahun_ajaran||'2025/2026',
          rtl_perencanaan: generated.p,
          rtl_pelaksanaan: generated.l,
          rtl_asesmen:     generated.a,
          rtl_madrasah:    allIssues.length>0?[{program:'Program Pembinaan Guru — '+(guru?.nama||''),tujuan:'Meningkatkan kompetensi pembelajaran PM-KBC',sasaran:guru?.nama||'Guru',waktu:'1 semester',pj:sup.nama_supervisor||sesi.pengguna.nama}]:[],
          catatan_umum:    '',
          konfirmasi_guru: 'belum',
          catatan_guru:    '',
          status:          'draft',
          dibuat_oleh:     sesi.pengguna.id,
          updated_at:      new Date().toISOString(),
        }).select().single();
        if (newRtl) setRtlId(newRtl.id);
      } catch(e) { console.error('Auto-save error:', e); }
    }
    setLoading(false);
  }

  async function simpanRTL(status='draft') {
    setSaving(true);
    const payload = {
      supervisi_id: sup.id,
      madrasah_id:  sesi.mad.id,
      guru_id:      guru.id,
      tahun_ajaran: sesi.mad.tahun_ajaran,
      rtl_perencanaan: rtlP,
      rtl_pelaksanaan: rtlL,
      rtl_asesmen:     rtlA,
      rtl_madrasah:    rtlMad,
      catatan_umum:    catUmum,
      konfirmasi_guru: konfirmasi,
      catatan_guru:    catatanGuru,
      status,
      dibuat_oleh: sesi.pengguna.id,
      updated_at: new Date().toISOString(),
    };
    let error;
    if (rtlId) {
      ({error} = await sb.from('supermad_rtl').update(payload).eq('id', rtlId));
    } else {
      const {data, error:e} = await sb.from('supermad_rtl').insert(payload).select().single();
      error = e;
      if (data) setRtlId(data.id);
    }
    setSaving(false);
    if (error) { showToast('Gagal simpan RTL: '+error.message,'error'); return; }
    showToast(status==='final' ? '✅ RTL final tersimpan!' : '✅ Draft RTL disimpan!');
  }

  </div>
</div>
<h2>Rekomendasi Tindak Lanjut (RTL)</h2>

<table>

${allRTL.length > 0 ? `

<table>
<tr><th width="4%">No</th><th width="22%">Aspek</th><th>Masalah</th><th>Rekomendasi</th><th width="12%">Target</th><th width="10%">Waktu</th></tr>
${allRTL.map((r,i)=>`<tr>

${catUmum ? `<div class="section-title">C. CATATAN UMUM SUPERVISOR</div>

<div class="ttd">
