}


// ── DASHBOARD GURU ────────────────────────────────────────────
function DashboardGuru({sesi, showToast}) {
  const [supList, setSupList]   = useState([]);
  const [rtlList, setRtlList]   = useState([]);
  const [loading, setLoading]   = useState(true);
  const [tab, setTab]           = useState('hasil');
  const [aktifRTL, setAktifRTL] = useState(null);
  const [konfirmasi, setKonfirmasi] = useState('belum');
  const [catatanGuru, setCatatanGuru] = useState('');
  const [saving, setSaving]     = useState(false);

  useEffect(()=>{ loadData(); }, []);

  async function loadData() {
    setLoading(true);
    // Guru login via token - id guru langsung dari sesi.pengguna.id
    const guruId = sesi.pengguna.id;
    const {data:sups} = await sb.from('supermad_supervisi')
      .select('*').eq('madrasah_id', sesi.mad.id)
      .eq('guru_id', guruId)
      .eq('status','selesai').order('created_at',{ascending:false});
    // Ambil RTL via supervisi_id agar tidak tergantung guru_id di RTL
    const supIds = (sups||[]).map(s=>s.id);
    let rtls = [];
    if (supIds.length > 0) {
      const {data:rtlData} = await sb.from('supermad_rtl')
        .select('*').in('supervisi_id', supIds)
        .order('created_at',{ascending:false});
      rtls = rtlData||[];
    }
    setSupList(sups||[]);
    setRtlList(rtls||[]);
    setLoading(false);
  }

  async function simpanKonfirmasi() {
    if (!aktifRTL) return;
    setSaving(true);
    const {error} = await sb.from('supermad_rtl').update({
      konfirmasi_guru: konfirmasi,
      catatan_guru:    catatanGuru,
      tgl_konfirmasi:  new Date().toISOString().split('T')[0],
      updated_at:      new Date().toISOString(),
    }).eq('id', aktifRTL.id);
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Konfirmasi berhasil disimpan!');
    setAktifRTL(null);
    loadData();
  }

  if (loading) return <Loading text="Memuat data..." />;

  // Halaman konfirmasi RTL
  if (aktifRTL) return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
        <button className="btn btn-outline btn-sm" onClick={()=>setAktifRTL(null)}>← Kembali</button>
        <div style={{fontWeight:900,color:'var(--p3)'}}>✉️ Konfirmasi Tindak Lanjut RTL</div>
      </div>
      <div className="card">
        <div style={{fontWeight:700,color:'var(--text2)',marginBottom:16}}>
          Supervisor: <b>{aktifRTL.sup?.nama_supervisor||'—'}</b> · 
          {aktifRTL.sup?.tanggal_supervisi ? ' '+new Date(aktifRTL.sup.tanggal_supervisi).toLocaleDateString('id-ID') : ''}
        </div>
        {/* Status */}
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:700,marginBottom:10,fontSize:'.85rem'}}>Status Tindak Lanjut Saya:</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {[
              {val:'belum',   label:'⏳ Belum Ditindaklanjuti', color:'#dc2626', bg:'#fee2e2'},
              {val:'sebagian',label:'🔄 Sebagian Sudah',        color:'#d97706', bg:'#fef3c7'},
              {val:'sudah',   label:'✅ Sudah Ditindaklanjuti', color:'#16a34a', bg:'#d1fae5'},
            ].map(opt=>(
              <button key={opt.val} onClick={()=>setKonfirmasi(opt.val)}
                style={{padding:'8px 16px',borderRadius:20,fontFamily:'inherit',
                  border:'2px solid '+(konfirmasi===opt.val?opt.color:'var(--border)'),
                  background:konfirmasi===opt.val?opt.bg:'#fff',
                  color:konfirmasi===opt.val?opt.color:'var(--text2)',
                  cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
                {opt.label}
              </button>
            ))}
          </div>
        </div>
        {/* Catatan */}
        <div className="form-group">
          <label>Catatan / Langkah Tindak Lanjut Saya:</label>
          <textarea rows={5} value={catatanGuru} onChange={e=>setCatatanGuru(e.target.value)}
            placeholder="Tuliskan langkah konkret yang sudah atau akan dilakukan..."
            style={{width:'100%',padding:'10px 12px',border:'1.5px solid var(--border)',
              borderRadius:9,fontSize:'.85rem',fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
        </div>
        {/* RTL Items */}
        {(aktifRTL.rtl_perencanaan?.length||aktifRTL.rtl_pelaksanaan?.length||aktifRTL.rtl_asesmen?.length) ? (
          <div style={{marginBottom:16,padding:'12px 14px',background:'var(--surface2)',borderRadius:9}}>
            <div style={{fontWeight:700,marginBottom:8,fontSize:'.82rem',color:'var(--p3)'}}>
              📋 Rekomendasi Supervisor:
            </div>
            {[...(aktifRTL.rtl_perencanaan||[]),...(aktifRTL.rtl_pelaksanaan||[]),...(aktifRTL.rtl_asesmen||[])].map((r,i)=>(
              <div key={i} style={{fontSize:'.8rem',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontWeight:600}}>{r.aspek}</span>
                <div style={{color:'var(--text2)',marginTop:2}}>{r.rekomendasi}</div>
              </div>
            ))}
          </div>
        ) : null}
        <button className="btn btn-primary" onClick={simpanKonfirmasi} disabled={saving}>
          {saving?'⏳ Menyimpan...':'💾 Simpan Konfirmasi'}
        </button>
      </div>
    </div>
  );

  return (
    <div>
      <h2 style={{fontWeight:900,color:'var(--p3)',marginBottom:16,fontSize:'1.1rem'}}>
        👨‍🏫 Dashboard Guru — {sesi.pengguna.nama}
      </h2>
      <div style={{marginBottom:16,padding:'10px 14px',background:'var(--surface2)',borderRadius:10,
        fontSize:'.82rem',color:'var(--text2)'}}>
        {sesi.mad.nama} · {sesi.mad.kota_kab||''}
      </div>

      {/* Tab */}
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        {[['hasil','📊 Hasil Supervisi'],['rtl','📋 RTL Saya']].map(([key,label])=>(
          <button key={key} onClick={()=>setTab(key)}
            style={{padding:'7px 14px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
              background:tab===key?'var(--p)':'var(--surface2)',
              color:tab===key?'#fff':'var(--text2)'}}>
            {label}
          </button>
        ))}
      </div>

      {/* TAB HASIL SUPERVISI */}
      {tab==='hasil' && (
        <div>
          {supList.length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
              Belum ada hasil supervisi untuk Anda.
            </div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {supList.map(s=>{
                const cap = parseFloat(s.capaian_rata)||0;
                const w = cap>=87.5?'#16a34a':cap>=75?'#2563eb':cap>=62.5?'#d97706':'#dc2626';
                const tgl = s.tanggal_supervisi
                  ? new Date(s.tanggal_supervisi).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})
                  : '—';
                return (
                  <div key={s.id} className="card" style={{borderTop:'3px solid '+w}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>
                      <div>
                        <div style={{fontWeight:700}}>{s.kelas_sem||'—'} · {s.semester}</div>
                        <div style={{fontSize:'.75rem',color:'var(--text2)',marginTop:2}}>
                          📅 {tgl} · Supervisor: {s.nama_supervisor||'—'}
                        </div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontWeight:900,fontSize:'1.2rem',color:w}}>{cap.toFixed(1)}%</div>
                        <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                          background:cap>=87.5?'#d1fae5':cap>=75?'#dbeafe':cap>=62.5?'#fef3c7':'#fee2e2',
                          color:cap>=87.5?'#065f46':cap>=75?'#1d4ed8':cap>=62.5?'#92400e':'#991b1b'}}>
                          {s.predikat||'—'}
                        </span>
                      </div>
                    </div>
                    {/* Bar per komponen */}
                    <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:4}}>
                      {[
                        {label:'Perencanaan',val:parseFloat(s.capaian_perencanaan)||0,color:'#16a34a'},
                        {label:'Pelaksanaan',val:parseFloat(s.capaian_pelaksanaan)||0,color:'#2563eb'},
                        {label:'Asesmen',    val:parseFloat(s.capaian_asesmen)||0,    color:'#d97706'},
                      ].map((b,i)=>(
                        <div key={i} style={{display:'flex',alignItems:'center',gap:8}}>
                          <span style={{fontSize:'.7rem',width:80,color:'var(--text2)'}}>{b.label}</span>
                          <div style={{flex:1,background:'#e5e7eb',borderRadius:4,height:10,overflow:'hidden'}}>
                            <div style={{width:b.val+'%',height:'100%',background:b.color,borderRadius:4}}/>
                          </div>
                          <span style={{fontSize:'.72rem',fontWeight:700,color:b.color,width:45,textAlign:'right'}}>
                            {b.val.toFixed(1)}%
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TAB RTL */}
      {tab==='rtl' && (
        <div>
          {rtlList.length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
              Belum ada RTL untuk Anda.
            </div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {rtlList.map(r=>{
                const sup = supList.find(s=>s.id===r.supervisi_id);
                const totalRTL = (r.rtl_perencanaan?.length||0)+(r.rtl_pelaksanaan?.length||0)+(r.rtl_asesmen?.length||0);
                const statusColor = r.konfirmasi_guru==='sudah'?'#16a34a':r.konfirmasi_guru==='sebagian'?'#d97706':'#dc2626';
                const statusLabel = r.konfirmasi_guru==='sudah'?'✅ Sudah':r.konfirmasi_guru==='sebagian'?'🔄 Sebagian':'⏳ Belum';
                return (
                  <div key={r.id} className="card">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                      <div>
                        <div style={{fontWeight:700}}>
                          RTL Supervisi · {sup?.tanggal_supervisi ? new Date(sup.tanggal_supervisi).toLocaleDateString('id-ID') : r.created_at?.split('T')[0]||'—'}
                        </div>
                        <div style={{fontSize:'.75rem',color:'var(--text2)',marginTop:3}}>
                          {totalRTL} item rekomendasi
                          {r.tgl_konfirmasi && ' · Direspons: '+new Date(r.tgl_konfirmasi).toLocaleDateString('id-ID')}
                        </div>
                        {r.catatan_guru && (
                          <div style={{marginTop:6,fontSize:'.77rem',color:'var(--text2)',
                            padding:'6px 10px',background:'var(--surface2)',borderRadius:7}}>
                            "{r.catatan_guru}"
                          </div>
                        )}
                      </div>
                      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                        <span style={{padding:'3px 10px',borderRadius:20,fontSize:'.75rem',fontWeight:700,
                          color:statusColor,border:'1.5px solid '+statusColor,background:'#fff'}}>
                          {statusLabel}
                        </span>
                        <button onClick={()=>{
                          setAktifRTL({...r,sup});
                          setKonfirmasi(r.konfirmasi_guru||'belum');
                          setCatatanGuru(r.catatan_guru||'');
                        }} className="btn btn-outline btn-sm">
                          ✏️ Update
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const total = skor.reduce((a,b)=>a+(b||0),0);
  const max   = items.length * 3;
  const pct   = max > 0 ? (total/max*100) : 0;
  const pred  = PREDIKAT(pct);
  const warna = pct>=87.5?'#16a34a':pct>=75?'#2563eb':pct>=62.5?'#d97706':'#dc2626';

  return (
    <div className="card" style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
        <div style={{fontWeight:800,color:'var(--p3)',fontSize:'.9rem'}}>{label}</div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{fontSize:'.78rem',color:'var(--text2)'}}>
            Skor: <b style={{color:warna}}>{total}/{max}</b>
          </div>
          <span style={{padding:'3px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:700,
            background:pct>=87.5?'#d1fae5':pct>=75?'#dbeafe':pct>=62.5?'#fef3c7':'#fee2e2',
            color:pct>=87.5?'#065f46':pct>=75?'#1d4ed8':pct>=62.5?'#92400e':'#991b1b'}}>
            {pred} ({pct.toFixed(1)}%)
          </span>
        </div>
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.8rem',minWidth:500}}>
          <thead>
            <tr style={{background:'var(--p3)',color:'#fff'}}>
              <th style={{padding:'7px 10px',textAlign:'left',width:32}}>No</th>
              <th style={{padding:'7px 10px',textAlign:'left'}}>Aspek Penilaian</th>
              <th style={{padding:'7px 10px',textAlign:'center',width:140}}>Skor (0-3)</th>
            </tr>
          </thead>
          <tbody>
            {items.map((item, i) => (
              <tr key={i} style={{borderBottom:'1px solid var(--border)',background:i%2?'var(--surface2)':'#fff'}}>
                <td style={{padding:'8px 10px',color:'var(--text3)',verticalAlign:'top'}}>{i+1}</td>
                <td style={{padding:'8px 10px',lineHeight:1.5}}>{item}</td>
                <td style={{padding:'8px 10px',textAlign:'center',verticalAlign:'top'}}>
                  <SkorBtns value={skor[i]||0} onChange={v => onChange(i, v)} />
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr style={{background:'var(--surface2)'}}>
              <td colSpan={2} style={{padding:'8px 10px',fontWeight:700,textAlign:'right',fontSize:'.8rem'}}>
                Total Skor:
              </td>
              <td style={{padding:'8px 10px',textAlign:'center',fontWeight:900,
                fontSize:'1rem',color:warna}}>{total}/{max}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div className="form-group" style={{margin:0}}>
          <label>Catatan / Temuan</label>
          <textarea rows={2} value={catatan.c||''} 
            onChange={e=>setCatatan({...catatan,c:e.target.value})}
            style={{fontSize:'.78rem',resize:'vertical'}}
            placeholder="Catatan pengamatan..."/>
        </div>
        <div className="form-group" style={{margin:0}}>
          <label>Rekomendasi Tindak Lanjut</label>
          <textarea rows={2} value={catatan.r||''} 
            onChange={e=>setCatatan({...catatan,r:e.target.value})}
            style={{fontSize:'.78rem',resize:'vertical'}}
            placeholder="Rekomendasi pembinaan..."/>
        </div>
      </div>
    </div>
  );
}

function FormSupervisi({guru, sesi, showToast, onSelesai, filterSmt='Ganjil', filterTA='2025/2026'}) {
  const [tab, setTab]   = useState('identitas');
  const [saving, setSaving] = useState(false);

  // Identitas
  const [tanggal, setTanggal]   = useState(new Date().toISOString().split('T')[0]);
  const [kelas, setKelas]       = useState('');
  const [semester, setSemester]     = useState(filterSmt);
  const [tahunAjaran, setTahunAjaran] = useState(filterTA);
  const [jtm, setJtm]           = useState('');
  const [jurusan, setJurusan]   = useState('');
  const [namaSupervisor, setNamaSupervisor] = useState(sesi.pengguna.nama||'');
  const [nipSupervisor, setNipSupervisor]   = useState(sesi.pengguna.nip||'');
  const [jabatanSup, setJabatanSup]         = useState(sesi.pengguna.jabatan||'');

  // Skor
  const [skorP, setSkorP] = useState(Array(P_ITEMS.length).fill(0));
  const [skorL, setSkorL] = useState(Array(L_ITEMS.length).fill(0));
  const [skorA, setSkorA] = useState(Array(A_ITEMS.length).fill(0));

  // Catatan
  const [catP, setCatP] = useState({c:'',r:''});
  const [catL, setCatL] = useState({c:'',r:''});
  const [catA, setCatA] = useState({c:'',r:''});

  // Hitung capaian
  const capP = (skorP.reduce((a,b)=>a+b,0)/(P_ITEMS.length*3)*100);
  const capL = (skorL.reduce((a,b)=>a+b,0)/(L_ITEMS.length*3)*100);
  const capA = (skorA.reduce((a,b)=>a+b,0)/(A_ITEMS.length*3)*100);
  const capRata = ((capP+capL+capA)/3);

  function setSkorPItem(i,v){ const s=[...skorP]; s[i]=v; setSkorP(s); }
  function setSkorLItem(i,v){ const s=[...skorL]; s[i]=v; setSkorL(s); }
  function setSkorAItem(i,v){ const s=[...skorA]; s[i]=v; setSkorA(s); }

  const tabs = [
    {key:'identitas',  label:'📋 Identitas'},
    {key:'perencanaan',label:'📝 Perencanaan'},
    {key:'pelaksanaan',label:'🎯 Pelaksanaan'},
    {key:'asesmen',    label:'✅ Asesmen'},
    {key:'rekap',      label:'📊 Rekap'},
  ];

  async function simpan(status='selesai') {
    if (!kelas.trim()) { showToast('Kelas wajib diisi','warning'); setTab('identitas'); return; }
    setSaving(true);
    try {
      const {error} = await sb.from('supermad_supervisi').insert({
        madrasah_id:         sesi.mad.id,
        guru_id:             guru.id,
        supervisor_id:       sesi.pengguna.id,
        tahun_ajaran:        sesi.mad.tahun_ajaran,
        semester,
        tanggal_supervisi:   tanggal,
        kelas_sem:           kelas,
        jtm:                 parseInt(jtm)||0,
        jurusan,
        nama_supervisor:    namaSupervisor,
        nip_supervisor:     nipSupervisor,
        jabatan_supervisor: jabatanSup,
        nama_kepala:        sesi.mad.nama_kepala||'',
        nip_kepala:         sesi.mad.nip_kepala||'',
        namaMadrasah:       sesi.mad.nama||'',
        alamatMadrasah:     sesi.mad.alamat||'',
        kota_kab:           sesi.mad.kota_kab||'',
        provinsi:           sesi.mad.provinsi||'',
        naungan:            sesi.mad.naungan||'',
        skor_perencanaan:    skorP,
        skor_pelaksanaan:    skorL,
        skor_asesmen:        skorA,
        catatan_p:           catP.c, rekomendasi_p: catP.r,
        catatan_l:           catL.c, rekomendasi_l: catL.r,
        catatan_a:           catA.c, rekomendasi_a: catA.r,
        capaian_perencanaan: parseFloat(capP.toFixed(2)),
        capaian_pelaksanaan: parseFloat(capL.toFixed(2)),
        capaian_asesmen:     parseFloat(capA.toFixed(2)),
        capaian_rata:        parseFloat(capRata.toFixed(2)),
        predikat:            PREDIKAT(capRata),
        status,
      });
      if (error) { 
        showToast('❌ Gagal simpan: '+error.message, 'error'); 
        return; 
      }
      showToast('✅ Supervisi berhasil disimpan!');
      onSelesai();
    } catch(err) {
      showToast('❌ Error: '+err.message, 'error');
    } finally { setSaving(false); }
  }

  async function cetakLaporan() {
    const mad = sesi.mad;
    const win = window.open('','_blank');
    const tgl = tanggal ? new Date(tanggal).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}) : '—';
    
    function buildKomponen(title, items, skors, cap, cat, rek, no) {
      const total = skors.reduce((a,b)=>a+(+b||0),0);
      const max = items.length*3;
      let rows = '';
      items.forEach(function(item,i) {
        const btns = [0,1,2,3].map(n=>'<span class="skor-btn '+(+skors[i]===n?'aktif':'')+'">'+ n+'</span>').join(' ');
        rows += '<tr><td style="text-align:center">'+(i+1)+'</td><td>'+item+'</td><td style="text-align:center">'+btns+'</td><td style="text-align:center;font-weight:700">'+(+skors[i]||0)+'</td></tr>';
      });
      const catRow = (cat||rek) ? '<tr><td colspan="4" style="font-size:9pt"><b>Catatan:</b> '+(cat||'—')+'<br><b>Rekomendasi:</b> '+(rek||'—')+'</td></tr>' : '';
      return '<table><tr><th colspan="4" style="background:#0f4238;color:#fff">'+no+'. KOMPONEN '+title.toUpperCase()+' — Skor: '+total+'/'+max+' ('+cap.toFixed(1)+'%) — '+PREDIKAT(cap)+'</th></tr>'+
        '<tr style="background:#f5f5f5"><th width="5%">No</th><th>Aspek Penilaian</th><th width="20%">Skor (0-3)</th><th width="10%">Nilai</th></tr>'+
        rows+
        '<tr style="background:#f0f0f0"><td colspan="2" style="text-align:right;font-weight:700">Total:</td><td style="text-align:center;font-weight:900">'+total+'/'+max+'</td><td style="text-align:center;font-weight:900;color:#0f4238">'+cap.toFixed(1)+'%</td></tr>'+
        catRow+'</table>';
    }
    
    function buildRTL() {
      var REKS = {
        'Merumuskan tujuan pembelajaran berbasis KBC':'Ikuti workshop KBC. Gunakan format A-B-C-D.',
        'Menyusun indikator capaian berbasis kompetensi':'Studi CP/TP/ATP terbaru. Konsultasi pengawas.',
        'Merancang materi ajar kontekstual dan bermakna':'Kembangkan materi berbasis konteks lokal Aceh.',
        'Memilih metode pembelajaran yang tepat':'Variasikan metode aktif learning.',
        'Menyiapkan media/sumber belajar yang relevan':'Manfaatkan teknologi digital.',
        'Merancang aktivitas KBC (mengetahui, memahami, mengaplikasi, merefleksi)':'Rancang aktivitas 4M dalam setiap RPP.',
        'Menyusun instrumen penilaian formatif':'Susun instrumen formatif tiap pertemuan.',
        'Mengintegrasikan nilai karakter Islam dalam pembelajaran':'Cantumkan nilai Islam dalam RPP.',
        'Merancang diferensiasi untuk keberagaman peserta didik':'Rancang diferensiasi konten, proses, produk.',
        'Membuka pembelajaran dengan apersepsi bermakna':'Gunakan pertanyaan pemantik kontekstual.',
        'Menyampaikan tujuan dan manfaat pembelajaran':'Sampaikan tujuan dengan bahasa mudah.',
        'Mengaitkan materi dengan konteks kehidupan nyata':'Gunakan contoh kehidupan sehari-hari.',
        'Memfasilitasi aktivitas MENGETAHUI (penguatan konsep)':'Gunakan brainstorming atau mind mapping.',
        'Memfasilitasi aktivitas MEMAHAMI (pendalaman makna)':'Gunakan diskusi kelompok atau studi kasus.',
        'Memfasilitasi aktivitas MENGAPLIKASI (penerapan)':'Rancang tugas proyek atau simulasi nyata.',
        'Memfasilitasi aktivitas MEREFLEKSI (evaluasi diri)':'Gunakan jurnal belajar atau kartu refleksi.',
        'Mendorong interaksi aktif antar peserta didik':'Terapkan pembelajaran kooperatif.',
        'Memberikan umpan balik konstruktif':'Berikan umpan balik segera dan spesifik.',
        'Mengintegrasikan nilai-nilai Islam (akhlak, adab)':'Sisipkan nilai akhlak/adab secara kontekstual.',
        'Menggunakan media/teknologi secara efektif':'Integrasikan media digital secara bertahap.',
        'Mengelola waktu pembelajaran dengan baik':'Buat alokasi waktu detail per aktivitas.',
        'Menyesuaikan pendekatan dengan kebutuhan peserta didik':'Terapkan diferensiasi proses.',
        'Menutup pembelajaran dengan refleksi dan penguatan':'Gunakan exit ticket atau one sentence summary.',
        'Melaksanakan penilaian formatif selama pembelajaran':'Gunakan observasi dan pertanyaan lisan.',
        'Menggunakan instrumen penilaian yang beragam':'Kembangkan rubrik, portofolio, tes lisan.',
        'Memberikan umpan balik terhadap hasil belajar':'Berikan umpan balik dalam 1x24 jam.',
        'Mendorong peserta didik melakukan penilaian diri':'Latih peserta didik menilai karya sendiri.',
        'Menggunakan hasil asesmen untuk perbaikan pembelajaran':'Analisis asesmen untuk remedial dan pengayaan.',
        'Mencatat perkembangan belajar peserta didik':'Buat jurnal/catatan anekdot secara tertib.',
        'Mengintegrasikan penilaian karakter dalam asesmen':'Kembangkan rubrik penilaian akhlak/karakter.'
      };
      var items = [];
      [[P_ITEMS,skorP,'Perencanaan'],[L_ITEMS,skorL,'Pelaksanaan'],[A_ITEMS,skorA,'Asesmen']].forEach(function(x){
        x[0].forEach(function(s,i){ if((+x[1][i]||0)<=1 && x[0][i]) items.push({komp:x[2],aspek:x[0][i],skor:+x[1][i]||0}); });
      });
      if(!items.length) return '<p style="padding:10px;background:#f0fdf4;border:1px solid #86efac;border-radius:6px;font-size:10pt">' +
        '✅ Tidak ada aspek dengan skor rendah. Pertahankan kualitas pembelajaran!</p>';
      var rows = '';
      items.forEach(function(r,i){
        var w = r.skor===0?'#dc2626':'#d97706';
        rows += '<tr>' +
          '<td style="border:1px solid #000;padding:5px 8px;text-align:center">'+(i+1)+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px">'+r.komp+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px">'+r.aspek+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px;text-align:center;font-weight:700;color:'+w+'">'+r.skor+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px">'+(REKS[r.aspek]||'Perlu pembinaan lebih lanjut.')+'</td></tr>';
      });
      return '<table style="width:100%;border-collapse:collapse;font-size:9.5pt">' +
        '<tr style="background:#0f4238;color:#fff">' +
        '<th style="padding:5px 8px;width:4%">No</th>' +
        '<th style="padding:5px 8px;width:15%">Komponen</th>' +
        '<th style="padding:5px 8px">Aspek yang Perlu Ditingkatkan</th>' +
        '<th style="padding:5px 8px;width:8%;text-align:center">Skor</th>' +
        '<th style="padding:5px 8px;width:30%">Rekomendasi</th></tr>' +
        rows + '</table>';
    }

    function buildRekap() {
      const rows = [
        {l:'Perencanaan',s:skorP.reduce((a,b)=>a+b,0),m:P_ITEMS.length*3,c:capP},
        {l:'Pelaksanaan',s:skorL.reduce((a,b)=>a+b,0),m:L_ITEMS.length*3,c:capL},
        {l:'Asesmen',    s:skorA.reduce((a,b)=>a+b,0),m:A_ITEMS.length*3,c:capA},
      ].map(r=>'<tr><td><b>'+r.l+'</b></td><td style="text-align:center">'+r.s+'/'+r.m+'</td>'+

        '<td style="text-align:center;font-weight:700;color:'+(r.c>=87.5?'#16a34a':r.c>=75?'#2563eb':r.c>=62.5?'#d97706':'#dc2626')+'">'+r.c.toFixed(1)+'%</td>'+
        '<td style="text-align:center"><b>'+PREDIKAT(r.c)+'</b></td></tr>').join('');
      return '<table><tr><th colspan="5" style="background:#0f4238;color:#fff">REKAPITULASI CAPAIAN SUPERVISI PEMBELAJARAN</th></tr>'+
        '<tr style="background:#f5f5f5"><th>Komponen</th><th>Skor</th><th width="30%">Capaian</th><th>%</th><th>Predikat</th></tr>'+
        rows+
        '<tr style="background:#f0fdf4;border-top:2px solid #0f4238"><td><b>RATA-RATA</b></td><td></td>'+
        '<td><div style="background:#e5e7eb;border-radius:4px;height:14px;overflow:hidden"><div style="width:'+capRata+'%;height:100%;background:'+(capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626')+'"></div></div></td>'+
        '<td style="text-align:center;font-weight:900;font-size:11pt;color:'+(capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626')+'">'+capRata.toFixed(1)+'%</td>'+
        '<td style="text-align:center;font-weight:900;font-size:11pt">'+PREDIKAT(capRata)+'</td></tr></table>';
    }
    
    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan Supervisi</title>'+
    '<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Times New Roman,serif;font-size:11pt;padding:20mm;color:#000}'+
    '.no-print{display:flex;gap:10px;margin-bottom:16px}@media print{.no-print{display:none!important}}'+
    '.kop{display:flex;align-items:center;gap:14px;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:14px}'+
    '.kop img{width:60px;height:60px;object-fit:contain}.kop-text .nama{font-size:14pt;font-weight:900;text-transform:uppercase}'+
    '.kop-text .sub{font-size:9pt}h2{text-align:center;font-size:12pt;text-transform:uppercase;margin:12px 0 4px}'+
    '.sub-judul{text-align:center;font-size:9pt;margin-bottom:14px;border-bottom:2px solid #000;padding-bottom:8px}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:10pt}th,td{border:1px solid #000;padding:5px 8px}'+
    'th{background:#f0f0f0;font-weight:700;text-align:center}.skor-btn{display:inline-block;width:22px;height:22px;border-radius:4px;'+
    'text-align:center;line-height:22px;font-weight:700;font-size:9pt;border:1px solid #999}.aktif{background:#0f4238;color:#fff}'+
    '.ttd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px;text-align:center;font-size:10pt}'+
    '.ttd-line{border-top:1.5px solid #000;margin-top:54px;padding-top:6px}'+
    '.footer{text-align:center;font-size:8pt;color:#666;margin-top:16px;border-top:1px solid #ccc;padding-top:8px}'+
    '</style></head><body>'+
    '<div class="no-print">'+
    '<button onclick="window.print()" style="padding:8px 20px;background:#0f4238;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700">🖨️ Cetak / PDF</button>'+
    '<button onclick="(function(){'+
      'var s=document.createElement(\'style\');'+
      's.textContent=\'@page{size:A4;margin:15mm}\';'+
      'document.head.appendChild(s);'+
      'window.print();'+
      'document.head.removeChild(s);'+
    '})()" style="padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700">'+
    '📥 Simpan PDF</button>'+
    '<button onclick="window.close()" style="padding:8px 14px;background:#eee;border:none;border-radius:6px;cursor:pointer">✕ Tutup</button>'+
    '</div>'+
    '<div class="kop">'+
    '<div class="kop-text" style="flex:1"><div class="nama">'+(mad.nama||'')+'</div>'+
    '<div class="sub">'+[mad.naungan,mad.alamat,[mad.kota_kab,mad.provinsi].filter(Boolean).join(', ')].filter(Boolean).join(' | ')+'</div></div></div>'+
    '<h2>Laporan Supervisi Pembelajaran</h2>'+
    '<div class="sub-judul">Berbasis PM-KBC &middot; KMA 1503/2025 &middot; Dirjenpendis 6077/2025</div>'+
    '<table><tr><th colspan="4" style="background:#0f4238;color:#fff">IDENTITAS SUPERVISI</th></tr>'+
    '<tr><td width="25%"><b>Nama Guru</b></td><td width="25%">'+guru.nama+'</td><td width="25%"><b>Tanggal</b></td><td>'+tgl+'</td></tr>'+
    '<tr><td><b>NIP/NUPTK</b></td><td>'+(guru.nip||'—')+'</td><td><b>Kelas/Semester</b></td><td>'+kelas+' / '+semester+'</td></tr>'+
    '<tr><td><b>Mata Pelajaran</b></td><td>'+(guru.mapel||'—')+'</td><td><b>JTM</b></td><td>'+jtm+' jam</td></tr>'+
    '<tr><td><b>Supervisor</b></td><td>'+(namaSupervisor||'—')+'</td><td><b>Jabatan</b></td><td>'+(jabatanSup||'—')+'</td></tr>'+
    '</table>'+
    buildKomponen('Perencanaan', P_ITEMS, skorP, capP, catatanP, rekomendasiP, 1)+
    buildKomponen('Pelaksanaan', L_ITEMS, skorL, capL, catatanL, rekomendasiL, 2)+
    buildKomponen('Asesmen', A_ITEMS, skorA, capA, catatanA, rekomendasiA, 3)+
    buildRekap()+
    '<div class="ttd">'+
    '<div><div style="margin-bottom:4px">Yang Disupervisi,</div><div class="ttd-line"><b>'+guru.nama+'</b><br>NIP. '+(guru.nip||'—')+'</div></div>'+
    '<div><div style="margin-bottom:4px">Supervisor,</div><div style="font-size:9pt">('+jabatanSup+')</div><div class="ttd-line"><b>'+(namaSupervisor||'—')+'</b><br>NIP. '+(nipSupervisor||'—')+'</div></div>'+
    '<div><div style="margin-bottom:4px">Mengetahui,</div><div style="font-size:9pt">Kepala Madrasah</div><div class="ttd-line"><b>'+(mad.nama_kepala||'.....')+'</b><br>NIP. '+(mad.nip_kepala||'—')+'</div></div>'+
    '</div>'+
    '<div style="page-break-before:always;padding-top:10px">'+
    '<h3 style="text-align:center;font-size:11pt;text-transform:uppercase;margin:0 0 4px;font-weight:900">'+
    'Rekomendasi Tindak Lanjut (RTL)</h3>'+
    '<div style="text-align:center;font-size:9pt;color:#444;margin-bottom:12px;border-bottom:2px solid #000;padding-bottom:6px">'+
    'Aspek dengan skor ≤ 1 yang perlu pembinaan</div>'+
    buildRTL()+
    '</div>'+
    '<div class="footer">SUPERMAD &mdash; Supervisi Pembelajaran Madrasah PM-KBC &middot; '+(mad.nama||'')+'</div>'+
    '</body></html>';
    
    win.document.write(html);
    win.document.close();
  }


  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <button className="btn btn-outline btn-sm" onClick={onSelesai}>← Kembali</button>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>
            Supervisi: {guru.nama}
          </div>
          <div style={{fontSize:'.75rem',color:'var(--text2)'}}>{guru.mapel} · {guru.status_kepeg}</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:8}}>
          <button className="btn btn-outline btn-sm" onClick={cetakLaporan}>🖨️ Cetak</button>
          <button className="btn btn-gold btn-sm" onClick={()=>simpan('draft')} disabled={saving}>
            💾 Draft
          </button>
          <button className="btn btn-primary btn-sm" onClick={()=>simpan('selesai')} disabled={saving}>
            {saving?'⏳...':'✅ Selesai'}
          </button>
        </div>
      </div>

      {/* Rekap mini */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:14}}>
        {[
          {label:'Perencanaan', val:capP, warna:capP>=87.5?'#16a34a':capP>=75?'#2563eb':capP>=62.5?'#d97706':'#dc2626'},
          {label:'Pelaksanaan', val:capL, warna:capL>=87.5?'#16a34a':capL>=75?'#2563eb':capL>=62.5?'#d97706':'#dc2626'},
          {label:'Asesmen',     val:capA, warna:capA>=87.5?'#16a34a':capA>=75?'#2563eb':capA>=62.5?'#d97706':'#dc2626'},
          {label:'Rata-rata',   val:capRata, warna:capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626'},
        ].map((k,i)=>(
          <div key={i} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:10,
            padding:'10px',textAlign:'center',borderTop:'3px solid '+k.warna}}>
            <div style={{fontSize:'1.1rem',fontWeight:900,color:k.warna}}>{k.val.toFixed(1)}%</div>
            <div style={{fontSize:'.68rem',color:'var(--text2)',marginTop:2}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Tab navigation */}
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)}
            style={{padding:'7px 14px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.78rem',fontFamily:'inherit',
              background:tab===t.key?'var(--p)':'var(--surface2)',
              color:tab===t.key?'#fff':'var(--text2)'}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* IDENTITAS */}
      {tab==='identitas' && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>📋 Identitas Supervisi</div>
          <div className="grid2">
            <div className="form-group">
              <label>Tanggal Supervisi</label>
              <input type="date" value={tanggal} onChange={e=>setTanggal(e.target.value)}/>
            </div>
            <div className="form-group">
              <label>Semester</label>
              <select value={semester} onChange={e=>setSemester(e.target.value)}>
                <option>Ganjil</option><option>Genap</option>
              </select>
            </div>
            <div className="form-group">
              <label>Kelas *</label>
              <input value={kelas} onChange={e=>setKelas(e.target.value)} placeholder="Contoh: IV A"/>
            </div>
            <div className="form-group">
              <label>JTM (Jam Tatap Muka)</label>
              <input type="number" value={jtm} onChange={e=>setJtm(e.target.value)} placeholder="24"/>
            </div>
            <div className="form-group">
              <label>Jurusan / Program</label>
              <input value={jurusan} onChange={e=>setJurusan(e.target.value)} placeholder="(opsional untuk MA)"/>
            </div>
          </div>
          <div style={{fontWeight:800,color:'var(--p3)',margin:'16px 0 12px'}}>👨‍💼 Identitas Supervisor</div>
          <div className="grid2">
            <div className="form-group">
              <label>Nama Supervisor</label>
              <input value={namaSupervisor} onChange={e=>setNamaSupervisor(e.target.value)}/>
            </div>
            <div className="form-group">
              <label>NIP Supervisor</label>
              <input value={nipSupervisor} onChange={e=>setNipSupervisor(e.target.value)}/>
            </div>
            <div className="form-group">
              <label>Jabatan Supervisor</label>
              <input value={jabatanSup} onChange={e=>setJabatanSup(e.target.value)}
                placeholder="Kepala Madrasah / Waka / Pengawas"/>
            </div>
          </div>
          <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={()=>setTab('perencanaan')}>
            Lanjut ke Perencanaan →
          </button>
        </div>
      )}

      {/* PERENCANAAN */}
      {tab==='perencanaan' && (
        <div>
          <TabelPenilaian label="📝 Komponen Perencanaan Pembelajaran (9 Item)"
            items={P_ITEMS} skor={skorP} onChange={setSkorPItem}
            catatan={catP} setCatatan={setCatP}/>
          <button className="btn btn-primary btn-sm" onClick={()=>setTab('pelaksanaan')}>
            Lanjut ke Pelaksanaan →
          </button>
        </div>
      )}

      {/* PELAKSANAAN */}
      {tab==='pelaksanaan' && (
        <div>
          <TabelPenilaian label="🎯 Komponen Pelaksanaan Pembelajaran (14 Item)"
            items={L_ITEMS} skor={skorL} onChange={setSkorLItem}
            catatan={catL} setCatatan={setCatL}/>
          <button className="btn btn-primary btn-sm" onClick={()=>setTab('asesmen')}>
            Lanjut ke Asesmen →
          </button>
        </div>
      )}

      {/* ASESMEN */}
      {tab==='asesmen' && (
        <div>
          <TabelPenilaian label="✅ Komponen Asesmen Pembelajaran (7 Item)"
            items={A_ITEMS} skor={skorA} onChange={setSkorAItem}
            catatan={catA} setCatatan={setCatA}/>
          <button className="btn btn-primary btn-sm" onClick={()=>setTab('rekap')}>
            Lihat Rekap →
          </button>
        </div>
      )}

      {/* REKAP */}
      {tab==='rekap' && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16,fontSize:'.95rem'}}>
            📊 Rekapitulasi Hasil Supervisi
          </div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.85rem',marginBottom:16}}>
            <thead>
              <tr style={{background:'var(--p3)',color:'#fff'}}>
                {['Komponen','Skor','Capaian','Predikat'].map(h=>(
                  <th key={h} style={{padding:'8px 12px',textAlign:'left'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                {label:'Perencanaan',tot:skorP.reduce((a,b)=>a+b,0),max:P_ITEMS.length*3,cap:capP},
                {label:'Pelaksanaan',tot:skorL.reduce((a,b)=>a+b,0),max:L_ITEMS.length*3,cap:capL},
                {label:'Asesmen',    tot:skorA.reduce((a,b)=>a+b,0),max:A_ITEMS.length*3,cap:capA},
              ].map((row,i)=>{
                const w=row.cap>=87.5?'#16a34a':row.cap>=75?'#2563eb':row.cap>=62.5?'#d97706':'#dc2626';
                return (
                  <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'9px 12px',fontWeight:600}}>{row.label}</td>
                    <td style={{padding:'9px 12px',fontFamily:'monospace'}}>{row.tot}/{row.max}</td>
                    <td style={{padding:'9px 12px',fontWeight:700,color:w}}>{row.cap.toFixed(1)}%</td>
                    <td style={{padding:'9px 12px'}}>
                      <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:700,
                        background:row.cap>=87.5?'#d1fae5':row.cap>=75?'#dbeafe':row.cap>=62.5?'#fef3c7':'#fee2e2',
                        color:row.cap>=87.5?'#065f46':row.cap>=75?'#1d4ed8':row.cap>=62.5?'#92400e':'#991b1b'}}>
                        {PREDIKAT(row.cap)}
                      </span>
                    </td>
                  </tr>
                );
              })}
              <tr style={{background:'#f0fdf4',borderTop:'2px solid var(--p)'}}>
                <td style={{padding:'10px 12px',fontWeight:800}}>Rata-rata</td>
                <td></td>
                <td style={{padding:'10px 12px',fontWeight:900,fontSize:'1.1rem',
                  color:capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626'}}>
                  {capRata.toFixed(1)}%
                </td>
                <td style={{padding:'10px 12px'}}>
                  <span style={{padding:'3px 12px',borderRadius:20,fontSize:'.78rem',fontWeight:800,
                    background:capRata>=87.5?'#d1fae5':capRata>=75?'#dbeafe':capRata>=62.5?'#fef3c7':'#fee2e2',
                    color:capRata>=87.5?'#065f46':capRata>=75?'#1d4ed8':capRata>=62.5?'#92400e':'#991b1b'}}>
                    {PREDIKAT(capRata)}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" onClick={cetakLaporan}>🖨️ Cetak Laporan</button>
            <button className="btn btn-gold btn-sm" onClick={()=>simpan('draft')} disabled={saving}>
              💾 Simpan Draft
            </button>
            <button className="btn btn-primary" onClick={()=>simpan('selesai')} disabled={saving}>
              {saving?'⏳ Menyimpan...':'✅ Simpan & Selesai'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── RENDER ─────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
