                  <label>Program Pembinaan *</label>
                  <input value={newMad.program} onChange={e=>setNewMad({...newMad,program:e.target.value})}
                    placeholder="Nama program..."/>
                </div>
                <div className="form-group">
                  <label>Tujuan</label>
                  <input value={newMad.tujuan} onChange={e=>setNewMad({...newMad,tujuan:e.target.value})}/>
                </div>
                <div className="form-group">
                  <label>Sasaran</label>
                  <input value={newMad.sasaran} onChange={e=>setNewMad({...newMad,sasaran:e.target.value})}/>
                </div>
                <div className="form-group">
                  <label>Waktu Pelaksanaan</label>
                  <input value={newMad.waktu} onChange={e=>setNewMad({...newMad,waktu:e.target.value})}/>
                </div>
                <div className="form-group" style={{gridColumn:'1/-1'}}>
                  <label>Penanggung Jawab</label>
                  <input value={newMad.pj} onChange={e=>setNewMad({...newMad,pj:e.target.value})}/>
                </div>
              </div>
              <button className="btn btn-primary btn-sm" onClick={()=>{
                if (!newMad.program) return;
                setRtlMad(prev=>[...prev,{...newMad}]);
                setNewMad({program:'',tujuan:'',sasaran:'Semua Guru',waktu:'1 semester',pj:'Kepala Madrasah'});
                setShowAddMad(false);
              }}>+ Tambah Program</button>
            </div>
          )}

          {rtlMad.length === 0 ? (
            <div style={{textAlign:'center',color:'var(--text3)',padding:24}}>
              Belum ada program RTL madrasah. Klik "+ Tambah Program".
            </div>
          ) : (
            rtlMad.map((item,i)=>(
              <RTLMadrasahItem key={i} item={item} index={i}
                onUpdate={updated => setRtlMad(prev=>prev.map((it,idx)=>idx===i?updated:it))}
                onRemove={() => setRtlMad(prev=>prev.filter((_,idx)=>idx!==i))}
              />
            ))
          )}
        </div>
      )}

      {/* TAB CATATAN */}
      {tab==='catatan' && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
            📝 Catatan Umum Supervisor
          </div>
          <textarea rows={8} value={catUmum} onChange={e=>setCatUmum(e.target.value)}
            placeholder="Tuliskan catatan umum hasil supervisi, kesimpulan, dan hal-hal yang perlu diperhatikan..."
            style={{width:'100%',padding:'10px 12px',border:'1.5px solid var(--border)',
              borderRadius:9,fontSize:'.85rem',fontFamily:'inherit',
              lineHeight:1.8,resize:'vertical',outline:'none'}}
            onFocus={e=>e.target.style.borderColor='var(--p)'}
            onBlur={e=>e.target.style.borderColor='var(--border)'}/>
          <div style={{marginTop:10,fontSize:'.75rem',color:'var(--text3)'}}>
            Catatan ini akan muncul di bagian akhir dokumen RTL yang dicetak.
          </div>
        </div>
      )}

      {/* TAB RESPONS GURU */}
      {tab==='respons' && (
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {/* Status konfirmasi */}
          <div className="card">
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16}}>
              ✉️ Tanggapan Guru — {guru?.nama||'—'}
            </div>
            {/* Tampilkan tanggapan guru jika sudah ada */}
            {(konfirmasi !== 'belum' || catatanGuru) && (
              <div style={{marginBottom:16,padding:'12px 14px',borderRadius:10,
                background: konfirmasi==='sudah'?'#f0fdf4':konfirmasi==='sebagian'?'#fffbeb':'#fef2f2',
                border:'1.5px solid '+(konfirmasi==='sudah'?'#86efac':konfirmasi==='sebagian'?'#fcd34d':'#fca5a5')}}>
                <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:6,
                  color:konfirmasi==='sudah'?'#16a34a':konfirmasi==='sebagian'?'#d97706':'#dc2626'}}>
                  {konfirmasi==='sudah'?'✅ Guru sudah menindaklanjuti':
                   konfirmasi==='sebagian'?'🔄 Guru sebagian sudah menindaklanjuti':
                   '⏳ Guru belum menindaklanjuti'}
                </div>
                {catatanGuru && (
                  <div style={{fontSize:'.8rem',color:'var(--text2)',fontStyle:'italic'}}>
                    "{catatanGuru}"
                  </div>
                )}
                {tglKonfirmasi && (
                  <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>
                    Diisi: {new Date(tglKonfirmasi).toLocaleDateString('id-ID')}
                  </div>
                )}
              </div>
            )}
            {konfirmasi === 'belum' && !catatanGuru && (
              <div style={{marginBottom:16,padding:'10px 14px',borderRadius:10,
                background:'var(--surface2)',fontSize:'.8rem',color:'var(--text3)'}}>
                ⏳ Guru belum mengisi tanggapan tindak lanjut.
              </div>
            )}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--text2)',marginBottom:10}}>
                Status Tindak Lanjut:
              </div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {[
                  {val:'belum',  label:'⏳ Belum Ditindaklanjuti', color:'#dc2626', bg:'#fee2e2'},
                  {val:'sebagian',label:'🔄 Sebagian Sudah',       color:'#d97706', bg:'#fef3c7'},
                  {val:'sudah',  label:'✅ Sudah Ditindaklanjuti', color:'#16a34a', bg:'#d1fae5'},
                ].map(opt=>(
                  <button key={opt.val} onClick={()=>setKonfirmasi(opt.val)}
                    style={{padding:'8px 16px',borderRadius:20,border:'2px solid '+(konfirmasi===opt.val?opt.color:'var(--border)'),
                      background:konfirmasi===opt.val?opt.bg:'#fff',
                      color:konfirmasi===opt.val?opt.color:'var(--text2)',
                      cursor:'pointer',fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
                      transition:'all .2s'}}>
                    {opt.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Catatan guru */}
            <div>
              <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--text2)',marginBottom:8}}>
                Catatan / Komentar Guru:
              </div>
              <textarea rows={5} value={catatanGuru} onChange={e=>setCatatanGuru(e.target.value)}
                placeholder="Tuliskan langkah yang sudah/akan diambil untuk menindaklanjuti rekomendasi supervisor..."
                style={{width:'100%',padding:'10px 12px',border:'1.5px solid var(--border)',
                  borderRadius:9,fontSize:'.85rem',fontFamily:'inherit',
                  lineHeight:1.8,resize:'vertical',outline:'none'}}
                onFocus={e=>e.target.style.borderColor='var(--p)'}
                onBlur={e=>e.target.style.borderColor='var(--border)'}/>
            </div>

            <button className="btn btn-primary" style={{marginTop:12}}
              onClick={()=>simpanRTL('final')} disabled={saving}>
              {saving?'⏳ Menyimpan...':'💾 Simpan Konfirmasi'}
            </button>
          </div>

          {/* Ringkasan RTL */}
          {(rtlP.length+rtlL.length+rtlA.length) > 0 && (
            <div className="card" style={{background:'#f8fffe'}}>
              <div style={{fontWeight:700,color:'var(--p3)',marginBottom:10}}>
                📋 Ringkasan RTL yang Perlu Ditindaklanjuti ({rtlP.length+rtlL.length+rtlA.length} item)
              </div>
              {[...rtlP,...rtlL,...rtlA].map((r,i)=>(
                <div key={i} style={{display:'flex',gap:10,padding:'8px 0',
                  borderBottom:'1px solid var(--border)',alignItems:'flex-start'}}>
                  <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',fontWeight:700,flexShrink:0,
                    background:r.skor===0?'#fee2e2':'#fef3c7',
                    color:r.skor===0?'#dc2626':'#d97706'}}>
                    Skor {r.skor}
                  </span>
                  <div style={{flex:1,fontSize:'.8rem'}}>
                    <div style={{fontWeight:600}}>{r.aspek}</div>
                    <div style={{color:'var(--text2)',fontSize:'.75rem',marginTop:2}}>{r.rekomendasi}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}


// ── DASHBOARD GURU ────────────────────────────────────────────
function DashboardGuru({sesi, showToast}) {
  // Fitur aktif dari setting kanwil
  const FITUR_DEFAULT_GURU = {supervisi:true,jadwal:true,rtl:true,portofolio:true,
    analisis_instrumen:true,analisis_asesmen:true,grafik:true,dashboard_guru:true};
  const fiturAktif = {...FITUR_DEFAULT_GURU, ...(sesi.mad.fitur_aktif||{})};

  const [supList, setSupList]   = useState([]);
  const [rtlList, setRtlList]   = useState([]);
  const [loading, setLoading]   = useState(true);
  const [tab, setTab]           = useState('hasil');
  const [aktifRTL, setAktifRTL] = useState(null);
  const [konfirmasi, setKonfirmasi] = useState('belum');
  const [catatanGuru, setCatatanGuru] = useState('');
  const [saving, setSaving]     = useState(false);

  useEffect(()=>{ loadData(); }, []);

  async function loadData() {
    setLoading(true);
    // Guru login via token - id guru langsung dari sesi.pengguna.id
    const guruId = sesi.pengguna.id;
    const {data:sups} = await sb.from('supermad_supervisi')
      .select('*').eq('madrasah_id', sesi.mad.id)
      .eq('guru_id', guruId)
      .eq('status','selesai').order('created_at',{ascending:false});
    // Ambil RTL via supervisi_id agar tidak tergantung guru_id di RTL
    const supIds = (sups||[]).map(s=>s.id);
    let rtls = [];
    if (supIds.length > 0) {
      const {data:rtlData} = await sb.from('supermad_rtl')
        .select('*').in('supervisi_id', supIds)
        .order('created_at',{ascending:false});
      rtls = rtlData||[];
    }
    setSupList(sups||[]);
    setRtlList(rtls||[]);
    setLoading(false);
  }

  async function simpanKonfirmasi() {
    if (!aktifRTL) return;
    setSaving(true);
    const {error} = await sb.from('supermad_rtl').update({
      konfirmasi_guru: konfirmasi,
      catatan_guru:    catatanGuru,
      tgl_konfirmasi:  new Date().toISOString().split('T')[0],
      updated_at:      new Date().toISOString(),
    }).eq('id', aktifRTL.id);
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Konfirmasi berhasil disimpan!');
    setAktifRTL(null);
    loadData();
  }

  if (loading) return <Loading text="Memuat data..." />;

  // Halaman konfirmasi RTL
  if (aktifRTL) return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
        <button className="btn btn-outline btn-sm" onClick={()=>setAktifRTL(null)}>← Kembali</button>
        <div style={{fontWeight:900,color:'var(--p3)'}}>✉️ Konfirmasi Tindak Lanjut RTL</div>
      </div>
      <div className="card">
        <div style={{fontWeight:700,color:'var(--text2)',marginBottom:16}}>
          Supervisor: <b>{aktifRTL.sup?.nama_supervisor||'—'}</b> · 
          {aktifRTL.sup?.tanggal_supervisi ? ' '+new Date(aktifRTL.sup.tanggal_supervisi).toLocaleDateString('id-ID') : ''}
        </div>
        {/* Status */}
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:700,marginBottom:10,fontSize:'.85rem'}}>Status Tindak Lanjut Saya:</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {[
              {val:'belum',   label:'⏳ Belum Ditindaklanjuti', color:'#dc2626', bg:'#fee2e2'},
              {val:'sebagian',label:'🔄 Sebagian Sudah',        color:'#d97706', bg:'#fef3c7'},
              {val:'sudah',   label:'✅ Sudah Ditindaklanjuti', color:'#16a34a', bg:'#d1fae5'},
            ].map(opt=>(
              <button key={opt.val} onClick={()=>setKonfirmasi(opt.val)}
                style={{padding:'8px 16px',borderRadius:20,fontFamily:'inherit',
                  border:'2px solid '+(konfirmasi===opt.val?opt.color:'var(--border)'),
                  background:konfirmasi===opt.val?opt.bg:'#fff',
                  color:konfirmasi===opt.val?opt.color:'var(--text2)',
                  cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
                {opt.label}
              </button>
            ))}
          </div>
        </div>
        {/* Catatan */}
        <div className="form-group">
          <label>Catatan / Langkah Tindak Lanjut Saya:</label>
          <textarea rows={5} value={catatanGuru} onChange={e=>setCatatanGuru(e.target.value)}
            placeholder="Tuliskan langkah konkret yang sudah atau akan dilakukan..."
            style={{width:'100%',padding:'10px 12px',border:'1.5px solid var(--border)',
              borderRadius:9,fontSize:'.85rem',fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
        </div>
        {/* RTL Items */}
        {(aktifRTL.rtl_perencanaan?.length||aktifRTL.rtl_pelaksanaan?.length||aktifRTL.rtl_asesmen?.length) ? (
          <div style={{marginBottom:16,padding:'12px 14px',background:'var(--surface2)',borderRadius:9}}>
            <div style={{fontWeight:700,marginBottom:8,fontSize:'.82rem',color:'var(--p3)'}}>
              📋 Rekomendasi Supervisor:
            </div>
            {[...(aktifRTL.rtl_perencanaan||[]),...(aktifRTL.rtl_pelaksanaan||[]),...(aktifRTL.rtl_asesmen||[])].map((r,i)=>(
              <div key={i} style={{fontSize:'.8rem',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontWeight:600}}>{r.aspek}</span>
                <div style={{color:'var(--text2)',marginTop:2}}>{r.rekomendasi}</div>
              </div>
            ))}
          </div>
        ) : null}
        <button className="btn btn-primary" onClick={simpanKonfirmasi} disabled={saving}>
          {saving?'⏳ Menyimpan...':'💾 Simpan Konfirmasi'}
        </button>
      </div>
    </div>
  );

  return (
    <div>
      <h2 style={{fontWeight:900,color:'var(--p3)',marginBottom:16,fontSize:'1.1rem'}}>
        👨‍🏫 Dashboard Guru — {sesi.pengguna.nama}
      </h2>
      <div style={{marginBottom:12,padding:'10px 14px',background:'var(--surface2)',borderRadius:10,
        fontSize:'.82rem',color:'var(--text2)'}}>
        {sesi.mad.nama} · {sesi.mad.kota_kab||''}
      </div>

      {/* Banner fitur yang dinonaktifkan */}
      {(()=>{
        const labelMap = {rtl:'RTL',portofolio:'e-Portofolio',analisis_instrumen:'Analisis Instrumen',
          analisis_asesmen:'Analisis Asesmen'};
        const mati = Object.entries(labelMap).filter(([k])=>fiturAktif[k]===false).map(([,l])=>l);
        if (mati.length===0) return null;
        return (
          <div style={{marginBottom:12,padding:'8px 12px',borderRadius:9,
            background:'#fffbeb',border:'1.5px solid #fcd34d',fontSize:'.76rem',color:'#92400e'}}>
            <b>⚙️ Fitur tidak tersedia:</b>{' '}{mati.join(', ')}
          </div>
        );
      })()}

      {/* Tab */}
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {[
          ['hasil',     '📊 Hasil Supervisi',      fiturAktif.supervisi !== false],
          ['rtl',       '📋 RTL Saya',              fiturAktif.rtl !== false],
          ['portofolio','🗂️ e-Portofolio',         fiturAktif.portofolio !== false],
          ['asesmen',   '📈 Analisis Asesmen',       fiturAktif.analisis_asesmen !== false],
          ['analisis',  '🔬 Analisis Instrumen',     fiturAktif.analisis_instrumen !== false],
        ].filter(([,,t])=>t).map(([key,label])=>(
          <button key={key} onClick={()=>setTab(key)}
            style={{padding:'7px 14px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
              background:tab===key?'var(--p)':'var(--surface2)',
              color:tab===key?'#fff':'var(--text2)'}}>
            {label}
          </button>
        ))}
      </div>

      {/* TAB HASIL SUPERVISI */}
      {tab==='hasil' && (
        <div>
          {supList.length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
              Belum ada hasil supervisi untuk Anda.
            </div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {supList.map(s=>{
                const cap = parseFloat(s.capaian_rata)||0;
                const w = cap>=87.5?'#16a34a':cap>=75?'#2563eb':cap>=62.5?'#d97706':'#dc2626';
                const tgl = s.tanggal_supervisi
                  ? new Date(s.tanggal_supervisi).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})
                  : '—';
                return (
                  <div key={s.id} className="card" style={{borderTop:'3px solid '+w}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>
                      <div>
                        <div style={{fontWeight:700}}>{s.kelas_sem||'—'} · {s.semester}</div>
                        <div style={{fontSize:'.75rem',color:'var(--text2)',marginTop:2}}>
                          📅 {tgl} · Supervisor: {s.nama_supervisor||'—'}
                        </div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontWeight:900,fontSize:'1.2rem',color:w}}>{cap.toFixed(1)}%</div>
                        <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                          background:cap>=87.5?'#d1fae5':cap>=75?'#dbeafe':cap>=62.5?'#fef3c7':'#fee2e2',
                          color:cap>=87.5?'#065f46':cap>=75?'#1d4ed8':cap>=62.5?'#92400e':'#991b1b'}}>
                          {s.predikat||'—'}
                        </span>
                      </div>
                    </div>
                    {/* Bar per komponen */}
                    <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:4}}>
                      {[
                        {label:'Perencanaan',val:parseFloat(s.capaian_perencanaan)||0,color:'#16a34a'},
                        {label:'Pelaksanaan',val:parseFloat(s.capaian_pelaksanaan)||0,color:'#2563eb'},
                        {label:'Asesmen',    val:parseFloat(s.capaian_asesmen)||0,    color:'#d97706'},
                      ].map((b,i)=>(
                        <div key={i} style={{display:'flex',alignItems:'center',gap:8}}>
                          <span style={{fontSize:'.7rem',width:80,color:'var(--text2)'}}>{b.label}</span>
                          <div style={{flex:1,background:'#e5e7eb',borderRadius:4,height:10,overflow:'hidden'}}>
                            <div style={{width:b.val+'%',height:'100%',background:b.color,borderRadius:4}}/>
                          </div>
                          <span style={{fontSize:'.72rem',fontWeight:700,color:b.color,width:45,textAlign:'right'}}>
                            {b.val.toFixed(1)}%
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TAB RTL */}
      {tab==='rtl' && (
        <div>
          {rtlList.length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
              Belum ada RTL untuk Anda.
            </div>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {rtlList.map(r=>{
                const sup = supList.find(s=>s.id===r.supervisi_id);
                const totalRTL = (r.rtl_perencanaan?.length||0)+(r.rtl_pelaksanaan?.length||0)+(r.rtl_asesmen?.length||0);
                const statusColor = r.konfirmasi_guru==='sudah'?'#16a34a':r.konfirmasi_guru==='sebagian'?'#d97706':'#dc2626';
                const statusLabel = r.konfirmasi_guru==='sudah'?'✅ Sudah':r.konfirmasi_guru==='sebagian'?'🔄 Sebagian':'⏳ Belum';
                return (
                  <div key={r.id} className="card">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                      <div>
                        <div style={{fontWeight:700}}>
                          RTL Supervisi · {sup?.tanggal_supervisi ? new Date(sup.tanggal_supervisi).toLocaleDateString('id-ID') : r.created_at?.split('T')[0]||'—'}
                        </div>
                        <div style={{fontSize:'.75rem',color:'var(--text2)',marginTop:3}}>
                          {totalRTL} item rekomendasi
                          {r.tgl_konfirmasi && ' · Direspons: '+new Date(r.tgl_konfirmasi).toLocaleDateString('id-ID')}
                        </div>
                        {r.catatan_guru && (
                          <div style={{marginTop:6,fontSize:'.77rem',color:'var(--text2)',
                            padding:'6px 10px',background:'var(--surface2)',borderRadius:7}}>
                            "{r.catatan_guru}"
                          </div>
                        )}
                      </div>
                      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                        <span style={{padding:'3px 10px',borderRadius:20,fontSize:'.75rem',fontWeight:700,
                          color:statusColor,border:'1.5px solid '+statusColor,background:'#fff'}}>
                          {statusLabel}
                        </span>
                        <button onClick={()=>{
                          setAktifRTL({...r,sup});
                          setKonfirmasi(r.konfirmasi_guru||'belum');
                          setCatatanGuru(r.catatan_guru||'');
                        }} className="btn btn-outline btn-sm">
                          ✏️ Update
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TAB PORTOFOLIO */}
      {tab==='portofolio' && (
        <TabPortofolio sesi={sesi} showToast={showToast} />
      )}

      {/* TAB ANALISIS ASESMEN */}
      {tab==='asesmen' && (
        <TabAnalisisAsesmen sesi={sesi} showToast={showToast} />
      )}

      {/* TAB ANALISIS INSTRUMEN */}
      {tab==='analisis' && (
        <TabAnalisisInstrumen sesi={sesi} showToast={showToast} />
      )}

    </div>
  );
}


// ── TAB ANALISIS ASESMEN ────────────────────────────────────────
function TabAnalisisAsesmen({sesi, showToast}) {
  const sb = window.supabase;
  const guruId = sesi.pengguna.id;
  const [list, setList]       = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [mode, setMode]       = React.useState('list'); // 'list' | 'form' | 'detail'
  const [aktif, setAktif]     = React.useState(null);
  const [saving, setSaving]   = React.useState(false);

  // ── Form state ──
  const blankForm = {
    jenis_penilaian:'UH', topik:'', mapel:'', kelas:'', semester:'Ganjil',
    tahun_ajaran:'2025/2026', tanggal_pelaksanaan:'', kkm:75,
    data_siswa:[], catatan_guru:'', status:'draft'
  };

  async function loadList() {
    setLoading(true);
    const {data} = await sb.from('supermad_analisis_asesmen')
      .select('*').eq('guru_id', guruId).order('created_at',{ascending:false});
    setList(data||[]);
    setLoading(false);
  }

  function hitungAnalisis(dataSiswa, kkm) {
    if (!dataSiswa||dataSiswa.length===0) return null;
    const n  = dataSiswa.length;
    const vals = dataSiswa.map(s=>Number(s.nilai)||0);
    const rata = vals.reduce((a,b)=>a+b,0)/n;
    const variance = vals.reduce((a,v)=>a+Math.pow(v-rata,2),0)/n;
    const stdv = Math.sqrt(variance);
    const maks = Math.max(...vals);
    const min  = Math.min(...vals);
    const tuntas    = vals.filter(v=>v>=kkm).length;
    const tdk_tuntas = n - tuntas;
    const pct_tuntas = (tuntas/n)*100;
    const distribusi = {
      r0_59:   vals.filter(v=>v<60).length,
      r60_74:  vals.filter(v=>v>=60&&v<75).length,
      r75_84:  vals.filter(v=>v>=75&&v<85).length,
      r85_100: vals.filter(v=>v>=85).length,
    };
    let interpretasi_stdv = '';
    if (stdv < 10)       interpretasi_stdv = 'Merata — kemampuan siswa relatif homogen (STDV < 10)';
    else if (stdv <= 20) interpretasi_stdv = 'Variasi Sedang — terdapat perbedaan kemampuan yang wajar (STDV 10–20)';
    else                 interpretasi_stdv = 'Variasi Tinggi — kemampuan siswa sangat beragam, perlu perhatian khusus (STDV > 20)';
    let rekomendasi = '';
    if (pct_tuntas >= 85) rekomendasi = 'Hasil sangat baik. Lanjutkan dengan materi pengayaan untuk siswa yang sudah tuntas.';
    else if (pct_tuntas >= 70) rekomendasi = 'Sebagian besar tuntas. Lakukan remedial terfokus untuk '+tdk_tuntas+' siswa yang belum mencapai KKM.';
    else if (pct_tuntas >= 50) rekomendasi = 'Lebih dari setengah belum tuntas. Pertimbangkan pembelajaran ulang sebelum remedial.';
    else rekomendasi = 'Sebagian besar siswa belum tuntas. Evaluasi strategi pembelajaran dan lakukan reteaching menyeluruh.';
    if (stdv > 20) rekomendasi += ' Variasi nilai sangat tinggi — pertimbangkan pengelompokan belajar berdasarkan kemampuan.';
    return { n, rata, stdv, maks, min, tuntas, tdk_tuntas, pct_tuntas, distribusi, interpretasi_stdv, rekomendasi };
  }

  async function simpan(statusBaru) {
    setSaving(true);
    const h = hitungAnalisis(form.data_siswa, Number(form.kkm));
    const payload = {
      guru_id: guruId,
      madrasah_id: sesi.mad.id,
      jenis_penilaian: form.jenis_penilaian,
      topik: form.topik, mapel: form.mapel, kelas: form.kelas,
      semester: form.semester, tahun_ajaran: form.tahun_ajaran,
      tanggal_pelaksanaan: form.tanggal_pelaksanaan||null,
      kkm: Number(form.kkm),
      data_siswa: form.data_siswa,
      jumlah_siswa: h?.n||0,
      nilai_rata: h?.rata||null,
      nilai_tertinggi: h?.maks||null,
      nilai_terendah: h?.min||null,
      stdv: h?.stdv||null,
      jumlah_tuntas: h?.tuntas||0,
      jumlah_tidak_tuntas: h?.tdk_tuntas||0,
      pct_tuntas: h?.pct_tuntas||0,
      distribusi: h?.distribusi||{},
      interpretasi_stdv: h?.interpretasi_stdv||'',
      rekomendasi: h?.rekomendasi||'',
      catatan_guru: form.catatan_guru,
      status: statusBaru||form.status,
      updated_at: new Date().toISOString(),
    };
    let error;
    if (aktif?.id) {
      ({error} = await sb.from('supermad_analisis_asesmen').update(payload).eq('id', aktif.id));
    } else {
      ({error} = await sb.from('supermad_analisis_asesmen').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal menyimpan: '+error.message,'error'); return; }
    showToast(statusBaru==='final'?'✅ Analisis difinalisasi':'💾 Disimpan sebagai draft','success');
    loadList(); setMode('list'); setAktif(null); setForm(blankForm);
  }

                  padding:'5px 10px',background:tuntas?'#f0fdf4':'#fef2f2',borderRadius:7}}>
                  <span style={{flex:1,fontSize:'.83rem'}}>{s.nama}</span>
                  <span style={{fontWeight:700,fontSize:'.85rem',color:tuntas?'#16a34a':'#ef4444'}}>{s.nilai}</span>
                  <span style={{fontSize:'.7rem',color:tuntas?'#16a34a':'#ef4444'}}>{tuntas?'✓':'✗'}</span>
                  <button onClick={()=>hapusSiswa(i)}
                    style={{background:'none',border:'none',cursor:'pointer',color:'#ef4444',fontSize:'.9rem',padding:'2px 5px'}}>×</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Preview Analisis Live */}
      {h && form.data_siswa.length>0 && (
        <div className="card" style={{marginBottom:12,border:'2px solid var(--p)33',background:'#f8faff'}}>
          <div style={{fontWeight:700,marginBottom:10,fontSize:'.88rem',color:'var(--p)'}}>
            📊 Preview Hasil Analisis ({form.data_siswa.length} siswa)
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:10}}>
            {[
              ['Rata-rata', h.rata.toFixed(1), '#3b82f6'],
              ['STDV', h.stdv.toFixed(1), '#8b5cf6'],
              ['Tuntas', h.pct_tuntas.toFixed(0)+'%', h.pct_tuntas>=70?'#22c55e':'#ef4444'],
            ].map(([l,v,c])=>(
              <div key={l} style={{textAlign:'center',padding:'8px',background:'#fff',borderRadius:8,border:'1.5px solid '+c+'44'}}>
                <div style={{fontWeight:800,color:c,fontSize:'1.1rem'}}>{v}</div>
                <div style={{fontSize:'.72rem',color:'var(--text2)'}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:'.8rem',padding:'7px 10px',background:'#ede9fe',borderRadius:8,marginBottom:6}}>
            📐 {h.interpretasi_stdv}
          </div>
          <div style={{fontSize:'.8rem',padding:'7px 10px',background:'#f0fdf4',borderRadius:8}}>
            💡 {h.rekomendasi}
          </div>
        </div>
      )}

      {/* Catatan */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:6}}>Catatan Guru (opsional)</div>
        <textarea rows={3} value={form.catatan_guru}
          onChange={e=>setForm(f=>({...f,catatan_guru:e.target.value}))}
          placeholder="Refleksi, catatan pelaksanaan, konteks khusus..."
          style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1.5px solid #d1d5db',
            fontFamily:'inherit',fontSize:'.85rem',resize:'vertical',boxSizing:'border-box'}}/>
      </div>

      <div style={{display:'flex',gap:10,justifyContent:'flex-end',flexWrap:'wrap'}}>
        <button className="btn btn-outline" onClick={()=>{setMode('list');setAktif(null);setForm(blankForm);}}>Batal</button>
        <button className="btn btn-outline" onClick={()=>simpan('draft')} disabled={saving||form.data_siswa.length===0}>
          {saving?'Menyimpan...':'💾 Simpan Draft'}
        </button>
        <button className="btn btn-primary" onClick={()=>simpan('final')} disabled={saving||form.data_siswa.length===0}>
          {saving?'Memproses...':'✅ Finalisasi'}
        </button>
      </div>
    </div>
  );
}

// ── TAB ANALISIS INSTRUMEN ────────────────────────────────────
function TabAnalisisInstrumen({sesi, showToast}) {
  const guruId = sesi.pengguna.id;
  const [list, setList]           = useState([]);
  const [loading, setLoading]     = useState(true);
  const [mode, setMode]           = useState('list'); // 'list' | 'form' | 'detail'
  const [aktif, setAktif]         = useState(null);
  const [formStep, setFormStep]   = useState(1); // 1=Identitas, 2=Butir Soal, 3=Checklist, 4=Hasil
  const [saving, setSaving]       = useState(false);

  // ── Form state ──
  const [form, setForm] = useState({
    jenis_penilaian:'UH', topik:'', kelas:'', semester: sesi.mad.semester_aktif||'Ganjil',
    tahun_ajaran: sesi.mad.tahun_ajaran||'', tanggal_pelaksanaan:'',
    mapel: sesi.pengguna.mapel||'', keterangan:'',
  });
  const [butirSoal, setButirSoal] = useState([]);
  const [butirForm, setButirForm] = useState({deskripsi:'',level_bloom:'C1',domain:'Pengetahuan',bobot:1});
  const [checkVal,  setCheckVal]  = useState({});  // id → nilai (1/2/3)

  // Checklist items
  const CHECKLIST = {
    validitas: [
      {id:'v1', teks:'Soal mengukur capaian pembelajaran (CP) yang telah ditetapkan'},
      {id:'v2', teks:'Setiap butir soal sesuai dengan tujuan pembelajaran (TP)'},
      {id:'v3', teks:'Instrumen mengukur kemampuan yang sesungguhnya (bukan hafalan semata)'},
      {id:'v4', teks:'Ada kunci jawaban / rubrik penilaian yang jelas'},
      {id:'v5', teks:'Proporsi bobot soal sesuai dengan tingkat kepentingan materi'},
    ],
    keterbacaan: [
      {id:'k1', teks:'Bahasa yang digunakan jelas dan tidak ambigu'},
      {id:'k2', teks:'Kalimat pertanyaan tidak mengandung petunjuk jawaban'},
      {id:'k3', teks:'Panjang kalimat soal proporsional dan mudah dipahami siswa'},
    ],
    kesesuaian: [
      {id:'s1', teks:'Instrumen sesuai dengan alur tujuan pembelajaran (ATP)'},
      {id:'s2', teks:'Distribusi level kognitif (C1-C6) variatif dan sesuai jenjang'},
      {id:'s3', teks:'Instrumen memuat penilaian ranah pengetahuan DAN keterampilan'},
      {id:'s4', teks:'Instrumen sudah diujicobakan / ditelaah sebelum digunakan'},
    ],
  };

  const BLOOM = ['C1','C2','C3','C4','C5','C6'];
  const BLOOM_LABEL = {C1:'Mengingat',C2:'Memahami',C3:'Menerapkan',C4:'Menganalisis',C5:'Mengevaluasi',C6:'Mencipta'};
  const BLOOM_COLOR = {C1:'#6b7280',C2:'#2563eb',C3:'#16a34a',C4:'#d97706',C5:'#9333ea',C6:'#dc2626'};
  const DOMAIN = ['Pengetahuan','Keterampilan','Sikap'];
  const JENIS  = ['UH','PTS','PAS','PAT','Proyek','Observasi','Portofolio','Lainnya'];
  const JENIS_LABEL = {UH:'Ulangan Harian',PTS:'Penilaian Tengah Semester',PAS:'Penilaian Akhir Semester',
    PAT:'Penilaian Akhir Tahun',Proyek:'Penugasan / Proyek',Observasi:'Observasi / Penilaian Sikap',
    Portofolio:'Portofolio',Lainnya:'Lainnya'};

  React.useEffect(()=>{ loadList(); },[]);

  async function loadList() {
    setLoading(true);
    const {data} = await sb.from('supermad_analisis_instrumen')
      .select('*').eq('guru_id', guruId).eq('madrasah_id', sesi.mad.id)
      .order('created_at',{ascending:false});
    setList(data||[]);
    setLoading(false);
  }

  function hitungHasil(bSoal, cVal) {
    // Hitung skor checklist (maks 12 item × 4 = 48)
    const allItems = [...CHECKLIST.validitas,...CHECKLIST.keterbacaan,...CHECKLIST.kesesuaian];
    let skorC = 0, totalC = allItems.length * 4;
    allItems.forEach(item => {
      const v = parseInt(cVal[item.id]||0);
      skorC += v===1?4:v===2?3:v===3?2:0;
    });
    const pctC = totalC > 0 ? (skorC/totalC)*100 : 0;

    // Analisis distribusi Bloom
    const total = bSoal.length;
    const dist = {};
    BLOOM.forEach(b=>{ dist[b] = bSoal.filter(s=>s.level_bloom===b).length; });
    const higherOrder = (dist['C4']||0)+(dist['C5']||0)+(dist['C6']||0);
    const pctHOTS = total>0 ? (higherOrder/total)*100 : 0;

    // Skor total gabungan (checklist 70% + HOTS 30%)
    const skorTotal = (pctC * 0.7) + (pctHOTS * 0.3);
    const predikat = skorTotal>=87.5?'Sangat Baik':skorTotal>=75?'Baik':skorTotal>=62.5?'Cukup':'Perlu Perbaikan';

    // Rekomendasi otomatis
    const rek = [];
    if (pctC < 75) rek.push('Tinjau kembali kualitas instrumen — skor checklist di bawah standar.');
    if (pctHOTS < 20) rek.push('Tambahkan soal level tinggi (C4-C6/HOTS) agar mengukur kemampuan berpikir kritis.');
    if ((dist['C1']||0)/Math.max(total,1) > 0.5) rek.push('Terlalu banyak soal hafalan (C1). Kurangi dan ganti dengan C2-C4.');
    if (total < 5) rek.push('Jumlah butir soal masih sedikit. Tambah butir soal untuk analisis lebih akurat.');
    if (rek.length===0) rek.push('Instrumen sudah berkualitas baik. Pertahankan!');

    return { skorTotal: Math.round(skorTotal*10)/10, predikat, rekomendasi: rek.join(' '), pctC, pctHOTS, dist };
  }

  async function simpan(statusSimpan) {
    setSaving(true);
    const hasil = hitungHasil(butirSoal, checkVal);
    const checklistVal = (items) => items.map(it=>({...it, nilai: parseInt(checkVal[it.id]||0)}));
    const payload = {
      guru_id: guruId,
      madrasah_id: sesi.mad.id,
      ...form,
      butir_soal: butirSoal,
      checklist_validitas:   checklistVal(CHECKLIST.validitas),
      checklist_keterbacaan: checklistVal(CHECKLIST.keterbacaan),
      checklist_kesesuaian:  checklistVal(CHECKLIST.kesesuaian),
      skor_total:  hasil.skorTotal,
      predikat:    hasil.predikat,
      rekomendasi: hasil.rekomendasi,
      status: statusSimpan,
      updated_at: new Date().toISOString(),
    };
    let error;
    if (aktif?.id) {
      ({error} = await sb.from('supermad_analisis_instrumen').update(payload).eq('id', aktif.id));
    } else {
      ({error} = await sb.from('supermad_analisis_instrumen').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast(statusSimpan==='final'?'✅ Analisis instrumen diselesaikan!':'💾 Draft tersimpan');
    setMode('list'); loadList();
  }

  function bukaEdit(item) {
    setAktif(item);
    setForm({
      jenis_penilaian: item.jenis_penilaian, topik: item.topik||'', kelas: item.kelas||'',
      semester: item.semester||'', tahun_ajaran: item.tahun_ajaran||'',
      tanggal_pelaksanaan: item.tanggal_pelaksanaan||'', mapel: item.mapel||'', keterangan: item.keterangan||'',
    });
    setButirSoal(item.butir_soal||[]);
    const cv = {};
    [...(item.checklist_validitas||[]),...(item.checklist_keterbacaan||[]),...(item.checklist_kesesuaian||[])]
      .forEach(c=>{ if (c.nilai) cv[c.id]=c.nilai; });
    setCheckVal(cv);
    setFormStep(1);
    setMode('form');
  }

  function bukaBaru() {
    setAktif(null);
    setForm({jenis_penilaian:'UH',topik:'',kelas:'',semester:sesi.mad.semester_aktif||'Ganjil',
      tahun_ajaran:sesi.mad.tahun_ajaran||'',tanggal_pelaksanaan:'',
      mapel:sesi.pengguna.mapel||'',keterangan:''});
    setButirSoal([]);
    setCheckVal({});
    setFormStep(1);
    setMode('form');
  }

  function tambahButir() {
    if (!butirForm.deskripsi.trim()) { showToast('Isi deskripsi butir soal','error'); return; }
    const nomor = butirSoal.length + 1;
    setButirSoal(prev=>[...prev, {nomor, ...butirForm, id: Date.now()}]);
    setButirForm({deskripsi:'',level_bloom:'C1',domain:'Pengetahuan',bobot:1});
  }

  // ── RENDER LIST ──
  if (loading) return <Loading text="Memuat analisis instrumen..." />;

  if (mode === 'list') return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
        <div style={{fontWeight:800,color:'var(--p3)',fontSize:'1rem'}}>🔬 Analisis Instrumen Asesmen</div>
        <button onClick={bukaBaru}
          style={{padding:'7px 16px',background:'var(--p)',color:'#fff',border:'none',
            borderRadius:8,cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
          + Buat Analisis Baru
        </button>
      </div>

      {list.length === 0 && (
        <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
          <div style={{fontSize:'2rem',marginBottom:8}}>🔬</div>
          <div style={{fontWeight:700,marginBottom:4}}>Belum ada analisis instrumen</div>
          <div style={{fontSize:'.8rem'}}>Klik "+ Buat Analisis Baru" untuk mulai menganalisis instrumen penilaian Anda</div>
        </div>
      )}

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {list.map(item=>{
          const isDraft = item.status==='draft';
          const warna = item.skor_total>=87.5?'#16a34a':item.skor_total>=75?'#2563eb':item.skor_total>=62.5?'#d97706':'#dc2626';
          return (
            <div key={item.id} className="card" style={{padding:'14px 16px',
              border:`1.5px solid ${isDraft?'#fbbf24':'#86efac'}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:'.95rem',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    {JENIS_LABEL[item.jenis_penilaian]||item.jenis_penilaian}
                    {isDraft
                      ? <span style={{padding:'1px 8px',borderRadius:20,fontSize:'.65rem',fontWeight:700,
                          background:'#fef3c7',color:'#92400e',border:'1px solid #fbbf24'}}>Draft</span>
                      : <span style={{padding:'1px 8px',borderRadius:20,fontSize:'.65rem',fontWeight:700,
                          background:'#d1fae5',color:'#065f46',border:'1px solid #86efac'}}>✓ Final</span>
                    }
                  </div>
                  <div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:4}}>
                    {item.topik && <span>📚 {item.topik} · </span>}
                    <span>Kelas {item.kelas||'—'} · {item.semester} {item.tahun_ajaran}</span>
                  </div>
                  <div style={{fontSize:'.73rem',color:'var(--text3)',marginTop:3}}>
                    {item.mapel} · {(item.butir_soal||[]).length} butir soal
                  </div>
                </div>
                {item.skor_total > 0 && (
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:'1.3rem',fontWeight:900,color:warna}}>{item.skor_total}%</div>
                    <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                      background:item.skor_total>=87.5?'#d1fae5':item.skor_total>=75?'#dbeafe':item.skor_total>=62.5?'#fef3c7':'#fee2e2',
                      color:item.skor_total>=87.5?'#065f46':item.skor_total>=75?'#1d4ed8':item.skor_total>=62.5?'#92400e':'#991b1b'}}>
                      {item.predikat}
                    </span>
                  </div>
                )}
              </div>
              {item.rekomendasi && (
                <div style={{marginTop:8,padding:'6px 10px',background:'var(--surface2)',borderRadius:7,
                  fontSize:'.73rem',color:'var(--text2)'}}>
                  💡 {item.rekomendasi}
                </div>
              )}
              <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
                <button onClick={()=>bukaEdit(item)}
                  style={{padding:'5px 12px',background:'var(--p)',color:'#fff',border:'none',
                    borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                  ✏️ {isDraft?'Lanjut Edit':'Edit'}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── RENDER FORM ──
  const stepLabel = ['','Identitas Instrumen','Butir Soal','Checklist Kualitas','Hasil Analisis'];
  const hasil = formStep===4 ? hitungHasil(butirSoal, checkVal) : null;

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <button onClick={()=>setMode('list')} className="btn btn-outline btn-sm">← Kembali</button>
        <div style={{fontWeight:900,color:'var(--p3)'}}>
          🔬 {aktif ? 'Edit Analisis' : 'Analisis Instrumen Baru'}
        </div>
      </div>

      {/* Step indicator */}
      <div style={{display:'flex',gap:4,marginBottom:20,overflowX:'auto'}}>
        {[1,2,3,4].map(s=>(
          <button key={s} onClick={()=>setFormStep(s)}
            style={{flex:1,minWidth:80,padding:'8px 4px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.75rem',textAlign:'center',
              background:formStep===s?'var(--p)':s<formStep?'#d1fae5':'var(--surface2)',
              color:formStep===s?'#fff':s<formStep?'#065f46':'var(--text2)'}}>
            {s<formStep?'✓ ':''}{stepLabel[s]}
          </button>
        ))}
      </div>

      {/* STEP 1 — IDENTITAS */}
      {formStep===1 && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>📋 Identitas Instrumen</div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>

            <div>
              <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:6}}>
                Jenis Penilaian *
              </label>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {JENIS.map(j=>(
                  <button key={j} onClick={()=>setForm(f=>({...f,jenis_penilaian:j}))}
                    style={{padding:'6px 14px',borderRadius:20,border:'1.5px solid',cursor:'pointer',
                      fontWeight:700,fontSize:'.78rem',
                      background:form.jenis_penilaian===j?'var(--p)':'#fff',
                      color:form.jenis_penilaian===j?'#fff':'var(--p)',
                      borderColor:'var(--p)'}}>
                    {JENIS_LABEL[j]}
                  </button>
                ))}
              </div>
            </div>

            {[
              {label:'Topik / Bab',key:'topik',ph:'Contoh: Bab 3 — Sistem Periodik Unsur'},
              {label:'Mata Pelajaran',key:'mapel',ph:'Contoh: IPA'},
              {label:'Kelas',key:'kelas',ph:'Contoh: IX-2'},
            ].map(({label,key,ph})=>(
              <div key={key}>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>{label}</label>
                <input value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                  placeholder={ph}
                  style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',
                    fontSize:'.85rem',boxSizing:'border-box'}}/>
              </div>
            ))}

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Semester</label>
                <select value={form.semester} onChange={e=>setForm(f=>({...f,semester:e.target.value}))}
                  style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.85rem'}}>
                  <option>Ganjil</option><option>Genap</option>
                </select>
              </div>
              <div>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Tahun Ajaran</label>
                <input value={form.tahun_ajaran} onChange={e=>setForm(f=>({...f,tahun_ajaran:e.target.value}))}
                  placeholder="2026/2027"
                  style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.85rem',boxSizing:'border-box'}}/>
              </div>
            </div>

            <div>
              <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Tanggal Pelaksanaan</label>
              <input type="date" value={form.tanggal_pelaksanaan} onChange={e=>setForm(f=>({...f,tanggal_pelaksanaan:e.target.value}))}
                style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.85rem',boxSizing:'border-box'}}/>
            </div>

            <div>
              <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Keterangan Tambahan</label>
              <textarea value={form.keterangan} onChange={e=>setForm(f=>({...f,keterangan:e.target.value}))}
                placeholder="Opsional — misal: UH setelah remedial, instrumen terevisi, dll"
                rows={2}
                style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',
                  fontSize:'.85rem',boxSizing:'border-box',resize:'vertical'}}/>
            </div>
          </div>
          <div style={{marginTop:16,display:'flex',justifyContent:'flex-end',gap:8}}>
            <button onClick={()=>simpan('draft')} disabled={saving||!form.jenis_penilaian}
              style={{padding:'8px 16px',background:'#fff',color:'var(--p)',border:'1.5px solid var(--p)',
                borderRadius:8,cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
              💾 Simpan Draft
            </button>
            <button onClick={()=>setFormStep(2)} disabled={!form.jenis_penilaian}
              style={{padding:'8px 18px',background:'var(--p)',color:'#fff',border:'none',
                borderRadius:8,cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
              Lanjut → Butir Soal
            </button>
          </div>
        </div>
      )}

      {/* STEP 2 — BUTIR SOAL */}
      {formStep===2 && (
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div className="card">
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>➕ Tambah Butir Soal</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>
                  Deskripsi Soal *
                </label>
                <textarea value={butirForm.deskripsi}
                  onChange={e=>setButirForm(f=>({...f,deskripsi:e.target.value}))}
                  placeholder="Tulis deskripsi singkat soal, misal: Siswa menjelaskan pengertian fotosintesis"
                  rows={2}
                  style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',
                    fontSize:'.85rem',boxSizing:'border-box',resize:'vertical'}}/>
              </div>

              {hasil.skorTotal}%
            </div>
            <span style={{padding:'4px 16px',borderRadius:20,fontSize:'.85rem',fontWeight:800,
              background:hasil.skorTotal>=87.5?'#d1fae5':hasil.skorTotal>=75?'#dbeafe':hasil.skorTotal>=62.5?'#fef3c7':'#fee2e2',
              color:hasil.skorTotal>=87.5?'#065f46':hasil.skorTotal>=75?'#1d4ed8':hasil.skorTotal>=62.5?'#92400e':'#991b1b'}}>

          {/* Distribusi Bloom */}
          <div className="card">
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>🧠 Distribusi Level Kognitif Bloom</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {BLOOM.map(b=>{
                const cnt = hasil.dist[b]||0;
                const total = butirSoal.length||1;

                  <div key={b} style={{display:'flex',alignItems:'center',gap:10}}>

                    <span style={{fontSize:'.72rem',color:'var(--text2)',width:80}}>{BLOOM_LABEL[b]}</span>
