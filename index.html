// ── TAB ANALITIK KANWIL ──────────────────────────────────────
function TabAnalitikKanwil({madrasahList, stats, filterSmt, filterTA, showToast}) {
  const [filterKab2, setFilterKab2] = React.useState('');
  const [filterTkt2, setFilterTkt2] = React.useState('');

  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  const warna = v => v>=87.5?'#16a34a':v>=75?'#2563eb':v>=62.5?'#d97706':'#dc2626';
  const pred  = v => v>=87.5?'Sangat Baik':v>=75?'Baik':v>=62.5?'Cukup':'Kurang';

  const kabList = [...new Set(madrasahList.map(m=>m.kota_kab).filter(Boolean))].sort();

  const filtered = madrasahList.filter(m => {
    if (filterKab2 && m.kota_kab !== filterKab2) return false;
    if (filterTkt2 && m.tingkat  !== filterTkt2) return false;
    return true;
  });

  // Statistik per kab/kota
  const kabStats = {};
  filtered.forEach(m => {
    const kab = m.kota_kab||'Lainnya';
    if (!kabStats[kab]) kabStats[kab] = {madrasah:0,supervisi:0,rata:[],p:[],l:[],a:[]};
    kabStats[kab].madrasah++;
    const s = stats[m.id]||{selesai:0,rata:[],p:[],l:[],a:[]};
    kabStats[kab].supervisi += s.selesai;
    kabStats[kab].rata.push(...s.rata);
    kabStats[kab].p.push(...s.p);
    kabStats[kab].l.push(...s.l);
    kabStats[kab].a.push(...s.a);
  });

  const kabRows = Object.entries(kabStats)
    .map(([kab,s]) => ({kab, ...s, avgRata:avg(s.rata), avgP:avg(s.p), avgL:avg(s.l), avgA:avg(s.a)}))
    .sort((a,b) => b.avgRata - a.avgRata);

  // Statistik per tingkat
  const tktStats = {};
  ['MI','MTs','MA'].forEach(tkt => {
    const mads = filtered.filter(m=>m.tingkat===tkt);
    const allR=mads.flatMap(m=>(stats[m.id]||{rata:[]}).rata);
    const allP=mads.flatMap(m=>(stats[m.id]||{p:[]}).p);
    const allL=mads.flatMap(m=>(stats[m.id]||{l:[]}).l);
    const allA=mads.flatMap(m=>(stats[m.id]||{a:[]}).a);
    tktStats[tkt] = {
      total:mads.length, sup:mads.reduce((s,m)=>s+(stats[m.id]||{selesai:0}).selesai,0),
      rata:avg(allR), p:avg(allP), l:avg(allL), a:avg(allA),
      len:allR.length,
    };
  });

  // Distribusi predikat semua madrasah
  const distrib = {SB:0,B:0,C:0,K:0,NA:0};
  filtered.forEach(m => {
    const s = stats[m.id]||{rata:[]};
    if (!s.rata.length) { distrib.NA++; return; }
    const r = avg(s.rata);
    if (r>=87.5) distrib.SB++;
    else if (r>=75) distrib.B++;
    else if (r>=62.5) distrib.C++;
    else distrib.K++;
  });

  const totalSupAll = filtered.reduce((s,m)=>s+(stats[m.id]||{selesai:0}).selesai,0);
  const allRataAll  = filtered.flatMap(m=>(stats[m.id]||{rata:[]}).rata);

  return (
    <div>
      <div style={{fontWeight:900,color:'var(--p3)',marginBottom:4}}>🔬 Analitik Mendalam</div>
      <div style={{fontSize:'.75rem',color:'var(--text3)',marginBottom:14}}>
        {filterSmt||'Semua semester'} · {filterTA||'Semua T.A.'}
        {(filterKab2||filterTkt2) && ` · Filter aktif`}
      </div>

      {/* Filter tambahan */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <select value={filterKab2} onChange={e=>setFilterKab2(e.target.value)}
          style={{padding:'5px 10px',borderRadius:8,border:'1.5px solid var(--border)',
            fontSize:'.78rem',fontFamily:'inherit',outline:'none'}}>
          <option value="">— Semua Kab/Kota —</option>
          {kabList.map(k=><option key={k}>{k}</option>)}
        </select>
        <select value={filterTkt2} onChange={e=>setFilterTkt2(e.target.value)}
          style={{padding:'5px 10px',borderRadius:8,border:'1.5px solid var(--border)',
            fontSize:'.78rem',fontFamily:'inherit',outline:'none'}}>
          <option value="">— Semua Tingkat —</option>
          {['MI','MTs','MA'].map(t=><option key={t}>{t}</option>)}
        </select>
        {(filterKab2||filterTkt2) && (
          <button className="btn btn-outline btn-sm" onClick={()=>{setFilterKab2('');setFilterTkt2('');}}>✕ Reset</button>
        )}
      </div>

      {/* Distribusi predikat */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
          🏆 Distribusi Predikat Madrasah
          <span style={{fontSize:'.75rem',fontWeight:400,color:'var(--text3)',marginLeft:8}}>
            Total: {filtered.length} madrasah · {totalSupAll} supervisi
          </span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8}}>
          {[
            {label:'Sangat Baik',val:distrib.SB,color:'#16a34a',bg:'#d1fae5',min:'≥87.5%'},
            {label:'Baik',       val:distrib.B, color:'#2563eb',bg:'#dbeafe',min:'≥75%'},
            {label:'Cukup',      val:distrib.C, color:'#d97706',bg:'#fef3c7',min:'≥62.5%'},
            {label:'Kurang',     val:distrib.K, color:'#dc2626',bg:'#fee2e2',min:'<62.5%'},
            {label:'Belum Data', val:distrib.NA,color:'#9ca3af',bg:'#f3f4f6',min:'—'},
          ].map((d,i)=>(
            <div key={i} style={{textAlign:'center',padding:'12px 8px',borderRadius:10,
              background:d.bg,border:'1.5px solid '+d.color+'33'}}>
              <div style={{fontSize:'1.6rem',fontWeight:900,color:d.color}}>{d.val}</div>
              <div style={{fontSize:'.68rem',fontWeight:700,color:d.color,marginTop:2}}>{d.label}</div>
              <div style={{fontSize:'.62rem',color:'#9ca3af',marginTop:2}}>{d.min}</div>
            </div>
          ))}
        </div>
        {allRataAll.length > 0 && (
          <div style={{marginTop:12,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,
            fontSize:'.8rem',display:'flex',gap:20,flexWrap:'wrap'}}>
            <span>📊 Rata-rata Provinsi: <b style={{color:warna(avg(allRataAll))}}>{avg(allRataAll).toFixed(1)}%</b></span>
            <span>📈 Tertinggi: <b style={{color:'#16a34a'}}>{Math.max(...allRataAll).toFixed(1)}%</b></span>
            <span>📉 Terendah: <b style={{color:'#dc2626'}}>{Math.min(...allRataAll).toFixed(1)}%</b></span>
          </div>
        )}
      </div>

      {/* Per tingkat madrasah */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>
          🏫 Perbandingan Capaian per Tingkat
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.8rem',minWidth:560}}>
            <thead>
              <tr style={{background:'var(--p3)',color:'#fff'}}>
                {['Tingkat','Madrasah','Supervisi','Perencanaan','Pelaksanaan','Asesmen','Rata-rata','Predikat'].map(h=>(
                  <th key={h} style={{padding:'7px 10px',textAlign:h==='Tingkat'||h==='Predikat'?'left':'center',fontWeight:700}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {['MI','MTs','MA'].map(tkt => {
                const s = tktStats[tkt];
                const fmt = v => s.len>0 ? v.toFixed(1)+'%' : '—';
                return (
                  <tr key={tkt} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'8px 10px'}}>
                      <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.75rem',fontWeight:700,
                        background:tkt==='MA'?'#dbeafe':tkt==='MTs'?'#fef3c7':'#d1fae5',
                        color:tkt==='MA'?'#1d4ed8':tkt==='MTs'?'#92400e':'#065f46'}}>
                        {tkt}
                      </span>
                    </td>
                    <td style={{padding:'8px 10px',textAlign:'center',fontWeight:700}}>{s.total}</td>
                    <td style={{padding:'8px 10px',textAlign:'center',fontWeight:700}}>{s.sup}</td>
                    {[s.p,s.l,s.a].map((v,vi)=>(
                      <td key={vi} style={{padding:'8px 10px',textAlign:'center',
                        fontWeight:s.len>0?700:400,color:s.len>0?warna(v):'#9ca3af'}}>
                        {fmt(v)}
                      </td>
                    ))}
                    <td style={{padding:'8px 10px',textAlign:'center',
                      fontWeight:s.len>0?900:400,fontSize:s.len>0?'1rem':'.8rem',
                      color:s.len>0?warna(s.rata):'#9ca3af'}}>
                      {s.len>0?s.rata.toFixed(1)+'%':'—'}
                    </td>
                    <td style={{padding:'8px 10px'}}>
                      {s.len>0 && (
                        <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                          background:s.rata>=87.5?'#d1fae5':s.rata>=75?'#dbeafe':s.rata>=62.5?'#fef3c7':'#fee2e2',
                          color:s.rata>=87.5?'#065f46':s.rata>=75?'#1d4ed8':s.rata>=62.5?'#92400e':'#991b1b'}}>
                          {pred(s.rata)}
                        </span>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Per Kab/Kota */}
      {kabRows.length > 0 && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>
            🗺️ Peringkat Capaian per Kabupaten/Kota
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {kabRows.map((k,i) => (
              <div key={k.kab}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:'.82rem',fontWeight:700}}>
                    <span style={{color:'var(--text3)',marginRight:6,fontWeight:400}}>{i+1}.</span>
                    {k.kab}
                    <span style={{fontSize:'.7rem',fontWeight:400,color:'var(--text3)',marginLeft:8}}>
                      {k.madrasah} madrasah · {k.supervisi} supervisi
                    </span>
                  </span>
                  <span style={{fontWeight:900,fontSize:'.9rem',color:k.rata.length?warna(k.avgRata):'#9ca3af'}}>
                    {k.rata.length?k.avgRata.toFixed(1)+'%':'—'}
                  </span>
                </div>
                {k.rata.length > 0 ? (
                  <div>
                    <div style={{background:'#f0f0f0',borderRadius:8,height:20,overflow:'hidden'}}>
                      <div style={{width:k.avgRata+'%',height:'100%',background:warna(k.avgRata),
                        borderRadius:8,display:'flex',alignItems:'center',paddingLeft:8}}>
                        {k.avgRata >= 20 && (
                          <span style={{fontSize:'.68rem',color:'#fff',fontWeight:700}}>{k.avgRata.toFixed(1)}%</span>
                        )}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:14,marginTop:4,fontSize:'.7rem',color:'var(--text3)'}}>
                      <span style={{color:'#16a34a'}}>P: {k.avgP.toFixed(1)}%</span>
                      <span style={{color:'#2563eb'}}>L: {k.avgL.toFixed(1)}%</span>
                      <span style={{color:'#d97706'}}>A: {k.avgA.toFixed(1)}%</span>
                    </div>
                  </div>
                ) : (
                  <div style={{background:'#f0f0f0',borderRadius:8,height:20,display:'flex',
                    alignItems:'center',paddingLeft:10,fontSize:'.7rem',color:'#9ca3af'}}>
                    Belum ada data supervisi
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── TAB TINDAK LANJUT KANWIL ─────────────────────────────────
function TabTindakLanjutKanwil({madrasahList, showToast}) {
  const [catatan, setCatatan]         = React.useState({});   // {madrasahId: teks}
  const [prioritas, setPrioritas]     = React.useState({});   // {madrasahId: 'rendah'|'sedang'|'tinggi'}
  const [status, setStatus]           = React.useState({});   // {madrasahId: 'belum'|'proses'|'selesai'}
  const [saving, setSaving]           = React.useState(null); // madrasahId yg sedang disimpan
  const [loading, setLoading]         = React.useState(true);
  const [filterStatus, setFilterStatus] = React.useState('');
  const [editId, setEditId]           = React.useState(null);

  React.useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const {data} = await sb.from('supermad_madrasah')
      .select('id,tl_kanwil').eq('aktif',true);
    const newCat={}, newPri={}, newStat={};
    (data||[]).forEach(m => {
      if (m.tl_kanwil) {
        newCat[m.id]  = m.tl_kanwil.catatan||'';
        newPri[m.id]  = m.tl_kanwil.prioritas||'sedang';
        newStat[m.id] = m.tl_kanwil.status||'belum';
      }
    });
    setCatatan(newCat); setPrioritas(newPri); setStatus(newStat);
    setLoading(false);
  }

  async function simpan(madId) {
    setSaving(madId);
    const payload = {
      catatan:   catatan[madId]||'',
      prioritas: prioritas[madId]||'sedang',
      status:    status[madId]||'belum',
      updated_at: new Date().toISOString(),
    };
    const {error} = await sb.from('supermad_madrasah')
      .update({tl_kanwil: payload}).eq('id', madId);
    setSaving(null);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Tindak lanjut tersimpan!');
    setEditId(null);
  }

  if (loading) return <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat...</div>;

  const filteredMad = madrasahList.filter(m => {
    if (!filterStatus) return true;
    return (status[m.id]||'belum') === filterStatus;
  });

  const priColor = {rendah:'#16a34a',sedang:'#d97706',tinggi:'#dc2626'};
  const priBg    = {rendah:'#d1fae5',sedang:'#fef3c7',tinggi:'#fee2e2'};
  const priLabel = {rendah:'🟢 Rendah',sedang:'🟡 Sedang',tinggi:'🔴 Tinggi'};
  const statColor = {belum:'#dc2626',proses:'#d97706',selesai:'#16a34a'};
  const statBg    = {belum:'#fee2e2',proses:'#fef3c7',selesai:'#d1fae5'};
  const statLabel = {belum:'⏳ Belum',proses:'🔄 Dalam Proses',selesai:'✅ Selesai'};

  const countSelesai = madrasahList.filter(m=>(status[m.id]||'belum')==='selesai').length;
  const countProses  = madrasahList.filter(m=>(status[m.id]||'belum')==='proses').length;
  const countBelum   = madrasahList.filter(m=>(status[m.id]||'belum')==='belum').length;

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>✍️ Tindak Lanjut Kanwil per Madrasah</div>
          <div style={{fontSize:'.75rem',color:'var(--text3)',marginTop:2}}>
            Catat hasil pembinaan lanjutan kanwil untuk setiap madrasah
          </div>
        </div>
      </div>

      {/* Ringkasan status */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:14}}>
        {[
          {label:'Selesai',val:countSelesai,color:'#16a34a',bg:'#d1fae5'},
          {label:'Dalam Proses',val:countProses,color:'#d97706',bg:'#fef3c7'},
          {label:'Belum',val:countBelum,color:'#dc2626',bg:'#fee2e2'},
        ].map((s,i)=>(
          <div key={i} style={{textAlign:'center',padding:'12px 8px',borderRadius:10,
            background:s.bg,border:'1.5px solid '+s.color+'33',cursor:'pointer'}
            }
            onClick={()=>setFilterStatus(filterStatus===Object.keys(statLabel)[i]?'':Object.keys(statLabel)[i])}>
            <div style={{fontSize:'1.5rem',fontWeight:900,color:s.color}}>{s.val}</div>
            <div style={{fontSize:'.72rem',fontWeight:700,color:s.color}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Filter */}
      <div style={{display:'flex',gap:8,marginBottom:14,alignItems:'center'}}>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
          style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',outline:'none'}}>
          <option value="">— Semua Status —</option>
          <option value="belum">⏳ Belum</option>
          <option value="proses">🔄 Dalam Proses</option>
          <option value="selesai">✅ Selesai</option>
        </select>
        <span style={{fontSize:'.75rem',color:'var(--text3)'}}>
          {filteredMad.length} madrasah
        </span>
      </div>

      {/* Daftar madrasah */}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {filteredMad.map(m => {
          const isEdit = editId === m.id;
          const st = status[m.id]||'belum';
          const pri = prioritas[m.id]||'sedang';
          const cat = catatan[m.id]||'';
          return (
            <div key={m.id} className="card" style={{borderLeft:'3px solid '+statColor[st]}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontWeight:700,fontSize:'.88rem'}}>{m.nama}</div>
                  <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:2}}>
                    {m.tingkat} · {m.kota_kab||'—'} · {m.npsn||'—'}
                  </div>
                  {cat && !isEdit && (
                    <div style={{marginTop:6,fontSize:'.8rem',color:'var(--text2)',
                      padding:'6px 10px',background:'var(--surface2)',borderRadius:7,lineHeight:1.5}}>
                      {cat}
                    </div>
                  )}
                  {!cat && !isEdit && (
                    <div style={{marginTop:6,fontSize:'.75rem',color:'#9ca3af',fontStyle:'italic'}}>
                      Belum ada catatan tindak lanjut
                    </div>
                  )}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end',flexShrink:0}}>
                  <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                    background:statBg[st],color:statColor[st]}}>
                    {statLabel[st]}
                  </span>
                  <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                    background:priBg[pri],color:priColor[pri]}}>
                    {priLabel[pri]}
                  </span>
                  <button onClick={()=>setEditId(isEdit?null:m.id)}
                    className="btn btn-outline btn-sm"
                    style={{fontSize:'.72rem',padding:'4px 10px',
                      color:isEdit?'#dc2626':'var(--p)',borderColor:isEdit?'#dc2626':'var(--p)'}}>
                    {isEdit?'✕ Batal':'✏️ Edit'}
                  </button>
                </div>
              </div>

              {isEdit && (
                <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
                  <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
                    <div className="form-group" style={{flex:1,minWidth:140,margin:0}}>
                      <label style={{fontSize:'.75rem'}}>Status Tindak Lanjut</label>
                      <select value={status[m.id]||'belum'} onChange={e=>setStatus({...status,[m.id]:e.target.value})}
                        style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
                          fontSize:'.8rem',fontFamily:'inherit',outline:'none',width:'100%'}}>
                        <option value="belum">⏳ Belum</option>
                        <option value="proses">🔄 Dalam Proses</option>
                        <option value="selesai">✅ Selesai</option>
                      </select>
                    </div>
                    <div className="form-group" style={{flex:1,minWidth:140,margin:0}}>
                      <label style={{fontSize:'.75rem'}}>Prioritas</label>
                      <select value={prioritas[m.id]||'sedang'} onChange={e=>setPrioritas({...prioritas,[m.id]:e.target.value})}
                        style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
                          fontSize:'.8rem',fontFamily:'inherit',outline:'none',width:'100%'}}>
                        <option value="rendah">🟢 Rendah</option>
                        <option value="sedang">🟡 Sedang</option>
                        <option value="tinggi">🔴 Tinggi</option>
                      </select>
                    </div>
                  </div>
                  <div className="form-group" style={{margin:0}}>
                    <label style={{fontSize:'.75rem'}}>Catatan Pembinaan / Tindak Lanjut</label>
                    <textarea rows={4}
                      value={catatan[m.id]||''}
                      onChange={e=>setCatatan({...catatan,[m.id]:e.target.value})}
                      placeholder="Tuliskan catatan kunjungan, pembinaan, atau rencana tindak lanjut kanwil untuk madrasah ini..."
                      style={{width:'100%',padding:'8px 10px',border:'1.5px solid var(--border)',
                        borderRadius:8,fontSize:'.8rem',fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
                  </div>
                  <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
                    <button onClick={()=>simpan(m.id)} className="btn btn-primary"
                      disabled={saving===m.id} style={{fontSize:'.8rem'}}>
                      {saving===m.id?'⏳ Menyimpan...':'💾 Simpan'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── E-PORTOFOLIO GURU ─────────────────────────────────────────
function TabPortofolio({sesi, showToast}) {
  const KATEGORI = ['Sertifikat Pelatihan','Workshop/Seminar','PTK / Karya Ilmiah','Media/Perangkat Ajar','Penghargaan','Lainnya'];

  const [items, setItems]       = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [showForm, setShowForm] = React.useState(false);
  const [saving, setSaving]     = React.useState(false);
  const [form, setForm]         = React.useState({
    judul:'', kategori:'Sertifikat Pelatihan', deskripsi:'', tanggal:'',
    penyelenggara:'', link_bukti:'',
  });
  const [filterKat, setFilterKat] = React.useState('');
  const [editId, setEditId]       = React.useState(null);

  React.useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const guruId = sesi.pengguna.id;
    const {data} = await sb.from('supermad_portofolio')
      .select('*').eq('guru_id', guruId)
      .order('tanggal',{ascending:false});
    setItems(data||[]);
    setLoading(false);
  }

  async function simpan(e) {
    e.preventDefault();
    setSaving(true);
    const guruId = sesi.pengguna.id;
    const payload = {...form, guru_id:guruId, madrasah_id:sesi.mad.id};
    let error;
    if (editId) {
      ({error} = await sb.from('supermad_portofolio').update(payload).eq('id', editId));
    } else {
      ({error} = await sb.from('supermad_portofolio').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast(editId?'✅ Portofolio diperbarui!':'✅ Portofolio ditambahkan!');
    setShowForm(false);
    setEditId(null);
    setForm({judul:'',kategori:'Sertifikat Pelatihan',deskripsi:'',tanggal:'',penyelenggara:'',link_bukti:''});
    loadData();
  }

  async function hapus(id) {
    if (!confirm('Hapus item portofolio ini?')) return;
    const {error} = await sb.from('supermad_portofolio').delete().eq('id',id);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('Portofolio dihapus.');
    loadData();
  }

  function startEdit(item) {
    setForm({
      judul:item.judul||'',
      kategori:item.kategori||'Sertifikat Pelatihan',
      deskripsi:item.deskripsi||'',
      tanggal:item.tanggal||'',
      penyelenggara:item.penyelenggara||'',
      link_bukti:item.link_bukti||'',
    });
    setEditId(item.id);
    setShowForm(true);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  if (loading) return <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat portofolio...</div>;

  const filtered = filterKat ? items.filter(i=>i.kategori===filterKat) : items;

  const katColor = {
    'Sertifikat Pelatihan':'#2563eb','Workshop/Seminar':'#7c3aed',
    'PTK / Karya Ilmiah':'#16a34a','Media/Perangkat Ajar':'#d97706',
    'Penghargaan':'#dc2626','Lainnya':'#6b7280',
  };
  const katBg = {
    'Sertifikat Pelatihan':'#dbeafe','Workshop/Seminar':'#ede9fe',
    'PTK / Karya Ilmiah':'#d1fae5','Media/Perangkat Ajar':'#fef3c7',
    'Penghargaan':'#fee2e2','Lainnya':'#f3f4f6',
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>🗂️ e-Portofolio PKB Saya</div>
          <div style={{fontSize:'.75rem',color:'var(--text3)',marginTop:2}}>
            Kumpulkan bukti Pengembangan Keprofesian Berkelanjutan (PKB)
          </div>
        </div>
        <button className="btn btn-primary btn-sm"
          onClick={()=>{setShowForm(!showForm);setEditId(null);
            setForm({judul:'',kategori:'Sertifikat Pelatihan',deskripsi:'',tanggal:'',penyelenggara:'',link_bukti:''});
          }}>
          {showForm&&!editId?'✕ Batal':'＋ Tambah'}
        </button>
      </div>

      {/* Form tambah/edit */}
      {showForm && (
        <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
            {editId?'✏️ Edit Portofolio':'＋ Tambah Portofolio PKB'}
          </div>
          <form onSubmit={simpan}>
            <div className="grid2">
              <div className="form-group" style={{gridColumn:'1/-1'}}>
                <label>Judul Kegiatan / Karya *</label>
                <input value={form.judul} onChange={e=>setForm({...form,judul:e.target.value})}
                  placeholder="Contoh: Pelatihan Implementasi KMA 1503/2025" required/>
              </div>
              <div className="form-group">
                <label>Kategori *</label>
                <select value={form.kategori} onChange={e=>setForm({...form,kategori:e.target.value})}>
                  {KATEGORI.map(k=><option key={k}>{k}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Tanggal</label>
                <input type="date" value={form.tanggal} onChange={e=>setForm({...form,tanggal:e.target.value})}/>
              </div>
              <div className="form-group">
                <label>Penyelenggara</label>
                <input value={form.penyelenggara} onChange={e=>setForm({...form,penyelenggara:e.target.value})}
                  placeholder="Contoh: Kanwil Kemenag Aceh"/>
              </div>
              <div className="form-group">
                <label>Link Bukti (URL)</label>
                <input value={form.link_bukti} onChange={e=>setForm({...form,link_bukti:e.target.value})}
                  type="url" placeholder="https://drive.google.com/..."/>
              </div>
              <div className="form-group" style={{gridColumn:'1/-1'}}>
                <label>Deskripsi Singkat</label>
                <textarea rows={3} value={form.deskripsi} onChange={e=>setForm({...form,deskripsi:e.target.value})}
                  placeholder="Tuliskan ringkasan kegiatan, dampak, atau kompetensi yang dikembangkan..."
                  style={{width:'100%',padding:'8px 10px',border:'1.5px solid var(--border)',
                    borderRadius:8,fontSize:'.82rem',fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
              </div>
            </div>
            <div style={{display:'flex',gap:8,marginTop:4}}>
              <button className="btn btn-primary" type="submit" disabled={saving}>
                {saving?'⏳ Menyimpan...':editId?'💾 Perbarui':'💾 Simpan'}
              </button>
              <button type="button" className="btn btn-outline" onClick={()=>{setShowForm(false);setEditId(null);}}>
                Batal
              </button>
            </div>
          </form>
        </div>
      )}

      {/* Statistik */}
      {items.length > 0 && (
        <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
          {KATEGORI.map(k => {
            const n = items.filter(i=>i.kategori===k).length;
            if (!n) return null;
            return (
              <button key={k} onClick={()=>setFilterKat(filterKat===k?'':k)}
                style={{padding:'5px 12px',borderRadius:20,border:'1.5px solid '+(filterKat===k?katColor[k]:'var(--border)'),
                  background:filterKat===k?katBg[k]:'#fff',color:filterKat===k?katColor[k]:'var(--text2)',
                  cursor:'pointer',fontSize:'.75rem',fontWeight:700,fontFamily:'inherit'}}>
                {k} ({n})
              </button>
            );
          })}
          {filterKat && (
            <button onClick={()=>setFilterKat('')}
              style={{padding:'5px 10px',borderRadius:20,border:'1.5px solid var(--border)',
                background:'#f3f4f6',color:'var(--text2)',cursor:'pointer',
                fontSize:'.75rem',fontFamily:'inherit'}}>
              ✕ Semua
            </button>
          )}
        </div>
      )}

      {/* Daftar item */}
      {filtered.length === 0 ? (
        <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
          {items.length===0?'Belum ada portofolio. Klik "＋ Tambah" untuk mulai.':'Tidak ada item untuk kategori ini.'}
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {filtered.map(item => (
            <div key={item.id} className="card"
              style={{borderLeft:'3px solid '+(katColor[item.kategori]||'#6b7280')}}>
              <div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:4}}>
                    <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',fontWeight:700,
                      background:katBg[item.kategori]||'#f3f4f6',
                      color:katColor[item.kategori]||'#6b7280'}}>
                      {item.kategori}
                    </span>
                    {item.tanggal && (
                      <span style={{fontSize:'.72rem',color:'var(--text3)'}}>
                        📅 {new Date(item.tanggal).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
                      </span>
                    )}
                  </div>
                  <div style={{fontWeight:700,fontSize:'.88rem',marginBottom:2}}>{item.judul}</div>
                  {item.penyelenggara && (
                    <div style={{fontSize:'.75rem',color:'var(--text2)'}}>🏢 {item.penyelenggara}</div>
                  )}
                  {item.deskripsi && (
                    <div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:4,lineHeight:1.5}}>
                      {item.deskripsi}
                    </div>
                  )}
                  {item.link_bukti && (
                    <a href={item.link_bukti} target="_blank" rel="noopener noreferrer"
                      style={{display:'inline-flex',alignItems:'center',gap:4,marginTop:6,
                        fontSize:'.75rem',color:'var(--p)',textDecoration:'none',fontWeight:600}}>
                      🔗 Lihat Bukti
                    </a>
                  )}
                </div>
                <div style={{display:'flex',gap:6,flexShrink:0,alignItems:'flex-start'}}>
                  <button onClick={()=>startEdit(item)}
                    style={{padding:'5px 10px',borderRadius:7,border:'1px solid #d97706',
                      background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:'.75rem'}}>
                    ✏️
                  </button>
                  <button onClick={()=>hapus(item.id)}
                    style={{padding:'5px 10px',borderRadius:7,border:'1px solid #fca5a5',
                      background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.75rem'}}>
                    🗑️
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TabInstrumen({sesi, showToast}) {
  const DEFAULT = {
    perencanaan: [
      'Merumuskan tujuan pembelajaran berbasis KBC',
      'Menyusun indikator capaian berbasis kompetensi',
      'Merancang materi ajar kontekstual dan bermakna',
      'Memilih metode pembelajaran yang tepat',
      'Menyiapkan media/sumber belajar yang relevan',
      'Merancang aktivitas KBC (mengetahui, memahami, mengaplikasi, merefleksi)',
      'Menyusun instrumen penilaian formatif',
      'Mengintegrasikan nilai karakter Islam dalam pembelajaran',
      'Merancang diferensiasi untuk keberagaman peserta didik',
    ],
    pelaksanaan: [
      'Membuka pembelajaran dengan apersepsi bermakna',
      'Menyampaikan tujuan dan manfaat pembelajaran',
      'Mengaitkan materi dengan konteks kehidupan nyata',
      'Memfasilitasi aktivitas MENGETAHUI (penguatan konsep)',
      'Memfasilitasi aktivitas MEMAHAMI (pendalaman makna)',
      'Memfasilitasi aktivitas MENGAPLIKASI (penerapan)',
      'Memfasilitasi aktivitas MEREFLEKSI (evaluasi diri)',
      'Mendorong interaksi aktif antar peserta didik',
      'Memberikan umpan balik konstruktif',
      'Mengintegrasikan nilai-nilai Islam (akhlak, adab)',
      'Menggunakan media/teknologi secara efektif',
      'Mengelola waktu pembelajaran dengan baik',
      'Menyesuaikan pendekatan dengan kebutuhan peserta didik',
      'Menutup pembelajaran dengan refleksi dan penguatan',
    ],
    asesmen: [
      'Melaksanakan penilaian formatif selama pembelajaran',
      'Menggunakan instrumen penilaian yang beragam',
      'Memberikan umpan balik terhadap hasil belajar',
      'Mendorong peserta didik melakukan penilaian diri',
      'Menggunakan hasil asesmen untuk perbaikan pembelajaran',
      'Mencatat perkembangan belajar peserta didik',
      'Mengintegrasikan penilaian karakter dalam asesmen',
    ],
  };

  const [komponen, setKomponen] = React.useState('perencanaan');
  const [items, setItems] = React.useState(null); // null = belum load
  const [saving, setSaving] = React.useState(false);
  const [editIdx, setEditIdx] = React.useState(null);
  const [editVal, setEditVal] = React.useState('');
  const [newItem, setNewItem] = React.useState('');

  React.useEffect(() => { loadInstrumen(); }, []);

  async function loadInstrumen() {
    const {data} = await sb.from('supermad_madrasah')
      .select('instrumen_custom').eq('id', sesi.mad.id).single();
    const inst = data?.instrumen_custom || {};
    setItems({
      perencanaan: inst.perencanaan || [...DEFAULT.perencanaan],
      pelaksanaan: inst.pelaksanaan || [...DEFAULT.pelaksanaan],
      asesmen:     inst.asesmen     || [...DEFAULT.asesmen],
    });
  }

  async function simpan(newItems) {
    setSaving(true);
    const toSave = newItems || items;
    const {error} = await sb.from('supermad_madrasah')
      .update({instrumen_custom: toSave}).eq('id', sesi.mad.id);
    setSaving(false);
    if (error) { showToast('Gagal simpan: '+error.message,'error'); return; }
    // Update sesi.mad supaya FormSupervisi langsung pakai yg baru
    if (sesi.mad) sesi.mad.instrumen_custom = toSave;
    setItems({...toSave});
    showToast('✅ Instrumen berhasil disimpan!');
  }

  function updateItem(idx, val) {
    const arr = [...items[komponen]];
    arr[idx] = val;
    const next = {...items, [komponen]: arr};
    setItems(next);
  }

  function hapusItem(idx) {
    if (!confirm('Hapus item ini?')) return;
    const arr = items[komponen].filter((_,i)=>i!==idx);
    const next = {...items, [komponen]: arr};
    setItems(next);
    simpan(next);
  }

  function tambahItem() {
    if (!newItem.trim()) return;
    const arr = [...items[komponen], newItem.trim()];
    const next = {...items, [komponen]: arr};
    setItems(next);
    setNewItem('');
    simpan(next);
  }

  function naikItem(idx) {
    if (idx===0) return;
    const arr = [...items[komponen]];
    [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
    const next = {...items, [komponen]: arr};
    setItems(next);
  }

  function turunItem(idx) {
    const arr = items[komponen];
    if (idx>=arr.length-1) return;
    const a = [...arr];
    [a[idx], a[idx+1]] = [a[idx+1], a[idx]];
    const next = {...items, [komponen]: a};
    setItems(next);
  }

  function resetDefault() {
    if (!confirm('Reset instrumen '+komponen+' ke default PM-KBC?')) return;
    const next = {...items, [komponen]: [...DEFAULT[komponen]]};
    setItems(next);
    simpan(next);
  }

  if (!items) return <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat instrumen...</div>;

  const labelMap = {perencanaan:'📝 Perencanaan', pelaksanaan:'🎯 Pelaksanaan', asesmen:'✅ Asesmen'};
  const curItems = items[komponen];

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>📋 Editor Instrumen Supervisi</div>
          <div style={{fontSize:'.75rem',color:'var(--text3)',marginTop:2}}>
            Sesuaikan item penilaian dengan kebutuhan madrasah. Skor per item: 0–3.
          </div>
        </div>
        <button onClick={resetDefault} className="btn btn-outline btn-sm" style={{color:'#d97706',borderColor:'#d97706'}}>
          🔄 Reset Default
        </button>
      </div>

      {/* Tab komponen */}
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        {Object.entries(labelMap).map(([key,label])=>(
          <button key={key} onClick={()=>setKomponen(key)}
            style={{padding:'7px 16px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
              background:komponen===key?'var(--p)':'var(--surface2)',
              color:komponen===key?'#fff':'var(--text2)'}}>
            {label}
          </button>
        ))}
      </div>

      <div className="card">
        <div style={{fontWeight:700,color:'var(--p3)',marginBottom:12}}>
          {labelMap[komponen]} — {curItems.length} item
        </div>

        {/* Daftar item */}
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
          {curItems.map((item, idx)=>(
            <div key={idx} style={{display:'flex',gap:8,alignItems:'flex-start',
              padding:'10px 12px',background:'var(--surface2)',borderRadius:9,
              border:'1.5px solid var(--border)'}}>
              <div style={{fontWeight:700,color:'var(--text3)',fontSize:'.75rem',
                minWidth:24,marginTop:2,textAlign:'center'}}>{idx+1}</div>
              <div style={{flex:1}}>
                {editIdx===idx ? (
                  <div style={{display:'flex',gap:6,alignItems:'flex-start'}}>
                    <textarea rows={2} value={editVal}
                      onChange={e=>setEditVal(e.target.value)}
                      style={{flex:1,padding:'6px 8px',border:'1.5px solid var(--p)',
                        borderRadius:7,fontSize:'.82rem',fontFamily:'inherit',
                        resize:'vertical',outline:'none'}}
                      autoFocus/>
                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                      <button onClick={()=>{
                        if (editVal.trim()) { updateItem(idx, editVal.trim()); }
                        setEditIdx(null);
                      }} className="btn btn-primary btn-sm">✓</button>
                      <button onClick={()=>setEditIdx(null)} className="btn btn-outline btn-sm">✕</button>
                    </div>
                  </div>
                ) : (
                  <div style={{fontSize:'.82rem',lineHeight:1.5}}>{item}</div>
                )}
              </div>
              <div style={{display:'flex',gap:4,flexShrink:0}}>
                <button onClick={()=>naikItem(idx)} disabled={idx===0}
                  style={{padding:'4px 6px',borderRadius:5,border:'1px solid var(--border)',
                    background:'#fff',cursor:'pointer',fontSize:'.75rem',
                    opacity:idx===0?0.3:1}}>▲</button>
                <button onClick={()=>turunItem(idx)} disabled={idx>=curItems.length-1}
                  style={{padding:'4px 6px',borderRadius:5,border:'1px solid var(--border)',
                    background:'#fff',cursor:'pointer',fontSize:'.75rem',
                    opacity:idx>=curItems.length-1?0.3:1}}>▼</button>
                <button onClick={()=>{setEditIdx(idx);setEditVal(item);}}
                  style={{padding:'4px 8px',borderRadius:5,border:'1px solid #d97706',
                    background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:'.75rem'}}>✏️</button>
                <button onClick={()=>hapusItem(idx)}
                  style={{padding:'4px 8px',borderRadius:5,border:'1px solid #fca5a5',
                    background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.75rem'}}>🗑️</button>
              </div>
            </div>
          ))}
        </div>

        {/* Tambah item baru */}
        <div style={{display:'flex',gap:8,alignItems:'flex-start',
          padding:'12px 14px',background:'#f0fdf4',borderRadius:9,
          border:'1.5px dashed #86efac'}}>
          <textarea rows={2} value={newItem} onChange={e=>setNewItem(e.target.value)}
            placeholder="Tulis item penilaian baru..."
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();tambahItem();}}}
            style={{flex:1,padding:'6px 8px',border:'1.5px solid #86efac',
              borderRadius:7,fontSize:'.82rem',fontFamily:'inherit',
              resize:'vertical',outline:'none',background:'#fff'}}/>
          <button onClick={tambahItem} className="btn btn-primary btn-sm"
            style={{background:'#16a34a',borderColor:'#16a34a',marginTop:2}}>
            ＋ Tambah
          </button>
        </div>

        {/* Simpan */}
        <div style={{marginTop:14,display:'flex',justifyContent:'flex-end'}}>
          <button onClick={()=>simpan(null)} className="btn btn-primary" disabled={saving}>
            {saving?'⏳ Menyimpan...':'💾 Simpan Perubahan'}
          </button>
        </div>
      </div>
    </div>
  );
}

function TabelPenilaian({items, prefix, skor, onChange, catatan, setCatatan, label}) {
  const total = skor.reduce((a,b)=>a+(b||0),0);
  const max   = items.length * 3;
  const pct   = max > 0 ? (total/max*100) : 0;
  const pred  = PREDIKAT(pct);
  const warna = pct>=87.5?'#16a34a':pct>=75?'#2563eb':pct>=62.5?'#d97706':'#dc2626';

  return (
    <div className="card" style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>

            Skor: <b style={{color:warna}}>{total}/{max}</b>

          <span style={{padding:'3px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:700,
            background:pct>=87.5?'#d1fae5':pct>=75?'#dbeafe':pct>=62.5?'#fef3c7':'#fee2e2',
            color:pct>=87.5?'#065f46':pct>=75?'#1d4ed8':pct>=62.5?'#92400e':'#991b1b'}}>
            {pred} ({pct.toFixed(1)}%)
          </span>
        </div>
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.8rem',minWidth:500}}>
          <thead>
            <tr style={{background:'var(--p3)',color:'#fff'}}>
              <th style={{padding:'7px 10px',textAlign:'left',width:32}}>No</th>
              <th style={{padding:'7px 10px',textAlign:'left'}}>Aspek Penilaian</th>
              <th style={{padding:'7px 10px',textAlign:'center',width:140}}>Skor (0-3)</th>
            </tr>
          </thead>
          <tbody>
            {items.map((item, i) => (
              <tr key={i} style={{borderBottom:'1px solid var(--border)',background:i%2?'var(--surface2)':'#fff'}}>
                <td style={{padding:'8px 10px',color:'var(--text3)',verticalAlign:'top'}}>{i+1}</td>
                <td style={{padding:'8px 10px',lineHeight:1.5}}>{item}</td>

                  <SkorBtns value={skor[i]||0} onChange={v => onChange(i, v)} />

              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr style={{background:'var(--surface2)'}}>
              <td colSpan={2} style={{padding:'8px 10px',fontWeight:700,textAlign:'right',fontSize:'.8rem'}}>
                Total Skor:
              </td>
              <td style={{padding:'8px 10px',textAlign:'center',fontWeight:900,
                fontSize:'1rem',color:warna}}>{total}/{max}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div className="form-group" style={{margin:0}}>
          <label>Catatan / Temuan</label>
          <textarea rows={2} value={catatan.c||''} 
            onChange={e=>setCatatan({...catatan,c:e.target.value})}
            style={{fontSize:'.78rem',resize:'vertical'}}

            style={{fontSize:'.78rem',resize:'vertical'}}
            placeholder="Rekomendasi pembinaan..."/>
        </div>
      </div>
    </div>
  );
}

function FormSupervisi({guru, sesi, showToast, onSelesai, onBatal, filterSmt='Ganjil', filterTA='2025/2026', jadwal=null}) {
  const [tab, setTab]   = useState('identitas');
  const [saving, setSaving] = useState(false);

  // Identitas
  const [tanggal, setTanggal]   = useState(jadwal&&jadwal.tanggal ? jadwal.tanggal : new Date().toISOString().split('T')[0]);
  const [kelas, setKelas]       = useState(jadwal?jadwal.kelas:'');
  const [semester, setSemester]     = useState(filterSmt);
  const [tahunAjaran, setTahunAjaran] = useState(filterTA);
  const [jtm, setJtm]           = useState('');
  const [jurusan, setJurusan]   = useState('');
  const [namaSupervisor, setNamaSupervisor] = useState(sesi.pengguna.nama||'');
  const [nipSupervisor, setNipSupervisor]   = useState(sesi.pengguna.nip||'');
  const [jabatanSup, setJabatanSup]         = useState(sesi.pengguna.jabatan||'');

  // Skor
  // Gunakan instrumen custom jika ada, fallback ke default
  const instrumen = sesi.mad?.instrumen_custom || {};
  const itemsP = instrumen.perencanaan && instrumen.perencanaan.length ? instrumen.perencanaan : P_ITEMS;
  const itemsL = instrumen.pelaksanaan && instrumen.pelaksanaan.length ? instrumen.pelaksanaan : L_ITEMS;
  const itemsA = instrumen.asesmen    && instrumen.asesmen.length    ? instrumen.asesmen    : A_ITEMS;

  const [skorP, setSkorP] = useState(Array(itemsP.length).fill(0));
  const [skorL, setSkorL] = useState(Array(itemsL.length).fill(0));
  const [skorA, setSkorA] = useState(Array(itemsA.length).fill(0));

  // Catatan
  const [catP, setCatP] = useState({c:'',r:''});
  const [catL, setCatL] = useState({c:'',r:''});
  const [catA, setCatA] = useState({c:'',r:''});

  // Hitung capaian
  const capP = (skorP.reduce((a,b)=>a+b,0)/(itemsP.length*3)*100);
  const capL = (skorL.reduce((a,b)=>a+b,0)/(itemsL.length*3)*100);
  const capA = (skorA.reduce((a,b)=>a+b,0)/(itemsA.length*3)*100);
  const capRata = ((capP+capL+capA)/3);

  function setSkorLItem(i,v){ const s=[...skorL]; s[i]=v; setSkorL(s); }

        rows += '<tr><td style="text-align:center">'+(i+1)+'</td><td>'+item+'</td><td style="text-align:center">'+btns+'</td><td style="text-align:center;font-weight:700">'+(+skors[i]||0)+'</td></tr>';
      });
      const catRow = (cat||rek) ? '<tr><td colspan="4" style="font-size:9pt"><b>Catatan:</b> '+(cat||'—')+'<br><b>Rekomendasi:</b> '+(rek||'—')+'</td></tr>' : '';
      return '<table><tr><th colspan="4" style="background:#0f4238;color:#fff">'+no+'. KOMPONEN '+title.toUpperCase()+' — Skor: '+total+'/'+max+' ('+cap.toFixed(1)+'%) — '+PREDIKAT(cap)+'</th></tr>'+
        '<tr style="background:#f5f5f5"><th width="5%">No</th><th>Aspek Penilaian</th><th width="20%">Skor (0-3)</th><th width="10%">Nilai</th></tr>'+
        rows+
        '<tr style="background:#f0f0f0"><td colspan="2" style="text-align:right;font-weight:700">Total:</td><td style="text-align:center;font-weight:900">'+total+'/'+max+'</td><td style="text-align:center;font-weight:900;color:#0f4238">'+cap.toFixed(1)+'%</td></tr>'+
        catRow+'</table>';
    }
    
    function buildRTL() {
      var REKS = {
        'Merumuskan tujuan pembelajaran berbasis KBC':'Ikuti workshop KBC. Gunakan format A-B-C-D.',
        'Menyusun indikator capaian berbasis kompetensi':'Studi CP/TP/ATP terbaru. Konsultasi pengawas.',
        'Merancang materi ajar kontekstual dan bermakna':'Kembangkan materi berbasis konteks lokal Aceh.',
        'Memilih metode pembelajaran yang tepat':'Variasikan metode aktif learning.',
        'Menyiapkan media/sumber belajar yang relevan':'Manfaatkan teknologi digital.',
        'Merancang aktivitas KBC (mengetahui, memahami, mengaplikasi, merefleksi)':'Rancang aktivitas 4M dalam setiap RPP.',
        'Menyusun instrumen penilaian formatif':'Susun instrumen formatif tiap pertemuan.',
        'Mengintegrasikan nilai karakter Islam dalam pembelajaran':'Cantumkan nilai Islam dalam RPP.',
        'Merancang diferensiasi untuk keberagaman peserta didik':'Rancang diferensiasi konten, proses, produk.',
        'Membuka pembelajaran dengan apersepsi bermakna':'Gunakan pertanyaan pemantik kontekstual.',
        'Menyampaikan tujuan dan manfaat pembelajaran':'Sampaikan tujuan dengan bahasa mudah.',
        'Mengaitkan materi dengan konteks kehidupan nyata':'Gunakan contoh kehidupan sehari-hari.',
        'Memfasilitasi aktivitas MENGETAHUI (penguatan konsep)':'Gunakan brainstorming atau mind mapping.',
        'Memfasilitasi aktivitas MEMAHAMI (pendalaman makna)':'Gunakan diskusi kelompok atau studi kasus.',
        'Memfasilitasi aktivitas MENGAPLIKASI (penerapan)':'Rancang tugas proyek atau simulasi nyata.',
        'Memfasilitasi aktivitas MEREFLEKSI (evaluasi diri)':'Gunakan jurnal belajar atau kartu refleksi.',
        'Mendorong interaksi aktif antar peserta didik':'Terapkan pembelajaran kooperatif.',
        'Memberikan umpan balik konstruktif':'Berikan umpan balik segera dan spesifik.',
        'Mengintegrasikan nilai-nilai Islam (akhlak, adab)':'Sisipkan nilai akhlak/adab secara kontekstual.',
        'Menggunakan media/teknologi secara efektif':'Integrasikan media digital secara bertahap.',
        'Mengelola waktu pembelajaran dengan baik':'Buat alokasi waktu detail per aktivitas.',
        'Menyesuaikan pendekatan dengan kebutuhan peserta didik':'Terapkan diferensiasi proses.',
        'Menutup pembelajaran dengan refleksi dan penguatan':'Gunakan exit ticket atau one sentence summary.',
        'Melaksanakan penilaian formatif selama pembelajaran':'Gunakan observasi dan pertanyaan lisan.',
        'Menggunakan instrumen penilaian yang beragam':'Kembangkan rubrik, portofolio, tes lisan.',
        'Memberikan umpan balik terhadap hasil belajar':'Berikan umpan balik dalam 1x24 jam.',
        'Mendorong peserta didik melakukan penilaian diri':'Latih peserta didik menilai karya sendiri.',
        'Menggunakan hasil asesmen untuk perbaikan pembelajaran':'Analisis asesmen untuk remedial dan pengayaan.',
        'Mencatat perkembangan belajar peserta didik':'Buat jurnal/catatan anekdot secara tertib.',
        'Mengintegrasikan penilaian karakter dalam asesmen':'Kembangkan rubrik penilaian akhlak/karakter.'
      };
      var items = [];
      [[P_ITEMS,skorP,'Perencanaan'],[L_ITEMS,skorL,'Pelaksanaan'],[A_ITEMS,skorA,'Asesmen']].forEach(function(x){
        x[0].forEach(function(s,i){ if((+x[1][i]||0)<=1 && x[0][i]) items.push({komp:x[2],aspek:x[0][i],skor:+x[1][i]||0}); });
      });
      if(!items.length) return '<p style="padding:10px;background:#f0fdf4;border:1px solid #86efac;border-radius:6px;font-size:10pt">' +
        '✅ Tidak ada aspek dengan skor rendah. Pertahankan kualitas pembelajaran!</p>';
      var rows = '';
      items.forEach(function(r,i){
        var w = r.skor===0?'#dc2626':'#d97706';
        rows += '<tr>' +
          '<td style="border:1px solid #000;padding:5px 8px;text-align:center">'+(i+1)+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px">'+r.komp+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px">'+r.aspek+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px;text-align:center;font-weight:700;color:'+w+'">'+r.skor+'</td>' +
          '<td style="border:1px solid #000;padding:5px 8px">'+(REKS[r.aspek]||'Perlu pembinaan lebih lanjut.')+'</td></tr>';
      });
      return '<table style="width:100%;border-collapse:collapse;font-size:9.5pt">' +
        '<tr style="background:#0f4238;color:#fff">' +
        '<th style="padding:5px 8px;width:4%">No</th>' +
        '<th style="padding:5px 8px;width:15%">Komponen</th>' +
        '<th style="padding:5px 8px">Aspek yang Perlu Ditingkatkan</th>' +
        '<th style="padding:5px 8px;width:8%;text-align:center">Skor</th>' +
        '<th style="padding:5px 8px;width:30%">Rekomendasi</th></tr>' +
        rows + '</table>';
    }

    function buildRekap() {
      const rows = [
        {l:'Perencanaan',s:skorP.reduce((a,b)=>a+b,0),m:itemsP.length*3,c:capP},
        {l:'Pelaksanaan',s:skorL.reduce((a,b)=>a+b,0),m:itemsL.length*3,c:capL},
        {l:'Asesmen',    s:skorA.reduce((a,b)=>a+b,0),m:itemsA.length*3,c:capA},
      ].map(r=>'<tr><td><b>'+r.l+'</b></td><td style="text-align:center">'+r.s+'/'+r.m+'</td>'+
        '<td><div style="background:#e5e7eb;border-radius:4px;height:14px;overflow:hidden"><div style="width:'+r.c+'%;height:100%;background:'+(r.c>=87.5?'#16a34a':r.c>=75?'#2563eb':r.c>=62.5?'#d97706':'#dc2626')+'"></div></div></td>'+
        '<td style="text-align:center;font-weight:700;color:'+(r.c>=87.5?'#16a34a':r.c>=75?'#2563eb':r.c>=62.5?'#d97706':'#dc2626')+'">'+r.c.toFixed(1)+'%</td>'+
        '<td style="text-align:center"><b>'+PREDIKAT(r.c)+'</b></td></tr>').join('');
      return '<table><tr><th colspan="5" style="background:#0f4238;color:#fff">REKAPITULASI CAPAIAN SUPERVISI PEMBELAJARAN</th></tr>'+
        '<tr style="background:#f5f5f5"><th>Komponen</th><th>Skor</th><th width="30%">Capaian</th><th>%</th><th>Predikat</th></tr>'+
        rows+
        '<tr style="background:#f0fdf4;border-top:2px solid #0f4238"><td><b>RATA-RATA</b></td><td></td>'+
        '<td><div style="background:#e5e7eb;border-radius:4px;height:14px;overflow:hidden"><div style="width:'+capRata+'%;height:100%;background:'+(capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626')+'"></div></div></td>'+
        '<td style="text-align:center;font-weight:900;font-size:11pt;color:'+(capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626')+'">'+capRata.toFixed(1)+'%</td>'+
        '<td style="text-align:center;font-weight:900;font-size:11pt">'+PREDIKAT(capRata)+'</td></tr></table>';
    }
    
    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan Supervisi</title>'+
    '<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Times New Roman,serif;font-size:11pt;padding:20mm;color:#000}'+
    '.no-print{display:flex;gap:10px;margin-bottom:16px}@media print{.no-print{display:none!important}}'+
    '.kop{display:flex;align-items:center;gap:14px;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:14px}'+
    '.kop img{width:60px;height:60px;object-fit:contain}.kop-text .nama{font-size:14pt;font-weight:900;text-transform:uppercase}'+
    '.kop-text .sub{font-size:9pt}h2{text-align:center;font-size:12pt;text-transform:uppercase;margin:12px 0 4px}'+
    '.sub-judul{text-align:center;font-size:9pt;margin-bottom:14px;border-bottom:2px solid #000;padding-bottom:8px}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:10pt}th,td{border:1px solid #000;padding:5px 8px}'+
    'th{background:#f0f0f0;font-weight:700;text-align:center}.skor-btn{display:inline-block;width:22px;height:22px;border-radius:4px;'+
    'text-align:center;line-height:22px;font-weight:700;font-size:9pt;border:1px solid #999}.aktif{background:#0f4238;color:#fff}'+
    '.ttd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px;text-align:center;font-size:10pt}'+
    '.ttd-line{border-top:1.5px solid #000;margin-top:54px;padding-top:6px}'+
    '.footer{text-align:center;font-size:8pt;color:#666;margin-top:16px;border-top:1px solid #ccc;padding-top:8px}'+
    '</style></head><body>'+
    '<div class="no-print">'+
    '<button onclick="window.print()" style="padding:8px 20px;background:#0f4238;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700">🖨️ Cetak / PDF</button>'+
    '<button onclick="(function(){'+
      'var s=document.createElement(\'style\');'+
      's.textContent=\'@page{size:A4;margin:15mm}\';'+
      'document.head.appendChild(s);'+
      'window.print();'+
      'document.head.removeChild(s);'+
    '})()" style="padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700">'+
    '📥 Simpan PDF</button>'+
    '<button onclick="window.close()" style="padding:8px 14px;background:#eee;border:none;border-radius:6px;cursor:pointer">✕ Tutup</button>'+
    '</div>'+
    '<div class="kop">'+
    '<div class="kop-text" style="flex:1"><div class="nama">'+(mad.nama||'')+'</div>'+
    '<div class="sub">'+[mad.naungan,mad.alamat,[mad.kota_kab,mad.provinsi].filter(Boolean).join(', ')].filter(Boolean).join(' | ')+'</div></div></div>'+
    '<h2>Laporan Supervisi Pembelajaran</h2>'+
    '<div class="sub-judul">Berbasis PM-KBC &middot; KMA 1503/2025 &middot; Dirjenpendis 6077/2025</div>'+
    '<table><tr><th colspan="4" style="background:#0f4238;color:#fff">IDENTITAS SUPERVISI</th></tr>'+
    '<tr><td width="25%"><b>Nama Guru</b></td><td width="25%">'+guru.nama+'</td><td width="25%"><b>Tanggal</b></td><td>'+tgl+'</td></tr>'+
    '<tr><td><b>NIP/NUPTK</b></td><td>'+(guru.nip||'—')+'</td><td><b>Kelas/Semester</b></td><td>'+kelas+' / '+semester+'</td></tr>'+
    '<tr><td><b>Mata Pelajaran</b></td><td>'+(guru.mapel||'—')+'</td><td><b>JTM</b></td><td>'+jtm+' jam</td></tr>'+
    '<tr><td><b>Supervisor</b></td><td>'+(namaSupervisor||'—')+'</td><td><b>Jabatan</b></td><td>'+(jabatanSup||'—')+'</td></tr>'+
    '</table>'+
    buildKomponen('Perencanaan', itemsP, skorP, capP, catatanP, rekomendasiP, 1)+
    buildKomponen('Pelaksanaan', itemsL, skorL, capL, catatanL, rekomendasiL, 2)+
    buildKomponen('Asesmen', itemsA, skorA, capA, catatanA, rekomendasiA, 3)+
    buildRekap()+
    '<div class="ttd">'+
    '<div><div style="margin-bottom:4px">Yang Disupervisi,</div><div class="ttd-line"><b>'+guru.nama+'</b><br>NIP. '+(guru.nip||'—')+'</div></div>'+
    '<div><div style="margin-bottom:4px">Supervisor,</div><div style="font-size:9pt">('+jabatanSup+')</div><div class="ttd-line"><b>'+(namaSupervisor||'—')+'</b><br>NIP. '+(nipSupervisor||'—')+'</div></div>'+
    '<div><div style="margin-bottom:4px">Mengetahui,</div><div style="font-size:9pt">Kepala Madrasah</div><div class="ttd-line"><b>'+(mad.nama_kepala||'.....')+'</b><br>NIP. '+(mad.nip_kepala||'—')+'</div></div>'+
    '</div>'+
    '<div style="page-break-before:always;padding-top:10px">'+
    '<h3 style="text-align:center;font-size:11pt;text-transform:uppercase;margin:0 0 4px;font-weight:900">'+
    'Rekomendasi Tindak Lanjut (RTL)</h3>'+
    '<div style="text-align:center;font-size:9pt;color:#444;margin-bottom:12px;border-bottom:2px solid #000;padding-bottom:6px">'+
    'Aspek dengan skor ≤ 1 yang perlu pembinaan</div>'+
    buildRTL()+
    '</div>'+
    '<div class="footer">SUPERMAD &mdash; Supervisi Pembelajaran Madrasah PM-KBC &middot; '+(mad.nama||'')+'</div>'+
    '</body></html>';
    
    win.document.write(html);
    win.document.close();
  }


  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <button className="btn btn-outline btn-sm" onClick={onBatal||onSelesai}>← Kembali</button>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>
            Supervisi: {guru.nama}
          </div>
          <div style={{fontSize:'.75rem',color:'var(--text2)'}}>{guru.mapel} · {guru.status_kepeg}</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:8}}>
          <button className="btn btn-outline btn-sm" onClick={cetakLaporan}>🖨️ Cetak</button>
          <button className="btn btn-gold btn-sm" onClick={()=>simpan('draft')} disabled={saving}>
            💾 Draft
          </button>
          <button className="btn btn-primary btn-sm" onClick={()=>simpan('selesai')} disabled={saving}>
            {saving?'⏳...':'✅ Selesai'}
          </button>
        </div>
      </div>

      {/* Rekap mini */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:14}}>
        {[
          {label:'Perencanaan', val:capP, warna:capP>=87.5?'#16a34a':capP>=75?'#2563eb':capP>=62.5?'#d97706':'#dc2626'},
          {label:'Pelaksanaan', val:capL, warna:capL>=87.5?'#16a34a':capL>=75?'#2563eb':capL>=62.5?'#d97706':'#dc2626'},
          {label:'Asesmen',     val:capA, warna:capA>=87.5?'#16a34a':capA>=75?'#2563eb':capA>=62.5?'#d97706':'#dc2626'},
          {label:'Rata-rata',   val:capRata, warna:capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626'},
        ].map((k,i)=>(
          <div key={i} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:10,
            padding:'10px',textAlign:'center',borderTop:'3px solid '+k.warna}}>
            <div style={{fontSize:'1.1rem',fontWeight:900,color:k.warna}}>{k.val.toFixed(1)}%</div>
            <div style={{fontSize:'.68rem',color:'var(--text2)',marginTop:2}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Tab navigation */}
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)}
            style={{padding:'7px 14px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.78rem',fontFamily:'inherit',
              background:tab===t.key?'var(--p)':'var(--surface2)',
              color:tab===t.key?'#fff':'var(--text2)'}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* IDENTITAS */}
      {tab==='identitas' && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>📋 Identitas Supervisi</div>
          <div className="grid2">
            <div className="form-group">
              <label>Tanggal Supervisi</label>
              <input type="date" value={tanggal} onChange={e=>setTanggal(e.target.value)}/>
            </div>
            <div className="form-group">
              <label>Semester</label>
              <select value={semester} onChange={e=>setSemester(e.target.value)}>
                <option>Ganjil</option><option>Genap</option>
              </select>
            </div>
            <div className="form-group">
              <label>Kelas *</label>
              <input value={kelas} onChange={e=>setKelas(e.target.value)} placeholder="Contoh: IV A"/>
            </div>
            <div className="form-group">
              <label>JTM (Jam Tatap Muka)</label>
              <input type="number" value={jtm} onChange={e=>setJtm(e.target.value)} placeholder="24"/>
            </div>
            <div className="form-group">
              <label>Jurusan / Program</label>
              <input value={jurusan} onChange={e=>setJurusan(e.target.value)} placeholder="(opsional untuk MA)"/>
            </div>
          </div>
          <div style={{fontWeight:800,color:'var(--p3)',margin:'16px 0 12px'}}>👨‍💼 Identitas Supervisor</div>
          <div className="grid2">
            <div className="form-group">
              <label>Nama Supervisor</label>
              <input value={namaSupervisor} onChange={e=>setNamaSupervisor(e.target.value)}/>
            </div>
            <div className="form-group">
              <label>NIP Supervisor</label>
              <input value={nipSupervisor} onChange={e=>setNipSupervisor(e.target.value)}/>
            </div>
            <div className="form-group">
              <label>Jabatan Supervisor</label>
              <input value={jabatanSup} onChange={e=>setJabatanSup(e.target.value)}
                placeholder="Kepala Madrasah / Waka / Pengawas"/>
            </div>
          </div>
          <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={()=>setTab('perencanaan')}>
            Lanjut ke Perencanaan →
          </button>
        </div>
      )}

      {/* PERENCANAAN */}
      {tab==='perencanaan' && (
        <div>
          <TabelPenilaian label="📝 Komponen Perencanaan Pembelajaran (9 Item)"
            items={itemsP} skor={skorP} onChange={setSkorPItem}
            catatan={catP} setCatatan={setCatP}/>
          <button className="btn btn-primary btn-sm" onClick={()=>setTab('pelaksanaan')}>
            Lanjut ke Pelaksanaan →
          </button>
        </div>
      )}

      {/* PELAKSANAAN */}
      {tab==='pelaksanaan' && (
        <div>
          <TabelPenilaian label="🎯 Komponen Pelaksanaan Pembelajaran (14 Item)"
            items={itemsL} skor={skorL} onChange={setSkorLItem}
            catatan={catL} setCatatan={setCatL}/>
          <button className="btn btn-primary btn-sm" onClick={()=>setTab('asesmen')}>
            Lanjut ke Asesmen →
          </button>
        </div>
      )}

      {/* ASESMEN */}
      {tab==='asesmen' && (
        <div>
          <TabelPenilaian label="✅ Komponen Asesmen Pembelajaran (7 Item)"
            items={itemsA} skor={skorA} onChange={setSkorAItem}
            catatan={catA} setCatatan={setCatA}/>
          <button className="btn btn-primary btn-sm" onClick={()=>setTab('rekap')}>
            Lihat Rekap →
          </button>
        </div>
      )}

      {/* REKAP */}
      {tab==='rekap' && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16,fontSize:'.95rem'}}>
            📊 Rekapitulasi Hasil Supervisi
          </div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.85rem',marginBottom:16}}>
            <thead>
              <tr style={{background:'var(--p3)',color:'#fff'}}>
                {['Komponen','Skor','Capaian','Predikat'].map(h=>(
                  <th key={h} style={{padding:'8px 12px',textAlign:'left'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                {label:'Perencanaan',tot:skorP.reduce((a,b)=>a+b,0),max:P_ITEMS.length*3,cap:capP},
                {label:'Pelaksanaan',tot:skorL.reduce((a,b)=>a+b,0),max:L_ITEMS.length*3,cap:capL},
                {label:'Asesmen',    tot:skorA.reduce((a,b)=>a+b,0),max:A_ITEMS.length*3,cap:capA},
              ].map((row,i)=>{
                const w=row.cap>=87.5?'#16a34a':row.cap>=75?'#2563eb':row.cap>=62.5?'#d97706':'#dc2626';
                return (
                  <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'9px 12px',fontWeight:600}}>{row.label}</td>
                    <td style={{padding:'9px 12px',fontFamily:'monospace'}}>{row.tot}/{row.max}</td>
                    <td style={{padding:'9px 12px',fontWeight:700,color:w}}>{row.cap.toFixed(1)}%</td>
                    <td style={{padding:'9px 12px'}}>
                      <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:700,
                        background:row.cap>=87.5?'#d1fae5':row.cap>=75?'#dbeafe':row.cap>=62.5?'#fef3c7':'#fee2e2',
                        color:row.cap>=87.5?'#065f46':row.cap>=75?'#1d4ed8':row.cap>=62.5?'#92400e':'#991b1b'}}>
                        {PREDIKAT(row.cap)}
                      </span>
                    </td>
                  </tr>
                );
              })}
              <tr style={{background:'#f0fdf4',borderTop:'2px solid var(--p)'}}>
                <td style={{padding:'10px 12px',fontWeight:800}}>Rata-rata</td>
                <td></td>
                <td style={{padding:'10px 12px',fontWeight:900,fontSize:'1.1rem',
                  color:capRata>=87.5?'#16a34a':capRata>=75?'#2563eb':capRata>=62.5?'#d97706':'#dc2626'}}>
                  {capRata.toFixed(1)}%
                </td>
                <td style={{padding:'10px 12px'}}>
                  <span style={{padding:'3px 12px',borderRadius:20,fontSize:'.78rem',fontWeight:800,
                    background:capRata>=87.5?'#d1fae5':capRata>=75?'#dbeafe':capRata>=62.5?'#fef3c7':'#fee2e2',
                    color:capRata>=87.5?'#065f46':capRata>=75?'#1d4ed8':capRata>=62.5?'#92400e':'#991b1b'}}>
                    {PREDIKAT(capRata)}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" onClick={cetakLaporan}>🖨️ Cetak Laporan</button>
            <button className="btn btn-gold btn-sm" onClick={()=>simpan('draft')} disabled={saving}>
              💾 Simpan Draft
            </button>
            <button className="btn btn-primary" onClick={()=>simpan('selesai')} disabled={saving}>
              {saving?'⏳ Menyimpan...':'✅ Simpan & Selesai'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── RENDER ─────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
