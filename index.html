<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SUPERMAD — Supervisi Pembelajaran Madrasah</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#1a6b5c;--p2:#155a4c;--p3:#0f4238;
  --g:#d4a017;--surface:#fff;--surface2:#f8faf9;
  --border:#e2ebe8;--text1:#1a2e2a;--text2:#4a6b63;--text3:#8aada6;
  --red:#dc2626;--red-l:#fef2f2;--green:#16a34a;
  --radius:12px;
}
body{font-family:'Segoe UI',sans-serif;background:var(--surface2);color:var(--text1);min-height:100vh}
.btn{padding:10px 20px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--p);color:#fff}
.btn-primary:hover{background:var(--p2)}
.btn-gold{background:var(--g);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--p);color:var(--p)}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:20px}
.badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge-baik{background:#d1fae5;color:#065f46}
.badge-cukup{background:#fef3c7;color:#92400e}
.badge-kurang{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:.87rem;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
label{display:block;font-size:.76rem;font-weight:700;color:var(--text2);margin-bottom:4px}
.form-group{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;font-weight:600;font-size:.82rem;z-index:9999;animation:slideIn .3s ease}
.toast-success{background:#f0fdf4;color:#166534;border:1.5px solid #86efac}
.toast-warning{background:#fffbeb;color:#92400e;border:1.5px solid #fcd34d}
.toast-error{background:#fef2f2;color:#991b1b;border:1.5px solid #fca5a5}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useCallback } = React;

// ── SUPABASE CONFIG ────────────────────────────────────────────
const SUPA_URL = 'https://djnbttyjyzknujrepdfe.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbmJ0dHlqeXprbnVqcmVwZGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1Mzc3MDksImV4cCI6MjEwMjExMzcwOX0.UfrTknQM7EU_3BiSGBy9bPtOeXh5u14X4ujRNxRlYcM';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── HEARTBEAT — Pengetuk Hati Supabase 💓 ──────────────────
// Ping setiap 4 menit agar koneksi tetap hidup
setInterval(async () => {
  try {
    await sb.from('supermad_madrasah').select('id').limit(1);
    console.log('💓 Heartbeat:', new Date().toLocaleTimeString('id-ID'));
  } catch(e) {
    console.warn('💔 Heartbeat gagal:', e.message);
  }
}, 4 * 60 * 1000);

// ── TOAST ──────────────────────────────────────────────────────
function Toast({msg, type, onClose}) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  return <div className={`toast toast-${type}`}>{msg}</div>;
}

// ── LOADING ────────────────────────────────────────────────────
function Loading({text='Memuat...'}) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'60vh',gap:16}}>
      <div style={{width:48,height:48,border:'4px solid var(--border)',borderTopColor:'var(--p)',borderRadius:'50%',animation:'spin 1s linear infinite'}}></div>
      <div style={{color:'var(--text2)',fontSize:'.88rem'}}>{text}</div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

// ── HALAMAN LOGIN ──────────────────────────────────────────────
// Komponen live lookup nama madrasah saat ketik NPSN
function NamaMadrasah({npsn}) {
  const [nama, setNama] = React.useState('');
  const [loading, setLoading] = React.useState(true);
  React.useEffect(()=>{
    setLoading(true); setNama('');
    if (!npsn || npsn.length < 8) return;
    sb.from('supermad_madrasah').select('nama,kota_kab,jenjang')
      .eq('npsn', npsn.trim()).maybeSingle()
      .then(({data})=>{
        setNama(data ? data.nama : 'NPSN tidak ditemukan');
        setLoading(false);
      });
  }, [npsn]);
  if (loading) return <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>⏳ Mencari...</div>;
  if (!nama || nama==='NPSN tidak ditemukan') return null;
  return (
    <div style={{marginTop:6,padding:'6px 10px',borderRadius:7,
      background:'#f0fdf4',border:'1px solid #86efac',
      fontSize:'.78rem',fontWeight:700,color:'#065f46'}}>
      🏫 {nama}
    </div>
  );
}

function HalamanLogin({onLogin}) {
  // Deteksi URL ?kanwil untuk akses tersembunyi
  const isKanwilMode = typeof window !== 'undefined' && 
    (window.location.search.includes('kanwil') || 
     window.location.hash.includes('kanwil'));
  const [mode, setMode]     = useState(isKanwilMode ? 'kanwil' : 'pilih');
  const [token, setToken]   = useState('');
  const [npsn, setNpsn]     = useState('');
  const [kode, setKode]     = useState('');
  const [user, setUser]     = useState('');
  const [pass, setPass]     = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr]       = useState('');

  async function loginMadrasah(e) {
    e.preventDefault();
    setErr(''); setLoading(true);
    try {
      // Cari madrasah berdasarkan NPSN dulu
      const {data:madList, error:e1} = await sb.from('supermad_madrasah')
        .select('*').eq('npsn', npsn.trim()).eq('aktif', true);
      if (e1) { setErr('Error: '+e1.message); return; }
      if (!madList || madList.length === 0) { setErr('NPSN tidak ditemukan.'); return; }
      const mad = madList[0];
      // Cek kode akses (case-insensitive)
      if (mad.kode_akses.toLowerCase() !== kode.trim().toLowerCase()) {
        setErr('Kode akses salah.');
        return;
      }
      // Ambil daftar pengguna madrasah ini
      const {data:penggunaList} = await sb.from('supermad_pengguna')
        .select('*').eq('madrasah_id', mad.id).eq('aktif', true).order('nama');
      onLogin({mad, penggunaList, mode:'madrasah'});
    } catch(err) {
      setErr('Koneksi gagal: '+err.message);
    } finally { setLoading(false); }
  }

  async function loginGuru(e) {
    e.preventDefault();
    setErr(''); setLoading(true);
    try {
      // Cari madrasah
      const {data:madList} = await sb.from('supermad_madrasah')
        .select('*').eq('npsn', npsn.trim());
      if (!madList||!madList.length) { setErr('NPSN tidak ditemukan.'); return; }
      const mad = madList[0];
      // Cari guru berdasarkan token
      const {data:guruList} = await sb.from('supermad_guru')
        .select('*').eq('madrasah_id', mad.id).eq('token', token.trim()).eq('aktif', true);
      if (!guruList||!guruList.length) { setErr('Token tidak valid.'); return; }
      const guru = guruList[0];
      onLogin({mode:'guru', mad, guru});
    } catch(err) {
      setErr('Error: '+err.message);
    } finally { setLoading(false); }
  }

  async function loginKanwil(e) {
    e.preventDefault();
    setErr(''); setLoading(true);
    try {
      const {data:uList, error:e1} = await sb.from('supermad_pengguna')
        .select('*').eq('username', user.trim()).eq('role','admin_kanwil');
      if (e1) { setErr('Error: '+e1.message); return; }
      if (!uList || uList.length === 0) { setErr('Username tidak ditemukan.'); return; }
      const u = uList[0];
      // password_hash di DB = md5(password) yang dihasilkan PostgreSQL
      // Kita verifikasi dengan query langsung ke DB
      const {data:verified} = await sb.rpc('supermad_cek_password', {
        p_id: u.id, p_pass: pass.trim()
      });
      if (!verified) { setErr('Password salah.'); return; }
      onLogin({pengguna:u, mode:'kanwil'});
    } catch(err) {
      setErr('Koneksi gagal: '+err.message);
    } finally { setLoading(false); }
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      background:'linear-gradient(135deg,#063d35,#0e7c6e)',padding:16}}>
      <div style={{background:'#fff',borderRadius:18,padding:'32px 28px',width:'100%',maxWidth:420,
        boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        {/* Logo */}
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:'2.5rem',marginBottom:8}}>🏫</div>
          <div style={{fontWeight:900,fontSize:'1.4rem',color:'var(--p3)'}}>SUPERMAD</div>
          <div style={{fontSize:'.76rem',color:'var(--text2)',marginTop:4}}>
            Supervisi Pembelajaran Madrasah PM-KBC
          </div>
        </div>

        {mode === 'pilih' && (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <button className="btn btn-primary" style={{justifyContent:'center',padding:'14px'}}
              onClick={() => setMode('madrasah')}>
              🏫 Login Madrasah
            </button>
            <button className="btn btn-outline" style={{justifyContent:'center',padding:'14px',
              borderColor:'var(--g)',color:'var(--g)'}}
              onClick={() => setMode('guru')}>
              👨‍🏫 Login Guru (Token)
            </button>
            {/* Kanwil login tersembunyi - akses via URL ?kanwil */}
            <div style={{textAlign:'center',fontSize:'.72rem',color:'var(--text3)',marginTop:8}}>
              KMA 1503/2025 · Dirjenpendis 6077/2025
            </div>
          </div>
        )}

        {mode === 'madrasah' && (
          <form onSubmit={loginMadrasah}>
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16,fontSize:'.9rem'}}>
              🏫 Login Madrasah
            </div>
            <div className="form-group">
              <label>NPSN Madrasah *</label>
              <input value={npsn} onChange={e=>setNpsn(e.target.value)} placeholder="8 digit NPSN" maxLength={8} required/>
              {npsn.length===8 && <NamaMadrasah npsn={npsn.trim()}/>}
            </div>
            <div className="form-group">
              <label>Kode Akses *</label>
              <input type="password" value={kode} onChange={e=>setKode(e.target.value)} placeholder="Kode akses madrasah" required/>
            </div>
            {err && <div style={{color:'var(--red)',fontSize:'.78rem',marginBottom:10}}>⚠️ {err}</div>}
            <button className="btn btn-primary" type="submit" disabled={loading} style={{width:'100%',justifyContent:'center'}}>
              {loading ? '⏳ Memeriksa...' : '🔓 Masuk'}
            </button>
            <button type="button" className="btn btn-outline" style={{width:'100%',justifyContent:'center',marginTop:8}}
              onClick={()=>{setMode('pilih');setErr('')}}>← Kembali</button>
          </form>
        )}

        {mode === 'guru' && (
          <form onSubmit={loginGuru}>
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16,fontSize:'1rem'}}>
              👨‍🏫 Login Guru
            </div>
            <div className="form-group">
              <label>NPSN Madrasah</label>
              <input value={npsn} onChange={e=>setNpsn(e.target.value)}
                placeholder="8 digit NPSN" maxLength={8} required autoFocus/>
            </div>
            <div className="form-group">
              <label>Token Guru (6 digit)</label>
              <input value={token} onChange={e=>setToken(e.target.value)}
                placeholder="Lihat token di daftar guru"
                maxLength={6} style={{fontFamily:'monospace',fontSize:'1.2rem',letterSpacing:4}}
                required/>
            </div>
            {err && <div style={{color:'var(--red)',fontSize:'.78rem',marginBottom:10}}>⚠️ {err}</div>}
            <button className="btn btn-primary" type="submit" disabled={loading}
              style={{width:'100%',marginBottom:10}}>
              {loading?'⏳ Memverifikasi...':'🔑 Masuk sebagai Guru'}
            </button>
            <button type="button" className="btn btn-outline"
              style={{width:'100%'}} onClick={()=>{setMode('pilih');setErr('');}}>
              ← Kembali
            </button>
          </form>
        )}

        {mode === 'kanwil' && (
          <form onSubmit={loginKanwil}>
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16,fontSize:'.9rem'}}>
              🏛️ Login Admin Kanwil
            </div>
            <div className="form-group">
              <label>Username *</label>
              <input value={user} onChange={e=>setUser(e.target.value)} placeholder="Username admin" required/>
            </div>
            <div className="form-group">
              <label>Password *</label>
              <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password" required/>
            </div>
            {err && <div style={{color:'var(--red)',fontSize:'.78rem',marginBottom:10}}>⚠️ {err}</div>}
            <button className="btn btn-primary" type="submit" disabled={loading} style={{width:'100%',justifyContent:'center'}}>
              {loading ? '⏳ Memeriksa...' : '🔓 Masuk'}
            </button>
            <button type="button" className="btn btn-outline" style={{width:'100%',justifyContent:'center',marginTop:8}}
              onClick={()=>{setMode('pilih');setErr('')}}>← Kembali</button>
          </form>
        )}
      </div>
    </div>
  );
}

// ── PILIH PENGGUNA (setelah login madrasah) ────────────────────
function PilihPengguna({mad, penggunaList, onPilih, onBack}) {
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      background:'linear-gradient(135deg,#063d35,#0e7c6e)',padding:16}}>
      <div style={{background:'#fff',borderRadius:18,padding:'28px 24px',width:'100%',maxWidth:400,
        boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontWeight:900,fontSize:'1rem',color:'var(--p3)'}}>{mad.nama}</div>
          <div style={{fontSize:'.76rem',color:'var(--text2)',marginTop:4}}>Pilih akun Anda</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {penggunaList.map(p => (
            <button key={p.id} onClick={() => onPilih(p)}
              style={{padding:'12px 16px',background:'var(--surface2)',border:'1.5px solid var(--border)',
                borderRadius:10,cursor:'pointer',textAlign:'left',transition:'all .15s'}}
              onMouseOver={e=>e.currentTarget.style.borderColor='var(--p)'}
              onMouseOut={e=>e.currentTarget.style.borderColor='var(--border)'}>
              <div style={{fontWeight:700,fontSize:'.88rem',color:'var(--text1)'}}>{p.nama}</div>
              <div style={{fontSize:'.72rem',color:'var(--text2)',marginTop:2}}>
                {p.jabatan} · {p.role === 'operator' ? 'Operator' : 'Supervisor'}
              </div>
            </button>
          ))}
          {!penggunaList.length && (
            <div style={{textAlign:'center',color:'var(--text3)',fontSize:'.82rem',padding:20}}>
              Belum ada pengguna terdaftar.<br/>Hubungi Admin Kanwil.
            </div>
          )}
        </div>
        <button className="btn btn-outline" style={{width:'100%',justifyContent:'center',marginTop:14}}
          onClick={onBack}>← Ganti Madrasah</button>
      </div>
    </div>
  );
}

// ── APP UTAMA ──────────────────────────────────────────────────
function App() {
  // Restore sesi dari localStorage saat pertama load
  const [sesi, setSesi]   = useState(()=>{
    try {
      const saved = localStorage.getItem('supermad_sesi');
      if (!saved) return null;
      const parsed = JSON.parse(saved);
      // Validasi: harus punya pengguna dan mode
      if (!parsed.pengguna || !parsed.mode) return null;
      return parsed;
    } catch(e) { return null; }
  });
  const [step, setStep]   = useState(()=>{
    try {
      const saved = localStorage.getItem('supermad_sesi');
      if (!saved) return 'login';
      const parsed = JSON.parse(saved);
      if (!parsed.pengguna || !parsed.mode) return 'login';
      return 'app';
    } catch(e) { return 'login'; }
  });
  const [loginData, setLoginData] = useState(null);
  const [toast, setToast] = useState(null);

  function showToast(msg, type='success') {
    setToast({msg, type, key: Date.now()});
  }

  // Refresh data madrasah dari DB saat restore dari localStorage
  React.useEffect(() => {
    if (sesi && sesi.mad && sesi.mad.id) {
      sb.from('supermad_madrasah').select('*').eq('id', sesi.mad.id).single()
        .then(({data}) => {
          if (data) setSesi(prev => ({...prev, mad: data}));
        }).catch(()=>{});
    }
  }, []);

  function handleLogin(data) {
    if (data.mode === 'kanwil') {
      const s = {pengguna: data.pengguna, mad: null, mode: 'admin_kanwil'};
      setSesi(s); setStep('app');
      try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
    } else if (data.mode === 'guru') {
      const s = {pengguna: {...data.guru, role:'guru', nama:data.guru.nama}, mad: data.mad, mode: 'guru'};
      setSesi(s); setStep('app');
      try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
    } else {
      setLoginData(data);
      setStep('pilih_pengguna');
    }
  }

  function handlePilihPengguna(pengguna) {
    const s = {pengguna, mad: loginData.mad, mode: pengguna.role};
    setSesi(s); setStep('app');
    try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
  }

  function logout() {
    setSesi(null); setLoginData(null); setStep('login');
    try { localStorage.removeItem('supermad_sesi'); } catch(e) {}
  }

  if (step === 'login') return <HalamanLogin onLogin={handleLogin} />;
  if (step === 'pilih_pengguna') return (
    <PilihPengguna
      mad={loginData.mad}
      penggunaList={loginData.penggunaList}
      onPilih={handlePilihPengguna}
      onBack={() => setStep('login')}
    />
  );

  // ── APLIKASI UTAMA ─────────────────────────────────────────
  return (
    <div style={{minHeight:'100vh'}}>
      {/* TOPBAR */}
      <div style={{background:'var(--p3)',color:'#fff',
        position:'sticky',top:0,zIndex:100}}>
        {/* Baris atas: Logo Kemenag + Nama Madrasah */}
        <div style={{padding:'8px 20px',background:'rgba(0,0,0,0.15)',
          display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid rgba(255,255,255,0.1)'}}>
          {sesi.mad && sesi.mad.logo_url
            ? <img src={sesi.mad.logo_url} alt="Logo Madrasah"
                style={{width:40,height:40,objectFit:'contain',flexShrink:0,
                  borderRadius:4,background:'rgba(255,255,255,0.15)',padding:2}}/>
            : <div style={{width:40,height:40,flexShrink:0,display:'flex',
                alignItems:'center',justifyContent:'center',
                background:'rgba(255,255,255,0.15)',borderRadius:'50%',
                fontSize:'1.5rem'}}>🏫</div>
          }
          <div>
            <div style={{fontSize:'.68rem',opacity:.7,letterSpacing:.5}}>
              KEMENTERIAN AGAMA REPUBLIK INDONESIA
            </div>
            <div style={{fontWeight:800,fontSize:'.82rem'}}>
              {sesi.mad
                ? sesi.mad.nama.toUpperCase()
                : 'KANTOR WILAYAH PROVINSI ACEH'}
            </div>
            {sesi.mad && sesi.mad.kota_kab && (
              <div style={{fontSize:'.65rem',opacity:.7}}>
                {sesi.mad.naungan||'Kemenag'} · {sesi.mad.kota_kab}
                {sesi.mad.npsn ? ' · NPSN: '+sesi.mad.npsn : ''}
              </div>
            )}
          </div>
        </div>
        {/* Baris bawah: SUPERMAD nav */}
        <div style={{padding:'8px 20px',
          display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:'1.1rem'}}>📋</span>
          <div>
            <div style={{fontWeight:900,fontSize:'.85rem'}}>SUPERMAD</div>
            <div style={{fontSize:'.62rem',opacity:.65}}>
              Supervisi Pembelajaran PM-KBC
            </div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{textAlign:'right',fontSize:'.72rem',opacity:.8}}>
            <div style={{fontWeight:700}}>{sesi.pengguna.nama}</div>
            <div>{sesi.pengguna.jabatan}</div>
          </div>
          <button onClick={logout}
            style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',
              padding:'6px 12px',borderRadius:7,cursor:'pointer',fontSize:'.75rem'}}>
            Keluar
          </button>
        </div>
        </div>
      </div>

      {/* KONTEN */}
      <div style={{padding:20,maxWidth:900,margin:'0 auto'}}>
        {sesi.mode === 'admin_kanwil' && <DashboardKanwil showToast={showToast} />}
        {sesi.mode === 'operator' && <DashboardOperator sesi={sesi} showToast={showToast} />}
        {sesi.mode === 'supervisor' && <DashboardSupervisor sesi={sesi} showToast={showToast} />}
        {sesi.mode === 'guru' && <DashboardGuru sesi={sesi} showToast={showToast} />}
      </div>

      {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onClose={()=>setToast(null)} />}
    </div>
  );
}


// ── DASHBOARD OPERATOR + KANWIL (LENGKAP) ──────────────────────
// ── DASHBOARD OPERATOR (LENGKAP) ──────────────────────────────
function DashboardOperator({sesi, showToast}) {
  const [tab, setTab]           = useState('guru');
  const [guruList, setGuruList] = useState([]);
  const [penggunaList, setPenggunaList] = useState([]);
  const [supList, setSupList]   = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showFormGuru, setShowFormGuru]     = useState(false);
  const [showFormUser, setShowFormUser]     = useState(false);
  const [resetTarget, setResetTarget]       = useState(null); // pengguna yang mau direset
  const [resetPass, setResetPass]           = useState('');
  const [resetPass2, setResetPass2]         = useState('');
  const [editGuru, setEditGuru]             = useState(null);
  const [formGuru, setFormGuru] = useState({nama:'',nip:'',mapel:'',status_kepeg:'GTT',pendidikan:'S1',nuptk:''});
  const [formUser, setFormUser] = useState({nama:'',nip:'',jabatan:'Kepala Madrasah',role:'supervisor',username:'',password:''});
  const [importStatus, setImportStatus]     = useState('');

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const [g, p, s] = await Promise.all([
      sb.from('supermad_guru').select('*').eq('madrasah_id', sesi.mad.id).order('nama'),
      sb.from('supermad_pengguna').select('*').eq('madrasah_id', sesi.mad.id).order('nama'),
      sb.from('supermad_supervisi').select('guru_id,status,capaian_rata,predikat,tanggal_supervisi')
        .eq('madrasah_id', sesi.mad.id),
    ]);
    setGuruList(g.data||[]);
    setPenggunaList(p.data||[]);
    setSupList(s.data||[]);
    setLoading(false);
  }

  async function simpanGuru(e) {
    e.preventDefault();
    const payload = {...formGuru, madrasah_id: sesi.mad.id, aktif:true};
    let error;
    if (editGuru) {
      ({error} = await sb.from('supermad_guru').update(payload).eq('id', editGuru.id));
    } else {
      ({error} = await sb.from('supermad_guru').insert(payload));
    }
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast(`✅ Guru ${editGuru?'diperbarui':'ditambahkan'}!`);
    setShowFormGuru(false); setEditGuru(null);
    setFormGuru({nama:'',nip:'',mapel:'',status_kepeg:'GTT',pendidikan:'S1',nuptk:''});
    loadData();
  }

  async function hapusGuru(g) {
    if (!confirm(`Hapus guru "${g.nama}"? Data supervisi terkait juga akan terhapus.`)) return;
    const {error} = await sb.from('supermad_guru').delete().eq('id', g.id);
    if (error) { showToast('Gagal hapus: '+error.message,'error'); return; }
    showToast('🗑️ Guru dihapus.');
    loadData();
  }

  async function resetPassword(e) {
    e.preventDefault();
    if (resetPass !== resetPass2) { showToast('Password tidak cocok!','error'); return; }
    if (resetPass.length < 4) { showToast('Password minimal 4 karakter!','error'); return; }
    const {error} = await sb.from('supermad_pengguna')
      .update({password_hash: resetPass})
      .eq('id', resetTarget.id);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Password berhasil direset!');
    setResetTarget(null); setResetPass(''); setResetPass2('');
  }

  async function hapusPengguna(p) {
    if (!confirm('Hapus pengguna "'+p.nama+'" ('+p.username+')? Tindakan ini tidak bisa dibatalkan.')) return;
    const {error} = await sb.from('supermad_pengguna').delete().eq('id', p.id);
    if (error) { showToast('Gagal hapus: '+error.message,'error'); return; }
    showToast('🗑️ Pengguna '+p.nama+' dihapus.');
    loadData();
  }

  async function simpanUser(e) {
    e.preventDefault();
    // Cek duplikat username
    const {data:existing} = await sb.from('supermad_pengguna')
      .select('id').eq('username', formUser.username.trim()).maybeSingle();
    if (existing) { showToast('Username sudah dipakai! Gunakan username lain.','error'); return; }
    const {error} = await sb.from('supermad_pengguna').insert({
      madrasah_id: sesi.mad.id,
      nama:     formUser.nama,
      nip:      formUser.nip,
      jabatan:  formUser.jabatan,
      role:     formUser.role,
      username: formUser.username,
      password_hash: formUser.password, // akan di-hash via RPC
      aktif: true,
    });
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    // Update password_hash ke md5
    await sb.rpc('supermad_cek_password', {p_id:'dummy',p_pass:'dummy'}).maybeSingle();
    // Set hash yang benar
    const {data:u} = await sb.from('supermad_pengguna')
      .select('id').eq('username', formUser.username).single();
    if (u) {
      await sb.from('supermad_pengguna')
        .update({password_hash: formUser.password})
        .eq('id', u.id);
    }
    showToast('✅ Pengguna berhasil ditambahkan!');
    setShowFormUser(false);
    setFormUser({nama:'',nip:'',jabatan:'Kepala Madrasah',role:'supervisor',username:'',password:''});
    loadData();
  }

  // Import Excel
  async function importExcel(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum siap. Pastikan koneksi internet aktif.','warning');
      return;
    }
    setImportStatus('⏳ Membaca file Excel...');
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb  = XLSX.read(ev.target.result, {type:'binary'});
        const ws  = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        if (!rows.length) { setImportStatus('❌ File kosong.'); return; }

        // Mapping kolom fleksibel
        const map = (row, keys) => keys.map(k=>row[k]||'').find(v=>v)||'';
        let added=0, skipped=0;
        for (const row of rows) {
          const nama = map(row,['Nama','NAMA','nama','Nama Guru','NAMA GURU']);
          const nip  = map(row,['NIP','nip','NIP/NUPTK']);
          const mapel= map(row,['Mapel','MAPEL','Mata Pelajaran','MATA PELAJARAN','mapel']);
          const stat = map(row,['Status','STATUS','Status Kepegawaian','status_kepeg'])||'GTT';
          const pend = map(row,['Pendidikan','PENDIDIKAN','pendidikan'])||'S1';
          if (!nama) { skipped++; continue; }
          const {error} = await sb.from('supermad_guru').insert({
            madrasah_id: sesi.mad.id, nama, nip, mapel, status_kepeg:stat, pendidikan:pend, aktif:true
          });
          if (error) skipped++; else added++;
        }
        setImportStatus(`✅ Selesai: ${added} guru ditambahkan, ${skipped} dilewati.`);
        loadData();
      } catch(err) {
        setImportStatus('❌ Error: '+err.message);
      }
    };
    reader.readAsBinaryString(file);
    e.target.value = '';
  }

  function downloadTemplate() {
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum siap.','warning'); return;
    }
    const ws = XLSX.utils.aoa_to_sheet([
      ['Nama','NIP','Mapel','Status','Pendidikan'],
      ['Ahmad Fauzi, S.Pd','197001012000031001','Matematika','PNS','S1'],
      ['Siti Rahma, S.Pd.I','','Fikih','GTT','S1'],
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Daftar Guru');
    XLSX.writeFile(wb, 'Template_Daftar_Guru.xlsx');
  }

  if (loading) return <Loading text="Memuat data madrasah..." />;

  const guruSudah = new Set(supList.filter(s=>s.status==='selesai').map(s=>s.guru_id));

  return (
    <div>
      <h2 style={{fontWeight:900,color:'var(--p3)',marginBottom:16,fontSize:'1.1rem'}}>
        ⚙️ Operator — {sesi.mad.nama}
      </h2>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:16}}>
        {[
          {icon:'👨‍🏫',label:'Total Guru',val:guruList.length,color:'var(--p)'},
          {icon:'👤',label:'Pengguna',val:penggunaList.length,color:'#2563eb'},
          {icon:'✅',label:'Sudah Supervisi',val:guruSudah.size,color:'#16a34a'},
        ].map((k,i)=>(
          <div key={i} className="card" style={{textAlign:'center',padding:14}}>
            <div style={{fontSize:'1.4rem'}}>{k.icon}</div>
            <div style={{fontSize:'1.4rem',fontWeight:900,color:k.color,marginTop:4}}>{k.val}</div>
            <div style={{fontSize:'.7rem',color:'var(--text2)'}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Tab */}
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {[['guru','👨‍🏫 Daftar Guru'],['pengguna','👤 Pengguna'],['profil','🏫 Profil']].map(([key,label])=>(
          <button key={key} onClick={()=>setTab(key)}
            style={{padding:'7px 14px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
              background:tab===key?'var(--p)':'var(--surface2)',
              color:tab===key?'#fff':'var(--text2)'}}>
            {label}
          </button>
        ))}
      </div>

      {/* TAB GURU */}
      {tab==='guru' && (
        <div>
          {/* Toolbar */}
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{fontWeight:700,color:'var(--text2)',fontSize:'.85rem',flex:1}}>
              {guruList.length} guru terdaftar
            </div>
            <button className="btn btn-outline btn-sm" onClick={downloadTemplate}>
              📥 Template Excel
            </button>
            <label className="btn btn-outline btn-sm" style={{cursor:'pointer',margin:0}}>
              📤 Import Excel
              <input type="file" accept=".xlsx,.xls" onChange={importExcel} style={{display:'none'}}/>
            </label>
            <button className="btn btn-primary btn-sm"
              onClick={()=>{setShowFormGuru(!showFormGuru);setEditGuru(null);
                setFormGuru({nama:'',nip:'',mapel:'',status_kepeg:'GTT',pendidikan:'S1',nuptk:''});}}>
              {showFormGuru?'✕ Batal':'+ Tambah Guru'}
            </button>
          </div>

          {importStatus && (
            <div style={{padding:'10px 14px',borderRadius:9,marginBottom:12,fontSize:'.8rem',
              background:importStatus.startsWith('✅')?'#f0fdf4':importStatus.startsWith('❌')?'#fef2f2':'#fffbeb',
              border:'1px solid '+(importStatus.startsWith('✅')?'#86efac':importStatus.startsWith('❌')?'#fca5a5':'#fcd34d'),
              color:importStatus.startsWith('✅')?'#166534':importStatus.startsWith('❌')?'#991b1b':'#92400e'}}>
              {importStatus}
            </div>
          )}

          {/* Form Tambah/Edit Guru */}
          {showFormGuru && (
            <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>
              <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
                {editGuru ? '✏️ Edit Guru' : '+ Tambah Guru'}
              </div>
              <form onSubmit={simpanGuru}>
                <div className="grid2">
                  <div className="form-group">
                    <label>Nama Lengkap *</label>
                    <input value={formGuru.nama} onChange={e=>setFormGuru({...formGuru,nama:e.target.value})} required
                      placeholder="Nama + gelar"/>
                  </div>
                  <div className="form-group">
                    <label>NIP</label>
                    <input value={formGuru.nip} onChange={e=>setFormGuru({...formGuru,nip:e.target.value})}
                      placeholder="18 digit NIP"/>
                  </div>
                  <div className="form-group">
                    <label>NUPTK</label>
                    <input value={formGuru.nuptk} onChange={e=>setFormGuru({...formGuru,nuptk:e.target.value})}
                      placeholder="16 digit NUPTK"/>
                  </div>
                  <div className="form-group">
                    <label>Mata Pelajaran *</label>
                    <input value={formGuru.mapel} onChange={e=>setFormGuru({...formGuru,mapel:e.target.value})} required
                      placeholder="Contoh: Matematika"/>
                  </div>
                  <div className="form-group">
                    <label>Status Kepegawaian</label>
                    <select value={formGuru.status_kepeg} onChange={e=>setFormGuru({...formGuru,status_kepeg:e.target.value})}>
                      {['PNS','PPPK','GTT','GTY'].map(s=><option key={s}>{s}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Pendidikan Terakhir</label>
                    <select value={formGuru.pendidikan} onChange={e=>setFormGuru({...formGuru,pendidikan:e.target.value})}>
                      {['D3','S1','S2','S3'].map(s=><option key={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-primary" type="submit">
                    💾 {editGuru?'Simpan Perubahan':'Tambah Guru'}
                  </button>
                  <button type="button" className="btn btn-outline"
                    onClick={()=>{setShowFormGuru(false);setEditGuru(null);}}>Batal</button>
                </div>
              </form>
            </div>
          )}

          {/* Tabel Guru */}
          <div className="card" style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.8rem',minWidth:500}}>
              <thead>
                <tr style={{background:'var(--p3)',color:'#fff'}}>
                  {['No','Nama Guru','NIP','Mapel','Status','Token','Supervisi','Aksi'].map(h=>(
                    <th key={h} style={{padding:'8px 10px',textAlign:'left',fontWeight:700,whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {guruList.map((g,i)=>{
                  const supData = supList.find(s=>s.guru_id===g.id&&s.status==='selesai');
                  return (
                    <tr key={g.id} style={{borderBottom:'1px solid var(--border)',
                      background:i%2?'var(--surface2)':'#fff'}}>
                      <td style={{padding:'8px 10px',color:'var(--text3)'}}>{i+1}</td>
                      <td style={{padding:'8px 10px',fontWeight:600}}>{g.nama}</td>
                      <td style={{padding:'8px 10px',fontFamily:'monospace',fontSize:'.72rem',
                        color:'var(--text3)'}}>{g.nip||'—'}</td>
                      <td style={{padding:'8px 10px'}}>{g.mapel||'—'}</td>
                      <td style={{padding:'8px 10px'}}>
                        <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                          background:g.status_kepeg==='PNS'?'#dbeafe':g.status_kepeg==='PPPK'?'#d1fae5':'#fef9c3',
                          color:g.status_kepeg==='PNS'?'#1d4ed8':g.status_kepeg==='PPPK'?'#065f46':'#92400e'}}>
                          {g.status_kepeg}
                        </span>
                      </td>
                      <td style={{padding:'8px 10px'}}>
                        {g.token ? (
                          <div style={{display:'flex',alignItems:'center',gap:4}}>
                            <span style={{fontFamily:'monospace',fontWeight:900,fontSize:'.85rem',
                              letterSpacing:2,color:'var(--p3)',background:'var(--surface2)',
                              padding:'2px 8px',borderRadius:6}}>{g.token}</span>

                              showToast('Token disalin!');
                            }} style={{padding:'2px 6px',borderRadius:4,border:'1px solid var(--border)',
                              background:'#fff',cursor:'pointer',fontSize:'.65rem'}}>📋</button>
                          </div>

                      </td>
                      <td style={{padding:'8px 10px'}}>
                        {supData

            </table>
          </div>
        </div>

      {/* TAB PENGGUNA */}
      {tab==='pengguna' && (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <div style={{fontWeight:700,color:'var(--text2)',fontSize:'.85rem'}}>
              {penggunaList.length} pengguna terdaftar
            </div>
            <button className="btn btn-primary btn-sm" onClick={()=>setShowFormUser(!showFormUser)}>
              {showFormUser?'✕ Batal':'+ Tambah Pengguna'}
            </button>
          </div>

          {showFormUser && (
            <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>
              <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>+ Tambah Pengguna</div>
              <form onSubmit={simpanUser}>
                <div className="grid2">
                  <div className="form-group">
                    <label>Nama Lengkap *</label>
                    <input value={formUser.nama} onChange={e=>setFormUser({...formUser,nama:e.target.value})}
                      required placeholder="Nama + gelar"/>
                  </div>
                  <div className="form-group">
                    <label>NIP</label>
                    <input value={formUser.nip} onChange={e=>setFormUser({...formUser,nip:e.target.value})}
                      placeholder="NIP (opsional)"/>

                    <label>Jabatan</label>

                  <div className="form-group">
                    <label>Role</label>
                    <select value={formUser.role} onChange={e=>setFormUser({...formUser,role:e.target.value})}>

          <div style={{display:'flex',flexDirection:'column',gap:8}}>

                </div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{padding:'3px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:700,
                    background:p.role==='supervisor'?'#d1fae5':p.role==='guru'?'#fef3c7':'#dbeafe',
                    color:p.role==='supervisor'?'#065f46':p.role==='guru'?'#92400e':'#1d4ed8'}}>
                    {p.role==='supervisor'?'Supervisor':p.role==='guru'?'Guru':'Operator'}
                  </span>
                  <button onClick={()=>{setResetTarget(p);setResetPass('');setResetPass2('');}}
                    style={{padding:'4px 10px',borderRadius:6,border:'1px solid #d97706',
                      background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                    🔑 Reset
                  </button>
                  <button onClick={()=>hapusPengguna(p)}
                    style={{padding:'4px 10px',borderRadius:6,border:'1px solid #fca5a5',
                      background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                    🗑️
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* MODAL RESET PASSWORD */}
      {resetTarget && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.5)',

// ── PROFIL MADRASAH (EDITABLE) ─────────────────────────────────
function ProfilMadrasah({sesi, showToast, onUpdate}) {
  const [form, setForm] = useState({
    nama_kepala: sesi.mad.nama_kepala||'',
    nip_kepala:  sesi.mad.nip_kepala||'',
    alamat:      sesi.mad.alamat||'',
    kota_kab:    sesi.mad.kota_kab||'',
    provinsi:    sesi.mad.provinsi||'',
    naungan:     sesi.mad.naungan||'',
    tahun_ajaran:sesi.mad.tahun_ajaran||'2025/2026',
  });
  const [saving, setSaving]       = useState(false);
  const [uploadingLogo, setUploadingLogo] = useState(false);
  const [logoUrl, setLogoUrl]     = useState(sesi.mad.logo_url||'');

  async function uploadLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500*1024) { showToast('Ukuran logo maksimal 500KB!','error'); return; }
    if (!file.type.startsWith('image/')) { showToast('File harus berupa gambar!','error'); return; }
    setUploadingLogo(true);
    try {
      const ext = file.name.split('.').pop();
      const path = sesi.mad.id + '/logo.' + ext;
      const {error:upErr} = await sb.storage.from('supermad-logo').upload(path, file, {upsert:true});
      if (upErr) { showToast('Gagal upload: '+upErr.message,'error'); return; }
      const {data:{publicUrl}} = sb.storage.from('supermad-logo').getPublicUrl(path);
      const {error:dbErr} = await sb.from('supermad_madrasah').update({logo_url: publicUrl}).eq('id', sesi.mad.id);
      if (dbErr) { showToast('Gagal simpan URL: '+dbErr.message,'error'); return; }
      setLogoUrl(publicUrl);
      if (onUpdate) onUpdate({...sesi.mad, logo_url: publicUrl});
      showToast('✅ Logo berhasil diupload!');
    } catch(err) {
      showToast('Error: '+err.message,'error');
    } finally { setUploadingLogo(false); }
  }

  async function hapusLogo() {
    if (!confirm('Hapus logo madrasah?')) return;
    await sb.from('supermad_madrasah').update({logo_url: null}).eq('id', sesi.mad.id);
    setLogoUrl('');
    if (onUpdate) onUpdate({...sesi.mad, logo_url: null});
    showToast('Logo dihapus.');
  }

  async function simpan(e) {
    e.preventDefault();
    setSaving(true);
    const {error} = await sb.from('supermad_madrasah').update(form).eq('id', sesi.mad.id);
    setSaving(false);
    if (error) { showToast('Gagal simpan: '+error.message,'error'); return; }
    // Update local sesi
    Object.assign(sesi.mad, form);
    showToast('✅ Profil madrasah berhasil disimpan!');
  }

  return (
    <div className="card">
      <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16}}>🏫 Profil Madrasah</div>

      {/* Upload Logo Madrasah */}
      <div style={{marginBottom:16,padding:'14px 16px',background:'var(--surface2)',
        borderRadius:10,display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>
        {logoUrl
          ? <img src={logoUrl} alt="Logo" style={{width:68,height:68,
              objectFit:'contain',borderRadius:8,border:'2px solid var(--border)',
              background:'#fff',padding:4,flexShrink:0}}/>
          : <div style={{width:68,height:68,borderRadius:8,border:'2px dashed var(--border)',
              display:'flex',alignItems:'center',justifyContent:'center',
              color:'var(--text3)',fontSize:'2rem',background:'#fff',flexShrink:0}}>🏫</div>
        }
        <div style={{flex:1,minWidth:180}}>
          <div style={{fontWeight:700,marginBottom:4}}>Logo Madrasah</div>
          <div style={{fontSize:'.72rem',color:'var(--text2)',marginBottom:8}}>
            JPG/PNG · Maks 500KB · Rekomendasi: persegi
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <label style={{padding:'6px 14px',borderRadius:7,background:'var(--p)',
              color:'#fff',cursor:'pointer',fontSize:'.78rem',fontWeight:700}}>
              {uploadingLogo?'⏳ Mengupload...':'📤 Upload Logo'}
              <input type="file" accept="image/*" onChange={uploadLogo}
                style={{display:'none'}} disabled={uploadingLogo}/>
            </label>
            {logoUrl && (
              <button onClick={hapusLogo} style={{padding:'6px 14px',borderRadius:7,
                border:'1px solid #fca5a5',background:'#fef2f2',
                color:'#dc2626',cursor:'pointer',fontSize:'.78rem',fontWeight:700}}>
                🗑️ Hapus
              </button>
            )}
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16,
        padding:'12px 14px',background:'var(--surface2)',borderRadius:10}}>
        {[['Nama',sesi.mad.nama],['NPSN',sesi.mad.npsn],['Tingkat',sesi.mad.tingkat]].map(([k,v])=>(
          <div key={k}>
            <div style={{fontSize:'.7rem',color:'var(--text3)',fontWeight:700}}>{k}</div>
            <div style={{fontWeight:700}}>{v}</div>
          </div>
        ))}
      </div>
      <form onSubmit={simpan}>
        <div className="grid2">
          <div className="form-group">
            <label>Nama Kepala Madrasah</label>
            <input value={form.nama_kepala} onChange={e=>setForm({...form,nama_kepala:e.target.value})}/>
          </div>
          <div className="form-group">
            <label>NIP Kepala Madrasah</label>
            <input value={form.nip_kepala} onChange={e=>setForm({...form,nip_kepala:e.target.value})}/>
          </div>
          <div className="form-group">
            <label>Naungan / Instansi</label>
            <input value={form.naungan} onChange={e=>setForm({...form,naungan:e.target.value})}/>
          </div>
          <div className="form-group">
            <label>Tahun Ajaran</label>
            <select value={form.tahun_ajaran} onChange={e=>setForm({...form,tahun_ajaran:e.target.value})}>
              {['2024/2025','2025/2026','2026/2027','2027/2028'].map(y=>(
                <option key={y}>{y}</option>
              ))}
            </select>
          </div>
          <div className="form-group" style={{gridColumn:'1/-1'}}>
            <label>Alamat Lengkap</label>
            <input value={form.alamat} onChange={e=>setForm({...form,alamat:e.target.value})}/>
          </div>
          <div className="form-group">
            <label>Kabupaten / Kota</label>
            <input value={form.kota_kab} onChange={e=>setForm({...form,kota_kab:e.target.value})}/>
          </div>
          <div className="form-group">
            <label>Provinsi</label>
            <input value={form.provinsi} onChange={e=>setForm({...form,provinsi:e.target.value})}/>
          </div>
        </div>
        <button className="btn btn-primary" type="submit" disabled={saving}>
          {saving?'⏳ Menyimpan...':'💾 Simpan Profil'}
        </button>
      </form>
    </div>
  );
}

function DashboardKanwil({showToast}) {
  const [madrasahList, setMadrasahList] = useState([]);
  const [stats, setStats]               = useState({});
  const [loading, setLoading]           = useState(true);
  const [tab, setTab]                   = useState('dashboard');
  const [showFormMad, setShowFormMad]   = useState(false);
  const [formMad, setFormMad]           = useState({
    npsn:'',nama:'',tingkat:'MI',naungan:'',alamat:'',
    kota_kab:'',provinsi:'Aceh',nama_kepala:'',nip_kepala:'',
    tahun_ajaran:'2025/2026',kode_akses:''
  });
  const [filterKab, setFilterKab]   = useState('');
  const [filterTingkat, setFilterTingkat] = useState('');
  const [exporting, setExporting]     = useState(false);
  const [madAktif, setMadAktif]       = useState(null); // madrasah yang sedang dikelola
  const [editMad, setEditMad]         = useState(null); // madrasah yang sedang diedit
  const [formEdit, setFormEdit]       = useState({});
  const [savingEdit, setSavingEdit]   = useState(false);
  const [rtlKanwil, setRtlKanwil]     = useState([]);
  const [loadingRTL, setLoadingRTL]   = useState(false);

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const {data:list} = await sb.from('supermad_madrasah')
      .select('*').eq('aktif',true).order('nama');
    const {data:sups} = await sb.from('supermad_supervisi')
      .select('madrasah_id,guru_id,capaian_rata,capaian_perencanaan,capaian_pelaksanaan,capaian_asesmen,status,predikat,tanggal_supervisi,nama_supervisor,jabatan_supervisor');

    const statsMap = {};
    (sups||[]).forEach(s => {
      if (!statsMap[s.madrasah_id]) statsMap[s.madrasah_id] = {total:0,selesai:0,rata:[],p:[],l:[],a:[]};
      statsMap[s.madrasah_id].total++;
      if (s.status==='selesai') {
        statsMap[s.madrasah_id].selesai++;
        statsMap[s.madrasah_id].rata.push(+s.capaian_rata||0);
        statsMap[s.madrasah_id].p.push(+s.capaian_perencanaan||0);
        statsMap[s.madrasah_id].l.push(+s.capaian_pelaksanaan||0);
        statsMap[s.madrasah_id].a.push(+s.capaian_asesmen||0);
      }
    });
    setMadrasahList(list||[]);
    setStats(statsMap);
    setLoading(false);
  }

  async function loadRTLKanwil() {
    setLoadingRTL(true);
    // Ambil semua supervisi + data guru untuk analisis RTL
    const {data:sups} = await sb.from('supermad_supervisi')
      .select('madrasah_id,guru_id,skor_perencanaan,skor_pelaksanaan,skor_asesmen,capaian_rata,nama_supervisor,tanggal_supervisi')
      .eq('status','selesai');
    const {data:gurus} = await sb.from('supermad_guru').select('id,nama,mapel,madrasah_id');
    const guruMap = {};
    (gurus||[]).forEach(g => guruMap[g.id] = g);

    // Hitung frekuensi item skor rendah per aspek
    const LP=['Merumuskan tujuan KBC','Menyusun indikator kompetensi','Merancang materi kontekstual','Memilih metode tepat','Menyiapkan media relevan','Merancang aktivitas KBC','Menyusun instrumen formatif','Mengintegrasikan nilai Islam','Merancang diferensiasi'];
    const LL=['Apersepsi bermakna','Menyampaikan tujuan','Konteks kehidupan nyata','Aktivitas MENGETAHUI','Aktivitas MEMAHAMI','Aktivitas MENGAPLIKASI','Aktivitas MEREFLEKSI','Interaksi aktif','Umpan balik konstruktif','Nilai Islam dalam KBM','Media/teknologi efektif','Pengelolaan waktu','Menyesuaikan pendekatan','Penutup bermakna'];
    const LA=['Penilaian formatif','Instrumen beragam','Umpan balik hasil','Penilaian diri PD','Asesmen untuk perbaikan','Mencatat perkembangan','Penilaian karakter'];

    const freqP = Array(LP.length).fill(0);
    const freqL = Array(LL.length).fill(0);
    const freqA = Array(LA.length).fill(0);
    let totalGuru = 0;

    (sups||[]).forEach(s => {
      totalGuru++;
      (s.skor_perencanaan||[]).forEach((sk,i) => { if((+sk||0)<=1 && i<freqP.length) freqP[i]++; });
      (s.skor_pelaksanaan||[]).forEach((sk,i) => { if((+sk||0)<=1 && i<freqL.length) freqL[i]++; });
      (s.skor_asesmen||[]).forEach((sk,i)     => { if((+sk||0)<=1 && i<freqA.length) freqA[i]++; });
    });

    // Gabungkan dan urutkan berdasarkan frekuensi
    const allIssues = [
      ...freqP.map((f,i) => ({komp:'Perencanaan',aspek:LP[i],frekuensi:f,persen:totalGuru?Math.round(f/totalGuru*100):0})),
      ...freqL.map((f,i) => ({komp:'Pelaksanaan',aspek:LL[i],frekuensi:f,persen:totalGuru?Math.round(f/totalGuru*100):0})),
      ...freqA.map((f,i) => ({komp:'Asesmen',    aspek:LA[i],frekuensi:f,persen:totalGuru?Math.round(f/totalGuru*100):0})),
    ].filter(x => x.frekuensi > 0)
     .sort((a,b) => b.frekuensi - a.frekuensi);

    setRtlKanwil({issues: allIssues, totalGuru, totalSup: (sups||[]).length});
    setLoadingRTL(false);
  }

  async function simpanMadrasah(e) {
    e.preventDefault();
    const {error} = await sb.from('supermad_madrasah').insert({...formMad,aktif:true});
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Madrasah berhasil ditambahkan!');
    setShowFormMad(false);
    setFormMad({npsn:'',nama:'',tingkat:'MI',naungan:'',alamat:'',
      kota_kab:'',provinsi:'Aceh',nama_kepala:'',nip_kepala:'',
      tahun_ajaran:'2025/2026',kode_akses:''});
    loadData();
  }

  async function exportExcel() {
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum siap. Pastikan internet aktif.','warning'); return;
    }
    setExporting(true);
    try {
      // Ambil semua data supervisi lengkap
      const {data:sups} = await sb.from('supermad_supervisi')
        .select('*').eq('status','selesai').order('created_at');
      const {data:gurus} = await sb.from('supermad_guru').select('*');
      const guruMap = {};
      (gurus||[]).forEach(g => guruMap[g.id] = g);

      const madMap = {};
      madrasahList.forEach(m => madMap[m.id] = m);

      // Sheet 1: Rekap per madrasah
      const rekap = madrasahList.map((m,i) => {
        const s = stats[m.id]||{selesai:0,rata:[],p:[],l:[],a:[]};
        const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '—';
        const pred = s.rata.length ? (avg(s.rata)>=87.5?'Sangat Baik':avg(s.rata)>=75?'Baik':avg(s.rata)>=62.5?'Cukup':'Kurang') : '—';
        return {
          'No': i+1,
          'Nama Madrasah': m.nama,
          'Tingkat': m.tingkat,
          'NPSN': m.npsn,
          'Kab/Kota': m.kota_kab||'—',
          'Guru Disupervisi': s.selesai,
          'Perencanaan (%)': avg(s.p),
          'Pelaksanaan (%)': avg(s.l),
          'Asesmen (%)': avg(s.a),
          'Rata-rata (%)': avg(s.rata),
          'Predikat': pred,
          'Kepala Madrasah': m.nama_kepala||'—',
        };
      });

      // Sheet 2: Detail per guru
      const detail = (sups||[]).map((s,i) => {
        const g = guruMap[s.guru_id]||{};
        const m = madMap[s.madrasah_id]||{};

                          color:s.rata.length?w(v):'var(--text3)'}}>

                          color:rr>=87.5?'#065f46':rr>=75?'#1d4ed8':rr>=62.5?'#92400e':'#991b1b'}}>

                        </span>}
                      </td>
                    </tr>

                })}

            </table>
          </div>
        </div>

                </table>
              </div>

              {/* Top 5 prioritas */}
              {rtlKanwil.issues.length > 0 && (
                <div className="card" style={{marginTop:14,background:'#fff8f0',border:'1.5px solid #fed7aa'}}>
                  <div style={{fontWeight:800,color:'#92400e',marginBottom:12}}>
                    🎯 Top 5 Prioritas Pembinaan Provinsi
                  </div>
                  {rtlKanwil.issues.slice(0,5).map((r,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,
                      padding:'10px 0',borderBottom:i<4?'1px solid #fed7aa':'none'}}>
                      <div style={{width:28,height:28,borderRadius:'50%',background:'#f97316',
                        color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',
                        fontWeight:900,fontSize:'.85rem',flexShrink:0}}>
                        {i+1}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:'.85rem'}}>{r.aspek}</div>
                        <div style={{fontSize:'.75rem',color:'var(--text2)',marginTop:2}}>
                          {r.komp} · {r.frekuensi} guru ({r.persen}%) mengalami masalah ini
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* TAB MADRASAH */}
      {tab==='madrasah' && (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <div style={{fontWeight:700,color:'var(--text2)',fontSize:'.85rem'}}>
              {madrasahList.length} madrasah terdaftar
            </div>
            <button className="btn btn-primary btn-sm" onClick={()=>setShowFormMad(!showFormMad)}>
              {showFormMad?'✕ Batal':'+ Tambah Madrasah'}
            </button>
          </div>

          {showFormMad && (
            <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>

              <form onSubmit={simpanMadrasah}>

                    <input value={formMad.npsn} onChange={e=>setFormMad({...formMad,npsn:e.target.value})} required maxLength={8}/>

                    <label>Kode Akses *</label>
                    <input value={formMad.kode_akses} onChange={e=>setFormMad({...formMad,kode_akses:e.target.value})} required

                    <div style={{fontSize:'.7rem',color:'var(--text3)',marginTop:2}}>

                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontWeight:900,fontSize:'1.1rem',
                      color:rr===null?'var(--text3)':rr>=87.5?'#16a34a':rr>=75?'#2563eb':rr>=62.5?'#d97706':'#dc2626'}}>
                      {rr!==null ? rr.toFixed(1)+'%' : '—'}
                    </div>
                    <div style={{fontSize:'.7rem',color:'var(--text3)'}}>
                      {s.selesai} supervisi
                    </div>
                  </div>
                  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                    <button onClick={()=>setMadAktif(m)}
                      style={{padding:'5px 10px',borderRadius:7,border:'1px solid var(--p)',

                      👤 Pengguna
                    </button>
                    <button onClick={()=>{setEditMad(m);setFormEdit({...m});}}
                      style={{padding:'5px 10px',borderRadius:7,border:'1px solid #d97706',
                        background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:'.72rem',fontWeight:700}}>
                      ✏️ Edit
                    </button>
                    <button onClick={()=>hapusMad(m)}
                      style={{padding:'5px 10px',borderRadius:7,border:'1px solid #fca5a5',
                        background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.72rem',fontWeight:700}}>
                      🗑️ Hapus
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}



function DashboardSupervisor({sesi, showToast}) {
  const [tab, setTab]             = useState('sudah'); // default ke sudah agar langsung terlihat
  const [guruList, setGuruList]   = useState([]);
  const [supList, setSupList]     = useState([]);
  const [loading, setLoading]     = useState(true);
  const [guruAktif, setGuruAktif]       = useState(null); // guru yang sedang disupervisi
  const [supAktifRTL, setSupAktifRTL] = useState(null);
  // Hitung tahun ajaran berjalan otomatis
  const now = new Date();
  const bln = now.getMonth() + 1; // 1-12
  const thn = now.getFullYear();
  const taAwal = bln >= 7 ? thn : thn - 1;
  const taDefault = taAwal + '/' + (taAwal + 1);
  const smtDefault = bln >= 7 ? 'Ganjil' : 'Genap';

  const [filterSmt, setFilterSmt] = useState(sesi.mad.semester_aktif || smtDefault);
  const [filterTA, setFilterTA]   = useState(sesi.mad.tahun_ajaran   || taDefault);

  useEffect(() => { loadData(); }, [filterSmt, filterTA]);

  async function loadData() {
    setLoading(true);
    const [g, s] = await Promise.all([
      sb.from('supermad_guru').select('*').eq('madrasah_id', sesi.mad.id).eq('aktif',true).order('nama'),
      sb.from('supermad_supervisi').select('*')
        .eq('madrasah_id', sesi.mad.id)
        .eq('semester', filterSmt)
        .eq('tahun_ajaran', filterTA)
        .order('created_at', {ascending:false}),
    ]);
    if (g.error) console.error('Guru error:', g.error);
    if (s.error) console.error('Supervisi error:', s.error);
    setGuruList(g.data||[]);
    setSupList(s.data||[]);
    setLoading(false);
  }

  if (loading) return <Loading text="Memuat data supervisi..." />;
  if (supAktifRTL) return (
    <HalamanRTL
      sup={supAktifRTL.sup} guru={supAktifRTL.guru}
      sesi={sesi} showToast={showToast}
      onBack={()=>{ setSupAktifRTL(null); setTab('riwayat'); loadData(); }}
    />
  );
  if (guruAktif) return (
    <FormSupervisi
      guru={guruAktif} sesi={sesi} showToast={showToast}
      onSelesai={() => { setGuruAktif(null); loadData(); }}
    />
  );

  const guruSudah = new Set(supList.filter(s=>s.status==='selesai').map(s=>s.guru_id));
  const guruBelum = guruList.filter(g => !guruSudah.has(g.id));
  const guruSelesai = guruList.filter(g => guruSudah.has(g.id));

  return (
    <div>
      <h2 style={{fontWeight:900,color:'var(--p3)',marginBottom:16,fontSize:'1.1rem'}}>
        👨‍💼 Supervisor — {sesi.mad.nama}
      </h2>

      {/* Stats */}
      <div className="grid3" style={{marginBottom:16}}>
        {[
          {label:'Total Guru', value:guruList.length, icon:'👨‍🏫'},
          {label:'Sudah Supervisi', value:guruSelesai.length, icon:'✅'},
          {label:'Belum Supervisi', value:guruBelum.length, icon:'⏳'},
        ].map((k,i)=>(
          <div key={i} className="card" style={{textAlign:'center',padding:14}}>
            <div style={{fontSize:'1.4rem'}}>{k.icon}</div>
            <div style={{fontSize:'1.4rem',fontWeight:900,color:'var(--p)',marginTop:4}}>{k.value}</div>
            <div style={{fontSize:'.7rem',color:'var(--text2)'}}>{k.label}</div>
          </div>
        ))}
      </div>



      {/* Filter Semester & TA */}
      <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center',
        padding:'10px 14px',background:'var(--surface2)',borderRadius:10,flexWrap:'wrap'}}>
        <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)'}}>📅 Filter:</span>
        <select value={filterSmt} onChange={e=>setFilterSmt(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer'}}>
          <option value="Ganjil">Semester Ganjil</option>
          <option value="Genap">Semester Genap</option>
        </select>
        <select value={filterTA} onChange={e=>setFilterTA(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer'}}>
          {(()=>{
            const yr = new Date().getFullYear();
            const tas = [];
            for(let y=yr-1; y<=yr+2; y++) tas.push(y+'/'+(y+1));
            return tas.map(ta=><option key={ta} value={ta}>{ta}</option>);
          })()}
        </select>
        <span style={{fontSize:'.75rem',color:'var(--text3)',marginLeft:'auto'}}>
          {supList.filter(s=>s.status==='selesai').length} supervisi selesai periode ini
        </span>

                  {label:'Kurang',     count:selesai.filter(s=>(+s.capaian_rata||0)<62.5).length,color:'#dc2626',bg:'#fee2e2'},

                          <div style={{fontSize:'.7rem',color:'var(--text3)',marginTop:2}}>📅 {tgl}</div>
                        </div>
                        <div style={{textAlign:'right'}}>
                          <div style={{fontWeight:900,fontSize:'1.1rem',color:warna}}>{capaian.toFixed(1)}%</div>
                          <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                            background:capaian>=87.5?'#d1fae5':capaian>=75?'#dbeafe':capaian>=62.5?'#fef3c7':'#fee2e2',
                            color:capaian>=87.5?'#065f46':capaian>=75?'#1d4ed8':capaian>=62.5?'#92400e':'#991b1b'}}>
                            {s.predikat||'—'}
                          </span>
                        </div>
                      </div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginTop:10}}>
                        {[
                          {label:'Perencanaan',val:s.capaian_perencanaan},
                          {label:'Pelaksanaan',val:s.capaian_pelaksanaan},
                          {label:'Asesmen',    val:s.capaian_asesmen},
                        ].map((k,ki)=>{
                          const v = parseFloat(k.val)||0;
                          const w = v>=87.5?'#16a34a':v>=75?'#2563eb':v>=62.5?'#d97706':'#dc2626';
                          return (
                            <div key={ki} style={{background:'#fff',borderRadius:7,padding:'6px 8px',
                              border:'1px solid var(--border)',textAlign:'center'}}>
                              <div style={{fontSize:'.68rem',color:'var(--text2)'}}>{k.label}</div>
                              <div style={{fontWeight:800,color:w,fontSize:'.85rem'}}>{v.toFixed(1)}%</div>
                            </div>
                          );
                        })}
                      </div>
                      <div style={{marginTop:10}}>
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                          <button onClick={()=>cetakDariRiwayat(s, guruData)}
                            style={{padding:'5px 12px',background:'var(--p)',color:'#fff',
                              border:'none',borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                            🖨️ Cetak Laporan
                          </button>
                          <button onClick={()=>setSupAktifRTL({sup:s,guru:guruData})}
                            style={{padding:'5px 12px',background:'var(--g)',color:'#fff',
                              border:'none',borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                            📋 RTL
                          </button>
                          <button onClick={()=>setGuruAktif(guruData)}
                            style={{padding:'5px 12px',background:'#fff',color:'var(--p)',
                              border:'1.5px solid var(--p)',borderRadius:7,cursor:'pointer',
                              fontSize:'.75rem',fontWeight:700}}>
                            🔄 Supervisi Lagi
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
          }
        </div>
      )}
    </div>
  );
}

  const capL    = parseFloat(sup.capaian_pelaksanaan)||0;

// Generate RTL otomatis dari skor rendah
function generateRTL(skorP, skorL, skorA) {
  const rtl = {p:[], l:[], a:[]};
  [['p',skorP],['l',skorL],['a',skorA]].forEach(([key,skors])=>{
    skors.forEach((skor,i)=>{
      if ((+skor||0) <= 1 && RTL_DB[key][i]) {
        rtl[key].push({
          ...RTL_DB[key][i],
          skor: +skor||0,
          edited: false,
          id: key+'_'+i,
        });
      }
    });
  });
  return rtl;
}

  const [expanded, setExpanded] = useState(false);
  const [editing, setEditing]   = useState(false);

    onUpdate({...form, edited:true});

        background:item.skor===0?'#fef2f2':item.skor===1?'#fffbeb':'var(--surface2)',
        cursor:'pointer'}} onClick={()=>setExpanded(!expanded)}>
        <span style={{fontSize:'1rem'}}>{item.skor===0?'🔴':'🟡'}</span>

        <span style={{fontSize:'.8rem',color:'var(--text3)'}}>{expanded?'▲':'▼'}</span>
      </div>

      {/* Content */}
      {expanded && (
        <div style={{padding:'12px 14px',background:'#fff'}}>
          {editing ? (
            <div>
              <div className="form-group">
                <label>Masalah yang Ditemukan</label>

          )}
        </div>
      )}
    </div>
  );
}

// ── HALAMAN RTL LENGKAP ────────────────────────────────────────
function HalamanRTL({sup, guru, sesi, showToast, onBack}) {
  const [loading, setLoading]   = useState(true);
  const [saving, setSaving]     = useState(false);
  const [rtlId, setRtlId]       = useState(null);
  const [tab, setTab]           = useState('guru');
  const [catUmum, setCatUmum]       = useState('');
  const [konfirmasi, setKonfirmasi] = useState('belum');
  const [catatanGuru, setCatatanGuru] = useState('');

  // RTL per komponen
  const [rtlP, setRtlP] = useState([]);
  const [rtlL, setRtlL] = useState([]);
  const [rtlA, setRtlA] = useState([]);

  // RTL Madrasah
  const [rtlMad, setRtlMad] = useState([]);
  const [newMad, setNewMad] = useState({program:'',tujuan:'',sasaran:'Semua Guru',waktu:'1 semester',pj:'Kepala Madrasah'});
  const [showAddMad, setShowAddMad] = useState(false);

  useEffect(() => { loadRTL(); }, []);

  async function loadRTL() {
    setLoading(true);
    // Cek apakah RTL sudah ada
    const {data} = await sb.from('supermad_rtl')
      .select('*').eq('supervisi_id', sup.id).maybeSingle();

    if (data) {
      setRtlId(data.id);
      setRtlP(data.rtl_perencanaan||[]);
      setRtlL(data.rtl_pelaksanaan||[]);
      setRtlA(data.rtl_asesmen||[]);
      setRtlMad(data.rtl_madrasah||[]);
      setCatUmum(data.catatan_umum||'');
      setKonfirmasi(data.konfirmasi_guru||'belum');
      setCatatanGuru(data.catatan_guru||'');
    } else {
      // Auto-generate dari skor rendah
      const generated = generateRTL(
        sup.skor_perencanaan||[],
        sup.skor_pelaksanaan||[],
        sup.skor_asesmen||[]
      );
      setRtlP(generated.p);
      setRtlL(generated.l);
      setRtlA(generated.a);
      // Auto-generate RTL madrasah dari item yang bermasalah
      const allIssues = [...generated.p,...generated.l,...generated.a];
      if (allIssues.length > 0) {
        setRtlMad([{
          program: 'Program Pembinaan Guru — ' + (guru?.nama||''),
          tujuan: 'Meningkatkan kompetensi pembelajaran PM-KBC',
          sasaran: guru?.nama||'Guru yang bersangkutan',
          waktu: '1 semester',
          pj: sup.nama_supervisor||sesi.pengguna.nama,
        }]);
      }
      // Auto-simpan draft ke DB
      try {
        const {data:newRtl} = await sb.from('supermad_rtl').insert({
          supervisi_id:    sup.id,
          madrasah_id:     sesi.mad.id,
          guru_id:         guru.id,
          tahun_ajaran:    sesi.mad.tahun_ajaran||'2025/2026',
          rtl_perencanaan: generated.p,
          rtl_pelaksanaan: generated.l,
          rtl_asesmen:     generated.a,
          rtl_madrasah:    allIssues.length>0?[{program:'Program Pembinaan Guru — '+(guru?.nama||''),tujuan:'Meningkatkan kompetensi pembelajaran PM-KBC',sasaran:guru?.nama||'Guru',waktu:'1 semester',pj:sup.nama_supervisor||sesi.pengguna.nama}]:[],
          catatan_umum:    '',
          konfirmasi_guru: 'belum',
          catatan_guru:    '',
          status:          'draft',
          dibuat_oleh:     sesi.pengguna.id,
          updated_at:      new Date().toISOString(),
        }).select().single();
        if (newRtl) setRtlId(newRtl.id);
      } catch(e) { console.error('Auto-save error:', e); }
    }
    setLoading(false);
  }

  async function simpanRTL(status='draft') {
    setSaving(true);
    const payload = {
      supervisi_id: sup.id,
      madrasah_id:  sesi.mad.id,
      guru_id:      guru.id,
      tahun_ajaran: sesi.mad.tahun_ajaran,
      rtl_perencanaan: rtlP,
      rtl_pelaksanaan: rtlL,
      rtl_asesmen:     rtlA,
      rtl_madrasah:    rtlMad,
      catatan_umum:    catUmum,
      konfirmasi_guru: konfirmasi,
      catatan_guru:    catatanGuru,
      status,
      dibuat_oleh: sesi.pengguna.id,
      updated_at: new Date().toISOString(),
    };
    let error;
    if (rtlId) {
      ({error} = await sb.from('supermad_rtl').update(payload).eq('id', rtlId));
    } else {
      const {data, error:e} = await sb.from('supermad_rtl').insert(payload).select().single();
      error = e;
      if (data) setRtlId(data.id);
    }
    setSaving(false);
    if (error) { showToast('Gagal simpan RTL: '+error.message,'error'); return; }
    showToast(status==='final' ? '✅ RTL final tersimpan!' : '✅ Draft RTL disimpan!');
  }

${allRTL.length > 0 ? `

                onUpdate={updated => setRtlMad(prev=>prev.map((it,idx)=>idx===i?updated:it))}

              ✉️ Tanggapan Guru — {guru?.nama||'—'}
            </div>
            {/* Tampilkan tanggapan guru jika sudah ada */}
            {(konfirmasi !== 'belum' || catatanGuru) && (
              <div style={{marginBottom:16,padding:'12px 14px',borderRadius:10,
                background: konfirmasi==='sudah'?'#f0fdf4':konfirmasi==='sebagian'?'#fffbeb':'#fef2f2',
                border:'1.5px solid '+(konfirmasi==='sudah'?'#86efac':konfirmasi==='sebagian'?'#fcd34d':'#fca5a5')}}>
                <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:6,
                  color:konfirmasi==='sudah'?'#16a34a':konfirmasi==='sebagian'?'#d97706':'#dc2626'}}>
                  {konfirmasi==='sudah'?'✅ Guru sudah menindaklanjuti':
                   konfirmasi==='sebagian'?'🔄 Guru sebagian sudah menindaklanjuti':
                   '⏳ Guru belum menindaklanjuti'}
                </div>
                {catatanGuru && (
                  <div style={{fontSize:'.8rem',color:'var(--text2)',fontStyle:'italic'}}>
                    "{catatanGuru}"
                  </div>
                )}
                {rtlData?.tgl_konfirmasi && (
                  <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>
                    Diisi: {new Date(rtlData.tgl_konfirmasi).toLocaleDateString('id-ID')}
                  </div>

              </div>

            {konfirmasi === 'belum' && !catatanGuru && (

                ⏳ Guru belum mengisi tanggapan tindak lanjut.
              </div>

            <div style={{marginBottom:14}}>
              <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--text2)',marginBottom:10}}>
                Status Tindak Lanjut:
              </div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {[
                  {val:'belum',  label:'⏳ Belum Ditindaklanjuti', color:'#dc2626', bg:'#fee2e2'},
                  {val:'sebagian',label:'🔄 Sebagian Sudah',       color:'#d97706', bg:'#fef3c7'},
                  {val:'sudah',  label:'✅ Sudah Ditindaklanjuti', color:'#16a34a', bg:'#d1fae5'},
                ].map(opt=>(
                  <button key={opt.val} onClick={()=>setKonfirmasi(opt.val)}
                    style={{padding:'8px 16px',borderRadius:20,border:'2px solid '+(konfirmasi===opt.val?opt.color:'var(--border)'),
                      background:konfirmasi===opt.val?opt.bg:'#fff',
                      color:konfirmasi===opt.val?opt.color:'var(--text2)',
                      cursor:'pointer',fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
                      transition:'all .2s'}}>
                    {opt.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Catatan guru */}
            <div>
              <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--text2)',marginBottom:8}}>
                Catatan / Komentar Guru:

              <textarea rows={5} value={catatanGuru} onChange={e=>setCatatanGuru(e.target.value)}
                placeholder="Tuliskan langkah yang sudah/akan diambil untuk menindaklanjuti rekomendasi supervisor..."
                style={{width:'100%',padding:'10px 12px',border:'1.5px solid var(--border)',
                  borderRadius:9,fontSize:'.85rem',fontFamily:'inherit',
                  lineHeight:1.8,resize:'vertical',outline:'none'}}

                onBlur={e=>e.target.style.borderColor='var(--border)'}/>

            <button className="btn btn-primary" style={{marginTop:12}}

          {/* Ringkasan RTL */}
          {(rtlP.length+rtlL.length+rtlA.length) > 0 && (
            <div className="card" style={{background:'#f8fffe'}}>
              <div style={{fontWeight:700,color:'var(--p3)',marginBottom:10}}>
                📋 Ringkasan RTL yang Perlu Ditindaklanjuti ({rtlP.length+rtlL.length+rtlA.length} item)
              </div>
              {[...rtlP,...rtlL,...rtlA].map((r,i)=>(
                <div key={i} style={{display:'flex',gap:10,padding:'8px 0',
                  borderBottom:'1px solid var(--border)',alignItems:'flex-start'}}>
                  <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',fontWeight:700,flexShrink:0,
