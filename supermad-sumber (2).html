  React.useEffect(()=>{ loadData(filterTA); }, [filterTA]);

  async function loadData(ta) {
    setLoading(true);
    const {data} = await sb.from('supermad_dokumen')
      .select('*').eq('madrasah_id', sesi.mad.id).eq('tahun_ajaran', ta||filterTA);
    setDokList(data||[]);
    setLoading(false);
  }

  const total = DAFTAR_DOKUMEN.length;
  const statusInfo = {
    lengkap:  {label:'✅ Lengkap',   color:'#16a34a', bg:'#d1fae5'},
    sebagian: {label:'⚠️ Sebagian',  color:'#d97706', bg:'#fef3c7'},
    belum:    {label:'❌ Belum',     color:'#dc2626', bg:'#fee2e2'},
  };

  function getProgress(guruId) {
    const docs = dokList.filter(d=>d.guru_id===guruId);
    const lengkap = docs.filter(d=>d.status==='lengkap').length;
    const sebagian = docs.filter(d=>d.status==='sebagian').length;
    return Math.round(((lengkap + sebagian*0.5)/total)*100);
  }

  const filtered = guruList.filter(g=>
    !filterGuru || g.nama.toLowerCase().includes(filterGuru.toLowerCase())
  );

  if (loading) return <Loading text="Memuat data dokumen..." />;

  // Detail per guru
  if (detailGuru) {
    const docs = dokList.filter(d=>d.guru_id===detailGuru.id);
    const getDok = kode => docs.find(d=>d.kode_dok===kode);
    const grups = [...new Set(DAFTAR_DOKUMEN.map(d=>d.grup))];
    return (
      <div>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <button className="btn btn-outline btn-sm" onClick={()=>setDetailGuru(null)}>← Kembali</button>
          <div>
            <div style={{fontWeight:800,color:'var(--p3)'}}>{detailGuru.nama}</div>
            <div style={{fontSize:'.75rem',color:'var(--text2)'}}>{detailGuru.mapel||'—'} · {detailGuru.status_kepeg||'—'}</div>
          </div>

// ── E-PORTOFOLIO GURU ─────────────────────────────────────────
function TabPortofolio({sesi, showToast}) {
  const KATEGORI = ['Sertifikat Pelatihan','Workshop/Seminar','PTK / Karya Ilmiah','Media/Perangkat Ajar','Penghargaan','Lainnya'];

  const [items, setItems]       = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [showForm, setShowForm] = React.useState(false);
  const [saving, setSaving]     = React.useState(false);
  const [form, setForm]         = React.useState({
    judul:'', kategori:'Sertifikat Pelatihan', deskripsi:'', tanggal:'',
    penyelenggara:'', link_bukti:'',
  });
  const [filterKat, setFilterKat] = React.useState('');
  const [editId, setEditId]       = React.useState(null);

  React.useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const guruId = sesi.pengguna.id;
    const {data} = await sb.from('supermad_portofolio')
      .select('*').eq('guru_id', guruId)
      .order('tanggal',{ascending:false});
    setItems(data||[]);
    setLoading(false);
  }

  async function simpan(e) {
    e.preventDefault();
    setSaving(true);
    const guruId = sesi.pengguna.id;
    const payload = {...form, guru_id:guruId, madrasah_id:sesi.mad.id};
    let error;
    if (editId) {
      ({error} = await sb.from('supermad_portofolio').update(payload).eq('id', editId));
    } else {
      ({error} = await sb.from('supermad_portofolio').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast(editId?'✅ Portofolio diperbarui!':'✅ Portofolio ditambahkan!');
    setShowForm(false);
    setEditId(null);
    setForm({judul:'',kategori:'Sertifikat Pelatihan',deskripsi:'',tanggal:'',penyelenggara:'',link_bukti:''});
    loadData();
  }

  async function hapus(id) {
    if (!confirm('Hapus item portofolio ini?')) return;
    const {error} = await sb.from('supermad_portofolio').delete().eq('id',id);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('Portofolio dihapus.');
    loadData();
  }

  function startEdit(item) {
    setForm({
      judul:item.judul||'',
      kategori:item.kategori||'Sertifikat Pelatihan',
      deskripsi:item.deskripsi||'',
      tanggal:item.tanggal||'',
      penyelenggara:item.penyelenggara||'',
      link_bukti:item.link_bukti||'',
    });
    setEditId(item.id);
    setShowForm(true);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  if (loading) return <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat portofolio...</div>;

  const filtered = filterKat ? items.filter(i=>i.kategori===filterKat) : items;

  const katColor = {
    'Sertifikat Pelatihan':'#2563eb','Workshop/Seminar':'#7c3aed',
    'PTK / Karya Ilmiah':'#16a34a','Media/Perangkat Ajar':'#d97706',
    'Penghargaan':'#dc2626','Lainnya':'#6b7280',
  };
  const katBg = {
    'Sertifikat Pelatihan':'#dbeafe','Workshop/Seminar':'#ede9fe',
    'PTK / Karya Ilmiah':'#d1fae5','Media/Perangkat Ajar':'#fef3c7',
    'Penghargaan':'#fee2e2','Lainnya':'#f3f4f6',
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>🗂️ e-Portofolio PKB Saya</div>
          <div style={{fontSize:'.75rem',color:'var(--text3)',marginTop:2}}>
            Kumpulkan bukti Pengembangan Keprofesian Berkelanjutan (PKB)
          </div>
        </div>
        <button className="btn btn-primary btn-sm"
          onClick={()=>{setShowForm(!showForm);setEditId(null);
            setForm({judul:'',kategori:'Sertifikat Pelatihan',deskripsi:'',tanggal:'',penyelenggara:'',link_bukti:''});
          }}>
          {showForm&&!editId?'✕ Batal':'＋ Tambah'}
        </button>
      </div>

      {/* Form tambah/edit */}
      {showForm && (
        <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
            {editId?'✏️ Edit Portofolio':'＋ Tambah Portofolio PKB'}

          <form onSubmit={simpan}>
            <div className="grid2">
              <div className="form-group" style={{gridColumn:'1/-1'}}>
                <label>Judul Kegiatan / Karya *</label>
                <input value={form.judul} onChange={e=>setForm({...form,judul:e.target.value})}
                  placeholder="Contoh: Pelatihan Implementasi KMA 1503/2025" required/>
              </div>
              <div className="form-group">
                <label>Kategori *</label>
                <select value={form.kategori} onChange={e=>setForm({...form,kategori:e.target.value})}>

              <div className="form-group">

              </div>
              <div className="form-group">

                    borderRadius:8,fontSize:'.82rem',fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
              </div>

            <div style={{display:'flex',gap:8,marginTop:4}}>

      )}

      {/* Statistik */}
      {items.length > 0 && (
        <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
          {KATEGORI.map(k => {

            return (
              <button key={k} onClick={()=>setFilterKat(filterKat===k?'':k)}

      {/* Daftar item */}
      {filtered.length === 0 ? (
        <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>

// ── PENCOCOKAN NAMA GURU (abaikan huruf besar/kecil, tanda baca, gelar) ──
function normNama(t) { return String(t||'').toLowerCase().replace(/[.,'`]/g,' ').replace(/\s+/g,' ').trim(); }
function intiNama(t) {
  return normNama(String(t||'').split(',')[0])
    .replace(/^((drs|dra|dr|h|hj|ir|prof|tgk|teungku|ust|ustadz|ustazah|ustadzah)\s+)+/,'').trim();
}
function cocokkanGuru(daftar, nama) {
  if (!nama) return null;
  let c = (daftar||[]).filter(g=>normNama(g.nama)===normNama(nama));
  if (c.length===1) return c[0];
  c = (daftar||[]).filter(g=>intiNama(g.nama)===intiNama(nama));
  return c.length===1 ? c[0] : null;
}

  return String(t||'').toLowerCase().replace(/kabupaten|kab\.?|pemerintah/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
}
function PetaSebaranWilayah({madrasahList, stats}) {
  const [metrik, setMetrik] = React.useState('aktif');
  const [pilih, setPilih]   = React.useState(null);
  const [rtlKab, setRtlKab] = React.useState({});
  React.useEffect(()=>{ (async()=>{
    try {
      const sups = await ambilSemua(()=>sb.from('supermad_supervisi')
        .select('madrasah_id,skor_perencanaan,skor_pelaksanaan,skor_asesmen').eq('status','selesai').order('madrasah_id'));
      const kabMad = {}; madrasahList.forEach(m=>{ kabMad[m.id]=normKab(m.kota_kab); });
      const hasil = {};
      sups.forEach(su=>{
        const kab = kabMad[su.madrasah_id]; if (!kab) return;
        const h = hasil[kab] = hasil[kab] || {};
        [['p',su.skor_perencanaan],['l',su.skor_pelaksanaan],['a',su.skor_asesmen]].forEach(([k,arr])=>{
          (arr||[]).forEach((v,i)=>{ if ((+v||0)<=1 && RTL_DB[k][i]) { const lb=RTL_DB[k][i].aspek; h[lb]=(h[lb]||0)+1; } });
        });
      });
      setRtlKab(hasil);
    } catch(e) { console.error(e); }
  })(); }, [madrasahList.length]);

  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const dataKab = {};
  madrasahList.forEach(m=>{
    const k = normKab(m.kota_kab); if (!k) return;
    const d = dataKab[k] = dataKab[k] || {mad:[], aktif:0, sup:0, rata:[]};
    d.mad.push(m);
    const st = stats[m.id];
    if (st && st.selesai>0) { d.aktif++; d.sup += st.selesai; d.rata.push(...st.rata); }
  });
  const nilaiMetrik = d => {
    if (!d) return null;
    if (metrik==='jumlah') return d.mad.length;
    if (metrik==='aktif') return d.mad.length ? d.aktif/d.mad.length*100 : null;
    return avg(d.rata);
  };
  const maksJumlah = Math.max(1, ...Object.values(dataKab).map(d=>d.mad.length));
  const warna = v => {
    if (v==null) return '#e5e7eb';
    if (metrik==='jumlah') { const t=v/maksJumlah; return `rgba(15,66,56,${0.15+t*0.8})`; }
    return v>=91?'#16a34a':v>=81?'#2563eb':v>=71?'#d97706':'#dc2626';
  };
  const tidakDikenal = Object.keys(dataKab).filter(k=>!PETA_ACEH.some(([n])=>normKab(n)===k));
  const dPilih = pilih ? dataKab[normKab(pilih)] : null;
  const topRtl = pilih ? Object.entries(rtlKab[normKab(pilih)]||{}).sort((a,b)=>b[1]-a[1]).slice(0,3) : [];

  return (
    <div className="card" style={{marginBottom:16}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <div style={{fontWeight:800,color:'var(--p3)',flex:1}}>🗺️ Peta Sebaran Madrasah Pengguna SUPERMAD</div>
        {[['aktif','% madrasah aktif supervisi'],['rata','Rata-rata capaian'],['jumlah','Jumlah madrasah']].map(([k,l])=>(
          <button key={k} onClick={()=>setMetrik(k)}
            style={{padding:'5px 11px',borderRadius:20,border:'1.5px solid '+(metrik===k?'var(--p)':'var(--border)'),
              background:metrik===k?'var(--p)':'#fff',color:metrik===k?'#fff':'var(--text2)',
              cursor:'pointer',fontSize:'.72rem',fontWeight:700,fontFamily:'inherit'}}>{l}</button>
        ))}
      </div>
      <div style={{overflowX:'auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(9,minmax(74px,1fr))',gridAutoRows:'66px',gap:5,minWidth:700}}>
          {PETA_ACEH.map(([nama,c,r])=>{
            const d = dataKab[normKab(nama)];
            const v = nilaiMetrik(d);
            const bg = warna(v);
            const gelap = v!=null && (metrik!=='jumlah' || v/maksJumlah>0.4);
            return (
              <button key={nama} onClick={()=>setPilih(nama===pilih?null:nama)} title={nama}
                style={{gridColumn:c+1,gridRow:r+1,background:bg,border:pilih===nama?'3px solid #c9a227':'1px solid rgba(0,0,0,.08)',
                  borderRadius:10,cursor:'pointer',padding:'5px 4px',fontFamily:'inherit',color:gelap?'#fff':'#374151',
                  display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:1}}>
                <span style={{fontSize:'.6rem',fontWeight:700,lineHeight:1.15,textAlign:'center',overflowWrap:'anywhere',maxWidth:'100%'}}>{nama}</span>
                <span style={{fontSize:'.85rem',fontWeight:900}}>
                  {v==null ? '—' : metrik==='jumlah' ? v : v.toFixed(0)+'%'}
                </span>
              </button>
            );
          })}
        </div>
      </div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginTop:10,fontSize:'.7rem',color:'var(--text2)'}}>
        {metrik==='jumlah'
          ? <span>Warna makin gelap = makin banyak madrasah pengguna. Abu-abu = belum ada.</span>
          : [['#16a34a','≥ 91%'],['#2563eb','81–90%'],['#d97706','71–80%'],['#dc2626','< 71%'],['#e5e7eb','belum ada data']].map(([c,l])=>(
            <span key={l} style={{display:'flex',alignItems:'center',gap:4}}>
              <span style={{width:12,height:12,borderRadius:3,background:c,display:'inline-block'}}/>{l}</span>))}
        <span style={{marginLeft:'auto'}}>Peta skematis (bukan skala). Klik kotak untuk detail.</span>
      </div>
      {tidakDikenal.length>0 && (
        <div style={{marginTop:8,fontSize:'.72rem',color:'#92400e'}}>
          ⚠️ Nama kab/kota tidak dikenali (periksa penulisan di data madrasah): {tidakDikenal.join(', ')}
        </div>
      )}
      {pilih && (
        <div style={{marginTop:12,padding:'12px 14px',borderRadius:10,background:'var(--surface2)',border:'1px solid var(--border)'}}>
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:6}}>📍 {pilih}</div>
          {!dPilih ? <div style={{fontSize:'.8rem',color:'var(--text3)'}}>Belum ada madrasah pengguna SUPERMAD di wilayah ini.</div> : (
            <>
              <div style={{display:'flex',gap:14,flexWrap:'wrap',fontSize:'.8rem',marginBottom:8}}>
                <span>🏫 <b>{dPilih.mad.length}</b> madrasah</span>
                <span>✅ <b>{dPilih.aktif}</b> aktif supervisi</span>
                <span>📋 <b>{dPilih.sup}</b> supervisi selesai</span>
                <span>📊 Rata-rata <b>{avg(dPilih.rata)==null?'—':avg(dPilih.rata).toFixed(1)+'%'}</b></span>
              </div>
              {topRtl.length>0 && (
                <div style={{fontSize:'.76rem',marginBottom:8}}>
                  <b>Aspek paling sering perlu pembinaan:</b>
                  <ol style={{margin:'4px 0 0 18px',padding:0}}>
                    {topRtl.map(([a,n])=><li key={a}>{a} <span style={{color:'var(--text3)'}}>({n}×)</span></li>)}
                  </ol>
                </div>
              )}
              <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                {dPilih.mad.map(m=>(
                  <span key={m.id} style={{padding:'2px 9px',borderRadius:20,fontSize:'.7rem',fontWeight:600,
                    background:(stats[m.id]?.selesai>0)?'#dcfce7':'#fef3c7',color:(stats[m.id]?.selesai>0)?'#166534':'#92400e'}}>{m.nama}</span>
                ))}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ── HELPER PEMANTAUAN TUGAS GURU (dipakai Tugas Saya & Kepatuhan Guru) ──
const JURNAL_BELUM = '(belum diisi)';
function semesterSekarang() {
  const b = new Date().getMonth()+1;
  return b >= 7 ? 'Ganjil' : 'Genap';
}
function smtKeAngka(nama) { return nama === 'Genap' ? '2' : '1'; }
function hariSejak(tgl) {
  if (!tgl) return null;
  return Math.floor((new Date() - new Date(tgl+'T00:00:00')) / 86400000);
}
async function muatPenugasanMadrasah(madId, ta) {
  const {data:pt} = await sb.from('supermad_penugasan').select('id,guru_id,mapel,kelas_id,aktif,tahun_ajaran')
    .eq('madrasah_id', madId).eq('tahun_ajaran', ta).eq('aktif', true);
  const ids = [...new Set((pt||[]).map(p=>p.kelas_id).filter(Boolean))];
  const kmap = {};
  if (ids.length) {
    const {data:ks} = await sb.from('supermad_kelas').select('id,nama_kelas').in('id', ids);
    (ks||[]).forEach(k=>{ kmap[k.id]=k.nama_kelas; });
  }
  return (pt||[]).map(p=>({...p, kelas: kmap[p.kelas_id]||''})).filter(p=>p.kelas);
}
// Kelengkapan nilai per penugasan (mapel+kelas): jumlah siswa yang sudah punya nilai per jenis
// ── ATURAN PENILAIAN MADRASAH (diatur operator) ──────────────
const ATURAN_NILAI_DEFAULT = {
  formatifMin: 3, formatifMaks: 5,
  slm: {formatif: true, sts: true, proyek: true},
  bobotSLM: 50, kktp: 75, tglSTS: '', tglSAS: '',
};
function kunciSemester(ta, smt) {
  const n = (smt==='Genap'||String(smt)==='2') ? '2' : '1';
  return (ta||'')+'|'+n;
}
function aturanPenilaian(peng, ta, smt) {
  const x = ((peng||{})[kunciSemester(ta, smt)]) || {};
  const a = {...ATURAN_NILAI_DEFAULT, ...x, slm: {...ATURAN_NILAI_DEFAULT.slm, ...(x.slm||{})}};
  a.formatifMin  = Math.min(5, Math.max(1, parseInt(a.formatifMin)||3));
  a.formatifMaks = Math.min(5, Math.max(a.formatifMin, parseInt(a.formatifMaks)||5));
  a.bobotSLM     = Math.min(100, Math.max(0, parseInt(a.bobotSLM)||0));
  return a;
}
async function muatAturanMadrasah(madId) {
  try {
    const {data, error} = await sb.from('supermad_madrasah').select('pengaturan_nilai').eq('id', madId).maybeSingle();
    if (error) return {};
    return (data && data.pengaturan_nilai) || {};
  } catch(e) { return {}; }
}
function sudahLewat(tgl) {
  if (!tgl) return false;
  return new Date() >= new Date(tgl+'T00:00:00');
}
// Komponen nilai yang WAJIB dihitung dalam kelengkapan pada saat ini
function komponenWajib(atur) {
  return {
    formatif: true,
    sts:    !atur.tglSTS || sudahLewat(atur.tglSTS),          // tanpa tanggal = dihitung sejak awal
    proyek: !!atur.slm.proyek && sudahLewat(atur.tglSAS),     // dihitung menjelang akhir semester
    sas:    sudahLewat(atur.tglSAS),                          // dihitung setelah tanggal SAS
  };
}

// Kelengkapan nilai per penugasan (mapel+kelas). Formatif lengkap bila siswa punya ≥ formatifMin nilai F.
async function hitungKelengkapanNilai(madId, ta, smtNama, penugasan, atur) {
  if (!penugasan.length) return [];
  atur = atur || ATURAN_NILAI_DEFAULT;
  const kelasSet = [...new Set(penugasan.map(p=>p.kelas))];
  const siswa = await ambilSemua(()=>sb.from('supermad_siswa').select('id,kelas')
    .eq('madrasah_id', madId).eq('tahun_ajaran', ta).eq('aktif', true).in('kelas', kelasSet).order('id'));
  const jmlSiswa = {}; siswa.forEach(x=>{ jmlSiswa[x.kelas]=(jmlSiswa[x.kelas]||0)+1; });
  const nilai = await ambilSemua(()=>sb.from('supermad_nilai').select('siswa_id,kelas,mapel,jenis_nilai,nilai,f1,f2,f3,f4,f5')
    .eq('madrasah_id', madId).eq('tahun_ajaran', ta).eq('semester', smtKeAngka(smtNama))
    .in('kelas', kelasSet).order('siswa_id'));
  // terisi[mapel|kelas|jenis] = Map(siswa_id → bobot 0..1)
  // Formatif dihitung sebagian: terisi 1 dari minimal 3 = 1/3, 2 dari 3 = 2/3, ≥3 = penuh
  const terisi = {};
  nilai.forEach(n=>{
    let bobot = 1;
    if (n.jenis_nilai === 'formatif') {
      let jml = ['f1','f2','f3','f4','f5'].filter(f=>n[f]!=null && n[f]!=='').length;
      if (!jml && n.nilai!=null) jml = 1;           // data lama: satu nilai formatif
      if (!jml) return;
      bobot = Math.min(jml, atur.formatifMin) / atur.formatifMin;
    } else if (n.nilai==null) return;
    const k = n.mapel+'|'+n.kelas+'|'+n.jenis_nilai;
    const m = (terisi[k] = terisi[k] || new Map());
    m.set(n.siswa_id, Math.max(m.get(n.siswa_id)||0, bobot));
  });
  return penugasan.map(p=>{
    const j = {};
    ['formatif','sts','sas','proyek'].forEach(jn=>{
      const m = terisi[p.mapel+'|'+p.kelas+'|'+jn];
      j[jn] = m ? Math.round([...m.values()].reduce((a,b)=>a+b,0)*100)/100 : 0;
    });
    return {...p, siswa: jmlSiswa[p.kelas]||0, jenis: j};
  });
}

// ── SKOR KEPATUHAN & SKOR PIAGAM ─────────────────────────────
// Ubah angka di bawah bila kebijakan madrasah berbeda
const PIAGAM_BOBOT_SUPERVISI = 0.7;   // 70% capaian supervisi (rata-rata)
const PIAGAM_BOBOT_KEPATUHAN = 0.3;   // 30% skor kepatuhan administrasi
const PIAGAM_BATAS           = 85;    // skor minimal untuk mendapat piagam

// Tanggal acuan keaktifan: hari ini, atau akhir semester bila semester sudah lewat
function tanggalAcuan(ta, smt) {
  const th = parseInt(String(ta||'').split('/')[0]) || new Date().getFullYear();
  const akhir = smt === 'Genap' ? new Date(th+1, 5, 30) : new Date(th, 11, 31);
  const kini = new Date();
  return akhir < kini ? akhir : kini;
}
function hariSejakAcuan(tgl, acuan) {
  if (!tgl) return null;
  return Math.max(0, Math.floor((acuan - new Date(tgl+'T00:00:00')) / 86400000));
}

// Hitung kepatuhan per guru untuk satu semester. hanyaGuruId = batasi ke satu guru (lebih ringan).
async function hitungKepatuhanGuru(madId, ta, smt, guruList, hanyaGuruId) {
  const qJurnal = () => {
    let q = sb.from('supermad_jurnal')
      .select('id,guru_id,tanggal,materi,jumlah_hadir,jumlah_sakit,jumlah_izin,jumlah_alpa')
      .eq('madrasah_id', madId).eq('tahun_ajaran', ta).eq('semester', smt);
    if (hanyaGuruId) q = q.eq('guru_id', hanyaGuruId);
    return q.order('id');
  };
  // RTL dihitung sama seperti yang dilihat guru: RTL tersimpan + RTL otomatis dari supervisi yang belum punya RTL
  const qSup = () => {
    let q = sb.from('supermad_supervisi').select('id,guru_id,skor_perencanaan,skor_pelaksanaan,skor_asesmen')
      .eq('madrasah_id', madId).eq('status','selesai');
    if (hanyaGuruId) q = q.eq('guru_id', hanyaGuruId);
    return q.order('id');
  };
  let [jurnal, pen, sups] = await Promise.all([ambilSemua(qJurnal), muatPenugasanMadrasah(madId, ta), ambilSemua(qSup)]);
  let rtl = [];
  const supIds = sups.map(x=>x.id);
  for (let i=0; i<supIds.length; i+=150) {
    const {data} = await sb.from('supermad_rtl').select('id,guru_id,supervisi_id,konfirmasi_guru').in('supervisi_id', supIds.slice(i,i+150));
    rtl = rtl.concat(data||[]);
  }
  const supGuru = {}; sups.forEach(x=>{ supGuru[x.id] = x.guru_id; });
  rtl.forEach(r=>{ if (!r.guru_id) r.guru_id = supGuru[r.supervisi_id]; });
  const adaRtl = new Set(rtl.map(r=>String(r.supervisi_id)));
  sups.forEach(x=>{
    if (adaRtl.has(String(x.id))) return;
    const g = generateRTL(x.skor_perencanaan||[], x.skor_pelaksanaan||[], x.skor_asesmen||[]);
    if (g.p.length+g.l.length+g.a.length) rtl.push({id:null, guru_id:x.guru_id, supervisi_id:x.id, konfirmasi_guru:'belum'});
  });
  if (hanyaGuruId) pen = pen.filter(p=>String(p.guru_id)===String(hanyaGuruId));
  const atur = aturanPenilaian(await muatAturanMadrasah(madId), ta, smt);
  const wajib = komponenWajib(atur);
  const nilai = await hitungKelengkapanNilai(madId, ta, smt, pen, atur);
  const acuan = tanggalAcuan(ta, smt);
  const absen = j => ((j.jumlah_hadir||0)+(j.jumlah_sakit||0)+(j.jumlah_izin||0)+(j.jumlah_alpa||0))>0;
  const isiJurnal = j => j.materi && j.materi !== JURNAL_BELUM;
  return (guruList||[]).filter(g=>g.aktif!==false && (!hanyaGuruId || String(g.id)===String(hanyaGuruId))).map(g=>{
    const gid = String(g.id);
    const jg = jurnal.filter(j=>String(j.guru_id)===gid);
    const ng = nilai.filter(n=>String(n.guru_id)===gid);
    const persen = jn => {
      const tot = ng.reduce((a,n)=>a+n.siswa,0);
      return tot ? Math.round(ng.reduce((a,n)=>a+Math.min(n.jenis[jn],n.siswa),0)/tot*100) : null;
    };
    const terakhir = jg.reduce((m,j)=>(!m||j.tanggal>m)?j.tanggal:m, null);
    const hari = hariSejakAcuan(terakhir, acuan);
    const status = hari==null ? 'tidak' : hari<=7 ? 'aktif' : hari<=14 ? 'kurang' : 'tidak';
    const rtlG = rtl.filter(r=>String(r.guru_id)===gid);
    const rtlBelum = rtlG.filter(r=>(r.konfirmasi_guru||'belum')==='belum').length;
    const formatif = persen('formatif'), sts = persen('sts'), sas = persen('sas');
    const jurnalTerisi = jg.filter(isiJurnal).length;
    // Komponen skor kepatuhan (0–100)
    const kKeaktifan = status==='aktif' ? 100 : status==='kurang' ? 50 : 0;
    const kJurnal    = jg.length ? Math.round(jurnalTerisi / jg.length * 100) : 0;
    const proyek = persen('proyek');
    const nilaiWajib = [['formatif',formatif],['sts',sts],['proyek',proyek],['sas',sas]]
      .filter(([k,v])=>wajib[k] && v!=null).map(([,v])=>v);
    const kNilai     = nilaiWajib.length ? Math.round(nilaiWajib.reduce((a,b)=>a+b,0)/nilaiWajib.length) : null;
    const kRtl       = rtlG.length ? Math.round((rtlG.length - rtlBelum) / rtlG.length * 100) : 100;
    const komponen   = [kKeaktifan, kJurnal, kNilai, kRtl].filter(v=>v!=null);
    const skor = Math.round(komponen.reduce((a,b)=>a+b,0) / komponen.length);
    return {
      id: g.id, nama: g.nama, mapel: g.mapel,
      kelasDiampu: ng.length,
      diabsen: jg.filter(absen).length,
      jurnal: jurnalTerisi,
      jurnalTertunda: jg.filter(j=>absen(j) && !isiJurnal(j)).length,
      formatif, sts, sas, proyek, rtlBelum, terakhir, hari, status, wajib, formatifMin: atur.formatifMin,
      pertemuan: jg.length,
      komponen: {keaktifan:kKeaktifan, jurnal:kJurnal, nilai:kNilai, rtl:kRtl},
      skor,
    };
  });
}
function skorPiagam(capSupervisi, skorKepatuhan) {
  return Math.round(((parseFloat(capSupervisi)||0) * PIAGAM_BOBOT_SUPERVISI + (skorKepatuhan||0) * PIAGAM_BOBOT_KEPATUHAN) * 10) / 10;
}

// Kotak rincian skor piagam (dipakai di akun guru)
function KotakSkorPiagam({sup, kep, onCetak, onSimpan}) {
  if (!kep) return (
    <div style={{marginTop:12,fontSize:'.75rem',color:'var(--text3)'}}>⏳ Menghitung skor piagam...</div>
  );
  const cap = parseFloat(sup.capaian_rata)||0;
  const total = skorPiagam(cap, kep.skor);
  const layak = total >= PIAGAM_BATAS;
  const kurang = Math.max(0, Math.round((PIAGAM_BATAS - total)*10)/10);
  const saran = [];
  if (kep.pertemuan && kep.komponen.keaktifan < 100) saran.push('isi absensi/jurnal secara rutin setiap pekan');
  if (!kep.pertemuan) saran.push('mulai isi absensi dan jurnal mengajar');
  else if (kep.komponen.jurnal < 100) saran.push('lengkapi '+(kep.jurnalTertunda ? kep.jurnalTertunda+' ' : '')+'jurnal yang belum diisi');
  if (kep.komponen.nilai != null && kep.komponen.nilai < 100) saran.push('lengkapi nilai sesuai aturan madrasah (formatif sampai '+(kep.formatifMin||3)+'× per siswa)');
  if (kep.komponen.rtl < 100) saran.push('tanggapi RTL supervisi');
  const bar = (lbl, v) => (
    <div style={{display:'flex',alignItems:'center',gap:6,fontSize:'.7rem'}}>
      <span style={{width:92,color:'var(--text2)'}}>{lbl}</span>
      <div style={{flex:1,height:6,background:'#e5e7eb',borderRadius:9,overflow:'hidden'}}>
        <div style={{width:(v||0)+'%',height:'100%',background:v>=90?'#16a34a':v>=60?'#d97706':'#dc2626'}}/>
      </div>
      <span style={{width:34,textAlign:'right',fontWeight:700}}>{v==null?'—':v}</span>
    </div>
  );
  return (
    <div style={{marginTop:12,padding:'12px 14px',borderRadius:10,
      background:layak?'#fffbeb':'#f8fafc',border:'1.5px solid '+(layak?'#d4a017':'var(--border)')}}>
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:8}}>

          <div style={{fontSize:'.7rem',color:'var(--text2)'}}>
            {Math.round(PIAGAM_BOBOT_SUPERVISI*100)}% Supervisi ({cap.toFixed(1)}) + {Math.round(PIAGAM_BOBOT_KEPATUHAN*100)}% Kepatuhan ({kep.skor}) · minimal {PIAGAM_BATAS}
          </div>
        </div>
        {layak && <>

          <button className="btn btn-outline btn-sm" onClick={onSimpan}>🗂️ Simpan ke e-Portofolio</button>
        </>}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:3}}>
        {bar('Keaktifan', kep.komponen.keaktifan)}
        {bar('Jurnal terisi', kep.komponen.jurnal)}
        {bar('Kelengkapan nilai', kep.komponen.nilai)}

  );
}

// ── TAB PENGATURAN PENILAIAN (operator) ──
function TabPengaturanNilai({sesi, showToast}) {
  const [ta, setTa]   = React.useState(getTASekarang());
  const [smt, setSmt] = React.useState(semesterSekarang()==='Genap' ? '2' : '1');
  const [semua, setSemua] = React.useState(null);
  const [form, setForm]   = React.useState(null);
  const [duaSmt, setDuaSmt] = React.useState(false);
  const [saving, setSaving] = React.useState(false);

  React.useEffect(()=>{ (async()=>{
    const {data, error} = await rpcSesi('supermad_get_madrasah', sesi);
    if (error) { showToast('Gagal memuat pengaturan','error'); setSemua({}); return; }
    setSemua((data && data.pengaturan_nilai) || {});
  })(); }, []);
  React.useEffect(()=>{ if (semua) setForm(aturanPenilaian(semua, ta, smt)); }, [semua, ta, smt]);

  async function simpan() {
    if (form.formatifMaks < form.formatifMin) { showToast('Maksimal formatif tidak boleh kurang dari minimal.','error'); return; }
    if (!form.slm.formatif && !form.slm.sts && !form.slm.proyek) { showToast('Pilih minimal satu komponen SLM.','error'); return; }
    setSaving(true);
    const isi = {formatifMin:form.formatifMin, formatifMaks:form.formatifMaks, slm:form.slm,
      bobotSLM:form.bobotSLM, kktp:form.kktp, tglSTS:form.tglSTS||'', tglSAS:form.tglSAS||''};
    const baru = {...semua, [kunciSemester(ta, smt)]: isi};
    if (duaSmt) baru[kunciSemester(ta, smt==='1'?'2':'1')] = {...isi, tglSTS:'', tglSAS:''};
    const {error} = await sb.from('supermad_madrasah').update({pengaturan_nilai: baru}).eq('id', sesi.mad.id);
    setSaving(false);
    if (error) {
      showToast(String(error.message).includes('pengaturan_nilai')
        ? 'Kolom pengaturan belum tersedia. Jalankan SQL supermad_pengaturan_nilai.sql terlebih dahulu.'
        : 'Gagal: '+error.message, 'error');
      return;
    }
    setSemua(baru);
    showToast('✅ Pengaturan penilaian disimpan dan berlaku untuk semua guru');
  }

  if (!form) return <Loading text="Memuat pengaturan penilaian..." />;
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const box = {padding:'14px 16px',borderRadius:12,border:'1px solid var(--border)',background:'#fff',marginBottom:12};
  const judul = t => <div style={{fontWeight:800,color:'var(--p3)',fontSize:'.86rem',marginBottom:8}}>{t}</div>;
  const ket = t => <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:6,lineHeight:1.5}}>{t}</div>;
  const slmAktif = Object.keys(form.slm).filter(k=>form.slm[k]);

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:220}}>
          <div style={{fontWeight:900,color:'var(--p3)'}}>📐 Pengaturan Penilaian Madrasah</div>
          <div style={{fontSize:'.74rem',color:'var(--text2)'}}>Berlaku sama untuk semua guru: input nilai, nilai rapor, Tugas Saya, dan Skor Kepatuhan</div>
        </div>
        <select value={ta} onChange={e=>setTa(e.target.value)}
          style={{padding:'6px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:'.8rem',fontFamily:'inherit',width:'auto'}}>
          {(()=>{const y=new Date().getFullYear();const l=[];for(let i=y+1;i>=y-2;i--)l.push(i+'/'+(i+1));return l.map(t=><option key={t}>{t}</option>);})()}
        </select>
        <select value={smt} onChange={e=>setSmt(e.target.value)}
          style={{padding:'6px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:'.8rem',fontFamily:'inherit',width:'auto'}}>
          <option value="1">Semester 1 (Ganjil)</option><option value="2">Semester 2 (Genap)</option>
        </select>
      </div>

      <div style={box}>
        {judul('📝 Asesmen Formatif')}
        <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'center',fontSize:'.84rem'}}>
          <label style={{display:'flex',alignItems:'center',gap:6}}>Minimal
            <select value={form.formatifMin} onChange={e=>{const v=+e.target.value; setForm(f=>({...f,formatifMin:v,formatifMaks:Math.max(v,f.formatifMaks)}));}}
              style={{width:'auto',padding:'5px 8px'}}>{[1,2,3,4,5].map(n=><option key={n} value={n}>{n}×</option>)}</select>
            per siswa per semester</label>
          <label style={{display:'flex',alignItems:'center',gap:6}}>Maksimal
            <select value={form.formatifMaks} onChange={e=>set('formatifMaks', +e.target.value)} style={{width:'auto',padding:'5px 8px'}}>
              {[1,2,3,4,5].filter(n=>n>=form.formatifMin).map(n=><option key={n} value={n}>{n}×</option>)}</select>
            kolom (F1–F{form.formatifMaks})</label>
        </div>
        {ket('Guru minimal menyediakan '+form.formatifMin+' kolom formatif dan boleh menambah sampai '+form.formatifMaks+'. Nilai formatif seorang siswa dihitung "lengkap" bila sudah terisi minimal '+form.formatifMin+' kali. Nilai formatif = rata-rata kolom yang terisi.')}
      </div>

      <div style={box}>
        {judul('📊 Rumus Nilai Rapor')}
        <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:10}}>
          {[['formatif','Formatif'],['sts','STS'],['proyek','Proyek / Praktik']].map(([k,l])=>(
            <label key={k} style={{display:'flex',alignItems:'center',gap:6,padding:'5px 12px',borderRadius:20,cursor:'pointer',
              fontSize:'.82rem',fontWeight:form.slm[k]?700:400,background:form.slm[k]?'#dbeafe':'var(--surface2)',
              border:'1.5px solid '+(form.slm[k]?'#93c5fd':'var(--border)'),color:form.slm[k]?'#1e40af':'var(--text2)'}}>
              <input type="checkbox" checked={!!form.slm[k]} style={{width:'auto',accentColor:'#1e40af'}}
                onChange={e=>setForm(f=>({...f,slm:{...f.slm,[k]:e.target.checked}}))}/>{l}
            </label>
          ))}
          <span style={{fontSize:'.78rem',color:'var(--text3)',alignSelf:'center'}}>→ masuk SLM (Sumatif Lingkup Materi)</span>
        </div>
        <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'center',fontSize:'.84rem'}}>
          <label style={{display:'flex',alignItems:'center',gap:6}}>Bobot SLM
            <input type="number" min={0} max={100} value={form.bobotSLM} style={{width:64,padding:'5px 8px',textAlign:'center'}}
              onChange={e=>set('bobotSLM', Math.min(100,Math.max(0,+e.target.value||0)))}/>%</label>
          <span>Bobot SAS <b>{100-form.bobotSLM}%</b></span>
          <label style={{display:'flex',alignItems:'center',gap:6}}>KKTP
            <input type="number" min={0} max={100} value={form.kktp} style={{width:64,padding:'5px 8px',textAlign:'center'}}
              onChange={e=>set('kktp', Math.min(100,Math.max(0,+e.target.value||0)))}/></label>
        </div>
        <div style={{marginTop:10,padding:'8px 12px',borderRadius:8,background:'#eff6ff',fontSize:'.8rem',color:'#1e40af'}}>
          📐 <b>Nilai Rapor</b> = rata-rata({slmAktif.map(k=>k.toUpperCase()).join(' + ')||'—'}) × {form.bobotSLM}% + SAS × {100-form.bobotSLM}%
        </div>
      </div>

      <div style={box}>
        {judul('📅 Jadwal Sumatif (untuk perhitungan kelengkapan)')}
        <div style={{display:'flex',gap:16,flexWrap:'wrap',fontSize:'.84rem'}}>
          <label style={{display:'flex',flexDirection:'column',gap:4}}>Mulai STS
            <input type="date" value={form.tglSTS||''} onChange={e=>set('tglSTS', e.target.value)} style={{width:'auto'}}/></label>
          <label style={{display:'flex',flexDirection:'column',gap:4}}>Mulai SAS
            <input type="date" value={form.tglSAS||''} onChange={e=>set('tglSAS', e.target.value)} style={{width:'auto'}}/></label>
        </div>
        {ket('STS ikut dihitung dalam kelengkapan nilai setelah tanggal Mulai STS (jika dikosongkan, dihitung sejak awal semester). SAS dan Proyek baru dihitung setelah tanggal Mulai SAS — guru tidak dirugikan sebelum sumatif dilaksanakan.')}
      </div>

      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.82rem',marginBottom:12,cursor:'pointer'}}>
        <input type="checkbox" checked={duaSmt} onChange={e=>setDuaSmt(e.target.checked)} style={{width:'auto'}}/>
        Terapkan juga ke semester {smt==='1'?'2 (Genap)':'1 (Ganjil)'} TA {ta} (tanpa tanggal STS/SAS)
      </label>
      <button className="btn btn-primary" onClick={simpan} disabled={saving}>{saving?'⏳ Menyimpan...':'💾 Simpan Pengaturan'}</button>
    </div>
  );
}

// ── KARTU "TUGAS SAYA" (dashboard guru) ──
function TugasSaya({sesi, rtlBelum, onBuka}) {
  const [data, setData] = React.useState(null);
  const smt = semesterSekarang();
  React.useEffect(()=>{ muat(); }, []);
  async function muat() {
    try {
      const guruId = sesi.pengguna.id;
      const pen = await fetchPenugasanGuru(guruId, getTASekarang());
      const ta = pen.ta || getTASekarang();
      const jurnal = await ambilSemua(()=>sb.from('supermad_jurnal')
        .select('id,tanggal,materi,jumlah_hadir,jumlah_sakit,jumlah_izin,jumlah_alpa')
        .eq('guru_id', guruId).eq('tahun_ajaran', ta).eq('semester', smt).order('tanggal'));
      const absen = j => ((j.jumlah_hadir||0)+(j.jumlah_sakit||0)+(j.jumlah_izin||0)+(j.jumlah_alpa||0))>0;
      const isiJurnal = j => j.materi && j.materi !== JURNAL_BELUM;
      const atur = aturanPenilaian(await muatAturanMadrasah(sesi.mad.id), ta, smt);
      const nilai = await hitungKelengkapanNilai(sesi.mad.id, ta, smt,
        pen.list.map(p=>({...p, kelas: p.supermad_kelas?.nama_kelas||''})).filter(p=>p.kelas), atur);
      setData({
        ta,
        jurnalTertunda: jurnal.filter(j=>absen(j) && !isiJurnal(j)).length,
        absenTertunda:  jurnal.filter(j=>isiJurnal(j) && !absen(j)).length,
        terakhir: jurnal.length ? jurnal[jurnal.length-1].tanggal : null,
        nilai, atur, wajib: komponenWajib(atur),
      });
    } catch(e) { console.error('Tugas Saya:', e); setData({error:true, nilai:[]}); }
  }
  if (!data) return (
    <div className="card" style={{marginBottom:12,padding:'12px 16px',fontSize:'.8rem',color:'var(--text3)'}}>⏳ Memeriksa tugas Anda...</div>
  );
  const wj = data.wajib || {formatif:true, sts:true, proyek:false, sas:false};
  const nilaiSebagian = data.nilai.filter(n=>['formatif','sts','proyek','sas'].some(j=>wj[j] && n.siswa>0 && n.jenis[j]<n.siswa));
  const jumlahTugas = data.jurnalTertunda + data.absenTertunda + (rtlBelum||0) + nilaiSebagian.length;
  const hari = hariSejak(data.terakhir);
  const item = (ikon, teks, warna, tab) => (
    <button type="button" onClick={()=>onBuka(tab)}
      style={{display:'flex',alignItems:'center',gap:8,width:'100%',textAlign:'left',padding:'8px 12px',
        borderRadius:9,border:'1.5px solid '+warna+'55',background:warna+'12',cursor:'pointer',fontFamily:'inherit',
        fontSize:'.8rem',color:'var(--text1)'}}>
      <span style={{fontSize:'1rem'}}>{ikon}</span><span style={{flex:1}}>{teks}</span>
      <span style={{color:warna,fontWeight:800}}>Buka →</span>
    </button>
  );
  const chip = (lbl, n, tot, dihitung=true, persen=false) => {
    if (!dihitung) return <span title="Belum masuk perhitungan kelengkapan (menunggu jadwal dari operator)"
      style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',fontWeight:600,color:'#9ca3af',
      background:'#f9fafb',border:'1px dashed #d1d5db'}}>{lbl} {n}/{tot} · belum dihitung</span>;
    n = Math.round(n*100)/100;
    const c = tot===0 ? '#9ca3af' : n>=tot ? '#16a34a' : n===0 ? '#dc2626' : '#d97706';
    return <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',fontWeight:700,color:c,
      background:c+'18',border:'1px solid '+c+'55'}}>{lbl} {persen ? (tot?Math.round(n/tot*100):0)+'%' : n+'/'+tot}</span>;
  };
  return (
    <div className="card" style={{marginBottom:12,padding:'12px 16px',
      border:'1.5px solid '+(jumlahTugas?'#fcd34d':'#86efac'),background:jumlahTugas?'#fffdf5':'#f7fef9'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:jumlahTugas||data.nilai.length?10:0,flexWrap:'wrap'}}>
        <div style={{fontWeight:800,color:'var(--p3)',fontSize:'.88rem',flex:1}}>
          ✅ Tugas Saya · Semester {smt} {data.ta}
        </div>
        {hari!=null && (
          <span style={{fontSize:'.72rem',color: hari>14?'#dc2626':hari>7?'#d97706':'var(--text2)'}}>
            Pertemuan terakhir tercatat: {hari===0?'hari ini':hari+' hari lalu'}
          </span>
        )}
      </div>
      {jumlahTugas===0 && (
        <div style={{fontSize:'.8rem',color:'#166534',marginBottom:data.nilai.length?10:0}}>
          🎉 Tidak ada tugas yang tertunda. Terima kasih!
        </div>
      )}
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {data.jurnalTertunda>0 && item('📓', <><b>{data.jurnalTertunda}</b> pertemuan sudah diabsen tetapi jurnalnya belum diisi</>, '#d97706', 'jurnal')}
        {data.absenTertunda>0 && item('🙋', <><b>{data.absenTertunda}</b> jurnal belum diabsen siswanya</>, '#0891b2', 'absensi')}
        {(rtlBelum||0)>0 && item('📋', <><b>{rtlBelum}</b> RTL supervisi belum Anda tanggapi</>, '#7c3aed', 'rtl')}
        {nilaiSebagian.length>0 && item('📝', <><b>{nilaiSebagian.length}</b> kelas dengan nilai yang belum lengkap sesuai aturan madrasah</>, '#dc2626', 'nilai')}
      </div>
      {data.nilai.length>0 && (
        <div style={{marginTop:10,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
          <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--text2)',marginBottom:5}}>
            Kelengkapan nilai (siswa terisi / jumlah siswa) · Formatif dihitung bertahap sampai {data.atur?.formatifMin||3}× per siswa
            {data.atur?.tglSAS ? ' · SAS & Proyek dihitung mulai '+new Date(data.atur.tglSAS+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'}) : ''}:
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {data.nilai.map(n=>(
              <div key={n.id} style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',fontSize:'.76rem'}}>
                <span style={{minWidth:150,fontWeight:600}}>{n.mapel} · {n.kelas}</span>
                {chip('Formatif '+(data.atur?.formatifMin||3)+'×', n.jenis.formatif, n.siswa, true, true)}
                {chip('STS', n.jenis.sts, n.siswa, wj.sts)}
                {data.atur?.slm?.proyek!==false && chip('Proyek', n.jenis.proyek, n.siswa, wj.proyek)}
                {chip('SAS', n.jenis.sas, n.siswa, wj.sas)}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function TabKepatuhanGuru({sesi, guruList, showToast, defaultTA, defaultSmt}) {

      <td class="c"><b style="color:${stInfo[r.status].c}">${stInfo[r.status].l}</b></td><td class="c"><b>${r.skor}</b></td></tr>`).join('');

// ── REKAP KEHADIRAN SEMESTER PER SISWA (operator & wali kelas) ──
async function ambilSemua(buatQuery) {
  // Ambil semua baris (melewati batas 1000 baris per permintaan)
  const hasil = []; const step = 1000;
  for (let from = 0; ; from += step) {
    const {data, error} = await buatQuery().range(from, from + step - 1);
    if (error) throw error;
    hasil.push(...(data||[]));
    if (!data || data.length < step) break;
  }
  return hasil;
}

function RekapKehadiranKelas({sesi, kelas, ta, showToast, onBack}) {
  const blnNow = new Date().getMonth()+1;
  const [smt, setSmt]         = React.useState(blnNow>=7 ? 'Ganjil' : 'Genap');
  const [loading, setLoading] = React.useState(true);
  const [rows, setRows]       = React.useState([]);
  const [info, setInfo]       = React.useState({hari:0, pertemuan:0});
  const [err, setErr]         = React.useState('');

  React.useEffect(()=>{ muat(); }, [smt]);

  async function muat() {
    setLoading(true); setErr('');
    try {
      const {data:sw} = await sb.from('supermad_siswa').select('id,nama,nis,jenis_kelamin')
        .eq('madrasah_id', sesi.mad.id).eq('kelas', kelas.nama_kelas).eq('tahun_ajaran', ta)
        .eq('aktif', true).order('nama');
      const siswa = sw||[];
      const jurnal = await ambilSemua(()=>sb.from('supermad_jurnal').select('id,tanggal,mapel')
        .eq('madrasah_id', sesi.mad.id).eq('kelas', kelas.nama_kelas)
        .eq('tahun_ajaran', ta).eq('semester', smt).order('tanggal'));
      const tglJurnal = {}; jurnal.forEach(j=>{ tglJurnal[j.id]=j.tanggal; });
      let absensi = [];
      const ids = jurnal.map(j=>j.id);
      for (let i=0; i<ids.length; i+=60) {
        const potong = ids.slice(i, i+60);
        const part = await ambilSemua(()=>sb.from('supermad_absensi').select('jurnal_id,siswa_id,status')
          .in('jurnal_id', potong).order('jurnal_id'));
        absensi = absensi.concat(part);
      }
      // Per siswa: hitung per pertemuan & per hari
      const perSiswa = {};
      absensi.forEach(a=>{
        const tgl = tglJurnal[a.jurnal_id]; if (!tgl) return;
        const ps = perSiswa[a.siswa_id] = perSiswa[a.siswa_id] || {p:{hadir:0,sakit:0,izin:0,alpa:0}, hari:{}};
        ps.p[a.status] = (ps.p[a.status]||0)+1;
        (ps.hari[tgl] = ps.hari[tgl] || []).push(a.status);
      });
      const hariSet = new Set(Object.values(tglJurnal));
      const hasil = siswa.map(s2=>{
        const ps = perSiswa[s2.id] || {p:{hadir:0,sakit:0,izin:0,alpa:0}, hari:{}};
        const h = {hadir:0,sakit:0,izin:0,alpa:0};
        Object.values(ps.hari).forEach(list=>{
          // Satu hari dianggap hadir bila hadir di salah satu pertemuan;
          // jika tidak hadir sama sekali: sakit > izin > alpa
          const st = list.includes('hadir') ? 'hadir' : list.includes('sakit') ? 'sakit' : list.includes('izin') ? 'izin' : 'alpa';
          h[st]++;
        });
        const totHari = h.hadir+h.sakit+h.izin+h.alpa;
        return {...s2, p: ps.p, h, totHari, pct: totHari ? h.hadir/totHari*100 : null};
      });
      setRows(hasil);
      setInfo({hari: hariSet.size, pertemuan: jurnal.length});
    } catch(e) {
      setErr(e.message||String(e));
    }
    setLoading(false);
  }

          <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:8,lineHeight:1.5}}>
            💡 Satu hari dihitung <b>hadir</b> bila siswa hadir di salah satu pertemuan hari itu. Bila tidak hadir sama sekali,
            status hari mengikuti urutan Sakit → Izin → Alpa. Kolom "Per Hari" inilah yang dipakai untuk rapor.
          </div>
        </>
      )}
    </div>
  );
}

// ── TAB KELAS & SISWA (OPERATOR) ─────────────────────────────
function TabKelasSiswa({sesi, showToast}) {
  const [kelasList, setKelasList]   = React.useState([]);
  const [siswaList, setSiswaList]   = React.useState([]);
  const [loading, setLoading]       = React.useState(true);
  const [view, setView]             = React.useState('kelas'); // 'kelas' | 'siswa'
  const [activeKelas, setActiveKelas] = React.useState(null);
  const [filterTA, setFilterTA]     = React.useState(getTASekarang());
  const [showFormKelas, setShowFormKelas] = React.useState(false);
  const [editKelas, setEditKelas]   = React.useState(null);
  const [formKelas, setFormKelas]   = React.useState({nama_kelas:'',tingkat:'VII',wali_kelas:'',wali_guru_id:''});
  const [guruOpsi, setGuruOpsi]     = React.useState([]);
  const [rekapKelas, setRekapKelas] = React.useState(null);
  React.useEffect(()=>{ rpcSesi('supermad_list_guru', sesi).then(({data})=>setGuruOpsi((data||[]).filter(g=>g.aktif!==false))); }, []);
  const [showFormSiswa, setShowFormSiswa] = React.useState(false);
  const [editSiswa, setEditSiswa]   = React.useState(null);
  const [formSiswa, setFormSiswa]   = React.useState({nama:'',nis:'',jenis_kelamin:'L'});
  const [importSiswaStatus, setImportSiswaStatus] = React.useState('');
  const [statsAll, setStatsAll] = React.useState(null); // {total,L,P,perKelas:{...}}

  React.useEffect(()=>{ loadKelas(filterTA); }, [filterTA]);

  async function loadKelas(ta) {
    setLoading(true);
    const [{data:kData},{data:sData}] = await Promise.all([
      sb.from('supermad_kelas').select('*')
        .eq('madrasah_id', sesi.mad.id).eq('tahun_ajaran', ta||filterTA)
        .order('tingkat').order('nama_kelas'),
      sb.from('supermad_siswa').select('id,kelas,jenis_kelamin')
        .eq('madrasah_id', sesi.mad.id).eq('tahun_ajaran', ta||filterTA).eq('aktif',true),
    ]);
    setKelasList(kData||[]);
    // Hitung stats
    const all = sData||[];
    const perKelas = {};
    all.forEach(s=>{
      if (!perKelas[s.kelas]) perKelas[s.kelas] = {L:0,P:0};
      perKelas[s.kelas][s.jenis_kelamin==='P'?'P':'L']++;
    });
    setStatsAll({
      total: all.length,
      L: all.filter(s=>s.jenis_kelamin!=='P').length,
      P: all.filter(s=>s.jenis_kelamin==='P').length,
      perKelas,
    });
    setLoading(false);
  }

  async function loadSiswa(kelasNama, ta) {
    const {data} = await sb.from('supermad_siswa').select('*')
      .eq('madrasah_id', sesi.mad.id)
      .eq('kelas', kelasNama)
      .eq('tahun_ajaran', ta||filterTA)
      .eq('aktif', true)
      .order('nama');
    setSiswaList(data||[]);
  }

  function bukaKelas(k) {
    setActiveKelas(k);
    setView('siswa');
    loadSiswa(k.nama_kelas, filterTA);
  }

  async function simpanKelas(e) {
    e.preventDefault();
    const payload = {...formKelas, wali_guru_id: formKelas.wali_guru_id || null,
      madrasah_id: sesi.mad.id, tahun_ajaran: filterTA, aktif: true};
    let error;
    if (editKelas) {
      ({error} = await sb.from('supermad_kelas').update(payload).eq('id', editKelas.id));
    } else {
      ({error} = await sb.from('supermad_kelas').insert(payload));
    }
    if (error) {
      showToast(String(error.message).includes('wali_guru_id')
        ? 'Kolom wali kelas belum tersedia. Jalankan SQL supermad_wali_kelas.sql terlebih dahulu.'
        : 'Gagal: '+error.message,'error');
      return;
    }
    showToast('✅ Kelas '+(editKelas?'diperbarui':'ditambahkan')+'!');
    setShowFormKelas(false); setEditKelas(null);
    setFormKelas({nama_kelas:'',tingkat:'VII',wali_kelas:'',wali_guru_id:''});
    loadKelas(filterTA);
  }

  async function hapusKelas(k) {
    if (!confirm(`Hapus kelas "${k.nama_kelas}"? Semua siswa di kelas ini juga akan dihapus.`)) return;
    await sb.from('supermad_siswa').delete().eq('madrasah_id', sesi.mad.id).eq('kelas', k.nama_kelas).eq('tahun_ajaran', filterTA);
    await sb.from('supermad_kelas').delete().eq('id', k.id);
    showToast('🗑️ Kelas dihapus');
    loadKelas(filterTA);
  }

  async function simpanSiswa(e) {
    e.preventDefault();
    const payload = {
      ...formSiswa,
      madrasah_id: sesi.mad.id,
      kelas: activeKelas.nama_kelas,
      tahun_ajaran: filterTA,
      aktif: true,
    };
    let error;
    if (editSiswa) {
      ({error} = await sb.from('supermad_siswa').update(payload).eq('id', editSiswa.id));
    } else {
      ({error} = await sb.from('supermad_siswa').insert(payload));
    }
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Siswa '+(editSiswa?'diperbarui':'ditambahkan')+'!');
    setShowFormSiswa(false); setEditSiswa(null);
    setFormSiswa({nama:'',nis:'',jenis_kelamin:'L'});
    loadSiswa(activeKelas.nama_kelas, filterTA);
  }

  async function hapusSiswa(s) {
    if (!confirm(`Hapus siswa "${s.nama}"?`)) return;
    await sb.from('supermad_siswa').delete().eq('id', s.id);
    showToast('🗑️ Siswa dihapus');

  function downloadTemplateSiswa() {
    // Pakai CSV dengan separator semicolon (sesuai Excel Indonesia)
    // Tambahkan 'sep=;' di baris pertama agar Excel otomatis pakai semicolon
    const csv = [
      'sep=;',
      'Tingkat;Rombel;Nama Siswa;NISN;Gender (L/P);Wali Kelas',
      'VII;VII-A;NAMA SISWA CONTOH;3201234567;L;'+(guruOpsi[0]?.nama||'Nama Guru Wali VII-A'),
      'VII;VII-A;NAMA SISWA KEDUA;3201234568;P;',
      'VIII;VIII-B;NAMA SISWA KETIGA;3201234569;P;'+(guruOpsi[1]?.nama||'Nama Guru Wali VIII-B'),
      '',
      'PETUNJUK: Kolom Wali Kelas cukup diisi pada SATU baris per rombel (boleh juga semua baris). Tulis nama guru persis seperti di Daftar Guru SUPERMAD. Hapus baris contoh dan petunjuk ini sebelum diimpor.',
    ].join('\r\n');
    const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'template_import_siswa.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  }

  // Hapus semua siswa + kelas untuk TA yang dipilih
  async function hapusSemuaData() {
    const konfirm = window.confirm(
      `⚠️ HAPUS SEMUA DATA TA ${filterTA}?\n\nIni akan menghapus:\n- Semua siswa (${statsAll?.total||0} siswa)\n- Semua kelas (${kelasList.length} kelas)\n\nData yang sudah terhapus TIDAK bisa dikembalikan.\n\nKetik OK untuk konfirmasi.`
    );
    if (!konfirm) return;
    setLoading(true);
    try {
      // Hapus siswa dulu
      const {error:e1} = await sb.from('supermad_siswa')
        .delete()
        .eq('madrasah_id', sesi.mad.id)
        .eq('tahun_ajaran', filterTA);
      if (e1) throw new Error('Gagal hapus siswa: ' + e1.message);
      // Hapus kelas
      const {error:e2} = await sb.from('supermad_kelas')
        .delete()
        .eq('madrasah_id', sesi.mad.id)
        .eq('tahun_ajaran', filterTA);
      if (e2) throw new Error('Gagal hapus kelas: ' + e2.message);
      setImportSiswaStatus('✅ Semua data siswa dan kelas TA ' + filterTA + ' berhasil dihapus. Silakan import ulang.');
      await loadKelas(filterTA);
    } catch(err) {
      setImportSiswaStatus('❌ ' + err.message);
    }
    setLoading(false);
  }

  // Import excel dari view kelas (auto-buat kelas + siswa)
  async function importSiswaExcelGlobal(e) {
    const file = e.target.files[0];
    if (!file) return;
    setImportSiswaStatus('⏳ Memproses file...');
    try {
      let rows;
      if (file.name.toLowerCase().endsWith('.csv')) {
        // Baca CSV langsung tanpa XLSX
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l=>l.trim() && !l.startsWith('sep='));
        // Deteksi separator: semicolon atau koma
        const sep = lines[0] && lines[0].includes(';') ? ';' : ',';
        rows = lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));
      } else {
        const buf = await file.arrayBuffer();
        const wb  = window.XLSX.read(buf,{type:'array'});
        const ws  = wb.Sheets[wb.SheetNames[0]];
        rows = window.XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      }
      if (rows.length < 2) { setImportSiswaStatus('❌ File kosong atau tidak ada data.'); return; }

      // Deteksi format header
      const header = rows[0].map(h=>String(h).toLowerCase().trim());
      const iWali  = header.findIndex(h=>h.includes('wali'));
      let iFormatBaru = header.findIndex(h=>h.includes('rombel'));
      if (iFormatBaru === -1) iFormatBaru = header.findIndex(h=>h.includes('kelas') && !h.includes('wali'));
      const iFormatTingkat = header.findIndex(h=>h.includes('tingkat'));
      const iNama  = header.findIndex(h=>h.includes('nama') && !h.includes('wali') && !h.includes('guru'));
      const iNisn  = header.findIndex(h=>h.includes('nisn')||h.includes('nis'));
      const iGender= header.findIndex(h=>h.includes('gender')||h.includes('jenis')||h.includes('l/p'));

      if (iNama === -1) { setImportSiswaStatus('❌ Kolom "Nama Siswa" tidak ditemukan.'); return; }

      // Kelompokkan siswa per kelas
      const kelasMap = {}; // nama_kelas -> [{nama, nisn, gender, tingkat}]
      rows.slice(1).forEach(r=>{
        const nama = String(r[iNama]||'').trim();
        if (!nama || nama.toUpperCase().startsWith('PETUNJUK')) return;
        let namaKelas = activeKelas ? activeKelas.nama_kelas : '';
        let tingkat = '';
        if (iFormatBaru > -1 && !activeKelas) {
          namaKelas = String(r[iFormatBaru]||'').trim();
        }
        if (iFormatTingkat > -1) {
          tingkat = String(r[iFormatTingkat]||'').trim();
          // Kalau kelas kosong, pakai Tingkat-Rombel
          if (!namaKelas && iFormatBaru > -1) namaKelas = String(r[iFormatBaru]||'').trim();
          if (!namaKelas) namaKelas = tingkat;
        }
        if (!namaKelas) return;
        if (!kelasMap[namaKelas]) kelasMap[namaKelas] = {tingkat, siswa:[], wali:''};
        const waliTxt = iWali > -1 ? String(r[iWali]||'').trim() : '';
        if (waliTxt && !kelasMap[namaKelas].wali) kelasMap[namaKelas].wali = waliTxt;
        kelasMap[namaKelas].siswa.push({
          nama,
          nis: iNisn > -1 ? String(r[iNisn]||'').trim() : '',
          jenis_kelamin: iGender > -1 ? (String(r[iGender]||'').trim().toUpperCase()==='P' ? 'P' : 'L') : 'L',
        });
      });

      const namaKelasList = Object.keys(kelasMap);
      if (!namaKelasList.length) { setImportSiswaStatus('❌ Tidak ada data valid.'); return; }

      let totalKelasNew = 0, totalSiswa = 0, totalWali = 0;
      const waliGagal = [];

      // Cocokkan nama wali kelas ke daftar guru (abaikan huruf besar/kecil, tanda baca, dan gelar)
      let daftarGuru = guruOpsi;
      if (!daftarGuru.length) { const {data} = await rpcSesi('supermad_list_guru', sesi); daftarGuru = (data||[]).filter(g=>g.aktif!==false); }
      const norm = t => String(t||'').toLowerCase().replace(/[.,'`]/g,' ').replace(/\s+/g,' ').trim();
      const inti = t => norm(String(t||'').split(',')[0])
        .replace(/^((drs|dra|dr|h|hj|ir|prof|tgk|teungku|ust|ustadz|ustazah|ustadzah)\s+)+/,'').trim();
      function cariGuru(namaTxt) {
        if (!namaTxt) return null;
        let cocok = daftarGuru.filter(g=>norm(g.nama)===norm(namaTxt));
        if (cocok.length===1) return cocok[0];
        cocok = daftarGuru.filter(g=>inti(g.nama)===inti(namaTxt));
        return cocok.length===1 ? cocok[0] : null;
      }

      for (const namaKelas of namaKelasList) {
        const {tingkat, siswa, wali} = kelasMap[namaKelas];
        const guruWali = cariGuru(wali);
        if (wali && !guruWali) waliGagal.push(namaKelas+' ("'+wali+'")');
        const dataWali = guruWali ? {wali_guru_id: guruWali.id, wali_kelas: guruWali.nama} : {};
        // Auto-buat kelas kalau belum ada; perbarui wali bila kelas sudah ada
        const existing = kelasList.find(k=>k.nama_kelas===namaKelas);
        if (!existing) {
          const {error:ek} = await sb.from('supermad_kelas').insert({
            madrasah_id: sesi.mad.id,
            nama_kelas: namaKelas,
            tingkat: tingkat||namaKelas,
            tahun_ajaran: filterTA,
            aktif: true,
            ...dataWali,
          });
          if (!ek) { totalKelasNew++; if (guruWali) totalWali++; }
        } else if (guruWali) {
          const {error:ew} = await sb.from('supermad_kelas').update(dataWali).eq('id', existing.id);
          if (!ew) totalWali++;
        }
        // Insert siswa
        const rows2 = siswa.map(s=>({
          ...s,
          madrasah_id: sesi.mad.id,
          kelas: namaKelas,
          tahun_ajaran: filterTA,
          aktif: true,
        }));
        const {error:es} = await sb.from('supermad_siswa').insert(rows2);
        if (!es) totalSiswa += rows2.length;
      }

      setImportSiswaStatus(`✅ Import selesai! ${totalKelasNew} kelas baru dibuat, ${totalSiswa} siswa ditambahkan`
        + (iWali>-1 ? `, ${totalWali} wali kelas ditetapkan.` : '.')
        + (waliGagal.length ? ` ⚠️ Nama wali tidak dikenali (atur manual lewat ✏️ Edit): ${waliGagal.join(', ')}` : ''));
      loadKelas(filterTA);
    } catch(err) {
      setImportSiswaStatus('❌ '+err.message);
    }
    e.target.value='';
  }

  // Import dari dalam view siswa (sudah di dalam kelas tertentu)
  async function importSiswaExcel(e) {
    const file = e.target.files[0];
    if (!file) return;
    setImportSiswaStatus('⏳ Memproses...');

      const buf = await file.arrayBuffer();
      const wb  = XLSX.read(buf,{type:'array'});
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const rows= XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const header = rows[0].map(h=>String(h).toLowerCase().trim());
      const iNama  = header.findIndex(h=>h.includes('nama'));
      const iNisn  = header.findIndex(h=>h.includes('nisn')||h.includes('nis'));
      const iGender= header.findIndex(h=>h.includes('gender')||h.includes('jenis')||h.includes('l/p'));
      const data= rows.slice(1).filter(r=>r[iNama>-1?iNama:1]).map(r=>({
        madrasah_id: sesi.mad.id,
        kelas: activeKelas.nama_kelas,
        tahun_ajaran: filterTA,
        nama: String(r[iNama>-1?iNama:1]).trim(),
        nis: String(r[iNisn>-1?iNisn:2]||'').trim(),
        jenis_kelamin: String(r[iGender>-1?iGender:3]||'L').trim().toUpperCase()==='P'?'P':'L',
        aktif: true,
      }));
      if (!data.length) { setImportSiswaStatus('❌ Tidak ada data ditemukan.'); return; }
      const {error} = await sb.from('supermad_siswa').insert(data);
      if (error) { setImportSiswaStatus('❌ '+error.message); return; }
      setImportSiswaStatus(`✅ ${data.length} siswa berhasil diimport!`);
      loadSiswa(activeKelas.nama_kelas, filterTA);
    } catch(err) {
      setImportSiswaStatus('❌ '+err.message);
    }
    e.target.value='';
  }

  const tingkatList = sesi.mad.naungan==='Pesantren'
    ? ['Kelas 1','Kelas 2','Kelas 3','Kelas 4','Kelas 5','Kelas 6']
    : ['VII','VIII','IX','X','XI','XII'];

  if (rekapKelas) return (
    <RekapKehadiranKelas sesi={sesi} kelas={rekapKelas} ta={filterTA} showToast={showToast}

  );
  if (loading) return <Loading text="Memuat kelas..." />;

  // VIEW DAFTAR SISWA
  if (view==='siswa' && activeKelas) return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
        <button className="btn btn-outline btn-sm" onClick={()=>{setView('kelas');setActiveKelas(null);setSiswaList([]);}}>
          ← Kembali
        </button>
        <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem',flex:1}}>
          🏫 Siswa Kelas {activeKelas.nama_kelas}
        </div>
        <span style={{fontSize:'.8rem',color:'var(--text2)'}}>
          {siswaList.length} siswa · {filterTA}
        </span>
      </div>

      {importSiswaStatus && (
        <div style={{padding:'10px 14px',borderRadius:9,marginBottom:12,fontSize:'.8rem',
          background:importSiswaStatus.startsWith('✅')?'#f0fdf4':importSiswaStatus.startsWith('❌')?'#fef2f2':'#fffbeb',
          border:'1px solid '+(importSiswaStatus.startsWith('✅')?'#86efac':importSiswaStatus.startsWith('❌')?'#fca5a5':'#fcd34d'),
          color:importSiswaStatus.startsWith('✅')?'#166534':importSiswaStatus.startsWith('❌')?'#991b1b':'#92400e'}}>
          {importSiswaStatus}
        </div>
      )}

      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{flex:1}}/>
        <button className="btn btn-outline btn-sm" onClick={downloadTemplateSiswa}>📥 Template Excel</button>
        <label className="btn btn-outline btn-sm" style={{cursor:'pointer',margin:0}}>
          📤 Import Excel
          <input type="file" accept=".xlsx,.xls" onChange={importSiswaExcel} style={{display:'none'}}/>
        </label>
        <button className="btn btn-primary btn-sm" onClick={()=>{
          setShowFormSiswa(!showFormSiswa); setEditSiswa(null);
          setFormSiswa({nama:'',nis:'',jenis_kelamin:'L'});
        }}>
          {showFormSiswa?'✕ Batal':'+ Tambah Siswa'}

                      background:s.jenis_kelamin==='P'?'#fce7f3':'#dbeafe',

      {siswaList.length > 0 && (
        <div style={{marginTop:10,fontSize:'.78rem',color:'var(--text3)',textAlign:'right'}}>

        </div>
      )}
    </div>
  );

  // VIEW DAFTAR KELAS
  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:8,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem',flex:1}}>🏫 Kelas & Siswa</div>
        <select value={filterTA} onChange={e=>setFilterTA(e.target.value)}
          style={{padding:'6px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:'.8rem',fontFamily:'inherit'}}>
          {[getTASekarang(), (()=>{const [a]=getTASekarang().split('/');return (a-1)+'/'+(a);})(),(()=>{const [a]=getTASekarang().split('/');return (parseInt(a)+1)+'/'+(parseInt(a)+2);})()] .filter((v,i,a)=>a.indexOf(v)===i).map(ta=>(
            <option key={ta} value={ta}>{ta}</option>
          ))}
        </select>
        <button className="btn btn-primary btn-sm" onClick={()=>{
          setShowFormKelas(!showFormKelas); setEditKelas(null);
          setFormKelas({nama_kelas:'',tingkat:tingkatList[0],wali_kelas:'',wali_guru_id:''});
        }}>
          {showFormKelas?'✕ Batal':'+ Tambah Kelas'}
        </button>
      </div>

      {/* Stats Dashboard */}
      {statsAll && (
        <div style={{marginBottom:14}}>
          {/* Stat cards baris atas */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:10,marginBottom:10}}>
            {[
              {label:'Total Siswa',val:statsAll.total,icon:'👥',color:'#2563eb',bg:'#dbeafe'},
              {label:'Laki-laki',  val:statsAll.L,    icon:'👦',color:'#0891b2',bg:'#cffafe'},
              {label:'Perempuan',  val:statsAll.P,    icon:'👧',color:'#db2777',bg:'#fce7f3'},
              {label:'Jumlah Kelas',val:kelasList.length,icon:'🏫',color:'#059669',bg:'#d1fae5'},

          {/* Bar rasio L/P */}
          {statsAll.total > 0 && (
            <div style={{background:'#fff',borderRadius:12,padding:'12px 16px',

              <div style={{display:'flex',justifyContent:'space-between',fontSize:'.75rem',
                fontWeight:700,marginBottom:6}}>
                <span style={{color:'#0891b2'}}>👦 L: {statsAll.L} ({Math.round(statsAll.L/statsAll.total*100)}%)</span>
                <span style={{color:'#db2777'}}>P: {statsAll.P} ({Math.round(statsAll.P/statsAll.total*100)}%) 👧</span>
              </div>

                <div style={{flex:1,background:'#db2777'}}/>

            </div>
          )}
          {/* Rekap per tingkat */}
          {(()=>{
            const perTingkat = {};
            kelasList.forEach(k=>{
              const t = k.tingkat||k.nama_kelas;
              if (!perTingkat[t]) perTingkat[t] = {kelas:0,L:0,P:0};

              perTingkat[t].L += st.L; perTingkat[t].P += st.P;

                      <td style={{padding:'6px 10px'}}>TOTAL</td>
                      <td style={{padding:'6px 10px',textAlign:'center'}}>{kelasList.length}</td>
                      <td style={{padding:'6px 10px',textAlign:'center'}}>{statsAll.L}</td>
                      <td style={{padding:'6px 10px',textAlign:'center'}}>{statsAll.P}</td>
                      <td style={{padding:'6px 10px',textAlign:'center'}}>{statsAll.total}</td>

                </table>
              </div>
            );

        </div>
      )}

      {/* Import massal */}
      <div style={{display:'flex',gap:8,marginBottom:6,flexWrap:'wrap',alignItems:'center',
        padding:'10px 14px',background:'#f0fdf4',borderRadius:10,border:'1.5px solid #86efac'}}>
        <div style={{fontSize:'.8rem',color:'#166534',flex:1}}>
          <b>📤 Import Massal</b> — Upload Excel berisi kolom: <i>Tingkat, Rombel, Nama Siswa, NISN, Gender (L/P), Wali Kelas</i>

        <button className="btn btn-outline btn-sm" onClick={downloadTemplateSiswa}>📥 Download Template</button>
        <label className="btn btn-primary btn-sm" style={{cursor:'pointer',margin:0}}>
          📤 Import Excel
          <input type="file" accept=".xlsx,.xls,.csv" onChange={importSiswaExcelGlobal} style={{display:'none'}}/>
        </label>
      </div>
      {/* Hapus semua data */}
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}>
        <button className="btn btn-sm" onClick={hapusSemuaData}
          style={{background:'#fef2f2',color:'#991b1b',border:'1.5px solid #fca5a5',fontSize:'.75rem'}}>
          🗑️ Hapus Semua Data TA {filterTA}
        </button>
      </div>

      {showFormKelas && (
        <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
            {editKelas?'✏️ Edit Kelas':'+ Tambah Kelas'}
          </div>
          <form onSubmit={simpanKelas}>
            <div className="grid2">
              <div className="form-group">
                <label>Nama Kelas *</label>
                <input value={formKelas.nama_kelas} onChange={e=>setFormKelas({...formKelas,nama_kelas:e.target.value})} required
                  placeholder="Contoh: VII-A atau 7A"/>
              </div>
              <div className="form-group">
                <label>Tingkat *</label>
                <select value={formKelas.tingkat} onChange={e=>setFormKelas({...formKelas,tingkat:e.target.value})}>
                  {tingkatList.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Wali Kelas <span style={{fontWeight:400,color:'var(--text3)'}}>(pilih dari daftar guru)</span></label>
                <select value={formKelas.wali_guru_id||''} onChange={e=>{
                  const g = guruOpsi.find(x=>String(x.id)===e.target.value);
                  setFormKelas({...formKelas, wali_guru_id: e.target.value, wali_kelas: g ? g.nama : ''});
                }}>
                  <option value="">— Belum ditentukan —</option>
                  {guruOpsi.map(g=><option key={g.id} value={g.id}>{g.nama}{g.mapel?' ('+g.mapel+')':''}</option>)}
                </select>
                {formKelas.wali_kelas && !formKelas.wali_guru_id && (
                  <div style={{fontSize:'.7rem',color:'#92400e',marginTop:4}}>
