  function md5ff(a,b,c,d,x,s,t){return md5cmn((b&c)|((~b)&d),a,b,x,s,t);}
  function md5gg(a,b,c,d,x,s,t){return md5cmn((b&d)|(c&(~d)),a,b,x,s,t);}
  function md5hh(a,b,c,d,x,s,t){return md5cmn(b^c^d,a,b,x,s,t);}

    a=md5ii(a,b,c,d,words[i+12],6,1700485571);d=md5ii(d,a,b,c,words[i+3],10,-1894986606);c=md5ii(c,d,a,b,words[i+10],15,-1051523);b=md5ii(b,c,d,a,words[i+1],21,-2054922799);

// Cek password: cocokkan plaintext ATAU md5
function cekPass(input, stored) {
  if (!input || !stored) return false;
  return stored === input || stored === md5(input);
}

// Setiap permintaan data (REST/RPC) membawa token sesi → database hanya melayani data madrasah sendiri
function supermadFetch(url, opts) {
  opts = opts || {};
  try {
    if (String(url).includes('/rest/v1/')) {
      const sv = JSON.parse(localStorage.getItem('supermad_sesi')||'null');
      if (sv && sv.token) {
        const h = new Headers(opts.headers || {});
        h.set('x-supermad-sesi', sv.token);
        opts = {...opts, headers: h};
      }
    }
  } catch(e) {}
  return fetch(url, opts);
}
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {global: {fetch: supermadFetch}});

// ── RPC BERSESI (data sensitif hanya lewat fungsi server) ─────
function sesiValid(s) {
  if (!s || !s.pengguna || !s.mode) return false;
  if (s.mode === 'admin_kanwil') return true;
  return !!s.token; // sesi lama tanpa token → wajib login ulang
}
async function rpcSesi(nama, sesi) {
  const {data, error} = await sb.rpc(nama, {p_sesi: sesi && sesi.token});
  if (error) {
    if (String(error.message||'').includes('SESI_TIDAK_VALID')) {
      window.dispatchEvent(new Event('supermad-sesi-habis'));
    }
    console.error(nama, error);
    return {data:null, error};
  }
  return {data, error:null};
}

// Komponen live lookup nama madrasah saat ketik NPSN
function NamaMadrasah({npsn}) {
  const [nama, setNama] = React.useState('');
  const [loading, setLoading] = React.useState(true);
  React.useEffect(()=>{
    setLoading(true); setNama('');
    if (!npsn || npsn.length < 8) return;
    sb.rpc('supermad_cek_npsn', {p_npsn: npsn.trim()})
      .then(({data})=>{
        setNama(data ? data : 'NPSN tidak ditemukan');
        setLoading(false);
      });
  }, [npsn]);
  if (loading) return <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>⏳ Mencari...</div>;
  if (!nama || nama==='NPSN tidak ditemukan') return null;
  return (
    <div style={{marginTop:6,padding:'6px 10px',borderRadius:7,
      background:'#f0fdf4',border:'1px solid #86efac',
      fontSize:'.78rem',fontWeight:700,color:'#065f46'}}>
      🏫 {nama}
    </div>
  );
}

function GantiPasswordPertama({sesi, onDone, onLogout}) {
  const [pass1, setPass1] = React.useState('');
  const [pass2, setPass2] = React.useState('');
  const [err, setErr]     = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [done, setDone]   = React.useState(false);

  async function handleGanti(e) {
    e.preventDefault();
    setErr('');
    if (pass1.length < 8) { setErr('Password minimal 8 karakter.'); return; }
    if (pass1 !== pass2)  { setErr('Konfirmasi password tidak cocok.'); return; }
    if (pass1 === 'Supermad@2026') { setErr('Password tidak boleh sama dengan password sementara.'); return; }
    setLoading(true);
    try {
      const {error} = await sb.auth.updateUser({password: pass1});
      if (error) { setErr('Gagal ganti password: '+error.message); return; }
      setDone(true);
      setTimeout(()=>onDone(), 2000);
    } catch(e) {
      setErr('Error: '+e.message);
    } finally { setLoading(false); }
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      background:'linear-gradient(135deg,#063d35,#0e7c6e)',padding:16}}>
      <div style={{background:'#fff',borderRadius:18,padding:'32px 28px',width:'100%',maxWidth:400,
        boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:'2.5rem',marginBottom:8}}>🔑</div>
          <div style={{fontWeight:900,fontSize:'1.2rem',color:'#1e40af'}}>Ganti Password</div>
          <div style={{fontSize:'.8rem',color:'#64748b',marginTop:6}}>
            Halo <b>{sesi?.pengguna?.nama}</b>! Anda login pertama kali.<br/>
            Silakan ganti password sementara Anda.
          </div>
        </div>
        {done ? (
          <div style={{textAlign:'center',color:'#16a34a',fontWeight:700,padding:16}}>
            ✅ Password berhasil diganti! Mengalihkan...
          </div>
        ) : (
          <form onSubmit={handleGanti}>
            <div className="form-group">
              <label>Password Baru *</label>
              <input type="password" value={pass1} onChange={e=>setPass1(e.target.value)}
                placeholder="Minimal 8 karakter" required autoFocus/>
            </div>
            <div className="form-group">
              <label>Konfirmasi Password *</label>
              <input type="password" value={pass2} onChange={e=>setPass2(e.target.value)}
                placeholder="Ulangi password baru" required/>
            </div>
            {err && <div style={{color:'#dc2626',fontSize:'.8rem',marginBottom:10}}>⚠️ {err}</div>}
            <button className="btn btn-primary" type="submit" disabled={loading}
              style={{width:'100%',justifyContent:'center'}}>
              {loading ? '⏳ Menyimpan...' : '🔐 Simpan Password Baru'}
            </button>
            <button type="button" onClick={onLogout}
              style={{width:'100%',marginTop:8,padding:'8px',border:'none',background:'none',
                color:'#94a3b8',cursor:'pointer',fontSize:'.8rem'}}>
              Keluar
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

      const needsReset = pass.trim() === 'Supermad@2026';

// ── PILIH PENGGUNA (setelah login madrasah) ────────────────────
function PilihPengguna({mad, penggunaList, token, onPilih, onBack}) {
  const [dipilih, setDipilih] = React.useState(null);
  const [pass, setPass]       = React.useState('');
  const [err, setErr]         = React.useState('');
  const [loading, setLoading] = React.useState(false);

  async function masuk(e) {
    e.preventDefault();
    if (!dipilih) return;
    setErr(''); setLoading(true);
    try {
      const {data:res, error} = await sb.rpc('supermad_pilih_pengguna',
        {p_sesi: token, p_pengguna_id: String(dipilih.id), p_password: pass});
      if (error) { setErr('Error: '+error.message); return; }
      if (!res || res.error) { setErr(res?.error || 'Password salah.'); return; }
      onPilih(res.pengguna);
    } catch(e2) { setErr('Koneksi gagal: '+e2.message); }
    finally { setLoading(false); }
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      background:'linear-gradient(135deg,#063d35,#0e7c6e)',padding:16}}>
      <div style={{background:'#fff',borderRadius:18,padding:'28px 24px',width:'100%',maxWidth:400,
        boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontWeight:900,fontSize:'1rem',color:'var(--p3)'}}>{mad.nama}</div>
          <div style={{fontSize:'.76rem',color:'var(--text2)',marginTop:4}}>
            {dipilih ? 'Masukkan password akun Anda' : 'Pilih akun Anda'}
          </div>
        </div>

        {!dipilih ? (
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {penggunaList.map(p => (
              <button key={p.id} onClick={() => { setDipilih(p); setPass(''); setErr(''); }}
                style={{padding:'12px 16px',background:'var(--surface2)',border:'1.5px solid var(--border)',
                  borderRadius:10,cursor:'pointer',textAlign:'left',transition:'all .15s',fontFamily:'inherit'}}
                onMouseOver={e=>e.currentTarget.style.borderColor='var(--p)'}
                onMouseOut={e=>e.currentTarget.style.borderColor='var(--border)'}>
                <div style={{fontWeight:700,fontSize:'.88rem',color:'var(--text1)'}}>{p.nama}</div>
                <div style={{fontSize:'.72rem',color:'var(--text2)',marginTop:2}}>
                  {p.jabatan} · {p.role === 'operator' ? 'Operator' : 'Supervisor'}
                </div>
              </button>
            ))}
            {!penggunaList.length && (
              <div style={{textAlign:'center',color:'var(--text3)',fontSize:'.82rem',padding:20}}>
                Belum ada pengguna terdaftar.<br/>Hubungi Admin SUPERMAD.
              </div>
            )}
          </div>
        ) : (
          <form onSubmit={masuk}>
            <div style={{padding:'10px 14px',background:'#f0fdf4',border:'1px solid #86efac',borderRadius:10,marginBottom:12}}>
              <div style={{fontWeight:700,fontSize:'.88rem'}}>{dipilih.nama}</div>
              <div style={{fontSize:'.72rem',color:'var(--text2)'}}>
                {dipilih.jabatan} · {dipilih.role === 'operator' ? 'Operator' : 'Supervisor'}
              </div>
            </div>
            <div className="form-group">
              <label>Password *</label>
              <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
                placeholder="Password akun" required autoFocus/>
            </div>
            {err && <div style={{color:'var(--red)',fontSize:'.78rem',marginBottom:8}}>⚠️ {err}</div>}
            <button className="btn btn-primary" type="submit" disabled={loading}
              style={{width:'100%',justifyContent:'center'}}>
              {loading ? '⏳ Memeriksa...' : '🔓 Masuk'}
            </button>
            <button type="button" className="btn btn-outline" style={{width:'100%',justifyContent:'center',marginTop:8}}
              onClick={()=>{ setDipilih(null); setErr(''); }}>← Pilih Akun Lain</button>
            <div style={{fontSize:'.7rem',color:'var(--text3)',textAlign:'center',marginTop:10}}>
              Lupa password? Minta operator madrasah atau Admin SUPERMAD mereset password Anda.
            </div>
          </form>
        )}

        {!dipilih && (
          <button className="btn btn-outline" style={{width:'100%',justifyContent:'center',marginTop:14}}
            onClick={onBack}>← Ganti Madrasah</button>
        )}
      </div>
    </div>
  );
}

// ── APP UTAMA ──────────────────────────────────────────────────
function App() {
  // Restore sesi dari localStorage saat pertama load
  const [sesi, setSesi]   = useState(()=>{
    try {
      const saved = localStorage.getItem('supermad_sesi');
      if (!saved) return null;
      const parsed = JSON.parse(saved);
      // Validasi: harus punya pengguna, mode, dan token sesi (kecuali Kanwil)
      if (!sesiValid(parsed)) { localStorage.removeItem('supermad_sesi'); return null; }
      return parsed;
    } catch(e) { return null; }
  });
  const [step, setStep]   = useState(()=>{
    try {
      const saved = localStorage.getItem('supermad_sesi');
      if (!saved) return 'login';
      const parsed = JSON.parse(saved);
      if (!sesiValid(parsed)) return 'login';
      return 'app';
    } catch(e) { return 'login'; }
  });
  const [loginData, setLoginData] = useState(null);
  const [toast, setToast] = useState(null);
  const [infoKode, setInfoKode] = useState(null); // tampil sekali setelah registrasi operator

  function showToast(msg, type='success') {
    setToast({msg, type, key: Date.now()});
  }

  // Refresh data madrasah dari DB saat restore dari localStorage
  React.useEffect(() => {
    if (sesi && sesi.mad && sesi.mad.id && sesi.token) {
      rpcSesi('supermad_get_madrasah', sesi).then(({data}) => {
        if (data) setSesi(prev => {
          const s = {...prev, mad: data};
          try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
          return s;
        });
      });
    }
  }, []);

  // Sesi kedaluwarsa / tidak valid → kembali ke login
  React.useEffect(() => {
    const h = () => { showToast('Sesi berakhir, silakan login ulang.','warning'); logout(); };
    window.addEventListener('supermad-sesi-habis', h);
    return () => window.removeEventListener('supermad-sesi-habis', h);
  }, []);

  function handleLogin(data) {
    if (data.mode === 'kanwil') {
      const s = {pengguna: data.pengguna, mad: null, mode: 'admin_kanwil'};
      setSesi(s);
      // Cek perlu ganti password dulu
      if (data.needsReset) { setStep('ganti_password'); }
      else { setStep('app'); }
      try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
    } else if (data.mode === 'guru') {
      const s = {pengguna: {...data.guru, role:'guru', nama:data.guru.nama}, mad: data.mad, mode: 'guru', token: data.token};
      setSesi(s); setStep('app');
      try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
    } else if (data.penggunaTerpilih) {
      // Registrasi operator baru: langsung masuk sebagai operator tersebut
      const s = {pengguna: data.penggunaTerpilih, mad: data.mad, mode: data.penggunaTerpilih.role||'operator', token: data.token};
      setSesi(s); setStep('app');
      if (data.kodeAkses) setInfoKode({kode: data.kodeAkses, npsn: data.mad?.npsn, nama: data.mad?.nama});
      try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
    } else {
      setLoginData(data);
      setStep('pilih_pengguna');
    }
  }

  function handlePilihPengguna(pengguna) {
    const s = {pengguna, mad: loginData.mad, mode: pengguna.role, token: loginData.token};
    setSesi(s); setStep('app');
    try { localStorage.setItem('supermad_sesi', JSON.stringify(s)); } catch(e) {}
  }

  async function logout() {
    // Sign out dari Supabase Auth jika ada session
    try { await sb.auth.signOut(); } catch(e) {}
    try {
      const saved = JSON.parse(localStorage.getItem('supermad_sesi')||'null');
      if (saved && saved.token) await sb.rpc('supermad_logout', {p_sesi: saved.token});
    } catch(e) {}
    setSesi(null); setLoginData(null); setStep('login');
    try { localStorage.removeItem('supermad_sesi'); } catch(e) {}
  }

  if (step === 'login') return <HalamanLogin onLogin={handleLogin} />;

  if (step === 'ganti_password') return (
    <GantiPasswordPertama
      sesi={sesi}
      onDone={()=>setStep('app')}
      onLogout={logout}
    />
  );

  if (step === 'pilih_pengguna') return (
    <PilihPengguna
      mad={loginData.mad}
      penggunaList={loginData.penggunaList}
      token={loginData.token}
      onPilih={handlePilihPengguna}
      onBack={() => setStep('login')}
    />
  );

  // ── APLIKASI UTAMA ─────────────────────────────────────────
  return (
    <div style={{minHeight:'100vh'}}>
      {/* TOPBAR */}
      <div style={{background:'var(--p3)',color:'#fff',
        position:'sticky',top:0,zIndex:100}}>
        {/* Baris atas: Logo Kemenag + Nama Madrasah */}
        <div style={{padding:'8px 20px',background:'rgba(0,0,0,0.15)',
          display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid rgba(255,255,255,0.1)'}}>
          {sesi.mad && sesi.mad.logo_url
            ? <img src={sesi.mad.logo_url} alt="Logo Madrasah"
                style={{width:40,height:40,objectFit:'contain',flexShrink:0,
                  borderRadius:4,background:'rgba(255,255,255,0.15)',padding:2}}/>
            : <div style={{width:40,height:40,flexShrink:0,display:'flex',
                alignItems:'center',justifyContent:'center',
                background:'rgba(255,255,255,0.15)',borderRadius:'50%',
                fontSize:'1.5rem'}}>🏫</div>
          }
          <div>
            <div style={{fontSize:'.68rem',opacity:.7,letterSpacing:.5}}>
              SUPERMAD · Supervisi Pembelajaran
            </div>
            <div style={{fontWeight:800,fontSize:'.82rem'}}>
              {sesi.mad
                ? sesi.mad.nama.toUpperCase()
                : 'ADMIN SUPERMAD'}
            </div>
            {sesi.mad && sesi.mad.kota_kab && (
              <div style={{fontSize:'.65rem',opacity:.7}}>
                {sesi.mad.naungan||'Kemenag'} · {sesi.mad.kota_kab}
                {sesi.mad.npsn ? ' · NPSN: '+sesi.mad.npsn : ''}
              </div>
            )}
          </div>
        </div>
        {/* Baris bawah: SUPERMAD nav */}
        <div style={{padding:'8px 20px',
          display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:'1.1rem'}}>📋</span>
          <div>
            <div style={{fontWeight:900,fontSize:'.85rem'}}>SUPERMAD</div>
            <div style={{fontSize:'.62rem',opacity:.65}}>
              Supervisi Pembelajaran PM-KBC
            </div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{textAlign:'right',fontSize:'.72rem',opacity:.8}}>
            <div style={{fontWeight:700}}>{sesi.pengguna.nama}</div>
            <div>{sesi.pengguna.jabatan}</div>
          </div>
          <button onClick={logout}
            style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',
              padding:'6px 12px',borderRadius:7,cursor:'pointer',fontSize:'.75rem'}}>
            Keluar
          </button>
        </div>
        </div>
      </div>

      {/* KONTEN */}
      <div style={{padding:20,maxWidth:900,margin:'0 auto'}}>
        {sesi.mode === 'admin_kanwil' && <DashboardKanwil showToast={showToast} />}
        {sesi.mode === 'operator' && <DashboardOperator sesi={sesi} showToast={showToast} onSesiUpdate={mad=>setSesi(prev=>{ const s={...prev,mad}; try{localStorage.setItem('supermad_sesi',JSON.stringify(s));}catch(e){} return s; })} />}
        {sesi.mode === 'supervisor' && <DashboardSupervisor sesi={sesi} showToast={showToast} />}
        {sesi.mode === 'guru' && <DashboardGuru sesi={sesi} showToast={showToast} />}
      </div>

      {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onClose={()=>setToast(null)} />}

      {infoKode && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',
          justifyContent:'center',zIndex:2000,padding:16}}>
          <div style={{background:'#fff',borderRadius:16,padding:'26px 24px',maxWidth:420,width:'100%',textAlign:'center',
            boxShadow:'0 20px 60px rgba(0,0,0,.35)'}}>
            <div style={{fontSize:'2.2rem'}}>🎉</div>
            <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1.05rem',margin:'6px 0 4px'}}>Pendaftaran Berhasil!</div>
            <div style={{fontSize:'.82rem',color:'var(--text2)',marginBottom:14}}>
              Catat data berikut untuk <b>login berikutnya</b> lewat menu <b>🏫 Login Madrasah</b>:
            </div>
            <div style={{background:'#f0fdf4',border:'2px solid #86efac',borderRadius:12,padding:'12px 16px',textAlign:'left',marginBottom:12}}>
              <div style={{fontSize:'.75rem',color:'var(--text2)'}}>Madrasah</div>
              <div style={{fontWeight:800,marginBottom:6}}>{infoKode.nama}</div>
              <div style={{fontSize:'.75rem',color:'var(--text2)'}}>NPSN</div>
              <div style={{fontWeight:800,fontFamily:'monospace',fontSize:'1.05rem',marginBottom:6}}>{infoKode.npsn}</div>
              <div style={{fontSize:'.75rem',color:'var(--text2)'}}>Kode Akses Madrasah</div>
              <div style={{fontWeight:900,fontFamily:'monospace',fontSize:'1.3rem',letterSpacing:2,color:'#065f46'}}>{infoKode.kode}</div>
            </div>
            <div style={{fontSize:'.74rem',color:'#92400e',background:'#fffbeb',border:'1px solid #fcd34d',
              borderRadius:9,padding:'8px 10px',textAlign:'left',marginBottom:14}}>
              Cara login berikutnya: <b>NPSN + Kode Akses</b> → pilih akun Anda → masukkan <b>password</b> yang tadi Anda buat.
              Kode akses juga bisa dilihat kembali di tab <b>⚙️ Profil</b>.
            </div>
            <div style={{display:'flex',gap:8,justifyContent:'center'}}>
              <button className="btn btn-outline btn-sm" onClick={()=>{
                navigator.clipboard?.writeText('NPSN: '+infoKode.npsn+' | Kode Akses: '+infoKode.kode);
                showToast('📋 NPSN & kode akses disalin');
              }}>📋 Salin</button>
              <button className="btn btn-primary btn-sm" onClick={()=>setInfoKode(null)}>✓ Sudah Saya Catat</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── DASHBOARD OPERATOR + KANWIL (LENGKAP) ──────────────────────
// ── DASHBOARD OPERATOR (LENGKAP) ──────────────────────────────
function DashboardOperator({sesi, showToast, onSesiUpdate}) {
  const [tab, setTab]           = useState('guru');
  const [guruList, setGuruList] = useState([]);
  const [penggunaList, setPenggunaList] = useState([]);
  const [supList, setSupList]   = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showFormGuru, setShowFormGuru]     = useState(false);
  const [showFormUser, setShowFormUser]     = useState(false);
  const [resetTarget, setResetTarget]       = useState(null); // pengguna yang mau direset
  const [resetPass, setResetPass]           = useState('');
  const [resetPass2, setResetPass2]         = useState('');
  const [editGuru, setEditGuru]             = useState(null);
  const [formGuru, setFormGuru] = useState({nama:'',nip:'',mapel:'',status_kepeg:'GTT',pendidikan:'S1',nuptk:''});
  const [formUser, setFormUser] = useState({nama:'',nip:'',jabatan:'Kepala Madrasah',role:'supervisor',username:'',password:''});
  const [importStatus, setImportStatus]     = useState('');

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const [g, p, s] = await Promise.all([
      rpcSesi('supermad_list_guru', sesi),
      rpcSesi('supermad_list_pengguna', sesi),
      sb.from('supermad_supervisi').select('guru_id,status,capaian_rata,predikat,tanggal_supervisi')
        .eq('madrasah_id', sesi.mad.id),
    ]);
    setGuruList(g.data||[]);
    setPenggunaList(p.data||[]);
    setSupList(s.data||[]);
    setLoading(false);
  }

  async function simpanGuru(e) {
    e.preventDefault();
    const payload = {...formGuru, madrasah_id: sesi.mad.id, aktif:true};
    let error;
    if (editGuru) {
      ({error} = await sb.from('supermad_guru').update(payload).eq('id', editGuru.id));
    } else {
      ({error} = await sb.from('supermad_guru').insert(payload));
    }
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast(`✅ Guru ${editGuru?'diperbarui':'ditambahkan'}!`);
    setShowFormGuru(false); setEditGuru(null);
    setFormGuru({nama:'',nip:'',mapel:'',status_kepeg:'GTT',pendidikan:'S1',nuptk:''});
    loadData();
  }

  async function hapusGuru(g) {
    if (!confirm(`Hapus guru "${g.nama}"? Data supervisi terkait juga akan terhapus.`)) return;
    const {error} = await sb.from('supermad_guru').delete().eq('id', g.id);
    if (error) { showToast('Gagal hapus: '+error.message,'error'); return; }
    showToast('🗑️ Guru dihapus.');
    loadData();
  }

  async function resetPassword(e) {
    e.preventDefault();
    if (resetPass !== resetPass2) { showToast('Password tidak cocok!','error'); return; }
    if (resetPass.length < 4) { showToast('Password minimal 4 karakter!','error'); return; }
    const {error} = await sb.from('supermad_pengguna')
      .update({password_hash: md5(resetPass)})
      .eq('id', resetTarget.id);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Password berhasil direset!');
    setResetTarget(null); setResetPass(''); setResetPass2('');
  }

  async function hapusPengguna(p) {
    if (!confirm('Hapus pengguna "'+p.nama+'" ('+p.username+')? Tindakan ini tidak bisa dibatalkan.')) return;
    const {error} = await sb.from('supermad_pengguna').delete().eq('id', p.id);
    if (error) { showToast('Gagal hapus: '+error.message,'error'); return; }
    showToast('🗑️ Pengguna '+p.nama+' dihapus.');
    loadData();
  }

  async function simpanUser(e) {
    e.preventDefault();
    // Cek duplikat username
    const {data:existing} = await sb.from('supermad_pengguna')
      .select('id').eq('username', formUser.username.trim()).maybeSingle();
    if (existing) { showToast('Username sudah dipakai! Gunakan username lain.','error'); return; }
    const {error} = await sb.from('supermad_pengguna').insert({
      madrasah_id: sesi.mad.id,
      nama:     formUser.nama,
      nip:      formUser.nip,
      jabatan:  formUser.jabatan,
      role:     formUser.role,
      username: formUser.username,
      password_hash: md5(formUser.password),
      aktif: true,
    });
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Pengguna berhasil ditambahkan!');
    setShowFormUser(false);
    setFormUser({nama:'',nip:'',jabatan:'Kepala Madrasah',role:'supervisor',username:'',password:''});
    loadData();
  }

  // Import Excel
  async function importExcel(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum siap. Pastikan koneksi internet aktif.','warning');
      return;
    }
    setImportStatus('⏳ Membaca file Excel...');
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb  = XLSX.read(ev.target.result, {type:'binary'});
        const ws  = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        if (!rows.length) { setImportStatus('❌ File kosong.'); return; }

        // Mapping kolom fleksibel
        const map = (row, keys) => keys.map(k=>row[k]||'').find(v=>v)||'';
        let added=0, skipped=0;
        for (const row of rows) {
          const nama = map(row,['Nama','NAMA','nama','Nama Guru','NAMA GURU']);
          const nip  = map(row,['NIP','nip','NIP/NUPTK']);
          const mapel= map(row,['Mapel','MAPEL','Mata Pelajaran','MATA PELAJARAN','mapel']);
          const stat = map(row,['Status','STATUS','Status Kepegawaian','status_kepeg'])||'GTT';
          const pend = map(row,['Pendidikan','PENDIDIKAN','pendidikan'])||'S1';
          if (!nama) { skipped++; continue; }
          const {error} = await sb.from('supermad_guru').insert({
            madrasah_id: sesi.mad.id, nama, nip, mapel, status_kepeg:stat, pendidikan:pend, aktif:true
          });
          if (error) skipped++; else added++;
        }
        setImportStatus(`✅ Selesai: ${added} guru ditambahkan, ${skipped} dilewati.`);
        loadData();
      } catch(err) {
        setImportStatus('❌ Error: '+err.message);
      }
    };
    reader.readAsBinaryString(file);
    e.target.value = '';
  }

  function downloadTemplate() {
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum siap.','warning'); return;
    }
    const ws = XLSX.utils.aoa_to_sheet([
      ['Nama','NIP','Mapel','Status','Pendidikan'],
      ['Ahmad Fauzi, S.Pd','197001012000031001','Matematika','PNS','S1'],
      ['Siti Rahma, S.Pd.I','','Fikih','GTT','S1'],
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Daftar Guru');
    XLSX.writeFile(wb, 'Template_Daftar_Guru.xlsx');
  }

  if (loading) return <Loading text="Memuat data madrasah..." />;

  const guruSudah = new Set(supList.filter(s=>s.status==='selesai').map(s=>s.guru_id));

  return (
    <div>
      <h2 style={{fontWeight:900,color:'var(--p3)',marginBottom:16,fontSize:'1.1rem'}}>
        ⚙️ Operator — {sesi.mad.nama}
      </h2>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:16}}>
        {[
          {icon:'👨‍🏫',label:'Total Guru',val:guruList.length,color:'var(--p)'},
          {icon:'👤',label:'Pengguna',val:penggunaList.length,color:'#2563eb'},

// ── PROFIL MADRASAH (EDITABLE) ─────────────────────────────────
function ProfilMadrasah({sesi, showToast, onUpdate}) {
  const [form, setForm] = useState({
    nama_kepala: sesi.mad.nama_kepala||'',
    nip_kepala:  sesi.mad.nip_kepala||'',
    alamat:      sesi.mad.alamat||'',
    kota_kab:    sesi.mad.kota_kab||'',
    provinsi:    sesi.mad.provinsi||'',
    naungan:     sesi.mad.naungan||'',
    tahun_ajaran:sesi.mad.tahun_ajaran||'2025/2026',
  });
  const [saving, setSaving]       = useState(false);
  const [uploadingLogo, setUploadingLogo] = useState(false);
  const [logoUrl, setLogoUrl]     = useState(sesi.mad.logo_url||'');
  const [kodeAkses, setKodeAkses] = useState('');

  async function uploadLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500*1024) { showToast('Ukuran logo maksimal 500KB!','error'); return; }
    if (!file.type.startsWith('image/')) { showToast('File harus berupa gambar!','error'); return; }
    setUploadingLogo(true);
    try {
      const ext = file.name.split('.').pop();
      const path = sesi.mad.id + '/logo.' + ext;
      const {error:upErr} = await sb.storage.from('supermad-logo').upload(path, file, {upsert:true});
      if (upErr) { showToast('Gagal upload: '+upErr.message,'error'); return; }
      const {data:{publicUrl}} = sb.storage.from('supermad-logo').getPublicUrl(path);
      const {error:dbErr} = await sb.from('supermad_madrasah').update({logo_url: publicUrl}).eq('id', sesi.mad.id);
      if (dbErr) { showToast('Gagal simpan URL: '+dbErr.message,'error'); return; }
      setLogoUrl(publicUrl);
      if (onUpdate) onUpdate({...sesi.mad, logo_url: publicUrl});
      showToast('✅ Logo berhasil diupload!');
    } catch(err) {
      showToast('Error: '+err.message,'error');
    } finally { setUploadingLogo(false); }
  }

  async function hapusLogo() {
    if (!confirm('Hapus logo madrasah?')) return;
    await sb.from('supermad_madrasah').update({logo_url: null}).eq('id', sesi.mad.id);
    setLogoUrl('');
    if (onUpdate) onUpdate({...sesi.mad, logo_url: null});
    showToast('Logo dihapus.');
  }

  async function simpan(e) {
    e.preventDefault();
    setSaving(true);
    const {error} = await sb.from('supermad_madrasah').update(form).eq('id', sesi.mad.id);
    setSaving(false);
    if (error) { showToast('Gagal simpan: '+error.message,'error'); return; }
    // Update local sesi
    Object.assign(sesi.mad, form);
    showToast('✅ Profil madrasah berhasil disimpan!');
  }

  return (
    <div className="card">
      <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16}}>🏫 Profil Madrasah</div>

      {sesi.mode==='operator' && (
        <div style={{marginBottom:16,padding:'12px 16px',background:'#f0fdf4',border:'1.5px solid #86efac',
          borderRadius:10,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:180}}>
            <div style={{fontWeight:700,fontSize:'.85rem'}}>🔐 Kode Akses Madrasah</div>
            <div style={{fontSize:'.72rem',color:'var(--text2)'}}>Dipakai bersama NPSN untuk Login Madrasah. Jangan dibagikan ke luar madrasah.</div>
          </div>
          <div style={{fontFamily:'monospace',fontWeight:900,fontSize:'1.1rem',letterSpacing:2,color:'#065f46'}}>
            {kodeAkses || '••••••••'}
          </div>
          {!kodeAkses ? (
            <button className="btn btn-outline btn-sm" onClick={async()=>{
              const {data, error} = await sb.rpc('supermad_kode_akses', {p_sesi: sesi.token});
              if (error || !data) { showToast('Gagal memuat kode akses'+(error?': '+error.message:''),'error'); return; }
              setKodeAkses(data);
            }}>👁️ Tampilkan</button>
          ) : (
            <button className="btn btn-outline btn-sm" onClick={()=>{
              navigator.clipboard?.writeText(kodeAkses); showToast('📋 Kode akses disalin');
            }}>📋 Salin</button>
          )}
        </div>
      )}

      {/* Upload Logo Madrasah */}
      <div style={{marginBottom:16,padding:'14px 16px',background:'var(--surface2)',
        borderRadius:10,display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>
        {logoUrl
          ? <img src={logoUrl} alt="Logo" style={{width:68,height:68,
              objectFit:'contain',borderRadius:8,border:'2px solid var(--border)',
              background:'#fff',padding:4,flexShrink:0}}/>
          : <div style={{width:68,height:68,borderRadius:8,border:'2px dashed var(--border)',
              display:'flex',alignItems:'center',justifyContent:'center',
              color:'var(--text3)',fontSize:'2rem',background:'#fff',flexShrink:0}}>🏫</div>
        }
        <div style={{flex:1,minWidth:180}}>
          <div style={{fontWeight:700,marginBottom:4}}>Logo Madrasah</div>
          <div style={{fontSize:'.72rem',color:'var(--text2)',marginBottom:8}}>
            JPG/PNG · Maks 500KB · Rekomendasi: persegi
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>

function KelolaPengguna({mad, showToast, onBack}) {
  const [list, setList]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({nama:'',nip:'',jabatan:'Kepala Madrasah',role:'supervisor',username:'',password:''});
  const [editP, setEditP]   = useState(null);   // pengguna yang sedang diedit
  const [formE, setFormE]   = useState({});
  const [savingE, setSavingE] = useState(false);

  useEffect(()=>{ loadList(); }, []);

  async function simpanEdit(e) {
    e.preventDefault();
    if (!formE.nama?.trim() || !formE.username?.trim()) { showToast('Nama dan username wajib diisi!','error'); return; }
    setSavingE(true);
    // Username harus unik
    const {data:dup} = await sb.from('supermad_pengguna').select('id')
      .eq('username', formE.username.trim()).neq('id', editP.id).limit(1);
    if (dup && dup.length) { setSavingE(false); showToast('Username sudah dipakai akun lain!','error'); return; }
    const payload = {
      nama: formE.nama.trim(), nip: (formE.nip||'').trim(), jabatan: formE.jabatan,
      role: formE.role, username: formE.username.trim(), aktif: !!formE.aktif,
    };
    if (formE.password_baru) {
      if (formE.password_baru.length < 6) { setSavingE(false); showToast('Password minimal 6 karakter!','error'); return; }
      payload.password_hash = md5(formE.password_baru);
    }
    const {error} = await sb.from('supermad_pengguna').update(payload).eq('id', editP.id);
    setSavingE(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Data '+payload.nama+' diperbarui'+(formE.password_baru?' (password diganti)':''));
    setEditP(null); loadList();
  }

  async function loadList() {
    setLoading(true);
    const {data} = await sb.from('supermad_pengguna')
      .select('*').eq('madrasah_id', mad.id).order('nama');
    setList(data||[]);
    setLoading(false);
  }

  async function simpan(e) {
    e.preventDefault();
    const {error} = await sb.from('supermad_pengguna').insert({
      madrasah_id: mad.id,
      nama: form.nama, nip: form.nip,
      jabatan: form.jabatan, role: form.role,
      username: form.username, password_hash: md5(form.password),
      aktif: true,
    });
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Pengguna ditambahkan!');
    setShowForm(false);
    setForm({nama:'',nip:'',jabatan:'Kepala Madrasah',role:'supervisor',username:'',password:''});
    loadList();
  }

  async function resetPass(pg) {
    const baru = window.prompt('Password baru untuk '+pg.nama+' ('+pg.username+'), minimal 6 karakter:');
    if (baru===null) return;
    if (baru.trim().length < 6) { showToast('Password minimal 6 karakter!','error'); return; }
    const {error} = await sb.from('supermad_pengguna').update({password_hash: md5(baru.trim())}).eq('id', pg.id);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Password '+pg.nama+' berhasil direset.');
  }

  async function hapus(id, nama) {
    if (!confirm('Hapus pengguna "'+nama+'"?')) return;
    await sb.from('supermad_pengguna').delete().eq('id', id);
    showToast('🗑️ Pengguna dihapus.');
    loadList();
  }

          <div style={{fontWeight:900,color:'var(--p3)'}}>👤 Kelola Pengguna</div>
          <div style={{fontSize:'.78rem',color:'var(--text2)'}}>{mad.nama} · {mad.npsn}</div>
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>

        <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(!showForm)}>
          {showForm?'✕ Batal':'+ Tambah Pengguna'}
        </button>
      </div>

      {showForm && (
        <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>

          <form onSubmit={simpan}>

              <div className="form-group">
                <label>NIP</label>
                <input value={form.nip} onChange={e=>setForm({...form,nip:e.target.value})}/>
              </div>
              <div className="form-group">
                <label>Jabatan</label>
                <select value={form.jabatan} onChange={e=>setForm({...form,jabatan:e.target.value})}>
                  {['Kepala Madrasah','Wakil Kepala Madrasah','Pengawas','Operator TU'].map(j=>(

                </select>
              </div>
              <div className="form-group">
                <label>Role</label>
                <select value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>

      {loading ? <Loading text="Memuat..." /> : (

function DashboardKanwil({showToast}) {
  const [madrasahList, setMadrasahList] = useState([]);

    npsn:'',nama:'',tingkat:'MI',naungan:'',alamat:'',
    kota_kab:'',provinsi:'Aceh',nama_kepala:'',nip_kepala:'',
    tahun_ajaran:'2025/2026',kode_akses:''
  });
  const [filterKab, setFilterKab]   = useState('');
  const [filterTingkat, setFilterTingkat] = useState('');
  const [exporting, setExporting]     = useState(false);
  const [madAktif, setMadAktif]       = useState(null); // madrasah yang sedang dikelola
  const [tokenMad, setTokenMad]       = useState(null); // {mad, token} untuk popup token
  const [editMad, setEditMad]         = useState(null); // madrasah yang sedang diedit
  const [formEdit, setFormEdit]       = useState({});
  const [savingEdit, setSavingEdit]   = useState(false);
  const [uploadPreview, setUploadPreview] = useState(null); // {rows:[], errors:[]} dari parsing Excel
  const [uploading, setUploading]     = useState(false);
  const [showUpload, setShowUpload]   = useState(false);
  const [rtlKanwil, setRtlKanwil]     = useState([]);
  const [loadingRTL, setLoadingRTL]   = useState(false);
  const [filterSmt, setFilterSmt]     = useState('');
  const [filterTA, setFilterTA]       = useState('');

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const {data:list} = await sb.from('supermad_madrasah')
      .select('*').eq('aktif',true).order('nama');
    const {data:sups} = await sb.from('supermad_supervisi')
      .select('madrasah_id,guru_id,capaian_rata,capaian_perencanaan,capaian_pelaksanaan,capaian_asesmen,status,predikat,tanggal_supervisi,nama_supervisor,jabatan_supervisor');

    const statsMap = {};
    (sups||[]).forEach(s => {
      if (!statsMap[s.madrasah_id]) statsMap[s.madrasah_id] = {total:0,selesai:0,rata:[],p:[],l:[],a:[]};
      statsMap[s.madrasah_id].total++;
      if (s.status==='selesai') {
        statsMap[s.madrasah_id].selesai++;
        statsMap[s.madrasah_id].rata.push(+s.capaian_rata||0);
        statsMap[s.madrasah_id].p.push(+s.capaian_perencanaan||0);
        statsMap[s.madrasah_id].l.push(+s.capaian_pelaksanaan||0);
        statsMap[s.madrasah_id].a.push(+s.capaian_asesmen||0);
      }
    });
    setMadrasahList(list||[]);
    setStats(statsMap);
    setLoading(false);
  }

  async function loadRTLKanwil() {
    setLoadingRTL(true);
    // Ambil semua supervisi + data guru untuk analisis RTL
    const {data:sups} = await sb.from('supermad_supervisi')
      .select('madrasah_id,guru_id,skor_perencanaan,skor_pelaksanaan,skor_asesmen,capaian_rata,nama_supervisor,tanggal_supervisi')
      .eq('status','selesai');
    const {data:gurus} = await sb.from('supermad_guru').select('id,nama,mapel,madrasah_id');
    const guruMap = {};
    (gurus||[]).forEach(g => guruMap[g.id] = g);

    // Hitung frekuensi item skor rendah per aspek
    const LP=['Identifikasi Murid','Dimensi Profil Lulusan','Integrasi Panca Cinta','Tujuan Pembelajaran','Prinsip BBM','Kemitraan Pembelajaran','Lingkungan Inklusif','Teknologi/Digital','Langkah Pembelajaran'];
    const LL=['Menyampaikan Tujuan','Apersepsi & Motivasi','Pertanyaan Terbuka','Penggalian Pengetahuan Awal','Prinsip BBM (Memahami)','Media Interaktif','Pengalaman Nyata','Kolaborasi Siswa','Berpikir Kritis & Kreatif','Prinsip BBM (Mengaplikasi)','Refleksi Proses Belajar','Umpan Balik & RTL','Integrasi Panca Cinta','Prinsip BBM (Merefleksi)'];
    const LA=['Instrumen sesuai Tujuan','Penilaian Proses & Hasil','Orientasi Profil Lulusan','Teknik Penilaian Beragam','Umpan Balik Membangun','Asesmen untuk Perbaikan'];

    const freqP = Array(LP.length).fill(0);
    const freqL = Array(LL.length).fill(0);
    const freqA = Array(LA.length).fill(0);
    let totalGuru = 0;

    (sups||[]).forEach(s => {
      totalGuru++;
      (s.skor_perencanaan||[]).forEach((sk,i) => { if((+sk||0)<=1 && i<freqP.length) freqP[i]++; });
      (s.skor_pelaksanaan||[]).forEach((sk,i) => { if((+sk||0)<=1 && i<freqL.length) freqL[i]++; });
      (s.skor_asesmen||[]).forEach((sk,i)     => { if((+sk||0)<=1 && i<freqA.length) freqA[i]++; });
    });

    // Gabungkan dan urutkan berdasarkan frekuensi
    const allIssues = [
      ...freqP.map((f,i) => ({komp:'Perencanaan',aspek:LP[i],frekuensi:f,persen:totalGuru?Math.round(f/totalGuru*100):0})),
      ...freqL.map((f,i) => ({komp:'Pelaksanaan',aspek:LL[i],frekuensi:f,persen:totalGuru?Math.round(f/totalGuru*100):0})),
      ...freqA.map((f,i) => ({komp:'Asesmen',    aspek:LA[i],frekuensi:f,persen:totalGuru?Math.round(f/totalGuru*100):0})),
    ].filter(x => x.frekuensi > 0)
     .sort((a,b) => b.frekuensi - a.frekuensi);

    setRtlKanwil({issues: allIssues, totalGuru, totalSup: (sups||[]).length});
    setLoadingRTL(false);
  }

  async function simpanMadrasah(e) {
    e.preventDefault();
    const {error} = await sb.from('supermad_madrasah').insert({...formMad,aktif:true});
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Madrasah berhasil ditambahkan!');
    setShowFormMad(false);
    setFormMad({npsn:'',nama:'',tingkat:'MI',naungan:'',alamat:'',
      kota_kab:'',provinsi:'Aceh',nama_kepala:'',nip_kepala:'',
      tahun_ajaran:'2025/2026',kode_akses:''});
    loadData();
  }

  async function exportExcel() {
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum siap. Pastikan internet aktif.','warning'); return;
    }
    setExporting(true);
    try {
      // Ambil semua data supervisi lengkap
      const {data:sups} = await sb.from('supermad_supervisi')
        .select('*').eq('status','selesai').order('created_at');
      const {data:gurus} = await sb.from('supermad_guru').select('*');
      const guruMap = {};
      (gurus||[]).forEach(g => guruMap[g.id] = g);

      const madMap = {};
      madrasahList.forEach(m => madMap[m.id] = m);

      // Sheet 1: Rekap per madrasah
      const rekap = madrasahList.map((m,i) => {
        const s = stats[m.id]||{selesai:0,rata:[],p:[],l:[],a:[]};
        const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '—';
        const pred = s.rata.length ? (avg(s.rata)>=91?'Sangat Baik':avg(s.rata)>=81?'Baik':avg(s.rata)>=71?'Cukup':'Kurang') : '—';
        return {
          'No': i+1,
          'Nama Madrasah': m.nama,
          'Tingkat': m.tingkat,
          'NPSN': m.npsn,
          'Kab/Kota': m.kota_kab||'—',
          'Guru Disupervisi': s.selesai,
          'Perencanaan (%)': avg(s.p),

  // ── Proses upload file Excel madrasah ─────────────────────────
  function handleUploadExcel(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum siap.','warning'); return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rawOri = XLSX.utils.sheet_to_json(ws, {defval:''});

        // normalisasi key: trim spasi & karakter invisible
        const raw = rawOri.map(r => {
          const clean = {};
          Object.keys(r).forEach(k => {
            clean[k.trim().replace(/[​-‍﻿]/g,'')] = r[k];
          });
          return clean;
        });
        const errors = [];
        const rows = [];
        const npsnSudahAda = new Set(madrasahList.map(m=>String(m.npsn).trim()));
        raw.forEach((r, idx) => {
          const no = idx+2; // nomor baris di Excel (header = baris 1)
          // Mapping fleksibel: support format EMIS, template SUPERMAD, atau variasi lain
          const nama  = String(
            r['Nama Madrasah']||r['nama_madrasah']||r['nama']||r['NAMA']||''
          ).trim();
          const npsn  = String(
            r['NPSN']||r['npsn']||r['Npsn']||''
          ).trim();
          const nsm   = String(
            r['NSM']||r['nsm']||r['Nsm']||''
          ).trim();
          const jenjangRaw = String(
            r['Jenjang']||r['jenjang']||r['JENJANG']||r['tingkat']||r['Tingkat']||''
          ).trim();
          // Normalisasi jenjang: MI/MTs/MA/MAK dari berbagai format
          const jenjangMap = {
            'RA':'RA','RAUDHATUL ATHFAL':'RA','RAUDLATUL ATHFAL':'RA','RAUDHATUL ATFAL':'RA','ROUDLOTUL ATFAL':'RA',
            'MI':'MI','MADRASAH IBTIDAIYAH':'MI','IBTIDAIYAH':'MI','MIN':'MI','MIS':'MI',
            'MTS':'MTs','MTSN':'MTs','MTS.':'MTs','MTSS':'MTs','MADRASAH TSANAWIYAH':'MTs','TSANAWIYAH':'MTs',
            'MA':'MA','MAN':'MA','MAS':'MA','MADRASAH ALIYAH':'MA','ALIYAH':'MA',
            'MAK':'MAK','MADRASAH ALIYAH KEJURUAN':'MAK',
          };
          const jenjang = jenjangMap[jenjangRaw.toUpperCase()] || jenjangRaw.toUpperCase();
          const kota  = String(
            r['Kabupaten']||r['kabupaten']||r['kota_kab']||r['Kab/Kota']||r['kota']||r['Kabupaten/Kota']||''
          ).trim();
          const kec   = String(r['Kecamatan']||r['kecamatan']||r['KECAMATAN']||r['Kec']||r['kec']||r['KEC']||r['Kecamatan/Kelurahan']||r['Kecamatan / Kelurahan']||'').trim();
          const alamat= String(r['Alamat']||r['alamat']||r['ALAMAT']||r['Alamat Madrasah']||r['alamat_madrasah']||r['Alamat Lengkap']||'').trim();
          const status= String(r['Status']||r['status']||r['Naungan']||r['naungan']||'').trim();
          // Status EMIS: "Negeri"→Kemenag, "Swasta"→Swasta
          const naungan = status.toLowerCase().includes('swasta') ? 'Swasta' : 'Kemenag';

          if (!nama && !npsn && !nsm) return; // baris benar-benar kosong
          if (!nama)    errors.push(`Baris ${no}: nama madrasah kosong`);
          if (!npsn)    errors.push(`Baris ${no}: NPSN kosong`);
          if (npsn && !/^\d{8}$/.test(npsn)) errors.push(`Baris ${no}: NPSN harus 8 digit angka (${npsn})`);
          if (!['RA','MI','MTs','MA','MAK'].includes(jenjang))
            errors.push(`Baris ${no}: jenjang tidak dikenali (${jenjangRaw}) — gunakan RA/MI/MTs/MA/MAK`);
          if (npsn && npsnSudahAda.has(npsn)) errors.push(`Baris ${no}: NPSN ${npsn} (${nama}) sudah terdaftar, akan dilewati`);
          rows.push({
            nama, npsn, nsm, jenjang,
            kota_kab: kota,
            kecamatan: kec,
            alamat:   alamat || (kec ? kec+', '+kota : kota),
            naungan,
            nama_kepala: String(r['nama_kepala']||r['Nama Kepala']||r['Kepala']||'').trim(),
            nip_kepala:  String(r['nip_kepala'] ||r['NIP Kepala']||'').trim(),
            tahun_ajaran: '2025/2026',
            _valid: !errors.some(er=>er.startsWith(`Baris ${no}:`) && !er.includes('sudah terdaftar')),
            _duplikat: !!(npsn && npsnSudahAda.has(npsn)),
          });
        });
        setUploadPreview({rows, errors, fileName:file.name});
      } catch(err) {
        showToast('Gagal membaca file: '+err.message,'error');
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = ''; // reset input agar bisa pilih file sama lagi
  }

  // Generate kode akses acak: jenjang + 6 angka acak, cth: mi482937
  function buatKodeAkses(jenjang) {
    const prefix = (jenjang||'mad').toLowerCase().replace(/[^a-z]/g,'');
    const angka  = Math.floor(100000 + Math.random()*900000); // 6 digit
    return prefix + angka;
  }

  async function prosesUploadMadrasah() {
    if (!uploadPreview) return;
    const valid = uploadPreview.rows.filter(r=>r._valid && !r._duplikat);
    if (!valid.length) { showToast('Tidak ada data valid untuk diimport.','warning'); return; }
    setUploading(true);
    try {
      const toInsert = valid.map(r=>({
        nama:        r.nama,
        npsn:        r.npsn,
        nsm:         r.nsm||null,
        tingkat:     r.jenjang,
        kota_kab:    r.kota_kab,
        kecamatan:   r.kecamatan||null,
        provinsi:    'Aceh',
        kode_akses:  buatKodeAkses(r.jenjang),
        nama_kepala: r.nama_kepala||null,
        nip_kepala:  r.nip_kepala||null,
        alamat:      r.alamat||null,
        naungan:     r.naungan,
        tahun_ajaran:r.tahun_ajaran,
        aktif:       true,
      }));
      const {error} = await sb.from('supermad_madrasah').insert(toInsert);
      if (error) { showToast('Gagal import: '+error.message,'error'); return; }
      showToast(`✅ ${valid.length} madrasah berhasil diimport!`,'success');
      setUploadPreview(null);
      setShowUpload(false);

    } catch(err) {
      showToast('Error: '+err.message,'error');
    } finally {
      setUploading(false);
    }
  }

  async function generateToken(m) {
    // Generate token 8 karakter acak huruf kapital + angka
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let token = '';
    for (let i=0; i<8; i++) token += chars[Math.floor(Math.random()*chars.length)];
    // Cek sudah ada operator belum
    const {data:opList} = await sb.from('supermad_pengguna')
      .select('id').eq('madrasah_id', m.id).eq('role','operator');
    if (opList && opList.length > 0) {
      showToast('⚠️ Madrasah ini sudah punya operator.','warning'); return;
    }
    const {error} = await sb.from('supermad_reg_token').insert({
      token, madrasah_id: m.id, dipakai: false
    });
    if (error) { showToast('Gagal buat token: '+error.message,'error'); return; }
    setTokenMad({mad:m, token});
  }

  // Modal Token Registrasi
  if (tokenMad) return (

      <div style={{background:'#fff',borderRadius:16,padding:32,
        width:'100%',maxWidth:440,boxShadow:'0 20px 60px rgba(0,0,0,.4)',textAlign:'center'}}>
        <div style={{fontSize:'2.5rem',marginBottom:12}}>🔑</div>
        <div style={{fontWeight:900,fontSize:'1.1rem',color:'var(--p3)',marginBottom:6}}>
          Token Registrasi Operator
        </div>
        <div style={{fontSize:'.85rem',color:'var(--text2)',marginBottom:20}}>
          {tokenMad.mad.nama}

        <div style={{background:'#f0fdf4',border:'2px solid #86efac',borderRadius:14,
          padding:'20px 24px',marginBottom:20}}>
          <div style={{fontSize:'2rem',fontWeight:900,letterSpacing:8,color:'#065f46',
            fontFamily:'monospace'}}>
            {tokenMad.token}
          </div>
          <div style={{fontSize:'.75rem',color:'#16a34a',marginTop:8}}>
            Token sekali pakai · berlaku sampai digunakan
          </div>
        </div>
        <div style={{background:'#fffbeb',border:'1px solid #fcd34d',borderRadius:10,
          padding:'10px 14px',fontSize:'.78rem',color:'#92400e',marginBottom:20,textAlign:'left'}}>
          <b>Cara penggunaan:</b><br/>
          1. Berikan token ini ke operator madrasah<br/>
          2. Operator buka <b>supermad.my.id</b> → klik <b>"Daftar Akun"</b><br/>
          3. Masukkan token, isi data diri, akun langsung aktif<br/>
          4. Kode akses madrasah ditampilkan setelah daftar — wajib dicatat untuk login berikutnya
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center'}}>
          <button onClick={()=>{
            navigator.clipboard?.writeText(tokenMad.token);
            showToast('📋 Token disalin!');
          }} className="btn btn-outline btn-sm">📋 Salin Token</button>
          <button onClick={()=>setTokenMad(null)} className="btn btn-primary btn-sm">✓ Selesai</button>
        </div>
      </div>
    </div>
  );

  // Modal Edit Madrasah
  if (editMad) return (
    <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,
      background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'center',
      justifyContent:'center',zIndex:1000,padding:20}}>
      <div style={{background:'#fff',borderRadius:16,padding:24,
        width:'100%',maxWidth:520,boxShadow:'0 20px 60px rgba(0,0,0,.3)',
        maxHeight:'90vh',overflowY:'auto'}}>
        <div style={{fontWeight:900,color:'var(--p3)',marginBottom:16,fontSize:'1rem'}}>
          ✏️ Edit Data Madrasah
        </div>
        <form onSubmit={simpanEditMad}>
          <div className="grid2">
            <div className="form-group">
              <label>Nama Madrasah *</label>
              <input value={formEdit.nama||''} onChange={e=>setFormEdit({...formEdit,nama:e.target.value})} required/>
            </div>
            <div className="form-group">
              <label>NPSN *</label>
              <input value={formEdit.npsn||''} onChange={e=>setFormEdit({...formEdit,npsn:e.target.value})} required maxLength={8}/>
            </div>
            <div className="form-group">
              <label>Jenjang</label>
              <select value={formEdit.jenjang||'MI'} onChange={e=>setFormEdit({...formEdit,jenjang:e.target.value})}>
                {['MI','MTs','MA','MAK'].map(j=><option key={j}>{j}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Naungan</label>
              <select value={formEdit.naungan||'Kemenag'} onChange={e=>setFormEdit({...formEdit,naungan:e.target.value})}>
                {['Kemenag','Swasta'].map(n=><option key={n}>{n}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Kab/Kota</label>
              <input value={formEdit.kota_kab||''} onChange={e=>setFormEdit({...formEdit,kota_kab:e.target.value})}/>
            </div>
            <div className="form-group">
              <label>Provinsi</label>
              <input value={formEdit.provinsi||''} onChange={e=>setFormEdit({...formEdit,provinsi:e.target.value})}/>
            </div>
            <div className="form-group" style={{gridColumn:'1/-1'}}>
              <label>Alamat</label>
              <input value={formEdit.alamat||''} onChange={e=>setFormEdit({...formEdit,alamat:e.target.value})}/>
            </div>
            <div className="form-group">
              <label>Kode Akses</label>
              <input value={formEdit.kode_akses||''} onChange={e=>setFormEdit({...formEdit,kode_akses:e.target.value})}/>
            </div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            <button className="btn btn-primary" type="submit" disabled={savingEdit}>
              {savingEdit?'⏳ Menyimpan...':'💾 Simpan Perubahan'}
            </button>
            <button type="button" className="btn btn-outline" onClick={()=>setEditMad(null)}>
              Batal
            </button>
          </div>
        </form>
      </div>
    </div>
  );

  if (madAktif) return (
    <KelolaPengguna mad={madAktif} showToast={showToast} onBack={()=>setMadAktif(null)} />
  );
  if (loading) return <Loading text="Memuat data kanwil..." />;

  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  const kabList     = [...new Set(madrasahList.map(m=>m.kota_kab).filter(Boolean))].sort();
  const tingkatList = ['MI','MTs','MA'];

  const filteredList = madrasahList.filter(m => {
    if (filterKab     && m.kota_kab !== filterKab)     return false;
    if (filterTingkat && m.tingkat  !== filterTingkat) return false;
    return true;
  });

  const totalSup    = Object.values(stats).reduce((s,v)=>s+v.selesai,0);
  const allRata     = Object.values(stats).flatMap(v=>v.rata);
  const rataKanwil  = avg(allRata);
  const madDenganData = Object.values(stats).filter(v=>v.selesai>0).length;

  // Data untuk grafik bar sederhana
  const kabStats = {};
  madrasahList.forEach(m => {
    const kab = m.kota_kab||'Lainnya';
    if (!kabStats[kab]) kabStats[kab] = {madrasah:0,supervisi:0,rata:[]};
    kabStats[kab].madrasah++;
    const s = stats[m.id]||{selesai:0,rata:[]};
    kabStats[kab].supervisi += s.selesai;
    kabStats[kab].rata.push(...s.rata);
  });

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <h2 style={{fontWeight:900,color:'var(--p3)',fontSize:'1.1rem'}}>
          🏛️ Admin SUPERMAD — Supervisi Pembelajaran Madrasah
        </h2>
        <button className="btn btn-outline btn-sm" onClick={exportExcel} disabled={exporting}>
          {exporting ? '⏳ Mengekspor...' : '📥 Export Excel'}
        </button>
      </div>

      {/* KPI */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:16}}>
        {[
          {icon:'🏫',label:'Total Madrasah',val:madrasahList.length,color:'var(--p)'},
          {icon:'📋',label:'Total Supervisi',val:totalSup,color:'#2563eb'},
          {icon:'🏆',label:'Aktif Laporan',val:madDenganData,color:'#16a34a'},
          {icon:'📊',label:'Rata-rata Semua',
            val:allRata.length?rataKanwil.toFixed(1)+'%':'—',
            color:rataKanwil>=91?'#16a34a':rataKanwil>=81?'#2563eb':rataKanwil>=71?'#d97706':'#dc2626'},
        ].map((k,i)=>(
          <div key={i} className="card" style={{textAlign:'center',padding:14}}>
            <div style={{fontSize:'1.4rem'}}>{k.icon}</div>
            <div style={{fontSize:'1.3rem',fontWeight:900,color:k.color,marginTop:4}}>{k.val}</div>
            <div style={{fontSize:'.68rem',color:'var(--text2)',marginTop:2}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Tab */}
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {[['dashboard','📊 Dashboard'],['wilayah','🗺️ Per Wilayah'],['grafik','📈 Grafik'],['analitik','🔬 Analitik'],['rtl','📋 RTL Lintas Madrasah'],['tindaklanjut','✍️ Tindak Lanjut'],['madrasah','🏫 Madrasah'],['fitur','⚙️ Kelola Fitur']].map(([key,label])=>(
          <button key={key} onClick={()=>setTab(key)}
            style={{padding:'7px 14px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
              background:tab===key?'var(--p)':'var(--surface2)',
              color:tab===key?'#fff':'var(--text2)'}}>
            {label}
          </button>
        ))}
      </div>

      {/* TAB DASHBOARD */}
      {tab==='dashboard' && (
        <div>
          {/* Filter */}
          <div style={{display:'flex',gap:10,marginBottom:14,alignItems:'center',flexWrap:'wrap'}}>
            <label style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)'}}>Filter:</label>
            <select value={filterKab} onChange={e=>setFilterKab(e.target.value)}
              style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
                fontSize:'.8rem',fontFamily:'inherit',outline:'none',minWidth:160}}>
              <option value="">— Semua Kab/Kota —</option>
              {kabList.map(k=><option key={k}>{k}</option>)}
            </select>
            <select value={filterTingkat} onChange={e=>setFilterTingkat(e.target.value)}
              style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
                fontSize:'.8rem',fontFamily:'inherit',outline:'none',minWidth:120}}>
              <option value="">— Semua Tingkat —</option>
              {tingkatList.map(t=><option key={t}>{t}</option>)}
            </select>
            {(filterKab||filterTingkat) && (
              <button className="btn btn-outline btn-sm"
                onClick={()=>{setFilterKab('');setFilterTingkat('');}}>✕ Reset</button>
            )}
            <span style={{fontSize:'.75rem',color:'var(--text3)',marginLeft:'auto'}}>
              Menampilkan {filteredList.length} dari {madrasahList.length} madrasah
            </span>
          </div>

          {/* Notifikasi madrasah belum mulai */}
          {(()=>{
            const belumMulai = filteredList.filter(m => !(stats[m.id]&&stats[m.id].selesai>0));
            if (!belumMulai.length) return null;
            return (
              <div style={{marginBottom:14,padding:'12px 16px',background:'#fef3c7',
                border:'1.5px solid #f59e0b',borderRadius:10}}>
                <div style={{fontWeight:800,color:'#92400e',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                  ⚠️ {belumMulai.length} Madrasah Belum Mulai Supervisi
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {belumMulai.map(m=>(
                    <span key={m.id} style={{padding:'3px 10px',borderRadius:20,fontSize:'.75rem',
                      background:'#fff',border:'1px solid #f59e0b',color:'#92400e',fontWeight:600}}>
                      {m.nama}
                    </span>
                  ))}
                </div>
              </div>
            );
          })()}

          {/* Tabel */}
          <div className="card" style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.79rem',minWidth:700}}>
              <thead>
                <tr style={{background:'var(--p3)',color:'#fff'}}>
                  {['No','Madrasah','Tkt','Kab/Kota','Guru','Perencanaan','Pelaksanaan','Asesmen','Rata-rata','Predikat'].map(h=>(
                    <th key={h} style={{padding:'7px 8px',textAlign:'left',whiteSpace:'nowrap',fontWeight:700}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filteredList.map((m,i)=>{
                  const s = stats[m.id]||{selesai:0,rata:[],p:[],l:[],a:[]};
                  const rp=avg(s.p),rl=avg(s.l),ra=avg(s.a),rr=avg(s.rata);
                  const w = v => v>=91?'#16a34a':v>=81?'#2563eb':v>=71?'#d97706':'#dc2626';
                  const fmt = v => s.rata.length ? v.toFixed(1)+'%' : '—';
                  const pred = s.rata.length ? (rr>=91?'Sangat Baik':rr>=81?'Baik':rr>=71?'Cukup':'Kurang') : null;
                  return (
                    <tr key={m.id} style={{borderBottom:'1px solid var(--border)',
                      background:!(stats[m.id]&&stats[m.id].selesai>0)?'#fffbeb':i%2?'var(--surface2)':'#fff'}}>
                      <td style={{padding:'7px 8px',color:'var(--text3)'}}>{i+1}</td>
                      <td style={{padding:'7px 8px'}}>
                        <div style={{fontWeight:700,fontSize:'.8rem'}}>{m.nama}</div>
                        <div style={{fontSize:'.68rem',color:'var(--text3)'}}>{m.npsn}</div>
                      </td>
                      <td style={{padding:'7px 8px'}}>
                        <span style={{padding:'2px 6px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                          background:m.tingkat==='MA'?'#dbeafe':m.tingkat==='MTs'?'#fef3c7':'#d1fae5',
                          color:m.tingkat==='MA'?'#1d4ed8':m.tingkat==='MTs'?'#92400e':'#065f46'}}>
                          {m.tingkat}
                        </span>
                      </td>
                      <td style={{padding:'7px 8px',color:'var(--text2)',fontSize:'.77rem'}}>{m.kota_kab||'—'}</td>
                      <td style={{padding:'7px 8px',textAlign:'center',fontWeight:700}}>{s.selesai}</td>
                      {[rp,rl,ra,rr].map((v,vi)=>(
                        <td key={vi} style={{padding:'7px 8px',textAlign:'center',
                          fontWeight:s.rata.length?700:400,
                          color:s.rata.length?w(v):'var(--text3)'}}>
                          {fmt(v)}
                        </td>
                      ))}
                      <td style={{padding:'7px 8px'}}>
                        {pred && <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',fontWeight:700,
                          background:rr>=91?'#d1fae5':rr>=81?'#dbeafe':rr>=71?'#fef3c7':'#fee2e2',
                          color:rr>=91?'#065f46':rr>=81?'#1d4ed8':rr>=71?'#92400e':'#991b1b'}}>
                          {pred}
                        </span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* TAB WILAYAH */}
      {tab==='wilayah' && <PetaSebaranWilayah madrasahList={madrasahList} stats={stats} />}
      {tab==='wilayah' && (()=>{
        // Agregat per kota_kab
        const kabMap = {};
        madrasahList.forEach(m => {
          const kab = m.kota_kab || 'Tidak Diisi';
          if (!kabMap[kab]) kabMap[kab] = {kab, madrasah:[], totalSup:0, nilaiList:[], MI:0, MTs:0, MA:0, MAK:0};
          kabMap[kab].madrasah.push(m);
          kabMap[kab][m.tingkat] = (kabMap[kab][m.tingkat]||0) + 1;
          const s = stats[m.id];
          if (s) {
            kabMap[kab].totalSup += s.selesai||0;
            kabMap[kab].nilaiList.push(...(s.rata||[]));
          }
        });
        const kabList2 = Object.values(kabMap).sort((a,b)=>b.madrasah.length-a.madrasah.length);
        const avg2 = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
        const warna = v => v>=91?'#16a34a':v>=81?'#2563eb':v>=71?'#d97706':'#dc2626';
        const totalMad = madrasahList.length;
        const totalSupAll = kabList2.reduce((s,k)=>s+k.totalSup,0);
        const allNilai = kabList2.flatMap(k=>k.nilaiList);
        const rataAll = avg2(allNilai);
        return (
          <div>
            {/* Ringkasan Provinsi */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:20}}>
              {[
                {label:'Total Madrasah',val:totalMad,ico:'🏫',warna:'#1a6b5c'},
                {label:'Total Supervisi Selesai',val:totalSupAll,ico:'✅',warna:'#2563eb'},
                {label:'Rata-rata Semua Madrasah',val:rataAll?rataAll.toFixed(1)+'%':'—',ico:'📊',warna:rataAll?warna(rataAll):'#8aada6'},
                {label:'Wilayah Terdaftar',val:kabList2.length,ico:'🗺️',warna:'#7c3aed'},
              ].map(({label,val,ico,warna:w})=>(
                <div key={label} className="card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:'1.5rem',marginBottom:6}}>{ico}</div>
                  <div style={{fontSize:'1.4rem',fontWeight:900,color:w}}>{val}</div>
                  <div style={{fontSize:'.72rem',color:'var(--text2)',marginTop:4}}>{label}</div>
                </div>
              ))}
            </div>

            {/* Kartu per Wilayah */}
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              {kabList2.map(k=>{
                const rata = avg2(k.nilaiList);
                const pctAktif = k.madrasah.length ? Math.round(k.madrasah.filter(m=>(stats[m.id]?.selesai||0)>0).length/k.madrasah.length*100) : 0;
                return (
                  <div key={k.kab} className="card" style={{padding:'18px 20px'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginBottom:14}}>
                      <div>
                        <div style={{fontWeight:900,fontSize:'1rem',color:'var(--p3)'}}>{k.kab}</div>
                        <div style={{fontSize:'.75rem',color:'var(--text2)',marginTop:2}}>
                          {k.madrasah.length} madrasah · {k.totalSup} supervisi selesai
                        </div>
                      </div>
                      <div style={{display:'flex',gap:8,alignItems:'center'}}>
                        {rata && (
                          <span style={{padding:'4px 14px',borderRadius:20,fontWeight:800,fontSize:'.85rem',
                            background:rata>=91?'#d1fae5':rata>=81?'#dbeafe':rata>=71?'#fef3c7':'#fee2e2',
                            color:warna(rata)}}>
                            {rata.toFixed(1)}%
                          </span>
                        )}
                        {!rata && <span style={{padding:'4px 14px',borderRadius:20,fontWeight:700,fontSize:'.8rem',background:'#f3f4f6',color:'#6b7280'}}>Belum ada data</span>}
                      </div>
                    </div>

                    {/* Bar komposisi tingkat */}
                    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
                      {[['MI','#d1fae5','#065f46'],['MTs','#fef3c7','#92400e'],['MA','#dbeafe','#1d4ed8'],['MAK','#fce7f3','#9d174d']].map(([tkt,bg,clr])=>(
                        k[tkt]>0 && <span key={tkt} style={{padding:'3px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:700,background:bg,color:clr}}>
                          {tkt}: {k[tkt]}
                        </span>
                      ))}
                    </div>

                    {/* Progress bar keaktifan supervisi */}
                    <div style={{marginBottom:6}}>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:'.72rem',color:'var(--text2)',marginBottom:4}}>
                        <span>Madrasah aktif supervisi</span>
                        <span style={{fontWeight:700,color:pctAktif>=80?'#16a34a':pctAktif>=50?'#d97706':'#dc2626'}}>
                          {k.madrasah.filter(m=>(stats[m.id]?.selesai||0)>0).length}/{k.madrasah.length} ({pctAktif}%)
                        </span>
                      </div>
                      <div style={{height:8,background:'#e5e7eb',borderRadius:99,overflow:'hidden'}}>
                        <div style={{height:'100%',width:pctAktif+'%',borderRadius:99,
                          background:pctAktif>=80?'#16a34a':pctAktif>=50?'#f59e0b':'#ef4444',transition:'width .4s'}}/>
                      </div>
                    </div>

                    {/* Madrasah belum mulai */}
                    {(()=>{
                      const belum = k.madrasah.filter(m=>!(stats[m.id]?.selesai>0));
                      if (!belum.length) return <div style={{fontSize:'.72rem',color:'#16a34a',marginTop:8}}>✅ Semua madrasah sudah mulai supervisi</div>;
                      return (
                        <div style={{marginTop:8}}>
                          <div style={{fontSize:'.72rem',color:'#92400e',fontWeight:700,marginBottom:4}}>⚠️ Belum mulai ({belum.length}):</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {belum.map(m=><span key={m.id} style={{padding:'2px 8px',borderRadius:20,fontSize:'.68rem',background:'#fef3c7',border:'1px solid #f59e0b',color:'#92400e',fontWeight:600}}>{m.nama}</span>)}
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* TAB GRAFIK */}
      {tab==='grafik' && (
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {/* Grafik capaian per tingkat */}
          <div className="card">
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:16}}>
              📊 Rata-rata Capaian per Tingkat Madrasah
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {['MI','MTs','MA'].map(tkt => {
                const madTkt = madrasahList.filter(m=>m.tingkat===tkt);
                const allR = madTkt.flatMap(m=>(stats[m.id]||{rata:[]}).rata);
                const rataT = allR.length ? avg(allR) : null;
                const warna = rataT ? (rataT>=91?'#16a34a':rataT>=81?'#2563eb':rataT>=71?'#d97706':'#dc2626') : '#e5e7eb';
                const supT  = madTkt.reduce((s,m)=>s+(stats[m.id]||{selesai:0}).selesai,0);
                return (
                  <div key={tkt}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,fontSize:'.8rem'}}>
                      <span style={{fontWeight:700}}>{tkt} ({madTkt.length} madrasah · {supT} supervisi)</span>
                      <span style={{fontWeight:800,color:warna}}>{rataT ? rataT.toFixed(1)+'%' : '—'}</span>
                    </div>
                    <div style={{background:'#f0f0f0',borderRadius:8,height:24,overflow:'hidden',position:'relative'}}>
                      {rataT && (
                        <div style={{width:rataT+'%',height:'100%',background:warna,
                          borderRadius:8,transition:'width .5s ease',
                          display:'flex',alignItems:'center',paddingLeft:8}}>
                          <span style={{fontSize:'.72rem',fontWeight:700,color:'#fff',whiteSpace:'nowrap'}}>
                            {rataT.toFixed(1)}%

                      👤 Pengguna
                    </button>
                    <button onClick={()=>generateToken(m)}
                      style={{padding:'5px 10px',borderRadius:7,border:'1px solid #16a34a',
                        background:'#f0fdf4',color:'#15803d',cursor:'pointer',fontSize:'.72rem',fontWeight:700}}>
                      🔑 Token
                    </button>
                    <button onClick={()=>{setEditMad(m);setFormEdit({...m});}}
                      style={{padding:'5px 10px',borderRadius:7,border:'1px solid #d97706',
                        background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:'.72rem',fontWeight:700}}>
                      ✏️ Edit
                    </button>
                    <button onClick={()=>hapusMad(m)}
                      style={{padding:'5px 10px',borderRadius:7,border:'1px solid #fca5a5',
                        background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.72rem',fontWeight:700}}>
                      🗑️ Hapus
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* TAB KELOLA FITUR */}
      {tab==='fitur' && (
        <TabKelolaFitur
          madrasahList={madrasahList}
          showToast={showToast}
          onReload={loadData}
        />
      )}
    </div>
  );
}
