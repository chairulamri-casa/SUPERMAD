// ── TAB ANALISIS ASESMEN ────────────────────────────────────────
function TabAnalisisAsesmen({sesi, showToast}) {
  const guruId = sesi.pengguna.id;
  const [list, setList]       = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [mode, setMode]       = React.useState('list'); // 'list' | 'form' | 'detail'
  const [aktif, setAktif]     = React.useState(null);
  const [saving, setSaving]   = React.useState(false);

  // ── Form state ──
  const blankForm = {
    jenis_penilaian:'UH', topik:'', mapel:'', kelas:'', semester:'Ganjil',
    tahun_ajaran:'2025/2026', tanggal_pelaksanaan:'', kkm:75,
    data_siswa:[], catatan_guru:'', status:'draft'
  };
  const [form, setForm]     = React.useState(blankForm);
  const [namaBaru, setNamaBaru] = React.useState('');
  const [nilaiInput, setNilaiInput] = React.useState('');

  React.useEffect(()=>{ loadList(); },[]);

  async function loadList() {
    setLoading(true);
    const {data} = await sb.from('supermad_analisis_asesmen')
      .select('*').eq('guru_id', guruId).order('created_at',{ascending:false});
    setList(data||[]);
    setLoading(false);
  }

  function hitungAnalisis(dataSiswa, kkm) {
    if (!dataSiswa||dataSiswa.length===0) return null;
    const n  = dataSiswa.length;
    const vals = dataSiswa.map(s=>Number(s.nilai)||0);
    const rata = vals.reduce((a,b)=>a+b,0)/n;
    const variance = vals.reduce((a,v)=>a+Math.pow(v-rata,2),0)/n;
    const stdv = Math.sqrt(variance);
    const maks = Math.max(...vals);
    const min  = Math.min(...vals);
    const tuntas    = vals.filter(v=>v>=kkm).length;
    const tdk_tuntas = n - tuntas;
    const pct_tuntas = (tuntas/n)*100;
    const distribusi = {
      r0_59:   vals.filter(v=>v<60).length,
      r60_74:  vals.filter(v=>v>=60&&v<75).length,
      r75_84:  vals.filter(v=>v>=75&&v<85).length,
      r85_100: vals.filter(v=>v>=85).length,
    };
    let interpretasi_stdv = '';
    if (stdv < 10)       interpretasi_stdv = 'Merata — kemampuan siswa relatif homogen (STDV < 10)';
    else if (stdv <= 20) interpretasi_stdv = 'Variasi Sedang — terdapat perbedaan kemampuan yang wajar (STDV 10–20)';
    else                 interpretasi_stdv = 'Variasi Tinggi — kemampuan siswa sangat beragam, perlu perhatian khusus (STDV > 20)';
    let rekomendasi = '';
    if (pct_tuntas >= 85) rekomendasi = 'Hasil sangat baik. Lanjutkan dengan materi pengayaan untuk siswa yang sudah tuntas.';
    else if (pct_tuntas >= 70) rekomendasi = 'Sebagian besar tuntas. Lakukan remedial terfokus untuk '+tdk_tuntas+' siswa yang belum mencapai KKM.';
    else if (pct_tuntas >= 50) rekomendasi = 'Lebih dari setengah belum tuntas. Pertimbangkan pembelajaran ulang sebelum remedial.';
    else rekomendasi = 'Sebagian besar siswa belum tuntas. Evaluasi strategi pembelajaran dan lakukan reteaching menyeluruh.';
    if (stdv > 20) rekomendasi += ' Variasi nilai sangat tinggi — pertimbangkan pengelompokan belajar berdasarkan kemampuan.';
    return { n, rata, stdv, maks, min, tuntas, tdk_tuntas, pct_tuntas, distribusi, interpretasi_stdv, rekomendasi };
  }

  async function simpan(statusBaru) {
    setSaving(true);
    const h = hitungAnalisis(form.data_siswa, Number(form.kkm));
    const payload = {
      guru_id: guruId,
      madrasah_id: sesi.mad.id,
      jenis_penilaian: form.jenis_penilaian,
      topik: form.topik, mapel: form.mapel, kelas: form.kelas,
      semester: form.semester, tahun_ajaran: form.tahun_ajaran,
      tanggal_pelaksanaan: form.tanggal_pelaksanaan||null,
      kkm: Number(form.kkm),
      data_siswa: form.data_siswa,
      jumlah_siswa: h?.n||0,
      nilai_rata: h?.rata||null,
      nilai_tertinggi: h?.maks||null,
      nilai_terendah: h?.min||null,
      stdv: h?.stdv||null,
      jumlah_tuntas: h?.tuntas||0,
      jumlah_tidak_tuntas: h?.tdk_tuntas||0,
      pct_tuntas: h?.pct_tuntas||0,
      distribusi: h?.distribusi||{},
      interpretasi_stdv: h?.interpretasi_stdv||'',
      rekomendasi: h?.rekomendasi||'',
      catatan_guru: form.catatan_guru,
      status: statusBaru||form.status,
      updated_at: new Date().toISOString(),
    };
    let error;
    if (aktif?.id) {
      ({error} = await sb.from('supermad_analisis_asesmen').update(payload).eq('id', aktif.id));
    } else {
      ({error} = await sb.from('supermad_analisis_asesmen').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal menyimpan: '+error.message,'error'); return; }
    showToast(statusBaru==='final'?'✅ Analisis difinalisasi':'💾 Disimpan sebagai draft','success');
    loadList(); setMode('list'); setAktif(null); setForm(blankForm);
  }

  function tambahSiswa() {
    const nm = namaBaru.trim();
    const nl = parseFloat(nilaiInput);
    if (!nm) { showToast('Masukkan nama siswa','error'); return; }
    if (isNaN(nl)||nl<0||nl>100) { showToast('Nilai harus 0–100','error'); return; }
    setForm(f=>({...f, data_siswa:[...f.data_siswa,{nama:nm,nilai:nl}]}));
    setNamaBaru(''); setNilaiInput('');
  }

  function hapusSiswa(idx) {
    setForm(f=>({...f, data_siswa:f.data_siswa.filter((_,i)=>i!==idx)}));
  }

  function bukaBaru() {
    setForm(blankForm); setAktif(null); setMode('form'); setNamaBaru(''); setNilaiInput('');
  }

  function bukaEdit(item) {
    setForm({
      jenis_penilaian: item.jenis_penilaian||'UH',
      topik: item.topik||'', mapel: item.mapel||'', kelas: item.kelas||'',
      semester: item.semester||'Ganjil', tahun_ajaran: item.tahun_ajaran||'2025/2026',
      tanggal_pelaksanaan: item.tanggal_pelaksanaan||'',
      kkm: item.kkm||75,
      data_siswa: item.data_siswa||[],
      catatan_guru: item.catatan_guru||'', status: item.status||'draft'
    });
    setAktif(item); setMode('form'); setNamaBaru(''); setNilaiInput('');
  }

  function bukaDetail(item) { setAktif(item); setMode('detail'); }

  const jenisOpts = ['UH','PTS','PAS','PAT','Proyek','Lainnya'];
  const h = hitungAnalisis(form.data_siswa, Number(form.kkm));

  // ── LIST VIEW ──
  if (mode==='list') return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:'1rem'}}>📈 Analisis Hasil Asesmen</div>
        <button className="btn btn-primary btn-sm" onClick={bukaBaru}>+ Analisis Baru</button>
      </div>
      {loading ? <div style={{textAlign:'center',padding:30,color:'var(--text2)'}}>Memuat...</div> :
       list.length===0 ? (
        <div style={{textAlign:'center',padding:40,background:'var(--surface2)',borderRadius:12}}>
          <div style={{fontSize:'2.5rem',marginBottom:8}}>📊</div>
          <div style={{fontWeight:700,marginBottom:6}}>Belum ada analisis asesmen</div>
          <div style={{color:'var(--text2)',marginBottom:16,fontSize:'.85rem'}}>Mulai dengan memasukkan data nilai siswa dari penilaian yang sudah dilaksanakan.</div>
          <button className="btn btn-primary" onClick={bukaBaru}>+ Mulai Analisis Pertama</button>
        </div>
       ) : (
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {list.map(item=>{
            const pct = item.pct_tuntas||0;
            const warna = pct>=85?'#22c55e':pct>=70?'#f59e0b':'#ef4444';
            return (
              <div key={item.id} className="card" style={{padding:'14px 16px',cursor:'pointer'}}
                onClick={()=>bukaDetail(item)}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:'.92rem'}}>
                      {item.jenis_penilaian} — {item.mapel||'—'} · {item.kelas||'—'}
                    </div>
                    {item.topik && <div style={{fontSize:'.8rem',color:'var(--text2)',marginTop:2}}>{item.topik}</div>}
                    <div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:4}}>
                      {item.jumlah_siswa||0} siswa · {item.semester} {item.tahun_ajaran}
                      {item.tanggal_pelaksanaan&&' · '+new Date(item.tanggal_pelaksanaan).toLocaleDateString('id-ID')}
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontWeight:800,fontSize:'1.1rem',color:warna}}>{pct.toFixed(0)}%</div>
                    <div style={{fontSize:'.7rem',color:'var(--text2)'}}>tuntas</div>
                    <span style={{display:'inline-block',marginTop:4,padding:'2px 9px',borderRadius:20,
                      fontSize:'.72rem',fontWeight:700,
                      background:item.status==='final'?'#dcfce7':'#fef9c3',
                      color:item.status==='final'?'#166534':'#92400e'}}>
                      {item.status==='final'?'Final':'Draft'}
                    </span>
                  </div>
                </div>
                {item.stdv!=null && (
                  <div style={{marginTop:8,fontSize:'.78rem',color:'var(--text2)',
                    padding:'5px 10px',background:'var(--surface2)',borderRadius:7}}>
                    Rata-rata: <b>{Number(item.nilai_rata||0).toFixed(1)}</b> ·
                    STDV: <b>{Number(item.stdv||0).toFixed(1)}</b> ·
                    KKM: <b>{item.kkm}</b>
                  </div>
                )}
              </div>
            );
          })}
        </div>
       )}
    </div>
  );

  // ── DETAIL VIEW ──
  if (mode==='detail' && aktif) {
    const dSiswa = aktif.data_siswa||[];
    const kkm    = Number(aktif.kkm||75);
    const pct = aktif.pct_tuntas||0;
    const warnaP = pct>=85?'#22c55e':pct>=70?'#f59e0b':'#ef4444';
    const dist   = aktif.distribusi||{};
    const maxDist = Math.max(dist.r0_59||0, dist.r60_74||0, dist.r75_84||0, dist.r85_100||0, 1);
    const remedial  = dSiswa.filter(s=>Number(s.nilai)<kkm).sort((a,b)=>a.nilai-b.nilai);
    const pengayaan = dSiswa.filter(s=>Number(s.nilai)>=85).sort((a,b)=>b.nilai-a.nilai);
    return (
      <div>
        <div style={{display:'flex',gap:8,marginBottom:14,alignItems:'center'}}>
          <button className="btn btn-outline btn-sm" onClick={()=>{setMode('list');setAktif(null);}}>← Kembali</button>
          <button className="btn btn-outline btn-sm" onClick={()=>bukaEdit(aktif)}>✏️ Edit</button>
          <span style={{flex:1}}/>
          <span style={{padding:'3px 12px',borderRadius:20,fontWeight:700,fontSize:'.78rem',
            background:aktif.status==='final'?'#dcfce7':'#fef9c3',
            color:aktif.status==='final'?'#166534':'#92400e'}}>
            {aktif.status==='final'?'Final':'Draft'}
          </span>
        </div>
        <div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:'1rem',marginBottom:4}}>
            {aktif.jenis_penilaian} — {aktif.mapel||'—'} · {aktif.kelas||'—'}
          </div>
          {aktif.topik && <div style={{color:'var(--text2)',fontSize:'.85rem',marginBottom:4}}>{aktif.topik}</div>}
          <div style={{fontSize:'.8rem',color:'var(--text2)'}}>
            {aktif.semester} {aktif.tahun_ajaran}
            {aktif.tanggal_pelaksanaan&&' · '+new Date(aktif.tanggal_pelaksanaan).toLocaleDateString('id-ID')}
            {' · KKM: '+(aktif.kkm||75)}
          </div>
        </div>

        {/* Ringkasan Statistik */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10,marginBottom:12}}>
          {[
            ['Jumlah Siswa', aktif.jumlah_siswa||0, '', '#6366f1'],
            ['Nilai Rata-rata', Number(aktif.nilai_rata||0).toFixed(1), '', '#3b82f6'],
            ['STDV', Number(aktif.stdv||0).toFixed(1), '', '#8b5cf6'],
            ['Tertinggi', Number(aktif.nilai_tertinggi||0).toFixed(0), '', '#22c55e'],
            ['Terendah', Number(aktif.nilai_terendah||0).toFixed(0), '', '#ef4444'],
            ['% Tuntas', pct.toFixed(1)+'%', aktif.jumlah_tuntas+' dari '+(aktif.jumlah_siswa||0), warnaP],
          ].map(([label,val,sub,c])=>(
            <div key={label} className="card" style={{textAlign:'center',padding:'12px 8px',border:'1.5px solid '+c+'33'}}>
              <div style={{fontSize:'1.4rem',fontWeight:800,color:c}}>{val}</div>
              <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--text2)'}}>{label}</div>
              {sub&&<div style={{fontSize:'.68rem',color:'var(--text2)',marginTop:2}}>{sub}</div>}
            </div>
          ))}
        </div>

        {/* Interpretasi STDV */}
        {aktif.interpretasi_stdv && (
          <div style={{marginBottom:12,padding:'10px 14px',borderRadius:10,
            background:'#f5f3ff',border:'1.5px solid #a78bfa',fontSize:'.83rem'}}>
            <b>📐 Interpretasi STDV:</b> {aktif.interpretasi_stdv}
          </div>
        )}

        {/* Distribusi Nilai Bar Chart */}
        <div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:700,marginBottom:10,fontSize:'.88rem'}}>Distribusi Nilai</div>
          {[['0–59','r0_59','#ef4444'],['60–74','r60_74','#f59e0b'],['75–84','r75_84','#22c55e'],['85–100','r85_100','#3b82f6']].map(([label,key,c])=>{
            const jml = dist[key]||0;
            const pct2 = Math.round((jml/maxDist)*100);
            return (
              <div key={key} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <div style={{width:56,fontSize:'.78rem',fontWeight:700,color:'var(--text2)',textAlign:'right'}}>{label}</div>
                <div style={{flex:1,height:22,background:'var(--surface2)',borderRadius:6,overflow:'hidden'}}>
                  <div style={{width:pct2+'%',height:'100%',background:c,borderRadius:6,transition:'width .4s'}}/>
                </div>
                <div style={{width:24,textAlign:'right',fontWeight:700,fontSize:'.82rem'}}>{jml}</div>
              </div>
            );
          })}
        </div>

        {/* Rekomendasi */}
        {aktif.rekomendasi && (
          <div style={{marginBottom:12,padding:'10px 14px',borderRadius:10,
            background:'#f0fdf4',border:'1.5px solid #86efac',fontSize:'.83rem'}}>
            <b>💡 Rekomendasi:</b> {aktif.rekomendasi}
          </div>
        )}

        {/* Daftar Remedial */}
        {remedial.length>0 && (
          <div className="card" style={{marginBottom:12}}>
            <div style={{fontWeight:700,marginBottom:8,fontSize:'.88rem',color:'#ef4444'}}>
              🔴 Remedial ({remedial.length} siswa — nilai &lt; KKM {kkm})
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {remedial.map((s,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',
                  padding:'5px 10px',background:'#fef2f2',borderRadius:7,fontSize:'.82rem'}}>
                  <span>{s.nama}</span>
                  <span style={{fontWeight:700,color:'#ef4444'}}>{s.nilai}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Daftar Pengayaan */}
        {pengayaan.length>0 && (
          <div className="card" style={{marginBottom:12}}>
            <div style={{fontWeight:700,marginBottom:8,fontSize:'.88rem',color:'#22c55e'}}>
              🟢 Pengayaan ({pengayaan.length} siswa — nilai ≥ 85)
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {pengayaan.map((s,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',
                  padding:'5px 10px',background:'#f0fdf4',borderRadius:7,fontSize:'.82rem'}}>
                  <span>{s.nama}</span>
                  <span style={{fontWeight:700,color:'#16a34a'}}>{s.nilai}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Semua siswa */}
        <div className="card">
          <div style={{fontWeight:700,marginBottom:8,fontSize:'.88rem'}}>Semua Siswa ({dSiswa.length})</div>
          <div style={{display:'flex',flexDirection:'column',gap:3,maxHeight:250,overflowY:'auto'}}>
            {[...dSiswa].sort((a,b)=>b.nilai-a.nilai).map((s,i)=>{
              const tuntas = Number(s.nilai)>=kkm;
              return (
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                  padding:'4px 10px',background:tuntas?'#f0fdf4':'#fef2f2',borderRadius:6,fontSize:'.82rem'}}>
                  <span>{s.nama}</span>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontWeight:700,color:tuntas?'#16a34a':'#ef4444'}}>{s.nilai}</span>
                    <span style={{fontSize:'.7rem',color:tuntas?'#16a34a':'#ef4444'}}>{tuntas?'✓ Tuntas':'✗ Remedial'}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ── FORM VIEW ──
  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:14,alignItems:'center'}}>
        <button className="btn btn-outline btn-sm" onClick={()=>{setMode('list');setAktif(null);setForm(blankForm);}}>
          ← Kembali
        </button>
        <div style={{fontWeight:700,fontSize:'.95rem'}}>
          {aktif?'Edit':'Buat'} Analisis Asesmen
        </div>
      </div>

      {/* Identitas */}
      <div className="card" style={{marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:10,fontSize:'.88rem'}}>📋 Identitas Penilaian</div>
        {/* Jenis Penilaian chips */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:6}}>Jenis Penilaian</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {jenisOpts.map(j=>(
              <button key={j} onClick={()=>setForm(f=>({...f,jenis_penilaian:j}))}
                style={{padding:'5px 14px',borderRadius:20,border:'2px solid',cursor:'pointer',fontFamily:'inherit',
                  fontWeight:700,fontSize:'.8rem',
                  borderColor:form.jenis_penilaian===j?'var(--p)':'#d1d5db',
                  background:form.jenis_penilaian===j?'var(--p)':'transparent',
                  color:form.jenis_penilaian===j?'#fff':'var(--text2)'}}>
                {j}
              </button>
            ))}
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[['topik','Topik / Kompetensi'],['mapel','Mata Pelajaran'],['kelas','Kelas'],
            ['tanggal_pelaksanaan','Tanggal Pelaksanaan']].map(([k,lbl])=>(
            <div key={k}>
              <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:4}}>{lbl}</div>
              <input type={k==='tanggal_pelaksanaan'?'date':'text'} value={form[k]||''}
                onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}
                style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid #d1d5db',
                  fontFamily:'inherit',fontSize:'.85rem',boxSizing:'border-box'}}
              />
            </div>
          ))}
          <div>
            <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:4}}>Semester</div>
            <select value={form.semester} onChange={e=>setForm(f=>({...f,semester:e.target.value}))}
              style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid #d1d5db',fontFamily:'inherit',fontSize:'.85rem'}}>
              {['Ganjil','Genap'].map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:4}}>Tahun Ajaran</div>
            <input value={form.tahun_ajaran} onChange={e=>setForm(f=>({...f,tahun_ajaran:e.target.value}))}
              style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid #d1d5db',fontFamily:'inherit',fontSize:'.85rem'}}/>
          </div>
          <div>
            <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:4}}>KKM / KKtp</div>
            <input type="number" min="0" max="100" value={form.kkm}
              onChange={e=>setForm(f=>({...f,kkm:e.target.value}))}
              style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid #d1d5db',fontFamily:'inherit',fontSize:'.85rem'}}/>
          </div>
        </div>
      </div>

      {/* Input Data Siswa */}
      <div className="card" style={{marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:10,fontSize:'.88rem'}}>
          🎓 Data Nilai Siswa
          {form.data_siswa.length>0 && <span style={{fontWeight:400,color:'var(--text2)',marginLeft:8}}>{form.data_siswa.length} siswa</span>}
        </div>
        <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
          <input placeholder="Nama siswa" value={namaBaru}
            onChange={e=>setNamaBaru(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&tambahSiswa()}
            style={{flex:2,minWidth:120,padding:'7px 10px',borderRadius:8,
              border:'1.5px solid #d1d5db',fontFamily:'inherit',fontSize:'.85rem'}}/>
          <input type="number" placeholder="Nilai (0-100)" value={nilaiInput}
            onChange={e=>setNilaiInput(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&tambahSiswa()}
            min="0" max="100"
            style={{flex:1,minWidth:90,padding:'7px 10px',borderRadius:8,
              border:'1.5px solid #d1d5db',fontFamily:'inherit',fontSize:'.85rem'}}/>
          <button className="btn btn-primary btn-sm" onClick={tambahSiswa}>+ Tambah</button>
        </div>
        {form.data_siswa.length===0 ? (
          <div style={{textAlign:'center',padding:'20px',color:'var(--text2)',fontSize:'.82rem'}}>
            Belum ada data siswa. Tambahkan nama dan nilai di atas.
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:220,overflowY:'auto'}}>
            {form.data_siswa.map((s,i)=>{
              const tuntas = Number(s.nilai)>=Number(form.kkm);
              return (
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,
                  padding:'5px 10px',background:tuntas?'#f0fdf4':'#fef2f2',borderRadius:7}}>
                  <span style={{flex:1,fontSize:'.83rem'}}>{s.nama}</span>
                  <span style={{fontWeight:700,fontSize:'.85rem',color:tuntas?'#16a34a':'#ef4444'}}>{s.nilai}</span>
                  <span style={{fontSize:'.7rem',color:tuntas?'#16a34a':'#ef4444'}}>{tuntas?'✓':'✗'}</span>
                  <button onClick={()=>hapusSiswa(i)}
                    style={{background:'none',border:'none',cursor:'pointer',color:'#ef4444',fontSize:'.9rem',padding:'2px 5px'}}>×</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Preview Analisis Live */}
      {h && form.data_siswa.length>0 && (
        <div className="card" style={{marginBottom:12,border:'2px solid var(--p)33',background:'#f8faff'}}>
          <div style={{fontWeight:700,marginBottom:10,fontSize:'.88rem',color:'var(--p)'}}>
            📊 Preview Hasil Analisis ({form.data_siswa.length} siswa)
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:10}}>
            {[
              ['Rata-rata', h.rata.toFixed(1), '#3b82f6'],
              ['STDV', h.stdv.toFixed(1), '#8b5cf6'],
              ['Tuntas', h.pct_tuntas.toFixed(0)+'%', h.pct_tuntas>=70?'#22c55e':'#ef4444'],
            ].map(([l,v,c])=>(
              <div key={l} style={{textAlign:'center',padding:'8px',background:'#fff',borderRadius:8,border:'1.5px solid '+c+'44'}}>
                <div style={{fontWeight:800,color:c,fontSize:'1.1rem'}}>{v}</div>
                <div style={{fontSize:'.72rem',color:'var(--text2)'}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:'.8rem',padding:'7px 10px',background:'#ede9fe',borderRadius:8,marginBottom:6}}>
            📐 {h.interpretasi_stdv}
          </div>
          <div style={{fontSize:'.8rem',padding:'7px 10px',background:'#f0fdf4',borderRadius:8}}>
            💡 {h.rekomendasi}
          </div>
        </div>
      )}

      {/* Catatan */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)',marginBottom:6}}>Catatan Guru (opsional)</div>
        <textarea rows={3} value={form.catatan_guru}
          onChange={e=>setForm(f=>({...f,catatan_guru:e.target.value}))}
          placeholder="Refleksi, catatan pelaksanaan, konteks khusus..."
          style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1.5px solid #d1d5db',
            fontFamily:'inherit',fontSize:'.85rem',resize:'vertical',boxSizing:'border-box'}}/>
      </div>

      <div style={{display:'flex',gap:10,justifyContent:'flex-end',flexWrap:'wrap'}}>
        <button className="btn btn-outline" onClick={()=>{setMode('list');setAktif(null);setForm(blankForm);}}>Batal</button>
        <button className="btn btn-outline" onClick={()=>simpan('draft')} disabled={saving||form.data_siswa.length===0}>
          {saving?'Menyimpan...':'💾 Simpan Draft'}
        </button>
        <button className="btn btn-primary" onClick={()=>simpan('final')} disabled={saving||form.data_siswa.length===0}>
          {saving?'Memproses...':'✅ Finalisasi'}
        </button>
      </div>
    </div>
  );
}

// ── TAB ANALISIS INSTRUMEN ────────────────────────────────────
function TabAnalisisInstrumen({sesi, showToast}) {
  const guruId = sesi.pengguna.id;
  const [list, setList]           = useState([]);
  const [loading, setLoading]     = useState(true);
  const [mode, setMode]           = useState('list'); // 'list' | 'form' | 'detail'
  const [aktif, setAktif]         = useState(null);
  const [formStep, setFormStep]   = useState(1); // 1=Identitas, 2=Butir Soal, 3=Checklist, 4=Hasil
  const [saving, setSaving]       = useState(false);

  // ── Form state ──
  const [form, setForm] = useState({
    jenis_penilaian:'UH', topik:'', kelas:'', semester: sesi.mad.semester_aktif||'Ganjil',
    tahun_ajaran: sesi.mad.tahun_ajaran||'', tanggal_pelaksanaan:'',
    mapel: sesi.pengguna.mapel||'', keterangan:'',
  });
  const [butirSoal, setButirSoal] = useState([]);
  const [butirForm, setButirForm] = useState({deskripsi:'',level_bloom:'C1',domain:'Pengetahuan',bobot:1});
  const [checkVal,  setCheckVal]  = useState({});  // id → nilai (1/2/3)

  // Checklist items
  const CHECKLIST = {
    validitas: [
      {id:'v1', teks:'Soal mengukur capaian pembelajaran (CP) yang telah ditetapkan'},
      {id:'v2', teks:'Setiap butir soal sesuai dengan tujuan pembelajaran (TP)'},
      {id:'v3', teks:'Instrumen mengukur kemampuan yang sesungguhnya (bukan hafalan semata)'},
      {id:'v4', teks:'Ada kunci jawaban / rubrik penilaian yang jelas'},
      {id:'v5', teks:'Proporsi bobot soal sesuai dengan tingkat kepentingan materi'},
    ],
    keterbacaan: [
      {id:'k1', teks:'Bahasa yang digunakan jelas dan tidak ambigu'},
      {id:'k2', teks:'Kalimat pertanyaan tidak mengandung petunjuk jawaban'},
      {id:'k3', teks:'Panjang kalimat soal proporsional dan mudah dipahami siswa'},
    ],
    kesesuaian: [
      {id:'s1', teks:'Instrumen sesuai dengan alur tujuan pembelajaran (ATP)'},
      {id:'s2', teks:'Distribusi level kognitif (C1-C6) variatif dan sesuai jenjang'},
      {id:'s3', teks:'Instrumen memuat penilaian ranah pengetahuan DAN keterampilan'},
      {id:'s4', teks:'Instrumen sudah diujicobakan / ditelaah sebelum digunakan'},
    ],
  };

  const BLOOM = ['C1','C2','C3','C4','C5','C6'];
  const BLOOM_LABEL = {C1:'Mengingat',C2:'Memahami',C3:'Menerapkan',C4:'Menganalisis',C5:'Mengevaluasi',C6:'Mencipta'};
  const BLOOM_COLOR = {C1:'#6b7280',C2:'#2563eb',C3:'#16a34a',C4:'#d97706',C5:'#9333ea',C6:'#dc2626'};
  const DOMAIN = ['Pengetahuan','Keterampilan','Sikap'];
  const JENIS  = ['UH','PTS','PAS','PAT','Proyek','Observasi','Portofolio','Lainnya'];
  const JENIS_LABEL = {UH:'Ulangan Harian',PTS:'Penilaian Tengah Semester',PAS:'Penilaian Akhir Semester',
    PAT:'Penilaian Akhir Tahun',Proyek:'Penugasan / Proyek',Observasi:'Observasi / Penilaian Sikap',
    Portofolio:'Portofolio',Lainnya:'Lainnya'};

  React.useEffect(()=>{ loadList(); },[]);

  async function loadList() {
    setLoading(true);
    const {data} = await sb.from('supermad_analisis_instrumen')
      .select('*').eq('guru_id', guruId).eq('madrasah_id', sesi.mad.id)
      .order('created_at',{ascending:false});
    setList(data||[]);
    setLoading(false);
  }

  function hitungHasil(bSoal, cVal) {
    // Hitung skor checklist (maks 12 item × 4 = 48)
    const allItems = [...CHECKLIST.validitas,...CHECKLIST.keterbacaan,...CHECKLIST.kesesuaian];
    let skorC = 0, totalC = allItems.length * 4;
    allItems.forEach(item => {
      const v = parseInt(cVal[item.id]||0);
      skorC += v===1?4:v===2?3:v===3?2:0;
    });
    const pctC = totalC > 0 ? (skorC/totalC)*100 : 0;

    // Analisis distribusi Bloom
    const total = bSoal.length;
    const dist = {};
    BLOOM.forEach(b=>{ dist[b] = bSoal.filter(s=>s.level_bloom===b).length; });
    const higherOrder = (dist['C4']||0)+(dist['C5']||0)+(dist['C6']||0);
    const pctHOTS = total>0 ? (higherOrder/total)*100 : 0;

    // Skor total gabungan (checklist 70% + HOTS 30%)
    const skorTotal = (pctC * 0.7) + (pctHOTS * 0.3);
    const predikat = skorTotal>=91?'Sangat Baik':skorTotal>=81?'Baik':skorTotal>=71?'Cukup':'Perlu Perbaikan';

    // Rekomendasi otomatis
    const rek = [];
    if (pctC < 75) rek.push('Tinjau kembali kualitas instrumen — skor checklist di bawah standar.');
    if (pctHOTS < 20) rek.push('Tambahkan soal level tinggi (C4-C6/HOTS) agar mengukur kemampuan berpikir kritis.');
    if ((dist['C1']||0)/Math.max(total,1) > 0.5) rek.push('Terlalu banyak soal hafalan (C1). Kurangi dan ganti dengan C2-C4.');
    if (total < 5) rek.push('Jumlah butir soal masih sedikit. Tambah butir soal untuk analisis lebih akurat.');
    if (rek.length===0) rek.push('Instrumen sudah berkualitas baik. Pertahankan!');

    return { skorTotal: Math.round(skorTotal*10)/10, predikat, rekomendasi: rek.join(' '), pctC, pctHOTS, dist };
  }

  async function simpan(statusSimpan) {
    setSaving(true);
    const hasil = hitungHasil(butirSoal, checkVal);
    const checklistVal = (items) => items.map(it=>({...it, nilai: parseInt(checkVal[it.id]||0)}));
    const payload = {
      guru_id: guruId,
      madrasah_id: sesi.mad.id,
      ...form,
      butir_soal: butirSoal,
      checklist_validitas:   checklistVal(CHECKLIST.validitas),
      checklist_keterbacaan: checklistVal(CHECKLIST.keterbacaan),
      checklist_kesesuaian:  checklistVal(CHECKLIST.kesesuaian),
      skor_total:  hasil.skorTotal,
      predikat:    hasil.predikat,
      rekomendasi: hasil.rekomendasi,
      status: statusSimpan,
      updated_at: new Date().toISOString(),
    };
    let error;
    if (aktif?.id) {
      ({error} = await sb.from('supermad_analisis_instrumen').update(payload).eq('id', aktif.id));
    } else {
      ({error} = await sb.from('supermad_analisis_instrumen').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast(statusSimpan==='final'?'✅ Analisis instrumen diselesaikan!':'💾 Draft tersimpan');
    setMode('list'); loadList();
  }

  function bukaEdit(item) {
    setAktif(item);
    setForm({
      jenis_penilaian: item.jenis_penilaian, topik: item.topik||'', kelas: item.kelas||'',
      semester: item.semester||'', tahun_ajaran: item.tahun_ajaran||'',
      tanggal_pelaksanaan: item.tanggal_pelaksanaan||'', mapel: item.mapel||'', keterangan: item.keterangan||'',
    });
    setButirSoal(item.butir_soal||[]);
    const cv = {};
    [...(item.checklist_validitas||[]),...(item.checklist_keterbacaan||[]),...(item.checklist_kesesuaian||[])]
      .forEach(c=>{ if (c.nilai) cv[c.id]=c.nilai; });
    setCheckVal(cv);
    setFormStep(1);
    setMode('form');
  }

  function bukaBaru() {
    setAktif(null);
    setForm({jenis_penilaian:'UH',topik:'',kelas:'',semester:sesi.mad.semester_aktif||'Ganjil',
      tahun_ajaran:sesi.mad.tahun_ajaran||'',tanggal_pelaksanaan:'',
      mapel:sesi.pengguna.mapel||'',keterangan:''});
    setButirSoal([]);
    setCheckVal({});
    setFormStep(1);
    setMode('form');
  }

  function tambahButir() {
    if (!butirForm.deskripsi.trim()) { showToast('Isi deskripsi butir soal','error'); return; }
    const nomor = butirSoal.length + 1;
    setButirSoal(prev=>[...prev, {nomor, ...butirForm, id: Date.now()}]);
    setButirForm({deskripsi:'',level_bloom:'C1',domain:'Pengetahuan',bobot:1});
  }

  // ── RENDER LIST ──
  if (loading) return <Loading text="Memuat analisis instrumen..." />;

  if (mode === 'list') return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
        <div style={{fontWeight:800,color:'var(--p3)',fontSize:'1rem'}}>🔬 Analisis Instrumen Asesmen</div>
        <button onClick={bukaBaru}
          style={{padding:'7px 16px',background:'var(--p)',color:'#fff',border:'none',
            borderRadius:8,cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
          + Buat Analisis Baru
        </button>
      </div>

      {list.length === 0 && (
        <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
          <div style={{fontSize:'2rem',marginBottom:8}}>🔬</div>
          <div style={{fontWeight:700,marginBottom:4}}>Belum ada analisis instrumen</div>
          <div style={{fontSize:'.8rem'}}>Klik "+ Buat Analisis Baru" untuk mulai menganalisis instrumen penilaian Anda</div>
        </div>
      )}

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {list.map(item=>{
          const isDraft = item.status==='draft';
          const warna = item.skor_total>=91?'#16a34a':item.skor_total>=81?'#2563eb':item.skor_total>=71?'#d97706':'#dc2626';
          return (
            <div key={item.id} className="card" style={{padding:'14px 16px',
              border:`1.5px solid ${isDraft?'#fbbf24':'#86efac'}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:'.95rem',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    {JENIS_LABEL[item.jenis_penilaian]||item.jenis_penilaian}
                    {isDraft
                      ? <span style={{padding:'1px 8px',borderRadius:20,fontSize:'.65rem',fontWeight:700,
                          background:'#fef3c7',color:'#92400e',border:'1px solid #fbbf24'}}>Draft</span>
                      : <span style={{padding:'1px 8px',borderRadius:20,fontSize:'.65rem',fontWeight:700,
                          background:'#d1fae5',color:'#065f46',border:'1px solid #86efac'}}>✓ Final</span>
                    }
                  </div>
                  <div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:4}}>
                    {item.topik && <span>📚 {item.topik} · </span>}
                    <span>Kelas {item.kelas||'—'} · {item.semester} {item.tahun_ajaran}</span>
                  </div>
                  <div style={{fontSize:'.73rem',color:'var(--text3)',marginTop:3}}>
                    {item.mapel} · {(item.butir_soal||[]).length} butir soal
                  </div>
                </div>
                {item.skor_total > 0 && (
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:'1.3rem',fontWeight:900,color:warna}}>{item.skor_total}%</div>
                    <span style={{padding:'2px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                      background:item.skor_total>=91?'#d1fae5':item.skor_total>=81?'#dbeafe':item.skor_total>=71?'#fef3c7':'#fee2e2',
                      color:item.skor_total>=91?'#065f46':item.skor_total>=81?'#1d4ed8':item.skor_total>=71?'#92400e':'#991b1b'}}>
                      {item.predikat}
                    </span>
                  </div>
                )}
              </div>
              {item.rekomendasi && (
                <div style={{marginTop:8,padding:'6px 10px',background:'var(--surface2)',borderRadius:7,
                  fontSize:'.73rem',color:'var(--text2)'}}>
                  💡 {item.rekomendasi}
                </div>
              )}
              <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
                <button onClick={()=>bukaEdit(item)}
                  style={{padding:'5px 12px',background:'var(--p)',color:'#fff',border:'none',
                    borderRadius:7,cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                  ✏️ {isDraft?'Lanjut Edit':'Edit'}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── RENDER FORM ──
  const stepLabel = ['','Identitas Instrumen','Butir Soal','Checklist Kualitas','Hasil Analisis'];
  const hasil = formStep===4 ? hitungHasil(butirSoal, checkVal) : null;

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <button onClick={()=>setMode('list')} className="btn btn-outline btn-sm">← Kembali</button>
        <div style={{fontWeight:900,color:'var(--p3)'}}>
          🔬 {aktif ? 'Edit Analisis' : 'Analisis Instrumen Baru'}
        </div>
      </div>

      {/* Step indicator */}
      <div style={{display:'flex',gap:4,marginBottom:20,overflowX:'auto'}}>
        {[1,2,3,4].map(s=>(
          <button key={s} onClick={()=>setFormStep(s)}
            style={{flex:1,minWidth:80,padding:'8px 4px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.75rem',textAlign:'center',
              background:formStep===s?'var(--p)':s<formStep?'#d1fae5':'var(--surface2)',
              color:formStep===s?'#fff':s<formStep?'#065f46':'var(--text2)'}}>
            {s<formStep?'✓ ':''}{stepLabel[s]}
          </button>
        ))}
      </div>

      {/* STEP 1 — IDENTITAS */}
      {formStep===1 && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>📋 Identitas Instrumen</div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>

            <div>
              <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:6}}>
                Jenis Penilaian *
              </label>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {JENIS.map(j=>(
                  <button key={j} onClick={()=>setForm(f=>({...f,jenis_penilaian:j}))}
                    style={{padding:'6px 14px',borderRadius:20,border:'1.5px solid',cursor:'pointer',
                      fontWeight:700,fontSize:'.78rem',
                      background:form.jenis_penilaian===j?'var(--p)':'#fff',
                      color:form.jenis_penilaian===j?'#fff':'var(--p)',
                      borderColor:'var(--p)'}}>
                    {JENIS_LABEL[j]}
                  </button>
                ))}
              </div>
            </div>

            {[
              {label:'Topik / Bab',key:'topik',ph:'Contoh: Bab 3 — Sistem Periodik Unsur'},
              {label:'Mata Pelajaran',key:'mapel',ph:'Contoh: IPA'},
              {label:'Kelas',key:'kelas',ph:'Contoh: IX-2'},
            ].map(({label,key,ph})=>(
              <div key={key}>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>{label}</label>
                <input value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                  placeholder={ph}
                  style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',
                    fontSize:'.85rem',boxSizing:'border-box'}}/>
              </div>
            ))}

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Semester</label>
                <select value={form.semester} onChange={e=>setForm(f=>({...f,semester:e.target.value}))}
                  style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.85rem'}}>
                  <option>Ganjil</option><option>Genap</option>
                </select>
              </div>
              <div>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Tahun Ajaran</label>
                <input value={form.tahun_ajaran} onChange={e=>setForm(f=>({...f,tahun_ajaran:e.target.value}))}
                  placeholder="2026/2027"
                  style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.85rem',boxSizing:'border-box'}}/>
              </div>
            </div>

            <div>
              <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Tanggal Pelaksanaan</label>
              <input type="date" value={form.tanggal_pelaksanaan} onChange={e=>setForm(f=>({...f,tanggal_pelaksanaan:e.target.value}))}
                style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.85rem',boxSizing:'border-box'}}/>
            </div>

            <div>
              <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>Keterangan Tambahan</label>
              <textarea value={form.keterangan} onChange={e=>setForm(f=>({...f,keterangan:e.target.value}))}
                placeholder="Opsional — misal: UH setelah remedial, instrumen terevisi, dll"
                rows={2}
                style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',
                  fontSize:'.85rem',boxSizing:'border-box',resize:'vertical'}}/>
            </div>
          </div>
          <div style={{marginTop:16,display:'flex',justifyContent:'flex-end',gap:8}}>
            <button onClick={()=>simpan('draft')} disabled={saving||!form.jenis_penilaian}
              style={{padding:'8px 16px',background:'#fff',color:'var(--p)',border:'1.5px solid var(--p)',
                borderRadius:8,cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
              💾 Simpan Draft
            </button>
            <button onClick={()=>setFormStep(2)} disabled={!form.jenis_penilaian}
              style={{padding:'8px 18px',background:'var(--p)',color:'#fff',border:'none',
                borderRadius:8,cursor:'pointer',fontWeight:700,fontSize:'.8rem'}}>
              Lanjut → Butir Soal
            </button>
          </div>
        </div>
      )}

      {/* STEP 2 — BUTIR SOAL */}
      {formStep===2 && (
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div className="card">
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>➕ Tambah Butir Soal</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div>
                <label style={{fontWeight:700,fontSize:'.8rem',color:'var(--text2)',display:'block',marginBottom:4}}>
                  Deskripsi Soal *
                </label>
                <textarea value={butirForm.deskripsi}
                  onChange={e=>setButirForm(f=>({...f,deskripsi:e.target.value}))}
                  placeholder="Tulis deskripsi singkat soal, misal: Siswa menjelaskan pengertian fotosintesis"
                  rows={2}
                  style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',
                    fontSize:'.85rem',boxSizing:'border-box',resize:'vertical'}}/>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 80px',gap:8}}>
                <div>
                  <label style={{fontWeight:700,fontSize:'.78rem',color:'var(--text2)',display:'block',marginBottom:4}}>Level Bloom</label>
                  <select value={butirForm.level_bloom} onChange={e=>setButirForm(f=>({...f,level_bloom:e.target.value}))}
                    style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.82rem'}}>
                    {BLOOM.map(b=><option key={b} value={b}>{b} — {BLOOM_LABEL[b]}</option>)}
                  </select>
                </div>
                <div>
                  <label style={{fontWeight:700,fontSize:'.78rem',color:'var(--text2)',display:'block',marginBottom:4}}>Domain</label>
                  <select value={butirForm.domain} onChange={e=>setButirForm(f=>({...f,domain:e.target.value}))}
                    style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.82rem'}}>
                    {DOMAIN.map(d=><option key={d}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label style={{fontWeight:700,fontSize:'.78rem',color:'var(--text2)',display:'block',marginBottom:4}}>Bobot</label>
                  <input type="number" min={1} max={100} value={butirForm.bobot}
                    onChange={e=>setButirForm(f=>({...f,bobot:parseInt(e.target.value)||1}))}
                    style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid var(--border)',
                      fontSize:'.82rem',boxSizing:'border-box'}}/>
                </div>
              </div>
              <button onClick={tambahButir}
                style={{padding:'8px 18px',background:'var(--g)',color:'#fff',border:'none',
                  borderRadius:8,cursor:'pointer',fontWeight:700,fontSize:'.8rem',alignSelf:'flex-start'}}>
                + Tambah Butir
              </button>
            </div>
          </div>

          {/* Daftar butir */}
          <div className="card">
            <div style={{fontWeight:800,color:'var(--p3)',marginBottom:10}}>
              📋 Daftar Butir Soal ({butirSoal.length} butir)
            </div>
            {butirSoal.length===0
              ? <div style={{textAlign:'center',color:'var(--text3)',padding:16,fontSize:'.83rem'}}>
                  Belum ada butir soal ditambahkan
                </div>
              : (
                <>
                  {/* Distribusi Bloom visual */}
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
                    {BLOOM.map(b=>{
                      const cnt = butirSoal.filter(s=>s.level_bloom===b).length;
                      const pct = butirSoal.length ? Math.round(cnt/butirSoal.length*100) : 0;
                      return cnt > 0 ? (
                        <span key={b} style={{padding:'3px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:800,
                          background:BLOOM_COLOR[b]+'20',color:BLOOM_COLOR[b],border:'1.5px solid '+BLOOM_COLOR[b]}}>
                          {b} ({cnt}) {pct}%
                        </span>
                      ) : null;
                    })}
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:6}}>
                    {butirSoal.map((s,idx)=>(
                      <div key={s.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 10px',
                        background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)'}}>
                        <span style={{fontWeight:800,color:'var(--text2)',fontSize:'.8rem',minWidth:20}}>{s.nomor}.</span>
                        <div style={{flex:1,fontSize:'.82rem'}}>{s.deskripsi}</div>
                        <div style={{display:'flex',gap:4,alignItems:'center',flexShrink:0}}>
                          <span style={{padding:'2px 8px',borderRadius:12,fontSize:'.68rem',fontWeight:800,
                            background:BLOOM_COLOR[s.level_bloom]+'20',color:BLOOM_COLOR[s.level_bloom]}}>
                            {s.level_bloom}
                          </span>
                          <span style={{fontSize:'.68rem',color:'var(--text3)'}}>{s.domain}</span>
                          <button onClick={()=>setButirSoal(prev=>prev.filter((_,i)=>i!==idx))}
                            style={{background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:6,
                              cursor:'pointer',padding:'2px 7px',fontSize:'.72rem',fontWeight:700}}>
                            ✕
                          </button>

// ── TAB ANALITIK KANWIL ──────────────────────────────────────
function TabAnalitikKanwil({madrasahList, stats, filterSmt, filterTA, showToast}) {
  const [filterKab2, setFilterKab2] = React.useState('');
  const [filterTkt2, setFilterTkt2] = React.useState('');

  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  const warna = v => v>=91?'#16a34a':v>=81?'#2563eb':v>=71?'#d97706':'#dc2626';
  const pred  = v => v>=91?'Sangat Baik':v>=81?'Baik':v>=71?'Cukup':'Kurang';

  const kabList = [...new Set(madrasahList.map(m=>m.kota_kab).filter(Boolean))].sort();

  const filtered = madrasahList.filter(m => {
    if (filterKab2 && m.kota_kab !== filterKab2) return false;
    if (filterTkt2 && m.tingkat  !== filterTkt2) return false;
    return true;
  });

  // Statistik per kab/kota
  const kabStats = {};
  filtered.forEach(m => {
    const kab = m.kota_kab||'Lainnya';
    if (!kabStats[kab]) kabStats[kab] = {madrasah:0,supervisi:0,rata:[],p:[],l:[],a:[]};
    kabStats[kab].madrasah++;
    const s = stats[m.id]||{selesai:0,rata:[],p:[],l:[],a:[]};
    kabStats[kab].supervisi += s.selesai;
    kabStats[kab].rata.push(...s.rata);
    kabStats[kab].p.push(...s.p);
    kabStats[kab].l.push(...s.l);
    kabStats[kab].a.push(...s.a);
  });

  const kabRows = Object.entries(kabStats)
    .map(([kab,s]) => ({kab, ...s, avgRata:avg(s.rata), avgP:avg(s.p), avgL:avg(s.l), avgA:avg(s.a)}))
    .sort((a,b) => b.avgRata - a.avgRata);

  // Statistik per tingkat
  const tktStats = {};
  ['MI','MTs','MA'].forEach(tkt => {
    const mads = filtered.filter(m=>m.tingkat===tkt);
    const allR=mads.flatMap(m=>(stats[m.id]||{rata:[]}).rata);
    const allP=mads.flatMap(m=>(stats[m.id]||{p:[]}).p);
    const allL=mads.flatMap(m=>(stats[m.id]||{l:[]}).l);
    const allA=mads.flatMap(m=>(stats[m.id]||{a:[]}).a);
    tktStats[tkt] = {
      total:mads.length, sup:mads.reduce((s,m)=>s+(stats[m.id]||{selesai:0}).selesai,0),
      rata:avg(allR), p:avg(allP), l:avg(allL), a:avg(allA),
      len:allR.length,
    };
  });

  // Distribusi predikat semua madrasah
  const distrib = {SB:0,B:0,C:0,K:0,NA:0};
  filtered.forEach(m => {
    const s = stats[m.id]||{rata:[]};
    if (!s.rata.length) { distrib.NA++; return; }
    const r = avg(s.rata);
    if (r>=91) distrib.SB++;
    else if (r>=81) distrib.B++;
    else if (r>=71) distrib.C++;
    else distrib.K++;
  });

  const totalSupAll = filtered.reduce((s,m)=>s+(stats[m.id]||{selesai:0}).selesai,0);
  const allRataAll  = filtered.flatMap(m=>(stats[m.id]||{rata:[]}).rata);

  return (
    <div>
      <div style={{fontWeight:900,color:'var(--p3)',marginBottom:4}}>🔬 Analitik Mendalam</div>
      <div style={{fontSize:'.75rem',color:'var(--text3)',marginBottom:14}}>
        {filterSmt||'Semua semester'} · {filterTA||'Semua T.A.'}
        {(filterKab2||filterTkt2) && ` · Filter aktif`}
      </div>

      {/* Filter tambahan */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <select value={filterKab2} onChange={e=>setFilterKab2(e.target.value)}
          style={{padding:'5px 10px',borderRadius:8,border:'1.5px solid var(--border)',
            fontSize:'.78rem',fontFamily:'inherit',outline:'none'}}>
          <option value="">— Semua Kab/Kota —</option>
          {kabList.map(k=><option key={k}>{k}</option>)}
        </select>
        <select value={filterTkt2} onChange={e=>setFilterTkt2(e.target.value)}
          style={{padding:'5px 10px',borderRadius:8,border:'1.5px solid var(--border)',
            fontSize:'.78rem',fontFamily:'inherit',outline:'none'}}>
          <option value="">— Semua Tingkat —</option>
          {['MI','MTs','MA'].map(t=><option key={t}>{t}</option>)}
        </select>
        {(filterKab2||filterTkt2) && (
          <button className="btn btn-outline btn-sm" onClick={()=>{setFilterKab2('');setFilterTkt2('');}}>✕ Reset</button>
        )}
      </div>

      {/* Distribusi predikat */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>
          🏆 Distribusi Predikat Madrasah
          <span style={{fontSize:'.75rem',fontWeight:400,color:'var(--text3)',marginLeft:8}}>
            Total: {filtered.length} madrasah · {totalSupAll} supervisi
          </span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8}}>
          {[
            {label:'Sangat Baik',val:distrib.SB,color:'#16a34a',bg:'#d1fae5',min:'≥91%'},
            {label:'Baik',       val:distrib.B, color:'#2563eb',bg:'#dbeafe',min:'≥81%'},
            {label:'Cukup',      val:distrib.C, color:'#d97706',bg:'#fef3c7',min:'≥71%'},
            {label:'Kurang',     val:distrib.K, color:'#dc2626',bg:'#fee2e2',min:'<71%'},
            {label:'Belum Data', val:distrib.NA,color:'#9ca3af',bg:'#f3f4f6',min:'—'},
          ].map((d,i)=>(
            <div key={i} style={{textAlign:'center',padding:'12px 8px',borderRadius:10,
              background:d.bg,border:'1.5px solid '+d.color+'33'}}>
              <div style={{fontSize:'1.6rem',fontWeight:900,color:d.color}}>{d.val}</div>
              <div style={{fontSize:'.68rem',fontWeight:700,color:d.color,marginTop:2}}>{d.label}</div>
              <div style={{fontSize:'.62rem',color:'#9ca3af',marginTop:2}}>{d.min}</div>
            </div>
          ))}
        </div>
        {allRataAll.length > 0 && (
          <div style={{marginTop:12,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,
            fontSize:'.8rem',display:'flex',gap:20,flexWrap:'wrap'}}>
            <span>📊 Rata-rata Semua Madrasah: <b style={{color:warna(avg(allRataAll))}}>{avg(allRataAll).toFixed(1)}%</b></span>
            <span>📈 Tertinggi: <b style={{color:'#16a34a'}}>{Math.max(...allRataAll).toFixed(1)}%</b></span>
            <span>📉 Terendah: <b style={{color:'#dc2626'}}>{Math.min(...allRataAll).toFixed(1)}%</b></span>
          </div>
        )}
      </div>

      {/* Per tingkat madrasah */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>
          🏫 Perbandingan Capaian per Tingkat
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.8rem',minWidth:560}}>
            <thead>
              <tr style={{background:'var(--p3)',color:'#fff'}}>
                {['Tingkat','Madrasah','Supervisi','Perencanaan','Pelaksanaan','Asesmen','Rata-rata','Predikat'].map(h=>(
                  <th key={h} style={{padding:'7px 10px',textAlign:h==='Tingkat'||h==='Predikat'?'left':'center',fontWeight:700}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {['MI','MTs','MA'].map(tkt => {
                const s = tktStats[tkt];
                const fmt = v => s.len>0 ? v.toFixed(1)+'%' : '—';
                return (
                  <tr key={tkt} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'8px 10px'}}>
                      <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.75rem',fontWeight:700,
                        background:tkt==='MA'?'#dbeafe':tkt==='MTs'?'#fef3c7':'#d1fae5',
                        color:tkt==='MA'?'#1d4ed8':tkt==='MTs'?'#92400e':'#065f46'}}>
                        {tkt}
                      </span>
                    </td>
                    <td style={{padding:'8px 10px',textAlign:'center',fontWeight:700}}>{s.total}</td>
                    <td style={{padding:'8px 10px',textAlign:'center',fontWeight:700}}>{s.sup}</td>
                    {[s.p,s.l,s.a].map((v,vi)=>(
                      <td key={vi} style={{padding:'8px 10px',textAlign:'center',
                        fontWeight:s.len>0?700:400,color:s.len>0?warna(v):'#9ca3af'}}>
                        {fmt(v)}
                      </td>
                    ))}
                    <td style={{padding:'8px 10px',textAlign:'center',
                      fontWeight:s.len>0?900:400,fontSize:s.len>0?'1rem':'.8rem',
                      color:s.len>0?warna(s.rata):'#9ca3af'}}>
                      {s.len>0?s.rata.toFixed(1)+'%':'—'}
                    </td>
                    <td style={{padding:'8px 10px'}}>
                      {s.len>0 && (
                        <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                          background:s.rata>=91?'#d1fae5':s.rata>=81?'#dbeafe':s.rata>=71?'#fef3c7':'#fee2e2',
                          color:s.rata>=91?'#065f46':s.rata>=81?'#1d4ed8':s.rata>=71?'#92400e':'#991b1b'}}>
                          {pred(s.rata)}
                        </span>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Per Kab/Kota */}
      {kabRows.length > 0 && (
        <div className="card">
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:14}}>
            🗺️ Peringkat Capaian per Kabupaten/Kota
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {kabRows.map((k,i) => (
              <div key={k.kab}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:'.82rem',fontWeight:700}}>
                    <span style={{color:'var(--text3)',marginRight:6,fontWeight:400}}>{i+1}.</span>
                    {k.kab}
                    <span style={{fontSize:'.7rem',fontWeight:400,color:'var(--text3)',marginLeft:8}}>
                      {k.madrasah} madrasah · {k.supervisi} supervisi

                {k.rata.length > 0 ? (
                  <div>
                    <div style={{background:'#f0f0f0',borderRadius:8,height:20,overflow:'hidden'}}>

                        borderRadius:8,display:'flex',alignItems:'center',paddingLeft:8}}>
                        {k.avgRata >= 20 && (
                          <span style={{fontSize:'.68rem',color:'#fff',fontWeight:700}}>{k.avgRata.toFixed(1)}%</span>
                        )}

                    </div>
                    <div style={{display:'flex',gap:14,marginTop:4,fontSize:'.7rem',color:'var(--text3)'}}>
                      <span style={{color:'#16a34a'}}>P: {k.avgP.toFixed(1)}%</span>

// ── TAB TINDAK LANJUT KANWIL ─────────────────────────────────
function TabTindakLanjutKanwil({madrasahList, showToast}) {
  const [catatan, setCatatan]         = React.useState({});   // {madrasahId: teks}
  const [prioritas, setPrioritas]     = React.useState({});   // {madrasahId: 'rendah'|'sedang'|'tinggi'}
  const [status, setStatus]           = React.useState({});   // {madrasahId: 'belum'|'proses'|'selesai'}
  const [saving, setSaving]           = React.useState(null); // madrasahId yg sedang disimpan
  const [loading, setLoading]         = React.useState(true);
  const [filterStatus, setFilterStatus] = React.useState('');
  const [editId, setEditId]           = React.useState(null);

  React.useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const {data} = await sb.from('supermad_madrasah')
      .select('id,tl_kanwil').eq('aktif',true);
    const newCat={}, newPri={}, newStat={};
    (data||[]).forEach(m => {
      if (m.tl_kanwil) {
        newCat[m.id]  = m.tl_kanwil.catatan||'';
        newPri[m.id]  = m.tl_kanwil.prioritas||'sedang';
        newStat[m.id] = m.tl_kanwil.status||'belum';
      }
    });
    setCatatan(newCat); setPrioritas(newPri); setStatus(newStat);
    setLoading(false);
  }

  async function simpan(madId) {
    setSaving(madId);
    const payload = {
      catatan:   catatan[madId]||'',
      prioritas: prioritas[madId]||'sedang',
      status:    status[madId]||'belum',
      updated_at: new Date().toISOString(),
    };
    const {error} = await sb.from('supermad_madrasah')
      .update({tl_kanwil: payload}).eq('id', madId);
    setSaving(null);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Tindak lanjut tersimpan!');
    setEditId(null);
  }

  if (loading) return <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat...</div>;

  const filteredMad = madrasahList.filter(m => {
    if (!filterStatus) return true;
    return (status[m.id]||'belum') === filterStatus;
  });

  const priColor = {rendah:'#16a34a',sedang:'#d97706',tinggi:'#dc2626'};
  const priBg    = {rendah:'#d1fae5',sedang:'#fef3c7',tinggi:'#fee2e2'};
  const priLabel = {rendah:'🟢 Rendah',sedang:'🟡 Sedang',tinggi:'🔴 Tinggi'};
  const statColor = {belum:'#dc2626',proses:'#d97706',selesai:'#16a34a'};
  const statBg    = {belum:'#fee2e2',proses:'#fef3c7',selesai:'#d1fae5'};
  const statLabel = {belum:'⏳ Belum',proses:'🔄 Dalam Proses',selesai:'✅ Selesai'};

  const countSelesai = madrasahList.filter(m=>(status[m.id]||'belum')==='selesai').length;
  const countProses  = madrasahList.filter(m=>(status[m.id]||'belum')==='proses').length;
  const countBelum   = madrasahList.filter(m=>(status[m.id]||'belum')==='belum').length;

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>✍️ Tindak Lanjut Pembinaan per Madrasah</div>
          <div style={{fontSize:'.75rem',color:'var(--text3)',marginTop:2}}>
            Catat hasil pembinaan lanjutan kanwil untuk setiap madrasah
          </div>
        </div>
      </div>

      {/* Ringkasan status */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:14}}>
        {[
          {label:'Selesai',val:countSelesai,color:'#16a34a',bg:'#d1fae5'},
          {label:'Dalam Proses',val:countProses,color:'#d97706',bg:'#fef3c7'},
          {label:'Belum',val:countBelum,color:'#dc2626',bg:'#fee2e2'},
        ].map((s,i)=>(
          <div key={i} style={{textAlign:'center',padding:'12px 8px',borderRadius:10,
            background:s.bg,border:'1.5px solid '+s.color+'33',cursor:'pointer'}
            }
            onClick={()=>setFilterStatus(filterStatus===Object.keys(statLabel)[i]?'':Object.keys(statLabel)[i])}>
            <div style={{fontSize:'1.5rem',fontWeight:900,color:s.color}}>{s.val}</div>
            <div style={{fontSize:'.72rem',fontWeight:700,color:s.color}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Filter */}
      <div style={{display:'flex',gap:8,marginBottom:14,alignItems:'center'}}>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
          style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',outline:'none'}}>
          <option value="">— Semua Status —</option>
          <option value="belum">⏳ Belum</option>
          <option value="proses">🔄 Dalam Proses</option>
          <option value="selesai">✅ Selesai</option>
        </select>
        <span style={{fontSize:'.75rem',color:'var(--text3)'}}>
          {filteredMad.length} madrasah
        </span>
      </div>

      {/* Daftar madrasah */}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {filteredMad.map(m => {
          const isEdit = editId === m.id;
          const st = status[m.id]||'belum';
          const pri = prioritas[m.id]||'sedang';
          const cat = catatan[m.id]||'';
          return (
            <div key={m.id} className="card" style={{borderLeft:'3px solid '+statColor[st]}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontWeight:700,fontSize:'.88rem'}}>{m.nama}</div>
                  <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:2}}>
                    {m.tingkat} · {m.kota_kab||'—'} · {m.npsn||'—'}
                  </div>
                  {cat && !isEdit && (
                    <div style={{marginTop:6,fontSize:'.8rem',color:'var(--text2)',
                      padding:'6px 10px',background:'var(--surface2)',borderRadius:7,lineHeight:1.5}}>
                      {cat}
                    </div>
                  )}
                  {!cat && !isEdit && (
                    <div style={{marginTop:6,fontSize:'.75rem',color:'#9ca3af',fontStyle:'italic'}}>
                      Belum ada catatan tindak lanjut
                    </div>
                  )}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end',flexShrink:0}}>
                  <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                    background:statBg[st],color:statColor[st]}}>
                    {statLabel[st]}
                  </span>
                  <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                    background:priBg[pri],color:priColor[pri]}}>
                    {priLabel[pri]}
                  </span>
                  <button onClick={()=>setEditId(isEdit?null:m.id)}
                    className="btn btn-outline btn-sm"
                    style={{fontSize:'.72rem',padding:'4px 10px',
                      color:isEdit?'#dc2626':'var(--p)',borderColor:isEdit?'#dc2626':'var(--p)'}}>
                    {isEdit?'✕ Batal':'✏️ Edit'}
                  </button>
                </div>
              </div>

              {isEdit && (
                <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
                  <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
                    <div className="form-group" style={{flex:1,minWidth:140,margin:0}}>
                      <label style={{fontSize:'.75rem'}}>Status Tindak Lanjut</label>
                      <select value={status[m.id]||'belum'} onChange={e=>setStatus({...status,[m.id]:e.target.value})}
                        style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
                          fontSize:'.8rem',fontFamily:'inherit',outline:'none',width:'100%'}}>
                        <option value="belum">⏳ Belum</option>
                        <option value="proses">🔄 Dalam Proses</option>
                        <option value="selesai">✅ Selesai</option>
                      </select>
                    </div>
                    <div className="form-group" style={{flex:1,minWidth:140,margin:0}}>
                      <label style={{fontSize:'.75rem'}}>Prioritas</label>
                      <select value={prioritas[m.id]||'sedang'} onChange={e=>setPrioritas({...prioritas,[m.id]:e.target.value})}
                        style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',
                          fontSize:'.8rem',fontFamily:'inherit',outline:'none',width:'100%'}}>
                        <option value="rendah">🟢 Rendah</option>
                        <option value="sedang">🟡 Sedang</option>
                        <option value="tinggi">🔴 Tinggi</option>
                      </select>
                    </div>
                  </div>
                  <div className="form-group" style={{margin:0}}>
                    <label style={{fontSize:'.75rem'}}>Catatan Pembinaan / Tindak Lanjut</label>
                    <textarea rows={4}
                      value={catatan[m.id]||''}
                      onChange={e=>setCatatan({...catatan,[m.id]:e.target.value})}
                      placeholder="Tuliskan catatan kunjungan, pembinaan, atau rencana tindak lanjut kanwil untuk madrasah ini..."
                      style={{width:'100%',padding:'8px 10px',border:'1.5px solid var(--border)',
                        borderRadius:8,fontSize:'.8rem',fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
                  </div>
                  <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
                    <button onClick={()=>simpan(m.id)} className="btn btn-primary"
                      disabled={saving===m.id} style={{fontSize:'.8rem'}}>
                      {saving===m.id?'⏳ Menyimpan...':'💾 Simpan'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Hitung TA otomatis (Juli = awal TA baru)
function getTASekarang() {
  const now = new Date();
  const bln = now.getMonth() + 1;
  const thn = now.getFullYear();
  const awal = bln >= 7 ? thn : thn - 1;
  return awal + '/' + (awal + 1);
}

function TabDokumenGuru({sesi, showToast}) {
  const [dokList, setDokList]   = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [saving, setSaving]     = React.useState(false);
  const [editDok, setEditDok]   = React.useState(null); // {kode, nama}
  const [form, setForm]         = React.useState({status:'lengkap', file_url:'', catatan:''});
  const [filterGrup, setFilterGrup] = React.useState('Perencanaan');
  const [filterTA, setFilterTA] = React.useState(getTASekarang());

  React.useEffect(()=>{ loadData(filterTA); }, [filterTA]);

  async function loadData(ta) {
    setLoading(true);
    const {data} = await sb.from('supermad_dokumen')
      .select('*')
      .eq('guru_id', sesi.pengguna.id)
      .eq('tahun_ajaran', ta||filterTA);
    setDokList(data||[]);
    setLoading(false);
  }

  function getDok(kode) {
    return dokList.find(d=>d.kode_dok===kode);
  }

  function bukaEdit(dok) {
    const existing = getDok(dok.kode);
    setEditDok(dok);
    setForm({
      status: existing?.status||'belum',
      file_url: existing?.file_url||'',
      catatan: existing?.catatan||'',
    });
  }

  async function simpanDok(e) {
    e.preventDefault();
    setSaving(true);
    const existing = getDok(editDok.kode);
    // Otomatis naikkan status ke 'sebagian' kalau ada file_url tapi status masih 'belum'
    let autoStatus = form.status;
    if (form.file_url && autoStatus === 'belum') autoStatus = 'sebagian';
    const payload = {
      guru_id: sesi.pengguna.id,
      madrasah_id: sesi.mad.id,
      tahun_ajaran: filterTA,
      kode_dok: editDok.kode,
      nama_dok: editDok.nama,
      status: autoStatus,
      file_url: form.file_url||null,
      catatan: form.catatan||null,
      updated_at: new Date().toISOString(),
    };
    let error;
    if (existing) {
      ({error} = await sb.from('supermad_dokumen').update(payload).eq('id', existing.id));
    } else {
      ({error} = await sb.from('supermad_dokumen').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Status dokumen disimpan!');
    setEditDok(null);
    loadData(filterTA);
  }

  const grups = [...new Set(DAFTAR_DOKUMEN.map(d=>d.grup))];
  const statusInfo = {
    lengkap:  {label:'✅ Lengkap',   color:'#16a34a', bg:'#d1fae5'},
    sebagian: {label:'⚠️ Sebagian',  color:'#d97706', bg:'#fef3c7'},
    belum:    {label:'❌ Belum Ada', color:'#dc2626', bg:'#fee2e2'},
  };

  // Hitung progress
  const total = DAFTAR_DOKUMEN.length;
  const lengkap = dokList.filter(d=>d.status==='lengkap').length;
  const sebagian = dokList.filter(d=>d.status==='sebagian').length;
  const pct = Math.round(((lengkap + sebagian*0.5)/total)*100);

  if (loading) return <Loading text="Memuat dokumen..." />;

  // Modal edit
  if (editDok) return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <button className="btn btn-outline btn-sm" onClick={()=>setEditDok(null)}>← Kembali</button>
        <div style={{fontWeight:800,color:'var(--p3)'}}>📄 {editDok.nama}</div>
      </div>
      <div className="card">
        <form onSubmit={simpanDok}>
          <div className="form-group">
            <label>Status Dokumen *</label>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
              {Object.entries(statusInfo).map(([val,info])=>(
                <button type="button" key={val}
                  onClick={()=>setForm({...form,status:val})}
                  style={{padding:'8px 16px',borderRadius:20,cursor:'pointer',fontFamily:'inherit',
                    border:'2px solid '+(form.status===val?info.color:'var(--border)'),
                    background:form.status===val?info.bg:'#fff',
                    color:form.status===val?info.color:'var(--text2)',
                    fontWeight:700,fontSize:'.82rem'}}>
                  {info.label}
                </button>
              ))}
            </div>
          </div>
          <div className="form-group">
            <label>Link File / Google Drive (opsional)</label>
            <input type="url" value={form.file_url}
              onChange={e=>setForm({...form,file_url:e.target.value})}
              placeholder="https://drive.google.com/..."/>
            <div style={{fontSize:'.7rem',color:'var(--text3)',marginTop:3}}>
              Upload ke Google Drive lalu paste link-nya di sini
            </div>
          </div>
          <div className="form-group">
            <label>Catatan (opsional)</label>
            <textarea rows={3} value={form.catatan}
              onChange={e=>setForm({...form,catatan:e.target.value})}
              placeholder="Contoh: ATP sudah direvisi sesuai CP terbaru..."
              style={{width:'100%',padding:'9px 12px',border:'1.5px solid var(--border)',
                borderRadius:9,fontSize:'.85rem',fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" type="submit" disabled={saving}>
              {saving?'⏳ Menyimpan...':'💾 Simpan'}
            </button>
            <button className="btn btn-outline" type="button" onClick={()=>setEditDok(null)}>Batal</button>
          </div>
        </form>
      </div>
    </div>
  );

  return (
    <div>
      {/* Filter TA */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)'}}>📅 Tahun Ajaran:</span>
        <select value={filterTA} onChange={e=>setFilterTA(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer'}}>
          {(()=>{const yr=new Date().getFullYear();const tas=[];
            for(let y=yr-2;y<=yr+1;y++) tas.push(y+'/'+(y+1));
            return tas.map(ta=><option key={ta} value={ta}>{ta}</option>);
          })()}
        </select>
      </div>

      {/* Progress bar */}
      <div className="card" style={{marginBottom:14,padding:'14px 18px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{fontWeight:700,fontSize:'.85rem'}}>Kelengkapan Administrasi TA {filterTA}</div>
          <div style={{fontWeight:900,fontSize:'1.1rem',color:pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}}>{pct}%</div>
        </div>
        <div style={{background:'#e5e7eb',borderRadius:99,height:10,overflow:'hidden'}}>
          <div style={{width:pct+'%',height:'100%',borderRadius:99,
            background:pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626',transition:'width .4s'}}/>
        </div>
        <div style={{display:'flex',gap:12,marginTop:8,fontSize:'.72rem',color:'var(--text2)'}}>
          <span>✅ Lengkap: <b>{lengkap}</b></span>
          <span>⚠️ Sebagian: <b>{sebagian}</b></span>
          <span>❌ Belum: <b>{total-lengkap-sebagian}</b></span>
          <span>Total: <b>{total}</b></span>
        </div>
      </div>

      {/* Filter grup */}
      <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
        {grups.map(g=>(
          <button key={g} onClick={()=>setFilterGrup(g)}
            style={{padding:'6px 14px',borderRadius:20,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.78rem',fontFamily:'inherit',
              background:filterGrup===g?'var(--p)':'var(--surface2)',
              color:filterGrup===g?'#fff':'var(--text2)'}}>
            {g==='Perencanaan'?'📚 Perencanaan':'📊 Penilaian'}
          </button>
        ))}
      </div>

      {/* Daftar dokumen */}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {DAFTAR_DOKUMEN.filter(d=>d.grup===filterGrup).map((dok,i)=>{
          const existing = getDok(dok.kode);
          const st = existing?.status||'belum';
          const si = statusInfo[st];
          return (
            <div key={dok.kode} className="card" style={{padding:'12px 16px',
              borderLeft:'4px solid '+(st==='lengkap'?'#16a34a':st==='sebagian'?'#d97706':'#e5e7eb')}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:'.85rem'}}>{i+1}. {dok.nama}</div>
                  {existing?.catatan && (
                    <div style={{fontSize:'.72rem',color:'var(--text2)',marginTop:2}}>
                      💬 {existing.catatan}
                    </div>
                  )}
                  {existing?.file_url && (
                    <a href={existing.file_url} target="_blank" rel="noreferrer"
                      style={{fontSize:'.72rem',color:'#2563eb',display:'inline-block',marginTop:2}}>
                      🔗 Lihat File
                    </a>
                  )}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{padding:'3px 10px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                    color:si.color,background:si.bg,whiteSpace:'nowrap'}}>
                    {si.label}
                  </span>
                  <button onClick={()=>bukaEdit(dok)}
                    className="btn btn-outline btn-sm" style={{whiteSpace:'nowrap'}}>
                    ✏️ Update
                  </button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TabDokumenSupervisor({sesi, guruList, showToast, defaultTA}) {
  const [dokList, setDokList]     = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [filterGuru, setFilterGuru] = React.useState('');
  const [detailGuru, setDetailGuru] = React.useState(null);
