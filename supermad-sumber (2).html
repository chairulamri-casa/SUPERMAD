                  </div>
                )}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-primary" type="submit">💾 {editKelas?'Simpan Perubahan':'Tambah Kelas'}</button>
              <button type="button" className="btn btn-outline" onClick={()=>{setShowFormKelas(false);setEditKelas(null);}}>Batal</button>
            </div>
          </form>
        </div>
      )}

      {kelasList.length===0 ? (
        <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
          Belum ada kelas untuk TA {filterTA}. Tambah kelas terlebih dahulu.
        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12}}>
          {kelasList.map(k=>(
            <div key={k.id} className="card" style={{cursor:'pointer',borderTop:'3px solid var(--p)',transition:'box-shadow .15s'}}
              onClick={()=>bukaKelas(k)}>
              <div style={{fontWeight:900,fontSize:'1.1rem',color:'var(--p3)',marginBottom:2}}>
                🏫 {k.nama_kelas}
              </div>
              <div style={{fontSize:'.78rem',color:'var(--text2)',marginBottom:6}}>
                Tingkat {k.tingkat} {k.wali_kelas?'· WK: '+k.wali_kelas:''}
              </div>
              {statsAll?.perKelas[k.nama_kelas] ? (
                <div style={{display:'flex',gap:6,marginBottom:8}}>
                  <span style={{fontSize:'.7rem',fontWeight:700,padding:'2px 7px',borderRadius:20,background:'#cffafe',color:'#0891b2'}}>
                    👦 {statsAll.perKelas[k.nama_kelas].L}
                  </span>
                  <span style={{fontSize:'.7rem',fontWeight:700,padding:'2px 7px',borderRadius:20,background:'#fce7f3',color:'#db2777'}}>
                    👧 {statsAll.perKelas[k.nama_kelas].P}
                  </span>
                  <span style={{fontSize:'.7rem',fontWeight:700,padding:'2px 7px',borderRadius:20,background:'var(--surface2)',color:'var(--text2)'}}>
                    ∑ {statsAll.perKelas[k.nama_kelas].L + statsAll.perKelas[k.nama_kelas].P}
                  </span>
                </div>
              ) : (
                <div style={{fontSize:'.7rem',color:'var(--text3)',marginBottom:8}}>Belum ada siswa</div>
              )}
              <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                <button onClick={e=>{e.stopPropagation();setRekapKelas(k);}}
                  style={{padding:'3px 8px',borderRadius:6,border:'1px solid #0891b2',
                    background:'#ecfeff',color:'#0e7490',cursor:'pointer',fontSize:'.72rem',fontWeight:700}}>📊 Kehadiran</button>
                <button onClick={e=>{e.stopPropagation();setEditKelas(k);setFormKelas({nama_kelas:k.nama_kelas,tingkat:k.tingkat,wali_kelas:k.wali_kelas||'',wali_guru_id:k.wali_guru_id?String(k.wali_guru_id):''});setShowFormKelas(true);}}
                  style={{padding:'3px 8px',borderRadius:6,border:'1px solid var(--p)',
                    background:'#fff',color:'var(--p)',cursor:'pointer',fontSize:'.72rem'}}>✏️ Edit</button>
                <button onClick={e=>{e.stopPropagation();hapusKelas(k);}}
                  style={{padding:'3px 8px',borderRadius:6,border:'1px solid #ef4444',
                    background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.72rem'}}>🗑️</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── TAB NILAI SISWA (GURU) ────────────────────────────────────
function TabNilai({sesi, showToast}) {
  const [filterTA,  setFilterTA]  = React.useState(getTASekarang());
  const [filterSmt, setFilterSmt] = React.useState('1');
  const [kelasList, setKelasList] = React.useState([]);
  const [siswaList, setSiswaList] = React.useState([]);
  const [nilaiMap,    setNilaiMap]    = React.useState({}); // {siswa_id: nilai} — untuk jenis aktif
  const [allNilaiMap, setAllNilaiMap] = React.useState({}); // {siswa_id: {formatif,sts,sas,proyek}}
  const [editMap,     setEditMap]     = React.useState({}); // {siswa_id: nilai_draft} — non-formatif
  // Formatif per pertemuan: {siswa_id: {f1,f2,f3,f4,f5}} draft edit
  const [fEditMap,    setFEditMap]    = React.useState({}); // {siswa_id: {f1:'',f2:'',…}}
  const [fDirtySet,   setFDirtySet]   = React.useState(new Set()); // siswa_id yg ada perubahan formatif
  // jumlah formatif yang diset guru untuk kelas+mapel ini (1–5)
  const [jumlahF,     setJumlahF]     = React.useState(1);
  // data formatif tersimpan: {siswa_id: {f1,f2,f3,f4,f5,jumlah_formatif,nilai}}
  const [formatifMap, setFormatifMap] = React.useState({});
  const [dirtySet,    setDirtySet]    = React.useState(new Set());
  const [savingId,    setSavingId]    = React.useState(null);
  const [filterKelas, setFilterKelas] = React.useState('');
  const [filterJenis, setFilterJenis] = React.useState('formatif');
  // Pengaturan rapor disimpan di browser per guru, agar tidak hilang saat pindah menu
  const RAPOR_KEY = 'supermad_rapor_'+sesi.pengguna.id;
  const raporSaved = (()=>{ try { return JSON.parse(localStorage.getItem(RAPOR_KEY)||'{}')||{}; } catch(e){ return {}; } })();
  const [activeTab,   setActiveTab]   = React.useState(raporSaved.activeTab||'input'); // 'input'|'rapor'
  // Bobot & komponen rapor mengikuti 📐 Pengaturan Penilaian madrasah (diatur operator)
  const [bobotSLM,    setBobotSLM]    = React.useState(ATURAN_NILAI_DEFAULT.bobotSLM);
  const [bobotSAS,    setBobotSAS]    = React.useState(100-ATURAN_NILAI_DEFAULT.bobotSLM);
  // Komponen yang masuk SLM — guru bisa centang/uncentang
  const [slmKomponen, setSlmKomponen] = React.useState({...ATURAN_NILAI_DEFAULT.slm});
  const [aturanMad, setAturanMad] = React.useState(null);
  React.useEffect(()=>{
    try { localStorage.setItem(RAPOR_KEY, JSON.stringify({activeTab})); } catch(e) {}
  }, [activeTab]);
  React.useEffect(()=>{
    rpcSesi('supermad_get_madrasah', sesi).then(({data})=>setAturanMad((data && data.pengaturan_nilai) || {}));
  }, []);
  const [loading,     setLoading]     = React.useState(false);
  const [saving,      setSaving]      = React.useState(false);
  const [importStatus, setImportStatus] = React.useState('');
  const [kktp, setKktp] = React.useState(ATURAN_NILAI_DEFAULT.kktp);
  const atur = aturanPenilaian(aturanMad, filterTA, filterSmt);
  React.useEffect(()=>{
    if (!aturanMad) return;
    setBobotSLM(atur.bobotSLM); setBobotSAS(100-atur.bobotSLM);
    setSlmKomponen({...atur.slm}); setKktp(atur.kktp);
    setJumlahF(j=>Math.min(atur.formatifMaks, Math.max(atur.formatifMin, j||atur.formatifMin)));
  }, [aturanMad, filterTA, filterSmt]);

  // Multi-penugasan: guru bisa punya banyak mapel+kelas
  const [penugasanList, setPenugasanList] = React.useState(null); // null = belum load
  const [selectedMapel, setSelectedMapel] = React.useState('');   // mapel terpilih
  const [selectedKelasId, setSelectedKelasId] = React.useState(''); // kelas_id terpilih
  const [loadingPenugasan, setLoadingPenugasan] = React.useState(true);

  // Mapel aktif: dari penugasan (jika ada) atau dari sesi.pengguna.mapel (lama)
  const mapelAktif = selectedMapel || sesi.pengguna.mapel || '';

  const jenisOpt = [
    {val:'formatif', label:'Formatif (Harian/Kuis)'},
    {val:'sts',      label:'Sumatif Tengah Semester'},
    {val:'sas',      label:'Sumatif Akhir Semester'},
    {val:'proyek',   label:'Proyek / Praktik'},
  ];

  // Simpan allNilaiMap di ref agar selalu fresh tanpa closure bug
  const allNilaiRef = React.useRef({});

  // Load penugasan saat pertama kali
  React.useEffect(()=>{ loadPenugasan(); }, [filterTA]);

  const penugasanAutoTA = React.useRef(false);
  async function loadPenugasan() {
    setLoadingPenugasan(true);
    const res = await fetchPenugasanGuru(sesi.pengguna.id, filterTA);
    // Saat pertama dibuka: jika penugasan tercatat di TA lain, pindah otomatis ke TA itu
    if (!penugasanAutoTA.current) {
      penugasanAutoTA.current = true;
      if (res.ta !== filterTA && res.list.length) { setFilterTA(res.ta); return; }
    }
    const list = res.ta===filterTA ? res.list : [];
    setPenugasanList(list);

    if (list.length > 0) {
      // Auto-pilih penugasan pertama
      if (!selectedMapel) setSelectedMapel(list[0].mapel);
      if (!selectedKelasId) {
        setSelectedKelasId(list[0].kelas_id);
        setFilterKelas(list[0].supermad_kelas?.nama_kelas||'');
      }
    }
    setLoadingPenugasan(false);
  }

  // Kelas yang tersedia untuk mapel terpilih (dari penugasan)
  const kelasUntukMapel = React.useMemo(()=>{
    if (!penugasanList) return [];
    return penugasanList.filter(p=>p.mapel===selectedMapel);
  }, [penugasanList, selectedMapel]);

  // Saat mapel berubah, auto-pilih kelas pertama dari penugasan mapel itu
  React.useEffect(()=>{
    if (!penugasanList || penugasanList.length === 0) return;
    const klsList = penugasanList.filter(p=>p.mapel===selectedMapel);
    if (klsList.length > 0) {
      setSelectedKelasId(klsList[0].kelas_id);
      setFilterKelas(klsList[0].supermad_kelas?.nama_kelas||'');
    }
  }, [selectedMapel]);

  // Saat kelas berubah dari dropdown penugasan
  function onPenugasanKelasChange(kelas_id) {
    setSelectedKelasId(kelas_id);
    const pt = penugasanList.find(p=>p.kelas_id===kelas_id && p.mapel===selectedMapel);
    if (pt) setFilterKelas(pt.supermad_kelas?.nama_kelas||'');
  }

  React.useEffect(()=>{
    // Jika tidak ada penugasan → fallback load kelas biasa
    if (penugasanList !== null && penugasanList.length === 0) loadKelas();
  }, [penugasanList, filterTA]);

  React.useEffect(()=>{
    if(filterKelas) { setEditMap({}); setDirtySet(new Set()); loadSiswaData(); }
  }, [filterKelas, filterSmt, filterTA, selectedMapel]);

  async function loadKelas() {
    const {data} = await sb.from('supermad_kelas').select('*')
      .eq('madrasah_id', sesi.mad.id).eq('tahun_ajaran', filterTA).order('tingkat').order('nama_kelas');
    setKelasList(data||[]);
    if (data && data.length > 0 && !filterKelas) setFilterKelas(data[0].nama_kelas);
  }

  async function loadSiswaData() {
    setLoading(true);
    const [{data:sw},{data:nl}] = await Promise.all([
      sb.from('supermad_siswa').select('id,nama,nis,jenis_kelamin')
        .eq('madrasah_id', sesi.mad.id).eq('kelas', filterKelas)
        .eq('tahun_ajaran', filterTA).eq('aktif', true).order('nama'),
      // Ambil SEMUA jenis nilai + kolom f1–f5 dan jumlah_formatif
      sb.from('supermad_nilai').select('siswa_id,jenis_nilai,nilai,f1,f2,f3,f4,f5,jumlah_formatif')
        .eq('madrasah_id', sesi.mad.id).eq('kelas', filterKelas)
        .eq('mapel', mapelAktif)
        .eq('semester', filterSmt).eq('tahun_ajaran', filterTA),
    ]);
    setSiswaList(sw||[]);
    // Build allNilaiMap: {siswa_id: {formatif, sts, sas, proyek}}
    const allMp = {};
    const fMap  = {}; // {siswa_id: {f1,f2,f3,f4,f5,jumlah_formatif,nilai}}
    let jumlahFDB = 1;
    (nl||[]).forEach(n=>{
      if(!allMp[n.siswa_id]) allMp[n.siswa_id]={};
      allMp[n.siswa_id][n.jenis_nilai] = n.nilai;
      if (n.jenis_nilai === 'formatif') {
        // Cek apakah ada data f1–f5 atau hanya nilai lama (migrasi)
        const adaFData = n.f1!=null||n.f2!=null||n.f3!=null||n.f4!=null||n.f5!=null;
        fMap[n.siswa_id] = {
          // Kalau data lama (f1-f5 kosong), masukkan nilai lama ke f1 sebagai tampilan
          f1: adaFData ? n.f1 : n.nilai,
          f2: adaFData ? n.f2 : null,
          f3: adaFData ? n.f3 : null,
          f4: adaFData ? n.f4 : null,
          f5: adaFData ? n.f5 : null,
          jumlah_formatif: n.jumlah_formatif||1,
          nilai: n.nilai,
          _legacy: !adaFData, // tandai data lama
        };
        if (n.jumlah_formatif) jumlahFDB = n.jumlah_formatif;
      }
    });
    allNilaiRef.current = allMp;
    setAllNilaiMap(allMp);
    setFormatifMap(fMap);
    // Ambil jumlah_formatif dari data DB (ambil nilai max yang ada)
    setJumlahF(Math.min(atur.formatifMaks, Math.max(atur.formatifMin, jumlahFDB||atur.formatifMin)));
    // nilaiMap untuk jenis aktif saat ini
    const mp={};
    Object.keys(allMp).forEach(sid=>{ if(allMp[sid][filterJenis]!==undefined) mp[sid]=allMp[sid][filterJenis]; });
    setNilaiMap(mp);
    // Reset draft formatif
    setFEditMap({}); setFDirtySet(new Set());
    setLoading(false);
  }

  // Hitung nilai formatif dari f1–f5 (hanya yang terisi, bagi jumlah yang ikut — bukan jumlahF)
  function hitungNilaiFormatif(fData) {
    if (!fData) return undefined;
    const vals = [];
    for(let i=1; i<=5; i++) {
      const v = fData['f'+i];
      if (v!=null && v!=='') vals.push(Number(v));
    }
    return vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : undefined;
  }

  // ── Formatif per pertemuan helpers ──
  function onFChange(siswaId, fKey, val) {
    setFEditMap(m=>({...m,[siswaId]:{...(m[siswaId]||{}), [fKey]:val}}));
    setFDirtySet(s=>{ const ns=new Set(s); ns.add(siswaId); return ns; });

  async function simpanFormatifSatu(siswa) {
    // Gabung data tersimpan + draft
    const saved = formatifMap[siswa.id]||{};
    const draft = fEditMap[siswa.id]||{};
    const fData = {};
    for(let i=1;i<=5;i++) {
      const key='f'+i;
      const v = draft[key]!==undefined ? draft[key] : saved[key];
      fData[key] = (v!==undefined&&v!==''&&v!==null) ? Number(v) : null;
    }
    // Hitung nilai rata
    const vals=[]; for(let i=1;i<=5;i++){if(fData['f'+i]!=null)vals.push(fData['f'+i]);}
    const nilaiF = vals.length>0 ? vals.reduce((a,b)=>a+b,0)/vals.length : null;

    setSavingId(siswa.id);
    const payload = {
      madrasah_id: sesi.mad.id, tahun_ajaran: filterTA, semester: filterSmt,

      f1:fData.f1, f2:fData.f2, f3:fData.f3, f4:fData.f4, f5:fData.f5,
      jumlah_formatif: jumlahF,
      nilai: nilaiF,
      kktp,
      updated_at: new Date().toISOString(),
    };
    const {error} = await sb.from('supermad_nilai')
      .upsert([payload], {onConflict:'siswa_id,mapel,jenis_nilai,semester,tahun_ajaran'});
    setSavingId(null);
    if (!error) {
      setFormatifMap(m=>({...m,[siswa.id]:{...fData,jumlah_formatif:jumlahF,nilai:nilaiF}}));
      setAllNilaiMap(m=>{ const nm={...m}; if(!nm[siswa.id]) nm[siswa.id]={}; nm[siswa.id].formatif=nilaiF; return nm; });
      allNilaiRef.current = {...allNilaiRef.current};
      if(allNilaiRef.current[siswa.id]) allNilaiRef.current[siswa.id].formatif=nilaiF;
      setFDirtySet(s=>{ const ns=new Set(s); ns.delete(siswa.id); return ns; });
      setFEditMap(m=>{ const nm={...m}; delete nm[siswa.id]; return nm; });
    } else {
      showToast&&showToast('❌ Gagal: '+error.message,'error');
    }
  }

  async function simpanFormatifSemua() {
    if (!fDirtySet.size) return;
    setSaving(true);
    const upserts=[];
    for(const sid of fDirtySet) {

        fData[key]=(v!==undefined&&v!==''&&v!==null)?Number(v):null;
      }
      const vals=[]; for(let i=1;i<=5;i++){if(fData['f'+i]!=null)vals.push(fData['f'+i]);}
      const nilaiF=vals.length>0?vals.reduce((a,b)=>a+b,0)/vals.length:null;
      upserts.push({

  // Helper: hitung SLM, Nilai Rapor per siswa
  function hitungRapor(siswaId) {
    const nd = allNilaiMap[siswaId]||{};
    // Untuk formatif, gunakan hitungan F1–F5 jika tersedia
    const nilaiFormatif = (() => {
      const fm = formatifMap[siswaId];
      if (fm) {
        const computed = hitungNilaiFormatif(fm);
        if (computed !== undefined) return computed;
      }
      return nd['formatif']; // fallback ke nilai tersimpan
    })();
    // Gabungkan nilaiFormatif ke nd copy
    const ndEff = {...nd, formatif: nilaiFormatif};
    // SLM = rata-rata hanya dari komponen yang dicentang guru
    const aktifKeys = Object.keys(slmKomponen).filter(k=>slmKomponen[k]);
    const slmVals = aktifKeys.map(k=>ndEff[k]).filter(v=>v!==undefined&&v!==null);
    const slm = slmVals.length ? slmVals.reduce((a,b)=>a+b,0)/slmVals.length : undefined;
    const sas = ndEff['sas'];
    let rapor;
    if(slm!==undefined && sas!==undefined) rapor = (slm*(bobotSLM/100) + sas*(bobotSAS/100));
    else if(slm!==undefined && sas===undefined) rapor = slm;
    else if(slm===undefined && sas!==undefined) rapor = sas;
    return { slm, sas, rapor, aktifKeys };
  }

  function downloadTemplate() {

    const jenisLabel = jenisOpt.find(j=>j.val===filterJenis)?.label || filterJenis;
    const csv = [
      'sep=;',
      `NISN;Nama Siswa;Nilai;KKTP`,
      ...siswaList.map(s=>`${s.nis||''};${s.nama};${nilaiMap[s.id]!==undefined?nilaiMap[s.id]:''};${kktp}`),
    ].join('\r\n');
    const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `nilai_${filterKelas}_${filterJenis}_smt${filterSmt}_${filterTA.replace('/','_')}.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  }

  // Import Excel nilai
  async function importNilai(e) {
    const file = e.target.files[0]; if (!file) return;
    e.target.value = '';
    setImportStatus('⏳ Memproses...');
    try {
      let rows;
      if (file.name.toLowerCase().endsWith('.csv')) {
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l=>l.trim()&&!l.startsWith('sep='));
        const sep = lines[0]&&lines[0].includes(';')?';':',';
        rows = lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));
      } else {
        const buf = await file.arrayBuffer();
        const wb  = window.XLSX.read(buf,{type:'array'});
        rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      }
      if (rows.length < 2) { setImportStatus('❌ File kosong.'); return; }
      const hdr   = rows[0].map(h=>String(h).toLowerCase().trim());
      const iNisn = hdr.findIndex(h=>h.includes('nisn')||h.includes('nis'));
      const iNama = hdr.findIndex(h=>h.includes('nama'));
      const iNilai= hdr.findIndex(h=>h.includes('nilai'));
      const iKktp = hdr.findIndex(h=>h.includes('kktp'));
      if (iNilai===-1) { setImportStatus('❌ Kolom "Nilai" tidak ditemukan.'); return; }

      // Cocokkan NISN/Nama ke siswa_id
      const upserts = [];
      rows.slice(1).forEach(r=>{
        const nilaiRaw = String(r[iNilai]||'').trim();
        if (!nilaiRaw) return;
        const nilai = parseFloat(nilaiRaw);
        if (isNaN(nilai)||nilai<0||nilai>100) return;
        const nisn  = iNisn>-1 ? String(r[iNisn]||'').trim() : '';
        const nama  = iNama>-1 ? String(r[iNama]||'').trim() : '';
        const ktpVal= iKktp>-1 ? parseFloat(r[iKktp])||kktp : kktp;
        // Cari siswa
        const siswa = siswaList.find(s=>(nisn&&s.nis===nisn)||(nama&&s.nama===nama));
        if (!siswa) return;
        upserts.push({
          madrasah_id: sesi.mad.id,
          tahun_ajaran: filterTA,
          semester: filterSmt,
          siswa_id: siswa.id,
          kelas: filterKelas,
          guru_id: sesi.pengguna.id,
          mapel: mapelAktif,
          jenis_nilai: filterJenis,
          nilai, kktp: ktpVal,
          updated_at: new Date().toISOString(),
        });
      });
      if (!upserts.length) { setImportStatus('❌ Tidak ada nilai valid yang dikenali.'); return; }
      const {error} = await sb.from('supermad_nilai')
        .upsert(upserts, {onConflict:'siswa_id,mapel,jenis_nilai,semester,tahun_ajaran'});
      if (error) throw new Error(error.message);
      setImportStatus(`✅ ${upserts.length} nilai berhasil disimpan.`);
      await loadSiswaData();
    } catch(err) { setImportStatus('❌ '+err.message); }
  }

                    <div style={{fontSize:'.7rem',fontWeight:700,color:d.color}}>{d.jml}</div>

            <div style={{fontSize:'.8rem',color:'#166534',flex:1}}>
              <b>📝 Mapel: {mapelAktif||'(belum diset)'}</b>
              {' · '}{jenisOpt.find(j=>j.val===filterJenis)?.label}

              <button className="btn btn-sm" onClick={simpanSemua} disabled={saving}
                style={{background:'#16a34a',color:'#fff',border:'none',fontWeight:700}}>
                {saving ? '⏳ Menyimpan...' : `💾 Simpan Semua (${dirtySet.size})`}
              </button>

              title="Buka rekap siap cetak di tab baru">

            </button>

              📥Template CSV
            </button>

            <div style={{marginBottom:10,padding:'8px 14px',borderRadius:8,fontSize:'.82rem',

              border:'1px solid '+(importStatus.startsWith('✅')?'#86efac':importStatus.startsWith('❌')?'#fca5a5':'#fcd34d'),
              color:importStatus.startsWith('✅')?'#166534':importStatus.startsWith('❌')?'#991b1b':'#92400e'}}>

                    const savedF  = formatifMap[s.id]||{};
                    const draftF  = fEditMap[s.id]||{};
                    const isDirty = fDirtySet.has(s.id);
                    const isSaving= savingId===s.id;
                    // Merge draft over saved for display
                    const fVals = {};
                    for(let k=1;k<=jumlahF;k++){

                    // Compute preview rata
                    const rataVals=[];
                    for(let k=1;k<=jumlahF;k++){const v=fVals['f'+k]; if(v!==''&&v!=null&&!isNaN(Number(v))) rataVals.push(Number(v));}

                        <td style={{padding:'6px 12px',fontWeight:600}}>

                        </td>
                        <td style={{padding:'6px 12px',textAlign:'center'}}>
                          <span style={{fontWeight:700,color:s.jenis_kelamin==='P'?'#db2777':'#0891b2'}}>
                            {s.jenis_kelamin||'L'}
                          </span>
                        </td>

                          const val=fVals[key];
                          const numV=val!==''&&val!=null?Number(val):undefined;

                            <td key={key} style={{padding:'3px 5px',textAlign:'center'}}>
                              <input

                                value={val}
                                placeholder="—"
                                onChange={e=>onFChange(s.id,key,e.target.value)}
                                onBlur={()=>fDirtySet.has(s.id) && simpanFormatifSatu(s)}
                                disabled={isSaving}
                                style={{
                                  width:58,padding:'4px 6px',borderRadius:6,textAlign:'center',
                                  fontFamily:'inherit',fontWeight:700,fontSize:'.88rem',
                                  border:'1.5px solid '+(draftF[key]!==undefined?'#f59e0b':val===''?'var(--border)':numV>=kktp?'#86efac':'#fca5a5'),
                                  background:isSaving?'#f3f4f6':'#fff',
                                  color:val===''?'var(--text3)':numV>=kktp?'#16a34a':'#dc2626',
                                  outline:'none',
                                }}
                              />
                            </td>
                          );
                        })}
                        <td style={{padding:'6px 10px',textAlign:'center',background:rataPreview===undefined?'transparent':tuntas?'#dcfce7':'#fee2e2'}}>
                          <span style={{fontWeight:900,fontSize:'.9rem',
                            color:rataPreview===undefined?'var(--text3)':tuntas?'#16a34a':'#dc2626'}}>
                            {rataPreview!==undefined?rataPreview.toFixed(1):'—'}
                          </span>
                          {isSaving && <span style={{fontSize:'.7rem',color:'var(--text3)',display:'block'}}>⏳</span>}
                        </td>
                        <td style={{padding:'6px 12px',textAlign:'center'}}>
                          {rataPreview===undefined ? (
                            <span style={{fontSize:'.7rem',color:'var(--text3)'}}>Belum</span>
                          ) : (
                            <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                              background:tuntas?'#dcfce7':'#fee2e2',color:tuntas?'#16a34a':'#dc2626'}}>
                              {tuntas?'Tuntas':'Belum Tuntas'}
                            </span>
                          )}
                        </td>
                      </tr>
                    );

                  // ── Mode Non-Formatif (nilai tunggal) ──
                  const savedN = nilaiMap[s.id];
                  const draftV = editMap[s.id];
                  const displayN = draftV!==undefined ? (draftV===''?undefined:parseFloat(draftV)) : savedN;
                  const isDirty = dirtySet.has(s.id);
                  const isSaving= savingId===s.id;
                  const tuntas  = displayN!==undefined && !isNaN(displayN) && displayN>=kktp;
                  const inputVal= draftV!==undefined ? draftV : (savedN!==undefined?String(savedN):'');
                  return (
                    <tr key={s.id} style={{borderTop:'1px solid var(--border)',
                      background:isDirty?'#fffbeb':i%2===0?'#fff':'var(--surface2)'}}>
                      <td style={{padding:'7px 12px',color:'var(--text3)'}}>{i+1}</td>
                      <td style={{padding:'7px 12px',fontWeight:600}}>{s.nama}</td>
                      <td style={{padding:'7px 12px',textAlign:'center'}}>
                        <span style={{fontWeight:700,color:s.jenis_kelamin==='P'?'#db2777':'#0891b2'}}>
                          {s.jenis_kelamin||'L'}
                        </span>
                      </td>
                      <td style={{padding:'4px 8px',textAlign:'center'}}>
                        <div style={{display:'flex',alignItems:'center',gap:4,justifyContent:'center'}}>
                          <input
                            type="number" min={0} max={100} step={1}
                            value={inputVal}
                            placeholder="—"
                            onChange={e=>onNilaiChange(s.id, e.target.value)}
                            onBlur={()=>isDirty && simpanSatu(s)}
                            disabled={isSaving}
                            style={{
                              width:58, padding:'4px 6px', borderRadius:6, textAlign:'center',
                              fontFamily:'inherit', fontWeight:700, fontSize:'.9rem',
                              border:'1.5px solid '+(isDirty?'#f59e0b':displayN===undefined?'var(--border)':tuntas?'#86efac':'#fca5a5'),
                              background:isSaving?'#f3f4f6':'#fff',
                              color:displayN===undefined?'var(--text3)':tuntas?'#16a34a':'#dc2626',
                              outline:'none',
                            }}
                          />
                          {isSaving && <span style={{fontSize:'.7rem',color:'var(--text3)'}}>⏳</span>}
                          {isDirty && !isSaving && <span style={{fontSize:'.7rem',color:'#f59e0b'}}>●</span>}
                        </div>
                      </td>
                      <td style={{padding:'7px 12px',textAlign:'center'}}>
                        {displayN===undefined || isNaN(displayN) ? (
                          <span style={{fontSize:'.7rem',color:'var(--text3)'}}>Belum</span>
                        ) : (
                          <span style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,
                            background:tuntas?'#dcfce7':'#fee2e2',
                            color:tuntas?'#16a34a':'#dc2626',
                            opacity:isDirty?.75:1}}>
                            {tuntas?'Tuntas':'Belum Tuntas'}
                          </span>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              {filterJenis === 'formatif' ? (() => {
                // Hitung rata kelas dari formatifMap (nilai rata per siswa)
                const fRataArr = siswaList.map(s=>{
                  const fm = formatifMap[s.id];
                  if (!fm) return null;
                  const vals=[];
                  for(let k=1;k<=5;k++){const v=fm['f'+k];if(v!=null)vals.push(Number(v));}
                  return vals.length>0?vals.reduce((a,b)=>a+b,0)/vals.length:null;
                }).filter(v=>v!=null);
                if (!fRataArr.length) return null;
                const fRataKelas = fRataArr.reduce((a,b)=>a+b,0)/fRataArr.length;
                const fLulus = fRataArr.filter(v=>v>=kktp).length;
                return (
                  <tfoot>
                    <tr style={{background:'var(--surface2)',fontWeight:700,borderTop:'2px solid var(--border)'}}>
                      <td colSpan={3} style={{padding:'8px 12px',color:'var(--text2)'}}>Rata-rata Kelas</td>
                      {Array.from({length:jumlahF},(_,k)=>(
                        <td key={k} style={{padding:'8px 10px',textAlign:'center',fontSize:'.8rem',color:'var(--text2)'}}>—</td>
                      ))}
                      <td style={{padding:'8px 10px',textAlign:'center',color:'var(--p)',fontSize:'1rem'}}>{fRataKelas.toFixed(1)}</td>
                      <td style={{padding:'8px 12px',textAlign:'center',fontSize:'.75rem',color:'var(--text2)'}}>
                        {fLulus}/{fRataArr.length} tuntas
                      </td>
                    </tr>
                  </tfoot>
                );
              })() : nilaiArr.length > 0 && (
                <tfoot>
                  <tr style={{background:'var(--surface2)',fontWeight:700,borderTop:'2px solid var(--border)'}}>
                    <td colSpan={3} style={{padding:'8px 12px',color:'var(--text2)'}}>Rata-rata Kelas</td>
                    <td style={{padding:'8px 12px',textAlign:'center',color:'var(--p)',fontSize:'1rem'}}>{rataRata}</td>
                    <td style={{padding:'8px 12px',textAlign:'center',fontSize:'.75rem',color:'var(--text2)'}}>
                      {lulus}/{nilaiArr.length} tuntas
                    </td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </>
      )}
    </div>
  );
}

// ── TAB JURNAL MENGAJAR (GURU) ────────────────────────────────
// ── HELPER CETAK: data penandatangan terbaru dari database ────
function escHtml(v) {
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function getPenandatangan(sesi) {
  let mad = {...(sesi.mad||{})};
  let guru = {...(sesi.pengguna||{})};
  try {
    const {data:m} = await rpcSesi('supermad_get_madrasah', sesi);
    if (m) mad = {...mad, ...m};
  } catch(e) {}
  try {
    if (guru.id) {
      const {data:gl} = await rpcSesi('supermad_list_guru', sesi);
      const g = (gl||[]).find(x=>x.id===guru.id);
      if (g) guru = {...guru, ...g};
    }
  } catch(e) {}
  let kepalaNama = mad.nama_kepala || '';
  let kepalaNip  = mad.nip_kepala || '';
  // Cadangan: ambil dari akun pengguna berjabatan Kepala Madrasah
  if (!kepalaNama) {
    try {
      const {data:kp} = await sb.from('supermad_pengguna').select('nama,nip')
        .eq('madrasah_id', mad.id).eq('jabatan','Kepala Madrasah').eq('aktif',true).limit(1);
      if (kp && kp.length) { kepalaNama = kp[0].nama||''; kepalaNip = kepalaNip || kp[0].nip || ''; }
    } catch(e) {}
  }
  const guruNip = guru.nip || guru.nuptk || '';
  return {
    mad,
    kepalaNama, kepalaNip,
    guruNama: guru.nama || '',
    guruNipLabel: guru.nip ? 'NIP' : (guru.nuptk ? 'NUPTK' : 'NIP/NUPTK'),
    guruNip,
  };
}
function blokTtdHtml(ttd, labelKanan) {
  const tgl = new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  return `<div class="ttd">
  <div>Mengetahui,<br>Kepala Madrasah<div class="sp"></div>
    <b>${escHtml(ttd.kepalaNama||'.............................')}</b><br>NIP. ${escHtml(ttd.kepalaNip||'—')}</div>
  <div>${escHtml(ttd.mad.kota_kab||'..............')}, ${tgl}<br>${escHtml(labelKanan)}<div class="sp"></div>
    <b>${escHtml(ttd.guruNama||'.............................')}</b><br>${ttd.guruNipLabel}. ${escHtml(ttd.guruNip||'—')}</div>
</div>`;
}

      sb.from('supermad_jurnal').select('*')

        .eq('madrasah_id', sesi.mad.id)
        .eq('tahun_ajaran', ta||filterTA)
        .eq('semester', smt||filterSmt)
        .order('tanggal', {ascending:false}),

  // Absensi mandiri: buat jurnal kosong (tanpa materi) lalu buka absensi
  async function mulaiAbsensiMandiri(e) {
    e.preventDefault();
    setSaving(true);
    const payload = {
      tanggal: formAbsensi.tanggal,
      kelas:   formAbsensi.kelas,
      jam_ke:  formAbsensi.jam_ke,
      mapel:   formAbsensi.mapel||sesi.pengguna.mapel||'',
      materi:  '(belum diisi)',
      guru_id: sesi.pengguna.id,
      madrasah_id: sesi.mad.id,
      tahun_ajaran: filterTA,
      semester: filterSmt,
      updated_at: new Date().toISOString(),
    };
    // Jika pertemuan yang sama sudah ada (misal jurnal sudah diisi), pakai itu
    const {data:ada} = await sb.from('supermad_jurnal').select('*')
      .eq('guru_id', sesi.pengguna.id).eq('tanggal', payload.tanggal)
      .eq('kelas', payload.kelas).eq('jam_ke', payload.jam_ke).eq('mapel', payload.mapel).limit(1);
    let newJurnal;
    if (ada && ada.length) {
      newJurnal = ada[0];
      setSaving(false);
    } else {
      const {data, error} = await sb.from('supermad_jurnal').insert(payload).select('id').single();
      setSaving(false);
      if (error) { showToast('Gagal: '+error.message,'error'); return; }
      newJurnal = {...payload, id: data.id};
    }
    loadData(filterTA, filterSmt);
    // Langsung buka absensi
    setActiveJurnal(newJurnal);
    const siswas = await loadSiswa(newJurnal.kelas);
    await loadAbsensi(newJurnal.id, siswas);
    setView('absensi');

  async function simpanJurnal(e) {
    e.preventDefault();
    setSaving(true);
    const payload = {
      ...form,
      guru_id: sesi.pengguna.id,
      madrasah_id: sesi.mad.id,
      tahun_ajaran: filterTA,
      semester: filterSmt,
      updated_at: new Date().toISOString(),
    };
    delete payload.kelas_id;
    let error, targetId = editJurnal ? editJurnal.id : null;
    if (!targetId) {
      const {data:ada} = await sb.from('supermad_jurnal').select('id')
        .eq('guru_id', sesi.pengguna.id).eq('tanggal', payload.tanggal)
        .eq('kelas', payload.kelas).eq('jam_ke', payload.jam_ke).eq('mapel', payload.mapel)
        .eq('materi', BELUM).limit(1);
      if (ada && ada.length) targetId = ada[0].id;
    }
    if (targetId) {
      ({error} = await sb.from('supermad_jurnal').update(payload).eq('id', targetId));
    } else {
      ({error} = await sb.from('supermad_jurnal').insert(payload));
    }
    setSaving(false);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    showToast('✅ Jurnal '+(targetId?'diperbarui':'disimpan')+'!');
    setView('list');
    setEditJurnal(null);
    loadData(filterTA, filterSmt);
  }

  async function simpanAbsensi() {
    if (!activeJurnal) return;
    setSavingAbsensi(true);
    // Upsert semua absensi
    const rows = siswaList.map(s=>({
      jurnal_id: activeJurnal.id,
      siswa_id: s.id,
      madrasah_id: sesi.mad.id,
      status: absensiMap[s.id]||'hadir',
    }));
    const {error} = await sb.from('supermad_absensi').upsert(rows, {onConflict:'jurnal_id,siswa_id'});
    if (error) { showToast('Gagal simpan absensi: '+error.message,'error'); setSavingAbsensi(false); return; }
    // Hitung rekap dan update jurnal
    const hadir  = rows.filter(r=>r.status==='hadir').length;
    const sakit  = rows.filter(r=>r.status==='sakit').length;
    const izin   = rows.filter(r=>r.status==='izin').length;
    const alpa   = rows.filter(r=>r.status==='alpa').length;
    await sb.from('supermad_jurnal').update({
      jumlah_hadir:hadir,jumlah_sakit:sakit,jumlah_izin:izin,jumlah_alpa:alpa,
      updated_at:new Date().toISOString()
    }).eq('id', activeJurnal.id);
    setSavingAbsensi(false);
    showToast('✅ Absensi tersimpan!');
    setView('list');
    setActiveJurnal(null);
    loadData(filterTA, filterSmt);
  }

  const adaJurnal  = j => j.materi && j.materi!==BELUM;

  async function hapusJurnal(j) {
    if (!confirm('Hapus isi jurnal pertemuan ini?')) return;
    if (adaAbsensi(j)) {

      await sb.from('supermad_jurnal').update({materi:BELUM,tujuan_pembelajaran:null,kendala:null,
        tindak_lanjut:null,refleksi:null,updated_at:new Date().toISOString()}).eq('id', j.id);
    } else {
      await sb.from('supermad_jurnal').delete().eq('id', j.id);
    }
    showToast('🗑️ Jurnal dihapus');
    loadData(filterTA, filterSmt);
  }

  async function hapusAbsensi(j) {

    await sb.from('supermad_absensi').delete().eq('jurnal_id', j.id);
    if (adaJurnal(j)) {

      await sb.from('supermad_jurnal').update({jumlah_hadir:0,jumlah_sakit:0,jumlah_izin:0,jumlah_alpa:0,

                      <td style={{padding:'6px 8px',textAlign:'center',color:'#16a34a'}}>{totHadir}</td>
                      <td style={{padding:'6px 8px',textAlign:'center',color:'#d97706'}}>{totSakit}</td>
                      <td style={{padding:'6px 8px',textAlign:'center',color:'#2563eb'}}>{totIzin}</td>
                      <td style={{padding:'6px 8px',textAlign:'center',color:'#dc2626'}}>{totAlpa}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          );
        })}
        {Object.keys(bulanMap).length===0 && (
          <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
            Belum ada jurnal untuk periode ini.
          </div>
        )}
      </div>
    );
  }

  // VIEW LIST (mode jurnal / mode absensi)
  if (loading) return <Loading text={isAbsensiMode?'Memuat absensi...':'Memuat jurnal...'} />;
  const daftarJurnal   = jurnalList.filter(adaJurnal);
  const belumJurnal    = jurnalList.filter(j=>!adaJurnal(j) && adaAbsensi(j));
  const daftarAbsensi  = jurnalList.filter(adaAbsensi);
  const belumAbsensi   = jurnalList.filter(j=>adaJurnal(j) && !adaAbsensi(j));
  const tampil = isAbsensiMode ? daftarAbsensi : daftarJurnal;
  const pending = isAbsensiMode ? belumAbsensi : belumJurnal;
  const chipAbsen = j => (
    <div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
      {[
        {label:'Hadir',val:j.jumlah_hadir||0,c:'#16a34a',bg:'#d1fae5'},
        {label:'Sakit',val:j.jumlah_sakit||0,c:'#d97706',bg:'#fef3c7'},
        {label:'Izin', val:j.jumlah_izin||0, c:'#2563eb',bg:'#dbeafe'},
        {label:'Alpa', val:j.jumlah_alpa||0, c:'#dc2626',bg:'#fee2e2'},
      ].map(({label,val,c,bg})=>(
        <span key={label} style={{padding:'2px 8px',borderRadius:20,fontSize:'.7rem',fontWeight:700,color:c,background:bg}}>
          {label}: {val}
        </span>
      ))}
    </div>
  );
  return (
    <div>
      {/* Toolbar */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem',flex:1}}>
          {isAbsensiMode ? '🙋 Absensi Siswa' : '📓 Jurnal Mengajar'}
        </div>
        <select value={filterTA} onChange={e=>setFilterTA(e.target.value)}
          style={{padding:'6px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:'.8rem',fontFamily:'inherit',width:'auto'}}>
          {[...new Set([...taList, filterTA])].map(ta=><option key={ta} value={ta}>{ta}</option>)}
        </select>
        <select value={filterSmt} onChange={e=>setFilterSmt(e.target.value)}
          style={{padding:'6px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:'.8rem',fontFamily:'inherit',width:'auto'}}>
          <option value="Ganjil">Ganjil</option>
          <option value="Genap">Genap</option>
        </select>
        {isAbsensiMode ? (<>
          <button className="btn btn-outline btn-sm" onClick={()=>setRekapMode(true)}>📊 Rekap Absensi</button>
          <button className="btn btn-primary btn-sm" onClick={()=>{
            setFormAbsensi({tanggal:new Date().toISOString().split('T')[0],jam_ke:'1',...defaultDariPenugasan()});
            setView('form-absensi');
          }}>+ Absensi Baru</button>
        </>) : (<>
          {daftarJurnal.length > 0 && (()=>{
            const bulanList = [...new Set(daftarJurnal.map(j=>(j.tanggal||'').slice(0,7)).filter(Boolean))].sort();
            const bln = bulanList.includes(bulanCetak) ? bulanCetak : (bulanList[bulanList.length-1]||'');
            return (<>
              <select value={bln} onChange={e=>setBulanCetak(e.target.value)}
                style={{padding:'6px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:'.8rem',fontFamily:'inherit',width:'auto'}}>
                {bulanList.map(b=><option key={b} value={b}>{new Date(b+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>)}
              </select>
              <button className="btn btn-outline btn-sm" onClick={()=>cetakJurnalBulanan(
                [...daftarJurnal].filter(j=>(j.tanggal||'').startsWith(bln)).sort((a,b)=>a.tanggal>b.tanggal?1:a.tanggal<b.tanggal?-1:String(a.jam_ke).localeCompare(String(b.jam_ke))), bln)}>
                🖨️ Cetak Jurnal
              </button>
            </>);
          })()}
          <button className="btn btn-primary btn-sm" onClick={()=>{
            setView('form-jurnal'); setEditJurnal(null);
            setForm({tanggal:new Date().toISOString().split('T')[0],jam_ke:'1',...defaultDariPenugasan(),
              materi:'',tujuan_pembelajaran:'',kendala:'',tindak_lanjut:'',refleksi:''});
          }}>+ Jurnal Baru</button>
        </>)}
      </div>

      {!isAbsensiMode && <PanelContohJurnal defaultOpen={daftarJurnal.length===0} />}

      {/* Pengingat pertemuan yang belum lengkap */}
      {pending.length > 0 && (
        <div style={{marginBottom:12,padding:'10px 14px',borderRadius:10,background:'#fffbeb',
          border:'1.5px solid #fcd34d',fontSize:'.8rem',color:'#92400e'}}>
          <div style={{fontWeight:800,marginBottom:6}}>
            {isAbsensiMode
              ? `⚠️ ${pending.length} pertemuan sudah ada jurnalnya tetapi belum diabsen:`
              : `⚠️ ${pending.length} pertemuan sudah diabsen tetapi jurnalnya belum diisi:`}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {pending.map(j=>(
              <div key={j.id} style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <span style={{flex:1}}>{formatTgl(j.tanggal)} · Kelas <b>{j.kelas}</b> · Jam ke-{j.jam_ke} · {j.mapel||''}</span>
                <button className="btn btn-sm" style={{background:'#d97706',color:'#fff',padding:'4px 10px',fontSize:'.72rem'}}
                  onClick={()=> isAbsensiMode ? bukaAbsensi(j) : bukaEditJurnal(j)}>
                  {isAbsensiMode ? '🙋 Absen Sekarang' : '📝 Isi Jurnal'}
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {tampil.length===0 ? (
        <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
          {isAbsensiMode
            ? <>Belum ada absensi untuk {filterSmt} {filterTA}.<br/><small>Klik <b>+ Absensi Baru</b> untuk mengabsen siswa.</small></>
            : <>Belum ada jurnal untuk {filterSmt} {filterTA}.<br/><small>Klik <b>+ Jurnal Baru</b> untuk mencatat pembelajaran.</small></>}
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {tampil.map(j=>(
            <div key={j.id} className="card" style={{borderLeft:'4px solid '+(isAbsensiMode?'#0891b2':'var(--p)')}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,flexWrap:'wrap'}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,marginBottom:2}}>
                    {formatTgl(j.tanggal)} &nbsp;·&nbsp; Kelas <b>{j.kelas}</b> &nbsp;·&nbsp; Jam ke-{j.jam_ke}
                  </div>
                  <div style={{fontSize:'.8rem',color:'var(--p3)',fontWeight:600,marginBottom:4}}>{j.mapel||''}</div>
                  {isAbsensiMode ? chipAbsen(j) : (
                    <>
                      <div style={{fontSize:'.82rem',color:'var(--text2)'}}>{j.materi}</div>
                      {j.kendala && <div style={{fontSize:'.75rem',color:'var(--text3)',marginTop:3}}>Kendala: {j.kendala}</div>}
                      {j.tindak_lanjut && <div style={{fontSize:'.75rem',color:'var(--text3)'}}>Tindak lanjut: {j.tindak_lanjut}</div>}
                    </>
                  )}
                </div>
                <div style={{display:'flex',gap:6,flexShrink:0}}>
                  {isAbsensiMode ? (
                    <button onClick={()=>bukaAbsensi(j)}
                      style={{padding:'4px 10px',borderRadius:7,border:'1.5px solid #0891b2',
                        background:'#fff',color:'#0891b2',cursor:'pointer',fontSize:'.75rem',fontWeight:700}}>
                      ✏️ Ubah Absen
                    </button>
                  ) : (
                    <button onClick={()=>bukaEditJurnal(j)}
                      style={{padding:'4px 10px',borderRadius:7,border:'1px solid var(--border)',
                        background:'#fff',color:'var(--text2)',cursor:'pointer',fontSize:'.75rem'}}>
                      ✏️
                    </button>
                  )}
                  <button onClick={()=> isAbsensiMode ? hapusAbsensi(j) : hapusJurnal(j)}
                    style={{padding:'4px 10px',borderRadius:7,border:'1px solid #ef4444',
                      background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.75rem'}}>
                    🗑️
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── TAB PENUGASAN (OPERATOR) ─────────────────────────────────
function TabPenugasan({sesi, showToast}) {
  const [guruList,     setGuruList]     = React.useState([]);
  const [kelasList,    setKelasList]    = React.useState([]);
  const [penugasanList,setPenugasanList]= React.useState([]);
  const [loading,  setLoading]  = React.useState(true);
  const [saving,   setSaving]   = React.useState(false);
  const [showForm, setShowForm] = React.useState(false);
  const [filterTA, setFilterTA] = React.useState(getTASekarang());
  const [form, setForm] = React.useState({
    guru_id:'', mapel:'', kelas_id:'', tahun_ajaran: getTASekarang()
  });

  const MAPEL_LIST = getMapelByJenjang(getJenjangMad(sesi.mad));

  React.useEffect(()=>{ loadData(); }, [filterTA]);

  async function loadData() {
    setLoading(true);
    const [pg, kl, pt] = await Promise.all([
      sb.from('supermad_guru').select('id,nama,mapel')
        .eq('madrasah_id', sesi.mad.id).eq('aktif', true).order('nama'),
      sb.from('supermad_kelas').select('id,nama_kelas,tingkat,tahun_ajaran')
        .eq('madrasah_id', sesi.mad.id).order('tingkat').order('nama_kelas'),
      sb.from('supermad_penugasan').select(`
        id, guru_id, mapel, kelas_id, tahun_ajaran, aktif,
        supermad_guru!guru_id(id,nama,mapel),
        supermad_kelas!kelas_id(nama_kelas,tingkat)
      `).eq('madrasah_id', sesi.mad.id).eq('tahun_ajaran', filterTA).order('created_at', {ascending:false}),
    ]);
    setGuruList(pg.data||[]);
    setKelasList(kl.data||[]);
    setPenugasanList(pt.data||[]);
    setLoading(false);
  }

  async function simpanPenugasan(e) {
    e.preventDefault();
    if (!form.guru_id||!form.mapel||!form.kelas_id) {
      showToast('Lengkapi semua field!','error'); return;
    }
    setSaving(true);
    const {error} = await sb.from('supermad_penugasan').insert({
      madrasah_id:  sesi.mad.id,
      guru_id:      form.guru_id,
      mapel:        form.mapel,
      kelas_id:     form.kelas_id,
      tahun_ajaran: form.tahun_ajaran,
      aktif: true,
    });
    setSaving(false);
    if (error) {
      if (error.code==='23505') showToast('Penugasan ini sudah ada!','warning');
      else showToast('Gagal: '+error.message,'error');
      return;
    }
    showToast('✅ Penugasan berhasil ditambahkan!');
    setShowForm(false);
    setForm({guru_id:'',mapel:'',kelas_id:'',tahun_ajaran:getTASekarang()});
    loadData();
  }

  const [importInfo, setImportInfo] = React.useState('');

  function downloadTemplatePenugasan() {
    if (typeof XLSX === 'undefined') { showToast('Library Excel belum siap, coba sesaat lagi.','warning'); return; }
    const kelasTA = kelasList.filter(k=>!k.tahun_ajaran || k.tahun_ajaran===filterTA);
    const contoh = [];
    guruList.slice(0,3).forEach((g,i)=>{
      contoh.push({'Nama Guru':g.nama,'Mata Pelajaran':g.mapel||MAPEL_LIST[0]||'',
        'Kelas':kelasTA.slice(i*2,i*2+2).map(k=>k.nama_kelas).join(', ')||(kelasTA[0]?.nama_kelas||'')});
    });
    if (!contoh.length) contoh.push({'Nama Guru':'Nama Guru Sesuai Daftar Guru','Mata Pelajaran':MAPEL_LIST[0]||'','Kelas':'VII-A, VII-B'});
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(contoh, {header:['Nama Guru','Mata Pelajaran','Kelas']});
    ws['!cols'] = [{wch:34},{wch:30},{wch:30}];
    XLSX.utils.book_append_sheet(wb, ws, 'Penugasan');
    const wsG = XLSX.utils.aoa_to_sheet([['Daftar Guru (salin namanya ke sheet Penugasan)','Mapel Utama'],
      ...guruList.map(g=>[g.nama, g.mapel||''])]);
    wsG['!cols'] = [{wch:40},{wch:30}];
    XLSX.utils.book_append_sheet(wb, wsG, 'Daftar Guru');
    const wsK = XLSX.utils.aoa_to_sheet([['Daftar Kelas TA '+filterTA,'Tingkat'], ...kelasTA.map(k=>[k.nama_kelas, k.tingkat||''])]);
    wsK['!cols'] = [{wch:28},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsK, 'Daftar Kelas');
    const wsM = XLSX.utils.aoa_to_sheet([['Daftar Mata Pelajaran (KMA 1503/2025)'], ...MAPEL_LIST.map(m=>[m])]);
    wsM['!cols'] = [{wch:44}];
    XLSX.utils.book_append_sheet(wb, wsM, 'Daftar Mapel');
    const wsP = XLSX.utils.aoa_to_sheet([
      ['PETUNJUK PENGISIAN TEMPLATE PENUGASAN'],[''],
      ['1. Isi sheet "Penugasan": satu baris = satu guru + satu mata pelajaran.'],
      ['2. Kolom Kelas boleh berisi beberapa kelas dipisah koma, misal: VII-A, VII-B, VIII-A'],
      ['3. Nama guru, mapel, dan kelas harus sesuai sheet Daftar Guru / Daftar Mapel / Daftar Kelas.'],
      ['4. Penugasan yang sudah ada otomatis dilewati (tidak dobel).'],
      ['5. Penugasan diimpor ke Tahun Ajaran yang sedang dipilih di menu Penugasan ('+filterTA+').'],
    ]);
    wsP['!cols'] = [{wch:90}];
    XLSX.utils.book_append_sheet(wb, wsP, 'Petunjuk');
    XLSX.writeFile(wb, 'Template_Penugasan_'+filterTA.replace('/','-')+'.xlsx');
  }

  async function importPenugasan(e) {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    if (typeof XLSX === 'undefined') { showToast('Library Excel belum siap, coba sesaat lagi.','warning'); return; }
    setImportInfo('⏳ Memproses file...');
    try {
      const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
      const ws = wb.Sheets['Penugasan'] || wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {defval:''});
      const ambil = (r, kunci) => { const k = Object.keys(r).find(x=>x.toLowerCase().includes(kunci)); return k ? String(r[k]).trim() : ''; };
      const kelasTA = kelasList.filter(k=>!k.tahun_ajaran || k.tahun_ajaran===filterTA);
      const normK = t => String(t||'').toUpperCase().replace(/\s+/g,'').replace(/[–—]/g,'-');
      const normM = t => String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      const sudah = new Set(penugasanList.map(p=>p.guru_id+'|'+p.mapel+'|'+p.kelas_id));
      const baru = []; const gagal = []; let lewati = 0;
      raw.forEach((r,i)=>{
        const baris = i+2;
        const namaG = ambil(r,'guru'), mapelTxt = ambil(r,'mapel')||ambil(r,'pelajaran'), kelasTxt = ambil(r,'kelas');
        if (!namaG && !mapelTxt && !kelasTxt) return;
        const g = cocokkanGuru(guruList, namaG);
        if (!g) { gagal.push('Baris '+baris+': guru "'+namaG+'" tidak dikenali'); return; }
        const mapel = MAPEL_LIST.find(m=>normM(m)===normM(mapelTxt)) || mapelTxt;
        if (!mapel) { gagal.push('Baris '+baris+': mata pelajaran kosong'); return; }
        kelasTxt.split(/[,;\/]+/).map(x=>x.trim()).filter(Boolean).forEach(kt=>{
          const k = kelasTA.find(x=>normK(x.nama_kelas)===normK(kt));
          if (!k) { gagal.push('Baris '+baris+': kelas "'+kt+'" tidak ada di TA '+filterTA); return; }
          const kunci = g.id+'|'+mapel+'|'+k.id;
          if (sudah.has(kunci)) { lewati++; return; }
          sudah.add(kunci);
          baru.push({madrasah_id: sesi.mad.id, guru_id: g.id, mapel, kelas_id: k.id, tahun_ajaran: filterTA, aktif: true});
        });
      });
      if (baru.length) {
        const {error} = await sb.from('supermad_penugasan').insert(baru);
        if (error) { setImportInfo('❌ Gagal menyimpan: '+error.message); return; }
      }
      setImportInfo((baru.length?'✅ ':'ℹ️ ')+baru.length+' penugasan ditambahkan'+(lewati?', '+lewati+' sudah ada (dilewati)':'')+'.'
        + (gagal.length ? '\n⚠️ '+gagal.length+' tidak diproses:\n• '+gagal.slice(0,15).join('\n• ')+(gagal.length>15?'\n• …':'') : ''));
      loadData();
    } catch(err) { setImportInfo('❌ '+err.message); }
  }

  async function hapusPenugasan(pt) {
    if (!confirm(`Hapus penugasan "${pt.supermad_guru?.nama} — ${pt.mapel} — ${pt.supermad_kelas?.nama_kelas}"?`)) return;
    const {error} = await sb.from('supermad_penugasan').delete().eq('id', pt.id);
    if (error) { showToast('Gagal hapus: '+error.message,'error'); return; }
    showToast('🗑️ Penugasan dihapus.');
    loadData();
  }

  async function toggleAktif(pt) {
    const {error} = await sb.from('supermad_penugasan').update({aktif:!pt.aktif}).eq('id', pt.id);
    if (error) { showToast('Gagal: '+error.message,'error'); return; }
    loadData();
  }

  if (loading) return <Loading text="Memuat data penugasan..." />;

  // Kelompokkan per guru
  const byGuru = {};
  penugasanList.forEach(pt=>{
    const gId = pt.guru_id;
    if (!byGuru[gId]) byGuru[gId] = {nama: pt.supermad_guru?.nama||'?', mapel_utama: pt.supermad_guru?.mapel||'', list:[]};
    byGuru[gId].list.push(pt);
  });

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
        <div style={{fontWeight:700,color:'var(--text2)',fontSize:'.85rem'}}>
          📌 Penugasan Mengajar — Siapa ngajar mapel apa di kelas mana
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <select value={filterTA} onChange={e=>setFilterTA(e.target.value)}
            style={{padding:'6px 10px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'.8rem',width:'auto'}}>
            {(()=>{const y=new Date().getFullYear();const l=[];for(let i=y+1;i>=y-2;i--)l.push(i+'/'+(i+1));return l;})().map(ta=>(
              <option key={ta} value={ta}>{ta}</option>
            ))}
          </select>
          <button className="btn btn-outline btn-sm" onClick={downloadTemplatePenugasan}>📥 Template</button>
          <label className="btn btn-outline btn-sm" style={{cursor:'pointer',margin:0}}>
            📤 Import Excel
            <input type="file" accept=".xlsx,.xls" onChange={importPenugasan} style={{display:'none'}}/>
          </label>
          <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(!showForm)}>
            {showForm?'✕ Batal':'+ Tambah Penugasan'}
          </button>
        </div>
      </div>

      {importInfo && (
        <div style={{whiteSpace:'pre-line',padding:'10px 14px',borderRadius:9,marginBottom:12,fontSize:'.8rem',
          background:importInfo.startsWith('❌')?'#fef2f2':importInfo.includes('⚠️')?'#fffbeb':'#f0fdf4',
          border:'1px solid '+(importInfo.startsWith('❌')?'#fca5a5':importInfo.includes('⚠️')?'#fcd34d':'#86efac'),
          color:importInfo.startsWith('❌')?'#991b1b':importInfo.includes('⚠️')?'#92400e':'#166534'}}>
          {importInfo}
          <button onClick={()=>setImportInfo('')} style={{float:'right',border:'none',background:'none',cursor:'pointer',color:'inherit'}}>✕</button>
        </div>
      )}

      {showForm && (
        <div className="card" style={{marginBottom:14,background:'#f8fffe',border:'1.5px solid var(--p)'}}>
          <div style={{fontWeight:800,color:'var(--p3)',marginBottom:12}}>📌 Tambah Penugasan</div>
          <form onSubmit={simpanPenugasan}>
            <div className="grid2">
              <div className="form-group">
                <label>Guru *</label>
                <select value={form.guru_id} onChange={e=>setForm({...form,guru_id:e.target.value})} required>
                  <option value="">— Pilih Guru —</option>
                  {guruList.map(g=>(
                    <option key={g.id} value={g.id}>{g.nama}{g.mapel?' ('+g.mapel+')':''}</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label>Mata Pelajaran *</label>
                <select value={form.mapel} onChange={e=>setForm({...form,mapel:e.target.value})} required>
                  <option value="">— Pilih Mapel —</option>
                  {MAPEL_LIST.map(m=><option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Kelas *</label>
                <select value={form.kelas_id} onChange={e=>setForm({...form,kelas_id:e.target.value})} required>
                  <option value="">— Pilih Kelas —</option>
                  {kelasList.map(k=>(
                    <option key={k.id} value={k.id}>{k.nama_kelas} (Tingkat {k.tingkat})</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label>Tahun Ajaran *</label>
                <select value={form.tahun_ajaran} onChange={e=>setForm({...form,tahun_ajaran:e.target.value})}>
                  {['2026/2027','2025/2026','2024/2025'].map(ta=>(

// ── TAB INSTRUMEN (EDITOR) ────────────────────────────────────
function TabInstrumen({sesi, showToast}) {
  const DEFAULT = {
    perencanaan: [...P_ITEMS],
    pelaksanaan: [...L_ITEMS],
    asesmen:     [...A_ITEMS],
  };

  const [komponen, setKomponen] = React.useState('perencanaan');
  const [items, setItems] = React.useState(null); // null = belum load
  const [saving, setSaving] = React.useState(false);
  const [editIdx, setEditIdx] = React.useState(null);
  const [editVal, setEditVal] = React.useState('');
  const [newItem, setNewItem] = React.useState('');

  React.useEffect(() => { loadInstrumen(); }, []);

  async function loadInstrumen() {
    const {data} = await sb.from('supermad_madrasah')
      .select('instrumen_custom').eq('id', sesi.mad.id).single();
    const inst = data?.instrumen_custom || {};
    setItems({
      perencanaan: inst.perencanaan || [...DEFAULT.perencanaan],
      pelaksanaan: inst.pelaksanaan || [...DEFAULT.pelaksanaan],
      asesmen:     inst.asesmen     || [...DEFAULT.asesmen],
    });
  }

  async function simpan(newItems) {
    setSaving(true);
    const toSave = newItems || items;
    const {error} = await sb.from('supermad_madrasah')
      .update({instrumen_custom: toSave}).eq('id', sesi.mad.id);
    setSaving(false);
    if (error) { showToast('Gagal simpan: '+error.message,'error'); return; }
    // Update sesi.mad supaya FormSupervisi langsung pakai yg baru
    if (sesi.mad) sesi.mad.instrumen_custom = toSave;
    setItems({...toSave});
    showToast('✅ Instrumen berhasil disimpan!');
  }

  function updateItem(idx, val) {
    const arr = [...items[komponen]];
    arr[idx] = val;
    const next = {...items, [komponen]: arr};
    setItems(next);
  }

  function hapusItem(idx) {
    if (!confirm('Hapus item ini?')) return;
    const arr = items[komponen].filter((_,i)=>i!==idx);
    const next = {...items, [komponen]: arr};
    setItems(next);
    simpan(next);
  }

  function tambahItem() {
    if (!newItem.trim()) return;
    const arr = [...items[komponen], newItem.trim()];
    const next = {...items, [komponen]: arr};
    setItems(next);
    setNewItem('');
    simpan(next);
  }

  function naikItem(idx) {
    if (idx===0) return;
    const arr = [...items[komponen]];
    [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
    const next = {...items, [komponen]: arr};
    setItems(next);
  }

  function turunItem(idx) {
    const arr = items[komponen];
    if (idx>=arr.length-1) return;
    const a = [...arr];
    [a[idx], a[idx+1]] = [a[idx+1], a[idx]];
    const next = {...items, [komponen]: a};
    setItems(next);
  }

  function resetDefault() {
    if (!confirm('Reset instrumen '+komponen+' ke default PM-KBC?')) return;
    const next = {...items, [komponen]: [...DEFAULT[komponen]]};
    setItems(next);
    simpan(next);
  }

  if (!items) return <div style={{textAlign:'center',padding:32,color:'var(--text3)'}}>⏳ Memuat instrumen...</div>;

  const labelMap = {perencanaan:'📝 Perencanaan', pelaksanaan:'🎯 Pelaksanaan', asesmen:'✅ Asesmen'};
  const curItems = items[komponen];

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontWeight:900,color:'var(--p3)',fontSize:'1rem'}}>📋 Editor Instrumen Supervisi</div>
          <div style={{fontSize:'.75rem',color:'var(--text3)',marginTop:2}}>
            Sesuaikan item penilaian dengan kebutuhan madrasah. Skor per item: 0–3.
          </div>
        </div>
        <button onClick={resetDefault} className="btn btn-outline btn-sm" style={{color:'#d97706',borderColor:'#d97706'}}>
          🔄 Reset Default
        </button>
      </div>

      {/* Tab komponen */}
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        {Object.entries(labelMap).map(([key,label])=>(
          <button key={key} onClick={()=>setKomponen(key)}
            style={{padding:'7px 16px',borderRadius:8,border:'none',cursor:'pointer',
              fontWeight:700,fontSize:'.8rem',fontFamily:'inherit',
              background:komponen===key?'var(--p)':'var(--surface2)',
              color:komponen===key?'#fff':'var(--text2)'}}>
            {label}
          </button>
        ))}
      </div>

      <div className="card">
        <div style={{fontWeight:700,color:'var(--p3)',marginBottom:12}}>
          {labelMap[komponen]} — {curItems.length} item
        </div>

        {/* Daftar item */}
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
          {curItems.map((item, idx)=>(
            <div key={idx} style={{display:'flex',gap:8,alignItems:'flex-start',
              padding:'10px 12px',background:'var(--surface2)',borderRadius:9,
              border:'1.5px solid var(--border)'}}>
              <div style={{fontWeight:700,color:'var(--text3)',fontSize:'.75rem',
                minWidth:24,marginTop:2,textAlign:'center'}}>{idx+1}</div>
              <div style={{flex:1}}>
                {editIdx===idx ? (
                  <div style={{display:'flex',gap:6,alignItems:'flex-start'}}>
                    <textarea rows={2} value={editVal}
                      onChange={e=>setEditVal(e.target.value)}
                      style={{flex:1,padding:'6px 8px',border:'1.5px solid var(--p)',
                        borderRadius:7,fontSize:'.82rem',fontFamily:'inherit',
                        resize:'vertical',outline:'none'}}
                      autoFocus/>
                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                      <button onClick={()=>{
                        if (editVal.trim()) { updateItem(idx, editVal.trim()); }
                        setEditIdx(null);
                      }} className="btn btn-primary btn-sm">✓</button>
                      <button onClick={()=>setEditIdx(null)} className="btn btn-outline btn-sm">✕</button>
                    </div>
                  </div>
                ) : (
                  <div style={{fontSize:'.82rem',lineHeight:1.5}}>{item}</div>
                )}
              </div>
              <div style={{display:'flex',gap:4,flexShrink:0}}>
                <button onClick={()=>naikItem(idx)} disabled={idx===0}
                  style={{padding:'4px 6px',borderRadius:5,border:'1px solid var(--border)',
                    background:'#fff',cursor:'pointer',fontSize:'.75rem',
                    opacity:idx===0?0.3:1}}>▲</button>
                <button onClick={()=>turunItem(idx)} disabled={idx>=curItems.length-1}
                  style={{padding:'4px 6px',borderRadius:5,border:'1px solid var(--border)',
                    background:'#fff',cursor:'pointer',fontSize:'.75rem',
                    opacity:idx>=curItems.length-1?0.3:1}}>▼</button>
                <button onClick={()=>{setEditIdx(idx);setEditVal(item);}}
                  style={{padding:'4px 8px',borderRadius:5,border:'1px solid #d97706',
                    background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:'.75rem'}}>✏️</button>
                <button onClick={()=>hapusItem(idx)}
                  style={{padding:'4px 8px',borderRadius:5,border:'1px solid #fca5a5',
                    background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'.75rem'}}>🗑️</button>
              </div>
            </div>
          ))}
        </div>

        {/* Tambah item baru */}
        <div style={{display:'flex',gap:8,alignItems:'flex-start',
          padding:'12px 14px',background:'#f0fdf4',borderRadius:9,
          border:'1.5px dashed #86efac'}}>
          <textarea rows={2} value={newItem} onChange={e=>setNewItem(e.target.value)}
            placeholder="Tulis item penilaian baru..."
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();tambahItem();}}}
            style={{flex:1,padding:'6px 8px',border:'1.5px solid #86efac',
              borderRadius:7,fontSize:'.82rem',fontFamily:'inherit',
              resize:'vertical',outline:'none',background:'#fff'}}/>
          <button onClick={tambahItem} className="btn btn-primary btn-sm"
            style={{background:'#16a34a',borderColor:'#16a34a',marginTop:2}}>
            ＋ Tambah
          </button>
        </div>

        {/* Simpan */}
        <div style={{marginTop:14,display:'flex',justifyContent:'flex-end'}}>
          <button onClick={()=>simpan(null)} className="btn btn-primary" disabled={saving}>
            {saving?'⏳ Menyimpan...':'💾 Simpan Perubahan'}
          </button>
        </div>
      </div>
    </div>
  );
}

// Helper: ambil daftar mapel sesuai jenjang madrasah
// Kolom di DB bisa 'tingkat' atau 'jenjang' — terima keduanya
function getMapelByJenjang(jenjangOrTingkat) {
  if (!jenjangOrTingkat) return MAPEL_KMA1503['MTs'];
  const j = String(jenjangOrTingkat).trim().toUpperCase();
  if (j === 'MI' || j.includes('IBTIDAIYAH')) return MAPEL_KMA1503['MI'];
  if (j === 'MTS' || j === 'MTs'.toUpperCase() || j.includes('TSANAWIYAH')) return MAPEL_KMA1503['MTs'];
  if (j === 'MAK' || j.includes('KEJURUAN')) return MAPEL_KMA1503['MAK'];
  if (j === 'MA' || j.includes('ALIYAH')) return MAPEL_KMA1503['MA'];
  if (j === 'RA' || j.includes('RAUDHATUL')) return MAPEL_KMA1503['MI'];
  return MAPEL_KMA1503['MTs'];
}

  return mad ? (mad.tingkat || mad.jenjang || '') : '';

            style={{fontSize:'.78rem',resize:'vertical'}}
            placeholder="Catatan pengamatan..."/>
        </div>
        <div className="form-group" style={{margin:0}}>
          <label>Rekomendasi Tindak Lanjut</label>
          <textarea rows={2} value={catatan.r||''} 
            onChange={e=>setCatatan({...catatan,r:e.target.value})}
            style={{fontSize:'.78rem',resize:'vertical'}}
            placeholder="Rekomendasi pembinaan..."/>
        </div>
      </div>
    </div>
  );
}

function FormSupervisi({guru, sesi, showToast, onSelesai, onBatal, filterSmt='Ganjil', filterTA='2025/2026', jadwal=null, supEdit=null}) {
  const se = supEdit || {};
  const wPra = se.wawancara_pra || {};
  const wPasca = se.wawancara_pasca || {};
  const [tab, setTab]   = useState('identitas');
  const [saving, setSaving] = useState(false);

  // Identitas
  const [tanggal, setTanggal]   = useState(se.tanggal_supervisi || (jadwal&&jadwal.tanggal ? jadwal.tanggal : new Date().toISOString().split('T')[0]));
  const [kelas, setKelas]       = useState(se.kelas_sem || (jadwal?jadwal.kelas:''));
  const [semester, setSemester]     = useState(se.semester || filterSmt);
  const [tahunAjaran, setTahunAjaran] = useState(se.tahun_ajaran || filterTA);

  const [jurusan, setJurusan]   = useState(se.jurusan || '');
  const [namaSupervisor, setNamaSupervisor] = useState(se.nama_supervisor || sesi.pengguna.nama||'');
  const [nipSupervisor, setNipSupervisor]   = useState(se.nip_supervisor || sesi.pengguna.nip||'');
  const [jabatanSup, setJabatanSup]         = useState(se.jabatan_supervisor || sesi.pengguna.jabatan||'');

  // Skor
  // Gunakan instrumen custom jika ada, fallback ke default
  const instrumen = sesi.mad?.instrumen_custom || {};
  const itemsP = instrumen.perencanaan && instrumen.perencanaan.length ? instrumen.perencanaan : P_ITEMS;
  const itemsL = instrumen.pelaksanaan && instrumen.pelaksanaan.length ? instrumen.pelaksanaan : L_ITEMS;
  const itemsA = instrumen.asesmen    && instrumen.asesmen.length    ? instrumen.asesmen    : A_ITEMS;

  const fitSkor = (arr,n) => Array.from({length:n},(_,i)=>(Array.isArray(arr)&&arr[i]!=null)?(+arr[i]||0):0);
  const [skorP, setSkorP] = useState(fitSkor(se.skor_perencanaan, itemsP.length));
  const [skorL, setSkorL] = useState(fitSkor(se.skor_pelaksanaan, itemsL.length));
  const [skorA, setSkorA] = useState(fitSkor(se.skor_asesmen, itemsA.length));

  // Daftar kelas dari DB
  const [daftarKelas, setDaftarKelas] = useState([]);
  useEffect(()=>{
    sb.from('supermad_kelas')
      .select('nama_kelas')
      .eq('madrasah_id', sesi.mad.id)
      .eq('tahun_ajaran', filterTA)
      .order('nama_kelas')
      .then(({data})=>{ if(data&&data.length) setDaftarKelas(data.map(k=>k.nama_kelas)); });
  },[]);

  // Catatan
  const [catP, setCatP] = useState({c:se.catatan_p||'',r:se.rekomendasi_p||''});
  const [catL, setCatL] = useState({c:se.catatan_l||'',r:se.rekomendasi_l||''});
  const [catA, setCatA] = useState({c:se.catatan_a||'',r:se.rekomendasi_a||''});

  // Wawancara Pra Observasi (8 pertanyaan)
  const PRA_Q = [
    'Apa tujuan pembelajaran yang akan saudara sajikan?',
    'Metode apa yang akan saudara gunakan dalam pembelajaran ini? Apa alasan anda memilih metode tersebut?',
    'Alat dan bahan (sumber belajar) apakah yang saudara siapkan? Jelaskan alasannya!',
    'Ceritakan tahapan pembelajaran yang akan saudara sajikan!',
    'Persiapan tertulis apa saja yang saudara buat?',
    'Materi apa yang dianggap sulit oleh siswa berdasarkan perkiraan saudara? Jika ada, Materi apa? Jelaskan alasan Saudara!',
    'Kompetensi apa yang bias dimiliki siswa setelah mengikuti pembelajaran sesuai dengan harapan saudara?',
    'Apa yang perlu mendapat perhatian khusus pada pembelajaran kali ini?',
  ];
  const [praJawab, setPraJawab]   = useState(PRA_Q.map((_,i)=>(wPra.jawaban&&wPra.jawaban[i])||''));
  const [praLama,  setPraLama]    = useState(wPra.lama||'');

  // Wawancara Pasca Observasi (9 pertanyaan)
  const PASCA_Q = [
    'Bagaimana pendapat saudara setelah menyajikan pelajaran ini?',
    'Apakah proses pembelajaran sudah sesuai dengan yang direncanakan?',
    'Dapatkah Saudara menceritakan hal-hal yang dirasakan memuaskan dalam proses pembelajaran tadi?',
    'Bagaimana perkiraan Saudara mengenai ketercapaian tujuan pembelajaran?',
    'Apa yang menjadi kesulitan siswa?',
    'Apa yang menjadi kesulitasn saudara?',
    'Adakah alternatif lain untuk mengatasi kesulitan Saudara?',
    'Marilah bersama-sama kita identifikasi hal-hal yang telah mantap dan hal-hal yang peerlu peningkatan, berdasarkan kegiatan yang baru saja Saudara lakukan dan pengamatan saya.',
    'Dengan demikian, apa yang akan Saudara lakukan untuk pertemuan berikutnya?',
  ];
  const [pascaJawab,  setPascaJawab]  = useState(PASCA_Q.map((_,i)=>(wPasca.jawaban&&wPasca.jawaban[i])||''));
  const [pascaLama,   setPascaLama]   = useState(wPasca.lama||'');
  const [kesanUmum,   setKesanUmum]   = useState(wPasca.kesan_umum||'');
  const [saranMasukan,setSaranMasukan]= useState(wPasca.saran_masukan||'');

  // Hitung capaian
  const capP = (skorP.reduce((a,b)=>a+b,0)/(itemsP.length*3)*100);
  const capL = (skorL.reduce((a,b)=>a+b,0)/(itemsL.length*3)*100);
  const capA = (skorA.reduce((a,b)=>a+b,0)/(itemsA.length*3)*100);
  const capRata = ((capP+capL+capA)/3);

  function setSkorPItem(i,v){ const s=[...skorP]; s[i]=v; setSkorP(s); }
  function setSkorLItem(i,v){ const s=[...skorL]; s[i]=v; setSkorL(s); }
  function setSkorAItem(i,v){ const s=[...skorA]; s[i]=v; setSkorA(s); }

  const tabs = [
    {key:'identitas',     label:'📋 Identitas'},
    {key:'pra_observasi', label:'🗣️ Pra Observasi'},
    {key:'perencanaan',   label:'📝 Perencanaan'},
    {key:'pelaksanaan',   label:'🎯 Pelaksanaan'},
    {key:'asesmen',       label:'✅ Asesmen'},
    {key:'pasca_observasi',label:'💬 Pasca Observasi'},
    {key:'rekap',         label:'📊 Rekap'},
  ];

  async function simpan(status='selesai') {
    if (!kelas.trim()) { showToast('Kelas wajib diisi','warning'); setTab('identitas'); return; }
    setSaving(true);
    try {
      const payloadSup = {
        madrasah_id:         sesi.mad.id,
        guru_id:             guru.id,
        supervisor_id:       sesi.pengguna.id,
        tahun_ajaran:        tahunAjaran,
        semester,
        tanggal_supervisi:   tanggal,
        kelas_sem:           kelas,
        jtm:                 parseInt(jtm)||0,
        jurusan,
        nama_supervisor:    namaSupervisor,
        nip_supervisor:     nipSupervisor,
        jabatan_supervisor: jabatanSup,
        nama_kepala:        sesi.mad.nama_kepala||'',
        nip_kepala:         sesi.mad.nip_kepala||'',
        namaMadrasah:       sesi.mad.nama||'',
        alamatMadrasah:     sesi.mad.alamat||'',
        kota_kab:           sesi.mad.kota_kab||'',
        provinsi:           sesi.mad.provinsi||'',
        naungan:            sesi.mad.naungan||'',
        skor_perencanaan:    skorP,
        skor_pelaksanaan:    skorL,
        skor_asesmen:        skorA,
        catatan_p:           catP.c, rekomendasi_p: catP.r,
        catatan_l:           catL.c, rekomendasi_l: catL.r,
        catatan_a:           catA.c, rekomendasi_a: catA.r,
        wawancara_pra:       {lama:praLama, jawaban:praJawab},
        wawancara_pasca:     {lama:pascaLama, jawaban:pascaJawab, kesan_umum:kesanUmum, saran_masukan:saranMasukan},
        capaian_perencanaan: parseFloat(capP.toFixed(2)),
        capaian_pelaksanaan: parseFloat(capL.toFixed(2)),
        capaian_asesmen:     parseFloat(capA.toFixed(2)),
        capaian_rata:        parseFloat(capRata.toFixed(2)),
        predikat:            PREDIKAT(capRata),
        status,
      };
      let newSup = null, error = null;
      if (supEdit && supEdit.id) {
        ({data:newSup, error} = await sb.from('supermad_supervisi')
          .update(payloadSup).eq('id', supEdit.id).select('id').single());
      } else {
        ({data:newSup, error} = await sb.from('supermad_supervisi')
          .insert(payloadSup).select('id').single());
      }
      if (error) { 
        showToast('❌ Gagal simpan: '+error.message, 'error'); 
        return; 
      }
      showToast(supEdit ? '✅ Perubahan supervisi berhasil disimpan!' : '✅ Supervisi berhasil disimpan!');
    // Update status jadwal jika ada
    if (jadwal && jadwal.id) {
      await sb.from('supermad_jadwal').update({
        status: 'selesai',
        supervisi_id: newSup?.id||null,
        updated_at: new Date().toISOString()
      }).eq('id', jadwal.id);
    }
      // Buat RTL otomatis agar langsung muncul di akun guru
      if (status==='selesai' && newSup && newSup.id) {
        const {data:rtlAda} = await sb.from('supermad_rtl').select('id').eq('supervisi_id', newSup.id).limit(1);
        if (!rtlAda || !rtlAda.length) {
          const g = generateRTL(skorP, skorL, skorA);

            supervisi_id: newSup.id, madrasah_id: sesi.mad.id, guru_id: guru.id,
            tahun_ajaran: tahunAjaran, rtl_perencanaan: g.p, rtl_pelaksanaan: g.l, rtl_asesmen: g.a,
            rtl_madrasah: [], catatan_umum: '', konfirmasi_guru: 'belum', catatan_guru: '',
            status: 'draft', dibuat_oleh: sesi.pengguna.id, updated_at: new Date().toISOString(),
          });
          if (rtlErr) console.error('Auto RTL error:', rtlErr);
        }
      }
      onSelesai();
    } catch(err) {
      showToast('❌ Error: '+err.message, 'error');
    } finally { setSaving(false); }
  }

                <td style={{padding:'10px 12px',fontWeight:900,fontSize:'1.1rem',

                </td>
