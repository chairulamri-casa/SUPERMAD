                  <span style={{padding:'3px 12px',borderRadius:20,fontSize:'.78rem',fontWeight:800,
                    background:capRata>=91?'#d1fae5':capRata>=81?'#dbeafe':capRata>=71?'#fef3c7':'#fee2e2',
                    color:capRata>=91?'#065f46':capRata>=81?'#1d4ed8':capRata>=71?'#92400e':'#991b1b'}}>
                    {PREDIKAT(capRata)}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" onClick={cetakLaporan}>🖨️ Cetak Laporan</button>
            <button className="btn btn-gold btn-sm" onClick={()=>simpan('draft')} disabled={saving}>
              💾 Simpan Draft
            </button>
            <button className="btn btn-primary" onClick={()=>simpan('selesai')} disabled={saving}>
              {saving?'⏳ Menyimpan...':'✅ Simpan & Selesai'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── TAB REKAP NILAI (Operator & Supervisor — view only) ────────
function TabRekapNilai({sesi, showToast}) {

  const jenisOpt = [
    {val:'formatif', label:'Formatif'},
    {val:'sts',      label:'Sumatif Tengah Semester'},
    {val:'sas',      label:'Sumatif Akhir Semester'},
    {val:'proyek',   label:'Proyek / Praktik'},
  ];

  // Hitung TA default
  const nowR = new Date();
  const blnR = nowR.getMonth()+1;
  const thnR = nowR.getFullYear();
  const taAwalR = blnR>=7?thnR:thnR-1;
  const smtDefaultR = blnR>=7?'Ganjil':'Genap';

  const [filterTA,  setFilterTA]  = React.useState(taAwalR+'/'+(taAwalR+1));
  const [filterSmt, setFilterSmt] = React.useState(smtDefaultR);
  // Konversi label semester ke angka (sesuai DB)
  const smtToNum = s => s==='Ganjil'||s==='1'||s===1?1:2;
  const [kelasList, setKelasList] = React.useState([]);
  const kelasListRef = React.useRef([]);
  const [filterKelas, setFilterKelas] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  // Data hasil rekap
  const [rekapData, setRekapData] = React.useState(null);
  // null = belum load, {} = sudah load (bisa kosong)

  React.useEffect(()=>{
    loadKelas();
  }, [filterTA]);

  React.useEffect(()=>{
    if (filterKelas) loadRekap();
    else setRekapData(null);
  }, [filterKelas, filterSmt, filterTA]);

  async function loadKelas() {
    const {data} = await sb.from('supermad_kelas').select('id,nama_kelas,tingkat')
      .eq('madrasah_id', sesi.mad.id).order('tingkat').order('nama_kelas');
    kelasListRef.current = data||[];
    setKelasList(data||[]);
    if (data && data.length>0) {
      setFilterKelas(data[0].id);
      // Langsung load rekap dengan kelas pertama
      await loadRekapWithKelas(data[0].id, data);
    }
  }

  async function loadRekap() {
    if (!filterKelas) return;
    await loadRekapWithKelas(filterKelas, kelasListRef.current);
  }

  async function loadRekapWithKelas(kelasId, klist) {
    if (!kelasId) return;
    setLoading(true);
    setRekapData(null);

    const kelas = (klist||[]).find(k=>k.id===kelasId);
    const namaKelas = kelas?.nama_kelas||'';
    // Nama kelas yang dipakai di supermad_siswa.kelas dan supermad_nilai.kelas
    const kelasStr = namaKelas;

    // Load siswa di kelas ini (tidak ada kolom nisn, hanya nis)
    const {data:siswaData} = await sb.from('supermad_siswa')
      .select('id,nama,nis')
      .eq('madrasah_id', sesi.mad.id)
      .eq('kelas', kelasStr)
      .eq('aktif', true)
      .order('nama');

    if (!siswaData || siswaData.length===0) {
      setRekapData({ siswa:[], nilai:{}, mapelList:[], jenisOpt });
      setLoading(false); return;
    }

    const siswaIds = siswaData.map(s=>s.id);

    // Load semua nilai untuk siswa-siswa ini, semester+TA yang dipilih
    // semester di DB disimpan sebagai angka (1=Ganjil, 2=Genap)
    const smtNum = smtToNum(filterSmt);
    const {data:nilaiData, error:nilaiErr} = await sb.from('supermad_nilai')
      .select('siswa_id,mapel,jenis_nilai,nilai,kktp')
      .in('siswa_id', siswaIds)
      .eq('semester', smtNum)
      .eq('tahun_ajaran', filterTA)
      .eq('madrasah_id', sesi.mad.id)
      .eq('kelas', kelasStr);

    // Struktur: nilaiMap[siswa_id][mapel][jenis_nilai] = nilai
    const nilaiMap = {};
    const mapelSet = new Set();
    (nilaiData||[]).forEach(n=>{
      if (!nilaiMap[n.siswa_id]) nilaiMap[n.siswa_id]={};
      if (!nilaiMap[n.siswa_id][n.mapel]) nilaiMap[n.siswa_id][n.mapel]={};
      nilaiMap[n.siswa_id][n.mapel][n.jenis_nilai] = n.nilai;
      mapelSet.add(n.mapel);
    });

    const mapelList = Array.from(mapelSet).sort();

    // Hitung rata-rata per siswa (rata-rata dari semua mapel, rata-rata dari semua jenis)
    const siswaWithAvg = siswaData.map((s,idx)=>{
      const nm = nilaiMap[s.id]||{};
      let totalNilai=0, countNilai=0;
      mapelList.forEach(mp=>{
        const jenisMp = nm[mp]||{};
        jenisOpt.forEach(j=>{
          if (jenisMp[j.val]!=null) { totalNilai+=Number(jenisMp[j.val]); countNilai++; }
        });
      });
      const rataRata = countNilai>0 ? totalNilai/countNilai : null;
      return {...s, rataRata, nomor: idx+1};
    });

    // Hitung peringkat berdasarkan rata-rata keseluruhan (null paling bawah)
    const sorted = [...siswaWithAvg].sort((a,b)=>{
      if (a.rataRata==null && b.rataRata==null) return 0;
      if (a.rataRata==null) return 1;
      if (b.rataRata==null) return -1;
      return b.rataRata - a.rataRata;
    });
    const peringkatMap = {};
    sorted.forEach((s,i)=>{ peringkatMap[s.id] = s.rataRata!=null ? i+1 : '-'; });

    setRekapData({ siswa:siswaWithAvg, nilai:nilaiMap, mapelList, jenisOpt,
      namaKelas, peringkatMap });
    setLoading(false);
  }

  // ── Export Excel ──
  function exportExcel() {
    if (!rekapData || !rekapData.siswa.length) return;
    const {siswa, nilai, mapelList, jenisOpt: jO, namaKelas, peringkatMap} = rekapData;

    // Header baris 1: No, Nama, Mapel-1 colspan jenis, ..., Rata-rata, Peringkat
    // Baris 2: jenis-jenis nilai untuk tiap mapel
    const header1 = ['No','Nama','NIS'];
    const header2 = ['','',''];
    mapelList.forEach(mp=>{
      jO.forEach(j=>{ header1.push(mp); header2.push(j.label); });
      header1.push(mp+' (Rata)'); header2.push('Rata-rata');
    });
    header1.push('Rata-rata Akhir','Peringkat');
    header2.push('','');

    const rows = [header1, header2];
    siswa.forEach((s,idx)=>{
      const nm = nilai[s.id]||{};
      const row = [idx+1, s.nama, s.nis||''];
      mapelList.forEach(mp=>{
        const jMp = nm[mp]||{};
        let tot=0,cnt=0;
        jO.forEach(j=>{
          const v = jMp[j.val];
          row.push(v!=null?Number(v):'');
          if (v!=null){tot+=Number(v);cnt++;}
        });
        row.push(cnt>0?(tot/cnt).toFixed(1):'');
      });
      row.push(s.rataRata!=null?s.rataRata.toFixed(1):'');
      row.push(peringkatMap[s.id]||'-');
      rows.push(row);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    // Merge header row 1 per mapel (4 kolom jenis + 1 rata = 5 per mapel)
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rekap Nilai');
    const fn = `Rekap_Nilai_${namaKelas}_Smt${filterSmt}_${filterTA.replace('/','_')}.xlsx`;
    XLSX.writeFile(wb, fn);
    showToast('✅ Excel berhasil diunduh!');
  }

  // ── Export PDF (print) ──
  function exportPDF() {
    if (!rekapData || !rekapData.siswa.length) return;
    const {siswa, nilai, mapelList, jenisOpt: jO, namaKelas, peringkatMap} = rekapData;
    const madNama = sesi.mad.nama||'';

    // Build HTML table
    let html = `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Rekap Nilai</title>
<style>
  body{font-family:Arial,sans-serif;font-size:10px;margin:10mm;}
  h2{text-align:center;font-size:13px;margin:0 0 2px;}
  p{text-align:center;margin:0 0 8px;font-size:10px;color:#555;}
  table{border-collapse:collapse;width:100%;}
  th,td{border:1px solid #999;padding:3px 5px;text-align:center;}
  th{background:#e5e7eb;font-weight:700;}
  td:nth-child(2){text-align:left;}
  .mapel-head{background:#dbeafe;}
  tr:nth-child(even){background:#f9fafb;}
  @media print{body{margin:5mm;} @page{size:landscape;}}
</style></head><body>
<h2>REKAP NILAI — ${namaKelas}</h2>
<p>${madNama} · Semester ${filterSmt} ${filterTA}</p>
<table><thead><tr>
<th rowspan="2">No</th>
<th rowspan="2">Nama Siswa</th>
<th rowspan="2">NIS</th>`;

    mapelList.forEach(mp=>{
      html += `<th colspan="${jO.length+1}" class="mapel-head">${mp}</th>`;
    });
    html += `<th rowspan="2">Rata-rata</th><th rowspan="2">Peringkat</th></tr><tr>`;
    mapelList.forEach(()=>{
      jO.forEach(j=>{ html+=`<th>${j.label}</th>`; });
      html+=`<th>Rata</th>`;
    });
    html += `</tr></thead><tbody>`;

    siswa.forEach((s,idx)=>{
      const nm = nilai[s.id]||{};
      html += `<tr><td>${idx+1}</td><td>${s.nama}</td><td>${s.nis||''}</td>`;
      mapelList.forEach(mp=>{
        const jMp = nm[mp]||{};
        let tot=0,cnt=0;
        jO.forEach(j=>{
          const v = jMp[j.val];
          html += `<td>${v!=null?Number(v).toFixed(0):'-'}</td>`;
          if(v!=null){tot+=Number(v);cnt++;}
        });
        html += `<td><b>${cnt>0?(tot/cnt).toFixed(1):'-'}</b></td>`;
      });
      const rataAkhir = s.rataRata!=null?s.rataRata.toFixed(1):'-';
      html += `<td><b>${rataAkhir}</b></td><td><b>${peringkatMap[s.id]||'-'}</b></td></tr>`;
    });

    html += `</tbody></table>
<p style="margin-top:8px;font-size:9px;color:#888;">Dicetak: ${new Date().toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
</body></html>`;

    const w = window.open('','_blank');
    w.document.write(html);
    w.document.close();
    setTimeout(()=>{ w.focus(); w.print(); }, 400);
  }

  // ── RENDER ──
  const {siswa=[],nilai={},mapelList=[],peringkatMap={}} = rekapData||{};

  return (
    <div>
      <div style={{fontWeight:800,fontSize:'1rem',marginBottom:14,color:'var(--p3)'}}>
        📊 Rekap Nilai Siswa
      </div>

      {/* Filter bar */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',
        background:'var(--surface2)',borderRadius:10,padding:'10px 14px',alignItems:'center'}}>
        <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--text2)'}}>📅 Filter:</span>
        <select value={filterTA} onChange={e=>setFilterTA(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer'}}>
          {(()=>{const yr=new Date().getFullYear(),tas=[];
            for(let y=yr-2;y<=yr+1;y++) tas.push(y+'/'+(y+1));
            return tas.map(ta=><option key={ta} value={ta}>{ta}</option>);})()}
        </select>
        <select value={filterSmt} onChange={e=>setFilterSmt(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer'}}>
          <option value="Ganjil">Semester Ganjil</option>
          <option value="Genap">Semester Genap</option>
        </select>
        <select value={filterKelas} onChange={e=>setFilterKelas(e.target.value)}
          style={{padding:'5px 10px',borderRadius:7,border:'1.5px solid var(--border)',
            fontSize:'.8rem',fontFamily:'inherit',fontWeight:700,outline:'none',cursor:'pointer',minWidth:130}}>
          <option value="">-- Pilih Kelas --</option>
          {kelasList.map(k=><option key={k.id} value={k.id}>{k.nama_kelas}</option>)}
        </select>
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button className="btn btn-outline btn-sm" onClick={exportExcel}
            disabled={!rekapData||!siswa.length}
            title="Export ke Excel">
            📥 Excel
          </button>
          <button className="btn btn-outline btn-sm" onClick={exportPDF}
            disabled={!rekapData||!siswa.length}
            title="Cetak / Export PDF">
            🖨️ PDF
          </button>
        </div>
      </div>

      {/* Tabel Rekap */}
      {loading ? (
        <div style={{textAlign:'center',padding:40,color:'var(--text2)'}}>
          <div style={{fontSize:'2rem',marginBottom:8}}>⏳</div>
          Memuat data nilai...
        </div>
      ) : !filterKelas ? (
        <div style={{textAlign:'center',padding:40,color:'var(--text3)',background:'var(--surface2)',borderRadius:12}}>
          <div style={{fontSize:'2rem',marginBottom:8}}>📊</div>
          Pilih kelas untuk melihat rekap nilai
        </div>
      ) : !rekapData ? null
      : siswa.length===0 ? (
        <div style={{textAlign:'center',padding:40,color:'var(--text3)',background:'var(--surface2)',borderRadius:12}}>
          <div style={{fontSize:'2rem',marginBottom:8}}>😕</div>
          Belum ada siswa di kelas ini atau belum ada nilai
        </div>
      ) : mapelList.length===0 ? (
        <div style={{textAlign:'center',padding:40,color:'var(--text3)',background:'var(--surface2)',borderRadius:12}}>
          <div style={{fontSize:'2rem',marginBottom:8}}>📭</div>
          Belum ada nilai yang diinput untuk kelas ini pada semester {filterSmt} {filterTA}
        </div>
      ) : (
        <div>
          {/* Info header */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontSize:'.82rem',color:'var(--text2)'}}>
              <b style={{color:'var(--text)'}}>
                {kelasList.find(k=>k.id===filterKelas)?.nama_kelas}
              </b>
              {' · '}Semester {filterSmt} {filterTA}
              {' · '}<b>{siswa.length}</b> siswa
              {' · '}<b>{mapelList.length}</b> mapel
            </div>
          </div>

          {/* Scroll wrapper */}
          <div style={{overflowX:'auto',borderRadius:10,border:'1px solid var(--border)'}}>
            <table style={{borderCollapse:'collapse',width:'100%',fontSize:'.76rem',minWidth:600}}>
              <thead>
                {/* Baris 1: No, Nama, NIS, lalu mapel (colspan), Rata-rata, Peringkat */}
                <tr style={{background:'var(--p)',color:'#fff'}}>
                  <th style={{...thSt,width:32}} rowSpan={2}>No</th>
                  <th style={{...thSt,textAlign:'left',minWidth:130}} rowSpan={2}>Nama Siswa</th>
                  <th style={{...thSt,width:60}} rowSpan={2}>NIS</th>
                  {mapelList.map(mp=>(
                    <th key={mp} style={{...thSt,background:'#2563eb'}}
                      colSpan={jenisOpt.length+1}>{mp}</th>
                  ))}
                  <th style={{...thSt,background:'#16a34a'}} rowSpan={2}>Rata-rata</th>
                  <th style={{...thSt,background:'#9333ea'}} rowSpan={2}>Peringkat</th>
                </tr>
                {/* Baris 2: jenis nilai untuk tiap mapel */}
                <tr style={{background:'var(--surface2)'}}>
                  {mapelList.map(mp=>(
                    <React.Fragment key={mp}>
                      {jenisOpt.map(j=>(
                        <th key={j.val} style={{...thSt,background:'var(--surface2)',
                          color:'var(--text2)',fontWeight:600,fontSize:'.7rem',minWidth:52}}>
                          {j.label.length>12?j.label.substring(0,11)+'…':j.label}
                        </th>
                      ))}
                      <th style={{...thSt,background:'var(--surface2)',color:'var(--text2)',
                        fontWeight:700,fontSize:'.7rem',minWidth:48}}>Rata</th>
                    </React.Fragment>
                  ))}
                </tr>
              </thead>
              <tbody>
                {siswa.map((s,idx)=>{
                  const nm = nilai[s.id]||{};
                  const peringkat = peringkatMap[s.id]||'-';
                  const topTiga = typeof peringkat==='number' && peringkat<=3;
                  return (
                    <tr key={s.id}
                      style={{background:idx%2===0?'var(--bg)':'var(--surface2)'}}>
                      <td style={tdSt}>{idx+1}</td>
                      <td style={{...tdSt,textAlign:'left',fontWeight:600,
                        color:topTiga?'#d97706':'var(--text)'}}>
                        {topTiga && ['🥇','🥈','🥉'][peringkat-1]+' '}
                        {s.nama}
                      </td>
                      <td style={{...tdSt,color:'var(--text2)'}}>{s.nis||'-'}</td>
                      {mapelList.map(mp=>{
                        const jMp = nm[mp]||{};
                        let tot=0,cnt=0;
                        const cells = jenisOpt.map(j=>{
                          const v = jMp[j.val];
                          if (v!=null){tot+=Number(v);cnt++;}
                          return (
                            <td key={j.val} style={{...tdSt,
                              color:v==null?'var(--text3)':'var(--text)'}}>
                              {v!=null?Number(v).toFixed(0):'-'}
                            </td>
                          );
                        });
                        const rataMp = cnt>0?(tot/cnt):null;
                        return (
                          <React.Fragment key={mp}>
                            {cells}
                            <td style={{...tdSt,fontWeight:700,
                              color:rataMp==null?'var(--text3)':
                                rataMp>=75?'#16a34a':rataMp>=60?'#d97706':'#dc2626'}}>
                              {rataMp!=null?rataMp.toFixed(1):'-'}
                            </td>
                          </React.Fragment>
                        );
                      })}
                      <td style={{...tdSt,fontWeight:800,
                        color:s.rataRata==null?'var(--text3)':
                          s.rataRata>=75?'#16a34a':s.rataRata>=60?'#d97706':'#dc2626'}}>
                        {s.rataRata!=null?s.rataRata.toFixed(1):'-'}
                      </td>
                      <td style={{...tdSt,fontWeight:800,
                        color:topTiga?'#d97706':'var(--text)',
                        background:topTiga?'#fef9c3':'inherit'}}>
                        {peringkat}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Legenda warna */}
          <div style={{marginTop:10,display:'flex',gap:14,flexWrap:'wrap',fontSize:'.72rem',color:'var(--text2)'}}>
            <span>Warna rata-rata:</span>
            <span style={{color:'#16a34a',fontWeight:700}}>● ≥75 (Tuntas)</span>
            <span style={{color:'#d97706',fontWeight:700}}>● 60–74 (Perlu Perhatian)</span>
            <span style={{color:'#dc2626',fontWeight:700}}>● &lt;60 (Belum Tuntas)</span>
          </div>
        </div>
      )}
    </div>
  );
}

// Style helper untuk tabel rekap
const thSt = {padding:'7px 8px',textAlign:'center',borderBottom:'1px solid rgba(0,0,0,.1)',
  borderRight:'1px solid rgba(0,0,0,.1)',fontWeight:700,whiteSpace:'nowrap'};
const tdSt = {padding:'6px 8px',textAlign:'center',borderBottom:'1px solid var(--border)',
  borderRight:'1px solid var(--border)',fontSize:'.76rem'};

// ── RENDER ─────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
